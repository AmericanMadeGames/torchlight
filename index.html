omeone, on a 12+, not only do they do what you want, they change their mind about you and become your ally. They will no longer advance the GM’s dangers and will instead support your plans.","page":79,"tier":6},{"name":"Wealthy Entrepreneur","text":"When a venture produces money for you, you may take 1 income instead of cashing out. Spend 1 income to get the 10+ result from your domain without rolling. Any income left over at the end of a session is converted into coins as normal. You can spend income from profitable estates in the same way.","page":79,"tier":6,"requires":["Entrepreneur"]}],"alignments":[{"type":"Good","text":"Use your wealth to directly benefit the least fortunate."},{"type":"Neutral","text":"Acquire something amazing or unique."}],"bonds":["__________ has a great nose for bargains.","__________ is too irresponsible to manage money."],"gear":"You get 100 coins and whatever you want to buy with it, in addition to whatever your other specialties give you.","races":[{"name":"Human","text":"Your race are conquerors. When you see or come to know of a thing you want, ask an extra question from the eye for loot list, even if you haven’t taken the move."}]},{"name":"Monstrous Heritage","archetype":"Adventurer","page":82,"blurb":"You can choose your friends, but you can’t choose your family.","compendium":"Once you find out your ancestry includes people you think are monsters, you may consider the monstrous heritage specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Ancestral Heritage","text":"You have a mixed heritage. Decide on your species, ethnicity, and cultural heritage, choosing anything or any combination of things that sounds interesting to you. Then choose up to three heritage moves to start with, from the monster moves that best match your heritage. How do you honour your people and invoke your rights of blood and tradition? Choose one:\n○ Building things for your people.\n○ Charity.\n○ Enforcing your peoples’ code of honour.\n○ Fighting for your people.\n○ Obeying your elders.\n○ Sacrifice.","page":82},{"name":"Blood and Tradition","text":"At the beginning of a session, or when you invoke your rights of blood and tradition, roll+WIS. On a 10+, hold 3. On a 7-9, hold 2. On a miss, you still hold 1. Spend a hold to make a heritage move, just like that.","stat":"WIS","page":82}],"advanced":[{"name":"Honouring Tradition","text":"When you gain a new appreciation for your heritage, add a new heritage move or change an existing one.","page":84,"tier":2,"requires":["Ancestral Heritage"]},{"name":"Interpreting Tradition","text":"Choose a second way you can honour your people.","page":84,"tier":2,"requires":["Ancestral Heritage"]},{"name":"Passing","text":"You are able to hide your heritage, and pass as a member of another race, as long as you don’t use your heritage moves.","page":84,"tier":2,"requires":["Ancestral Heritage"]},{"name":"Awakening Blood","text":"Choose another type of creature that has contributed to your heritage. Gain one of their moves, in addition to your other heritage moves, and you may change any other heritage moves to moves from this new heritage, if you wish.","page":84,"tier":6,"requires":["Ancestral Heritage"]},{"name":"Flexible Traditions","text":"Choose a third way you can honour your people.","page":84,"tier":6,"requires":["Interpreting Tradition"]},{"name":"Monster Blood","text":"When you roll for blood and tradition, on a hit, you get +1 hold.","page":84,"tier":6,"requires":["Blood and Tradition"]}],"alignments":[{"type":"Evil","text":"Attack your ancestral foes."},{"type":"Good","text":"Deliver aid to your ancestral allies."},{"type":"Neutral","text":"Prove your worth to someone else."}],"bonds":["__________ doesn’t judge me for who my parents were.","__________ thinks I am a monster, I will prove them wrong."],"gear":"You get adventuring gear (5 uses, 1 weight) and an item that symbolizes your heritage (describe it), in addition to whatever your other specialties give you.","races":[]},{"name":"Sage","archetype":"Adventurer","page":87,"blurb":"A scholar of infinite knowledge, who plunders the pages of lost tomes, and finds forgotten treasures in the scripts of ancient peoples, now lost in the mists of time—that’s you!","compendium":"Once you have mastered the works of the eight immortals, you may consider the sage specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Consult Sage","text":"When another PC comes to you for advice about something important and you tell them what you honestly think is best, they get +1 forward when following your advice. At the end of a session, if any other PCs benefited from following your advice, you can mark XP.","page":87}],"advanced":[{"name":"Buddy Movie","text":"You have a trusty sidekick or partner, who supports you in all that you do. Describe them and give them a name (Adam, Monkey King, or Sarah, for example). They count as a hireling with loyalty +2 and skill points equal to your level+1, with your choice of skills, plus one of the following abilities:\n- When they help you defend, you get +1 hold.\n- When they help you defy danger, take +1.\n- When they help you fight, you deal +1d4 damage.\n- When they help you parley, take +1.\nThey do not have their own HP. When they take damage, lower your own HP. If you die or refuse Death’s bargain, your buddy can sacrifice their own life so that you may live.","page":88,"tier":2},{"name":"Fount of Knowledge","text":"When you spout lore about something no one else has any clue about, take +1.","page":88,"tier":2},{"name":"I Know This Work","text":"When you encounter an interesting artifact, construction, or device (your call), roll+WIS. On a hit, you can ask the GM questions. On a 10+, ask three. On a 7-9, ask two:\n- How could I make this thing do ________?\n- How is it weak or vulnerable?\n- What’s happened to it recently?\n- What’s it for?\n- What’s it made of?\n- Who made it?\nOn a miss, it is something beyond your knowledge and understanding.","stat":"WIS","page":88,"tier":2},{"name":"Quick Study","text":"When you see the effects of an arcane spell, ask the GM the name of the spell and its effects. You take +1 when acting on the answers.","page":89,"tier":2},{"name":"Book of Names","text":"When you meet someone important (your call), say what you’ve heard about them and roll+WIS. On a hit, the GM will tell you more details. On a 10+, the GM’s details will complement yours. On a 7-9, the GM’s details may contradict your own information, and how you discover the truth is your own affair. On a miss, you are wrong about something important.","stat":"WIS","page":89,"tier":6},{"name":"Evidence of Faith","text":"When you see divine magic as it happens, you can ask the GM which deity granted the spell and its effects. Take +1 when acting on the answers.","page":89,"tier":6},{"name":"Superfriends","text":"Give your trusty sidekick or partner a second ability from the list.","page":89,"tier":6,"requires":["Buddy Movie"]},{"name":"A Wealth of Knowledge","text":"When you spout lore, on a 12+, you ask the GM a question, but the GM will also ask you a question about the subject. Whatever you answer, it is the truth.","page":89,"tier":6}],"alignments":[{"type":"Chaotic","text":"Give someone the advice they need to change their life."},{"type":"Lawful","text":"Support the lawful order with your wisdom."}],"bonds":["__________ is always making fun of me, but they still know who the real boss is around here.","__________ never takes my advice."],"gear":"You get sagacious robes and choose one:\n○ Antitoxin and bandages (3 uses, slow).\n○ Bag of books (5 uses, 2 weight).\n○ Staff (reach, 2 weight).","races":[{"name":"Dwarf","text":"When you ask the stones of a mountain for advice, they will tell you what they want. If you try to give it to them, take +1 forward, and mark XP if you succeed."},{"name":"Elf","text":"You have lived a long, long life. When you spout lore about historical events, you may roll with WIS instead of INT."},{"name":"Human","text":"When another PC comes to you for advice about something important and you tell them what you honestly think is best, they also deal +1d6 damage forward if they follow that advice."}]},{"name":"Shopkeeper","archetype":"Adventurer","page":93,"blurb":"Sometimes, running a business is an adventure in and of itself.","compendium":"Once you have a shop and some employees to work in it, you may consider the shopkeeper specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Inventory","text":"When you check your shop for something you should have, roll+WIS. On a 10+, it’s in stock. On a 7-9, you’re out, but somebody owes you some. On a miss, you had it, but somebody stole it or broke it, or stole it and broke it, the scumbag.","stat":"WIS","page":93}],"advanced":[{"name":"Bustling Storefront","text":"When you have time to advertise your services and tend your storefront, the GM will tell you who has come to spend money at your store. Other players may tell you that their characters have been customers as well. Say which ones you gave special treatment and roll+CHA. On a 10+, they were all satisfied. On a 7-9, one of them wasn’t happy but the rest were. On a miss, none of them are happy.","stat":"CHA","page":93,"tier":2},{"name":"Hired Help","text":"When you recruit from your shop, you attract twice as many prospective recruits.","page":94,"tier":2},{"name":"Idle Gossip","text":"When you ask your staff or regulars about someone important (your call), roll+CHA. On a 10+, you can ask the GM three questions from the list below. On a 7-9, only two:\n- How could I get to them, physically or financially?\n- What’s their deal and how’s it working out?\n- When should I expect to see them next?\n- Who do they associate with?\n- Who or what do they cherish most?\nOn a miss, ask one anyway, but your questions stir up trouble.","stat":"CHA","page":94,"tier":2},{"name":"Bazaar of Curios","text":"When you check your shop for something you really shouldn’t have, roll+WIS. On a 10+, you have it, or something close, although it might cause problems down the line. On a 7-9, you can get it, or something close, but it will come with strings attached. On a miss, you have it, alright, and a world of problems along with it!","stat":"WIS","page":94,"tier":6,"requires":["Inventory"]},{"name":"High Class","text":"Your shop deals in higher-end, more expensive goods. At the beginning of a session, or when there’s downtime, roll+CHA. On a 10+, both. On a 7-9, choose one:\n- You gain a useful contact from amongst your customers.\n- You make 1d6×100 coins in profit.","stat":"CHA","page":94,"tier":6},{"name":"Make This Go Away","text":"When you give something to one of your underlings and tell them to get rid of it, roll+CHA. On a 10+, it’s gone and only the two of you know it was ever there to begin with. On a 7-9, it’s common knowledge in and around the shop, but no further. On a miss, the thing pops up again at the worst possible time.","stat":"CHA","page":95,"tier":6}],"alignments":[{"type":"Evil","text":"Swindle a customer."},{"type":"Lawful","text":"Win a legal dispute."}],"bonds":["__________ should be able to get me some more customers.","__________ used to work for me, until I fired them."],"gear":"You get your shop’s inventory in addition to whatever your other specialties give you.","races":[{"name":"Human","text":"When you first arrive at a civilized settlement, the GM will tell you what goods are in abundance and what goods the settlement is in need of."}]},{"name":"Wayfarer","archetype":"Adventurer","page":96,"blurb":"A vagabond, a wanderer, a rolling stone is what they call you and it is true. You cannot stay long in one place, or at least you have yet to find the place that would have you, and you it.","compendium":"Once you have visited seven different lands, and in each land visited seven different settlements, you may consider the wayfarer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the wayfarer specialty, you get +2 load.","mods":{"load":2},"starting":[{"name":"A Port in the Storm","text":"When you return to a civilized settlement you’ve visited before, tell the GM when you were last here. They’ll tell you how it’s changed since then. Additionally, at your option, name a person you met here or something you left behind.","page":96},{"name":"Wide-Wanderer","text":"You’ve travelled the wide world over. When you arrive someplace, ask the GM about any important traditions, rituals, and so on, they’ll tell you what you need to know.","page":96}],"advanced":[{"name":"Hobo Signs","text":"When you discern realities in the wilderness or when you enter a settlement for the first time, also ask one of these questions:\n- How could I be accepted by the people here?\n- How could I best attract attention here?\n- How could I gain access to what is secret here?\n- What here is a source of evil?\n- Where could I best hide around here?\nIf you discern realities about a location, you may ask one of these questions instead of one from the normal list.","page":97,"tier":2},{"name":"Local Contacts","text":"When you arrive at a new settlement, roll+CHA. On a hit, you know someone here who can help you. They count as a hireling with points according to the settlement size and will accept friendship as payment. Additionally, on a 10+, they will rescue you from danger once while you are here. On a miss, instead you bring your enemies with you and find no friends here.","stat":"CHA","page":97,"tier":2},{"name":"Secret Paths and Ways","text":"You know places in the wilderness where secret paths lie unseen. When you travel by a way that is beyond the mortal world, roll+WIS. On a 10+, it leads where you want it to. On a 7-9, you or the GM must choose a difficulty:\n- Others find the way who did not know it before.\n- The journey takes much longer than it seemed to.\n- The way is long and hard. Each person who takes it must consume a ration or mark the debility weak.\n- You encounter some danger upon the road.","stat":"WIS","page":97,"tier":2},{"name":"Around the World","text":"You now have both A Port in the Storm and Wide-Wanderer. When you return to a civilized settlement you’ve visited before, you may name both someone you met and something you left behind.","page":98,"tier":6,"requires":["A Port in the Storm|Wide-Wanderer"]},{"name":"Reputation","text":"When you first meet someone who’s heard songs about you, roll+CHA. On a 10+, tell the GM two things they’ve heard about you. On a 7-9, tell the GM one thing they’ve heard, and the GM tells you one thing.","stat":"CHA","page":98,"tier":6},{"name":"Unforgettable Face","text":"When you meet someone you’ve met before (your call) after some time apart, you take +1 forward against them.","page":98,"tier":6}],"alignments":[{"type":"Good","text":"Leave a place in a better condition than it was in when you arrived."},{"type":"Neutral","text":"Leave a place in a better condition that you were in when you arrived."}],"bonds":["__________ brings trouble with them wherever they go.","__________ is great to have around, but I wouldn’t trust them with my life."],"gear":"You get a bag and a walking stick, if you want one, in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"When you wake from at least a few uninterrupted hours of sleep, you regain all your HP."},{"name":"Elf","text":"When you take watch, don’t roll. If something approaches, you’re able to wake the camp and prepare a response of your choice. Everyone in the camp takes +1 forward, provided they participate in your choice of response."}]},{"name":"Wraithlander","archetype":"Adventurer","page":101,"blurb":"Death is a guard at the gates, a keen eye and a black hand on the latch. Some folk find their way through the hollow kingdoms and out the other side. Shame they’ll never fit in again—nobody comes back without a mark to show for it.","compendium":"Once you have returned from the wraithlands with your life, you may consider the wraithlander specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"From the Forbidden Land Returned","text":"You bear a mark of your time in the wraith lands. Choose a part of your body that takes on the visible aspects of death while remaining fully functional:\n○ Arm: Any weapon you grasp flows into the other world. It gains +2 piercing against living creatures.\n○ Eye: When you touch a corpse you see what it saw in its last moments. The GM will describe it.\n○ Legs: Your passing leaves no mark or scent as a living person would.\n○ Tongue: You may lace any oath, prayer, or spell, prayer with a link to the forbidden land. Its effects on the dying or dead will be amplified, as described by the GM.\nDead spirits see your mark and know you as their own. Any dead spirit that still clings to the mortal plane will speak with you, sharing openly. The living, especially the devout, see your mark as a sign of sin. You take -1 ongoing to CHA rolls with the devout who see your mark.","page":101}],"advanced":[{"name":"Branded","text":"Choose another body part to take on the visible aspects of death.","page":102,"tier":2,"requires":["From the Forbidden Land Returned"]},{"name":"Death’s Friend","text":"When another player character meets death you may immediately resolve a bond you have with them, marking XP and writing a new bond as usual.","page":102,"tier":2},{"name":"Indelible","text":"The mark of the wraith lands grows such that it may not be concealed. Describe it. The dead will seek you out, giving you what aid they can. The undead will not harm you. The devout will treat you as a heretic.","page":102,"tier":2,"requires":["From the Forbidden Land Returned"]},{"name":"Blemished","text":"Choose a third body part to take on the visible aspects of deaths.","page":102,"tier":6,"requires":["Branded"]},{"name":"Final Tether","text":"When you speak to a dead spirit, you take +1 forward with all who knew that spirit in life.","page":102,"tier":6}],"alignments":[{"type":"Evil","text":"Increase the influence of the wraithlands over the living world."},{"type":"Good","text":"Bring peace to a restless spirit."},{"type":"Neutral","text":"Discover more about the wraithlands or your connection to them."}],"bonds":["__________ has seen much of Death, almost as much as I.","__________ is too full of secrets for my liking."],"gear":"You get a token of your time in the wraithlands, in addition to whatever your other specialties give you. Describe it.","races":[{"name":"Elf","text":"You are immune to all types of paralysis—from enchantment to hypnosis, from poisons to the influence of gods."},{"name":"Human","text":"Take +1 ongoing to your last breath roll. Death is no stranger to you."}]},{"name":"Avatar","archetype":"Disciple","page":110,"blurb":"You have been chosen to bear the blessings of your god to the world.","compendium":"Once you have been chosen by a deity to carry a piece of its essence within you, you may consider the avatar specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the avatar specialty, lower your maximum HP by 2, but not lower than 4+Constitution.","mods":{"hp":-2},"starting":[{"name":"Blessed","text":"When you roll for another move while asking for the blessings of your deity, you may choose options equal to your WIS or less (but not fewer than none), and then tell the other players:\n- …how your deity’s domain manifests itself on earth.\n- …what your deity asks for in return.\n- …which one of your deity’s boons is granted to you now.\n- …why your deity has taken an interest in this affair.\nOn a 10+, all that you say is true. On a 7-9, the GM chooses one statement to be false, the others are true. On a miss, you have angered the gods.","page":110},{"name":"Personal Deity","text":"You serve and worship some deity or power which speaks to you and through you. Give your god a name. You may also choose an additional domain for your deity, in addition to the sphere(s) you have insight into:\n○ Bloody conquest.\n○ Civilization.\n○ Knowledge and hidden things.\n○ Mercy for the downtrodden.\n○ Those lost and forgotten.\n○ Time and the passing seasons.\n○ What lies beneath.\nChoose one precept of your god:\n○ Your god believes in trial by combat, and is petitioned through personal victory.\n○ Your god desires sacrificial rites, and is petitioned through offerings of such.\n○ Your god is secretive and insular, and is petitioned through the gaining of secrets.\n○ Your god preaches the sanctity of suffering, and is petitioned by such.\nChoose one or two personal features for your deity:\n○ A handful of other deities are closely connected to yours.\n○ Many festivals are held in honour of your deity.\n○ Numerous other deities are loosely connected to yours.\n○ One or more regions have outlawed your deity.\n○ Your deity desires more worldly worship.\n○ Your deity has a favoured social group, a chosen people.\n○ Your deity has divine rivals.\n○ Your deity has multiple personas, that manifest in different situations.\n○ Your deity has worshippers all over the world.\n○ Your deity is vengeful and has many worldly enemies.","page":111}],"advanced":[{"name":"Divine Guidance","text":"When you petition your deity according to the precepts of your religion, you are granted some useful knowledge or boon related to your deity’s domain. The GM will tell you what.","page":113,"tier":2,"requires":["Personal Deity"]},{"name":"Driven by the Divine","text":"When your actions are controlled by supernatural or outside forces, you may instead surrender control of your body to your deity. If you do so, roll+CHA. On a 10+, choose two. On a 7-9, choose one:\n- You are possessed for a short time only.\n- Your deity is not interrupted by demonic forces.\n- Your deity is not single-minded in pursuit of its agenda.\nEither way, your deity is not controlled by outside forces, and the GM will tell you how its will is done through your body.","stat":"CHA","page":113,"tier":2},{"name":"Orison for Guidance","text":"When you sacrifice something of value to your deity and pray for guidance, your deity tells you what it would have you do. If you do it, mark experience.","page":113,"tier":2,"requires":["Personal Deity"]},{"name":"The Face of God","text":"When you choose blessed options, you may also choose to take on the likeness of your deity. Anyone witnessing your acts will react accordingly. This manifestation lasts until you rest or dispel it.","page":114,"tier":6,"requires":["Blessed"]},{"name":"Haruspex","text":"When you petition your deity according to the precepts of your religion, you may also ask the GM any one question. The GM will answer truthfully. You or your allies take +1 forward when acting on the answer.","page":114,"tier":6,"requires":["Personal Deity"]},{"name":"Petitioning the Empty Sky","text":"When you undertake a petition to your deity, dedicating such actions to them beforehand, take +1 forward.","page":114,"tier":6,"requires":["Personal Deity"]}],"alignments":[{"type":"Chaotic","text":"Disrupt a power structure that is not aligned with your god."},{"type":"Lawful","text":"Assist a local power structure that agrees with your god."}],"bonds":["__________ is ignorant of the evil that we face.","My god has a special task for __________."],"gear":"You get a symbol of your god, in addition to whatever your other specialties give you. Describe it.","races":[{"name":"Dwarf","text":"When you choose blessed options, your deity will also show you one of the following (your choice:\n- A way out from underground.\n- A way to get underground.\n- If there is treasure nearby."},{"name":"Elf","text":"When you choose blessed options, you may also make plants grow in your presence, in addition to any other effects."},{"name":"Halfling","text":"When you choose blessed options, your deity will also reveal an escape route from your current situation, if any exist."},{"name":"Human","text":"When you choose blessed options, your deity will also reveal to you who or what is the greatest threat to you, personally, at that moment, and why."}]},{"name":"Crusader","archetype":"Disciple","page":116,"blurb":"You have a crusade to lead and you will not stop fighting for it!","compendium":"Once you have been accepted into a holy order of knights after passing their initiation tests, you may consider the crusader specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the crusader specialty, increase your damage die by one size (from d6 to d8), and you get +1 load.","mods":{"load":1,"dmg":1},"starting":[{"name":"Lay on Hands","text":"When you touch someone, skin to skin, and pray for their well-being, roll+CHA. On a 10+, you heal 1d8 damage or remove one disease. On a 7-9, they are healed, but the damage or disease is transferred to you.","stat":"CHA","page":116}],"advanced":[{"name":"Charge!","text":"When you lead the charge into combat, those you lead take +1 forward.","page":117,"tier":2},{"name":"First Aid","text":"Cure Light Wounds is a rote for you, and therefore doesn’t count against your limit of granted spells.","page":117,"tier":2,"requires":["Cast a Spell"]},{"name":"Hospitaller","text":"When you heal an ally, you heal +1d8 damage.","page":117,"tier":2},{"name":"Invigorate","text":"When you heal someone, they take +2 forward to their damage.","page":117,"tier":2},{"name":"Ever Onward","text":"When you lead the charge into combat, those you lead take +1 forward and +2 armour forward.","page":117,"tier":6,"replaces":["Charge!"]},{"name":"Greater First Aid","text":"Cure Moderate Wounds is a rote for you, and therefore doesn’t count against your limit of granted spells.","page":117,"tier":6,"requires":["First Aid"]},{"name":"Perfect Hospitaller","text":"When you heal an ally, you heal +2d8 damage.","page":117,"tier":6,"replaces":["Hospitaller"]}],"alignments":[{"type":"Chaotic","text":"Deny the authorities power over your actions."},{"type":"Good","text":"Endanger yourself to protect someone weaker than you."},{"type":"Lawful","text":"Deny mercy to a criminal or unbeliever."}],"bonds":["__________ is a brave soul, I have much to learn from them.","__________ is in constant danger, but I will keep them safe.","__________ has stood by me in battle and can be trusted completely."],"gear":"Choose two:\n○ Adventuring gear (5 uses, 1 weight) and a backpack.\n○ Chainmail (1 armour, 1 weight).\n○ Dungeon rations (5 uses, 1 weight) and a healing potion.\n○ Halberd (Reach, +1 damage, two-handed, 2 weight).\n○ Longsword (close, +1 damage, 2 weight).","races":[{"name":"Dwarf","text":"While you attend to healing a comrade, you have +2 armour."},{"name":"Elf","text":"Lay on hands may be used on anyone who can see you or hear your voice, not just people you touch."},{"name":"Human","text":"When you heal someone, on a 10+, you may also ask a question about them from the discern realities list, as if you had made the move and rolled 7-9."}]},{"name":"Devoted","archetype":"Disciple","page":120,"blurb":"More than a mere philosophy, you have devoted yourself to a god.","compendium":"Once you devote yourself to a specific, personified deity and that deity contacts you personally to accept your devotion, you may consider the devoted specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the devoted specialty, you get +1 load. It is a heavy burden you bear, but you have grown used to it.","mods":{"load":1},"starting":[{"name":"Divine Guidance","text":"When you petition your deity according to the precepts of your religion, you are granted some useful knowledge or boon related to your deity’s domain. The GM will tell you what.","page":120},{"name":"Personal Deity","text":"You serve and worship some deity or power which speaks to you and through you. Give your god a name. You may also choose an additional domain for your deity, in addition to the sphere(s) you have insight into:\n○ Bloody conquest.\n○ Civilization.\n○ Knowledge and hidden things.\n○ Mercy for the downtrodden.\n○ Those lost and forgotten.\n○ Time and the passing seasons.\n○ What lies beneath.\nChoose one precept of your god:\n○ Your god believes in trial by combat, and is petitioned through personal victory.\n○ Your god desires sacrificial rites, and is petitioned through offerings of such.\n○ Your god is secretive and insular, and is petitioned through the gaining of secrets.\n○ Your god preaches the sanctity of suffering, and is petitioned by such.\nChoose one or two personal features for your deity:\n○ A handful of other deities are closely connected to yours.\n○ Many festivals are held in honour of your deity.\n○ Numerous other deities are loosely connected to yours.\n○ One of more regions have outlawed your deity.\n○ Your deity desires more worldly worship.\n○ Your deity has a favoured social group, a chosen people.\n○ Your deity has divine rivals.\n○ Your deity has multiple personas, that manifest in different situations.\n○ Your deity has worshippers all over the world.\n○ Your deity is vengeful and has many worldly enemies.","page":121}],"advanced":[{"name":"Divine Intervention","text":"When you commune with or petition your deity, you get one hold and lose any hold you already had from this move. Spend that hold when you or an ally take damage to call on your deity, who intervenes with an appropriate manifestation and negates the damage.","page":122,"tier":2,"requires":["Commune|Divine Guidance"]},{"name":"Heaven’s Weaving","text":"When you parley with someone, your faith grants you insight into them. Ask their player two questions from the discern realities list.","page":122,"tier":2},{"name":"Orison for Guidance","text":"When you sacrifice something of value to your deity and pray for guidance, your deity tells you what it would have you do. If you do it, mark experience.","page":122,"tier":2,"requires":["Personal Deity"]},{"name":"Apotheosis","text":"The first time you spend time in prayer as appropriate to your god after taking this move, choose a feature associated with your deity (rending claws, wings of sapphire feathers, an all-seeing third eye, etc). When you emerge from prayer, you permanently gain that physical feature.","page":122,"tier":6,"requires":["Personal Deity"]},{"name":"Divine Invincibility","text":"When you commune with or petition your deity, you gain 2 hold and lose any hold you already had. Spend one hold when you or an ally takes damage to call on your deity, who intervenes with an appropriate manifestation and negates the damage.","page":123,"tier":6,"replaces":["Divine Intervention"]},{"name":"Evidence of Faith","text":"When you see divine magic as it happens, you can ask the GM which deity granted the spell and its effects. Take +1 when acting on the answers.","page":123,"tier":6}],"alignments":[{"type":"Chaotic","text":"Disrupt the workings of authorities who do not share your faith."},{"type":"Evil","text":"Gain an advantage for your deity at the expense of someone else."},{"type":"Good","text":"Bring the benefits of your deity to people of a different faith."},{"type":"Lawful","text":"Defend others who share your faith."}],"bonds":["__________’s misguided behaviour endangers their very soul!","I have interceded with others of my faith on behalf of __________ before.","I respect the beliefs of __________ but hope they will someday see the true way."],"gear":"Choose one:\n○ An additional symbol of your devotion.\n○ Adventuring gear (5 uses, 1 weight) and a backpack.\n○ Bag of book (5 uses, 2 weight).\n○ Mace or warhammer (close, 1 weight).","races":[{"name":"Dwarf","text":"You may also petition your deity by crafting items made of gems, metal, and stone to honour your devotion."},{"name":"Elf","text":"You may also petition your deity by tending to the health of the natural world around you."},{"name":"Halfling","text":"Choose one of your deity’s spheres (or your deity’s additional domain, if you chose one). When you spout lore concerning that sphere or domain, take +1."},{"name":"Human","text":"When you petition your deity, you are also told who poses the greatest threat to you or your faith, and why."}]},{"name":"Elementalist","archetype":"Disciple","page":126,"blurb":"Let the sun fall into the ocean, let the earth erupt in flames.","compendium":"Once you sacrifice your most prized possession to the spirits of the elements, you may consider the elementalist specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Elemental Mastery","text":"When you call on the primal spirits of air, earth, fire or water to perform a task for you, roll+CON. On a 10+, choose two from the list below. On a 7-9, choose one:\n- The effect you desire comes to pass.\n- You avoid paying nature’s price.\n- You retain control.\nOn a miss, some catastrophe occurs as a result of your calling.","stat":"CON","page":126}],"advanced":[{"name":"Born of Fire","text":"You are no longer harmed by the touch of fire, nor are you vulnerable to heat.","page":128,"tier":2},{"name":"Eye of the Storm","text":"When you exert your will in a circle around yourself, roll+CON. On a hit, the world calms around you (the earth below your feet stops breaking apart, fires you touch go out, storms break around you, etc), but on a 7-9, this calmness affects only what you touch, and only as long as you are touching it.","stat":"CON","page":128,"tier":2},{"name":"Friend of the Sea","text":"You can live, breathe, and move underwater with ease.","page":128,"tier":2},{"name":"Heart of Ice","text":"You can walk easily on ice and are no longer vulnerable to freezing. No matter how cold or slippery it gets, you function fine.","page":128,"tier":2},{"name":"Nature’s Fury","text":"When you use the natural elements to deal damage, your damage die is d10 instead of d4.","page":128,"tier":2},{"name":"Touching the Firmament","text":"If you have a few hours or so to meditate amongst the raw elements, or to perform rituals before them, they will purify you. This counts as making camp and sleeping, but you do not need to consume a ration. If you spend days amongst the elements, it counts as recovering under the care of a healer.","page":128,"tier":2},{"name":"Elemental Form","text":"You can transmute your own body into a form made from the raw elements. When you assume an elemental form, roll+CON. On a 10+, hold 3. On a 7-9, hold 2. On a miss, hold 1 in addition to whatever the GM says. Your new form can move much like your old form, but has the innate abilities of the elements it is made of: fire burns, stone is hard, water runs and flows, and a body made of light, shadow, or wind is intangible. You still use your normal stats but some moves may be harder to trigger. The GM will also tell you one or more moves associated with your new form. Spend a hold to make that move. Once you’re out of hold, you return to your natural form. At any time, you may spend all your hold and revert to your natural form.","stat":"CON","page":129,"tier":6},{"name":"Physical Purity","text":"When you purify yourself amongst the elements, you may also remove a debility or be cured of a disease or poison, so long as the cause of your ailment is not more powerful than the elements themselves.","page":130,"tier":6,"requires":["Touching the Firmament"]},{"name":"To Speak With the World Itself","text":"When you examine something made from the raw elements of nature, roll+CON. On a 10+, you learn something interesting and useful. On a 7-9, you learn something interesting, but it’s on you to make it useful. On a miss, you have disturbed the elements with your meddling. Whatever the result, the GM may also tell you something this element wants. If you give it what it wants, it will answer one question you ask of it, to the best of its abilities.","stat":"CON","page":130,"tier":6},{"name":"Weather Weaver","text":"When you are under open skies when the sun rises, the GM will ask you what the weather will be that day. tell them whatever you like, it comes to pass.","page":130,"tier":6}],"alignments":[{"type":"Chaotic","text":"Permanently change the way someone else interacts with their environment."},{"type":"Evil","text":"Prove yourself superior to someone in a position of authority."},{"type":"Good","text":"Use your powers over the elements to better someone else’s lot in life."}],"bonds":["__________ and I have braved the elements together.","__________ has been touched by the primal elements and I will find out why."],"gear":"Choose one:\n○ A large item made of, or for, a particular element, with one tag of your choice.\n○ Many small items made of, or for, a particular element, with one tag of your choice.","races":[{"name":"Dwarf","text":"When you call on the primal spirits of earth, on a hit, choose one extra option."},{"name":"Elf","text":"When you call on the primal spirits of air, on a hit, choose one extra option."},{"name":"Halfling","text":"You can interact (and parley) with elemental spirits as if they were people."},{"name":"Human","text":"When you call on the primal spirits of water, on a hit, choose one extra option."}]},{"name":"Embodiment","archetype":"Disciple","page":132,"blurb":"Your embody one particular domain, one aspect of the cosmos. This is what you live and breathe. In this domain, you work miracles.","compendium":"Once you have devoted yourself to a single sphere of divine influence and completed one task of legend to prove it, you may consider the embodiment specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Cast a Holy Spell","text":"When you cast a spell from your sphere of influence, roll+WIS. On a 10+, you cast the spell, but choose one consequence from the list below. On a 7-9, you cast the spell, but choose two:\n- The spell has other effects as well.\n- You may not cast this spell again until after you get a full night’s sleep.\n- Your spellcasting is obvious and you draw attention to yourself.","stat":"WIS","page":132},{"name":"Sphere of Influence","text":"Choose one sphere of holy spells. Your faith and discipline allows you to cast any spell from that list of your level or lower.","page":132}],"advanced":[{"name":"Learned and Wise","text":"When you spout lore about your sphere of influence, take +1.","page":133,"tier":2,"requires":["Sphere of Influence"]},{"name":"Ostentation","text":"When you cast a spell, on a hit, you may also choose one of these options:\n- The spell’s effect is doubled.\n- The spell’s targets are doubled.","page":133,"tier":2,"requires":["Cast a Holy Spell"]},{"name":"Worldly Wisdom","text":"Choose a spell from another spell list. You can cast that spell as if it were one of your own.","page":133,"tier":2,"requires":["Cast a Holy Spell"]},{"name":"Exacting Discipline","text":"When you cast a spell, on a 12+, choose no consequences.","page":133,"tier":6,"requires":["Cast a Holy Spell"]},{"name":"Genius Savant","text":"When you spout lore about your sphere of influence, take +1. On a 12+, the GM will also ask you a question about the topic. Whatever you answer, it is the truth.","page":133,"tier":6,"replaces":["Learned and Wise"]},{"name":"Syncretic Faith","text":"Choose another spell from another spell list. You can cast that spell as if it were one of your own.","page":134,"tier":6,"requires":["Worldly Wisdom"]}],"alignments":[{"type":"Chaotic","text":"Defeat someone who opposes your sphere of influence."},{"type":"Good","text":"Discredit a dangerous misconception about your sphere of influence."},{"type":"Lawful","text":"Sacrifice something to your sphere of influence instead of accepting personal gain."}],"bonds":["__________ could also become the embodiment of my faith’s sphere of influence.","I will teach __________ all about my faith’s sphere of influence."],"gear":"Choose one:\n○ An additional symbol of your faith, exhibiting your sphere of influence.\n○ Adventuring gear (5 uses, 1 weight) and a backpack.\n○ Axe or sword (close, 1 weight).\n○ Bandages (3 uses, slow) and dungeon rations (5 uses, 1 weight).\n○ Dagger (hand, 1 weight).","races":[{"name":"Dwarf","text":"After you cast a spell underground, take +1 forward."},{"name":"Elf","text":"After you cast a spell in a forest, take +1 forward."},{"name":"Human","text":"Your faith is diverse. Choose a spell from any spell list: you can cast this spell as if it were part of your sphere of influence."}]},{"name":"Empath","archetype":"Disciple","page":136,"blurb":"“Captain, I sense hostility.\"","compendium":"Once you have thrice bared your emotional soul to another person and had them reciprocated, you may consider the empath specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Empathy","text":"When you study someone, you can also ask their player “What is your character feeling?” in addition to anything else that happens. Also, add these to the list of discern realities questions:\n- How could I make your character feel __________?\n- What is making your character feel this way?","page":136}],"advanced":[{"name":"Comfortably Numb","text":"When you touch someone, you may deaden their emotions and sense of pain. This stops them from feeling extremes of anger, joy, or sadness. It lasts for several hours or until the target suffers any kind of emotional trigger or trauma.","page":137,"tier":2},{"name":"Emotional Transference","text":"When you touch someone, you may allow them to feel all the emotions you are feeling, even if emotions are something strange for them to feel. If you can use this as leverage, you may parley with WIS instead of CHA.","page":137,"tier":2},{"name":"Mindmeld","text":"When you touch a willing or sleeping subject, your senses are tuned to their thoughts. The GM will give you an impression of what’s going on inside their head.","page":137,"tier":2},{"name":"Crowd Control","text":"When you catch the attention of a crowd and fix your will upon their emotions, roll+WIS. On a hit, you may instil one emotion of your choice into every member of that crowd. On a 10+, you may also command the crowd to take one concrete action—the majority will obey. On a miss, the crowd turns on you.","stat":"WIS","page":138,"tier":6},{"name":"Emotional Manipulation","text":"When you touch someone, you may force them to feel any emotion you want. If you can use this as leverage, you may parley with WIS instead of CHA.","page":138,"tier":6,"requires":["Emotional Transference"]},{"name":"Pain to Pleasure","text":"When you take damage, take +1 forward.","page":138,"tier":6}],"alignments":[{"type":"Good","text":"Turn someone’s foul mood around by doing something significant for them."},{"type":"Neutral","text":"Use someone else’s mood for your own profit."}],"bonds":["__________ needs to respect me more than they do right now.","I keep telling __________, but they won’t listen.","I suspect __________ of some kind of betrayal."],"gear":"Choose one:\n○ Antitoxin and bandages (3 uses, slow).\n○ Dungeon rations (5 uses, 1 weight).\n○ Healing potion.\n○ Poultices and herbs (2 uses, slow, 1 weight).\n○ Shield (+1 armour, 2 weight).","races":[{"name":"Dwarf","text":"When you study someone, the GM will also tell you if they intend to break or keep any oaths they have made, or if they are the kind of person who keeps the oaths they make."},{"name":"Halfling","text":"When you parley with someone, you may ask their player “What is your character feeling?” in addition to anything else that happens."},{"name":"Human","text":"When you study someone, you may ask their player “What do I have that your character wants?” instead of “What is your character feeling?”"}]},{"name":"Exorcist","archetype":"Disciple","page":140,"blurb":"Who you gonna call?","compendium":"Once you have successfully banished a demon, ghost, or other extraplanar monster, you may consider the exorcist specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Circle of Protection","text":"When you draw a magical circle on the floor or ground, roll+WIS. On a 10+, it will keep spirits, ghosts, or extra-planar entities in or out until someone else breaks it. On a 7-9, it will keep them in or out momentarily, but not for long.","stat":"WIS","page":140},{"name":"Ghost Seer","text":"When you invoke your faith by prayer, you can interact with ghostly, insubstantial, or extra-planar entities, including dealing damage to them if your faith opposes them. If they are possessing someone, though, you can’t necessarily deal with them separately.","page":140}],"advanced":[{"name":"Abjuration","text":"When you banish a creature from another plane of existence, roll+INT. On a 10+, it may not approach you further and if it lacks an anchor in this world, it must return to whence it came. On a 7-9, it may not approach you further unless you allow it to (or you let your guard down). On a miss, you cannot banish it.","stat":"INT","page":141,"tier":2},{"name":"Ghost Killer","text":"When you attack a spirit, ghost, or extra-planar entity, your damage die is a d10.","page":141,"tier":2},{"name":"Spiritual Connection","text":"If you have a piece of someone’s body, or a possession they hold very dear, you can interact with them as if they were a spirit, ghost, or extra-planar entity, and use moves against them as such.","page":141,"tier":2},{"name":"To Know the Unknowable","text":"When you encounter a creature, manifestation, or power from another plane of existence, you can ask the GM from whence it came and what its properties are. Take +1 when acting on the answers.","page":141,"tier":2},{"name":"Ars Goetia","text":"When you first encounter an extra-planar entity, you may ask the GM any one question about it. The GM will answer truthfully.","page":142,"tier":6},{"name":"Closing the Gateway","text":"When you attack a spirit, ghost, or extra-planar entity, you deal +1d6 damage, and your foe can choose to return from whence it came instead of taking damage. When you reduce a spirit, ghost, or extra-planar creature to zero HP, its soul is henceforth barred from appearing on the material plane in any form. It can still be encountered in astral visions and on other planes, just not your world.","page":142,"tier":6},{"name":"Command of Injunction","text":"When you command someone in your presence to cease from a specific activity, roll+WIS. On a 10+, they must comply to the best of their ability. On a 7-9, they must comply until they leave your presence. Only one injunction you issue can stand at any one time, though you may command any and all person in your presence. Those under an indefinite injunction are not notified when it is lifted. Only activities consciously undertaken can be subject to injunction.","stat":"WIS","page":142,"tier":6}],"alignments":[{"type":"Good","text":"Free someone from a troublesome spirit."},{"type":"Lawful","text":"Punish a necromancer or summoner of spirits for their misdeeds."}],"bonds":["__________ helped me banish a great evil from the world, but not without cost.","__________ is in constant danger, but I will keep them safe."],"gear":"Choose one:\n○ Bag of books (5 uses, 2 weight).\n○ Bandages (3 uses, slow).\n○ Fifty feet of rope (1 weight).\n○ Lead-lined gloves (hand, +1 damage, 1 weight).\n○ A special uniform.","races":[{"name":"Elf","text":"When you discern realities, on a hit, your keen senses also tell you if there are any spirits, ghost, or extra-planar entities around."},{"name":"Human","text":"When you touch someone, you can always tell if they are possessed, and if so, by what."}]},{"name":"Impervious","archetype":"Disciple","page":144,"blurb":"Your path in life is to face danger head on, and defy it.","compendium":"Once you have stood up to defend those less fortunate than you, been met with violence, and responded in a non-violent manner, you may consider the impervious specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Unbowed, Unbent, Unbroken","text":"When you prepare yourself to endure some hardship without fighting back, roll+CON. On a hit, you can either take half damage or you can completely ignore one other ill effect. On a 10+, you can also defeat, expose, or frustrate your oppressor with your stubbornness.","stat":"CON","page":144}],"advanced":[{"name":"Bloody Aegis","text":"When you take damage, you can grit your teeth and accept the blow. If you do, you take no damage but instead suffer a debility of your choice. If you already have all six debilities you can’t use this move.","page":145,"tier":2},{"name":"By Nature Sustained","text":"You don’t need to eat or drink. If a move tells you to mark off a ration just ignore it.","page":145,"tier":2},{"name":"Divine Protection","text":"When you wear no armour or shield, you have 2 armour.","page":145,"tier":2},{"name":"Iron Will","text":"When you are subject to mind control or magic that influences your feelings, you may choose to take 1d4 damage (ignores armour) and ignore the influence.","page":145,"tier":2},{"name":"Staunch Defender","text":"When you defend, you always get +1 hold, even on a miss.","page":145,"tier":2},{"name":"Divine Armour","text":"When you wear no armour or shield, you have 3 armour.","page":146,"tier":6,"replaces":["Divine Protection"]},{"name":"Healthy Distrust","text":"Whenever the unclean magic wielded by mortal men causes you to defy danger, treat a miss as a 7-9 instead.","page":146,"tier":6},{"name":"Impervious Defender","text":"When you defend, you always get +1 hold, even on a miss. On a 12+, instead of getting hold the nearest attacking creature is stymied giving you a clear advantage, the GM will describe it.","page":146,"tier":6,"replaces":["Staunch Defender"]},{"name":"Indomitable","text":"When you suffer a debility (even through Bloody Aegis), take +1 forward against whatever caused it.","page":146,"tier":6}],"alignments":[{"type":"Good","text":"Endanger yourself to protect someone weaker than you."},{"type":"Lawful","text":"Stand up to an illegitimate authority figure."}],"bonds":["__________ is a brave soul, I have much to learn from them.","__________ is hiding something, but that is okay. We’ve all got scars we’re not willing to share.","__________ is tougher than they think. I will prove it to them."],"gear":"You don’t need any more gear, you’re impervious!","races":[{"name":"Dwarf","text":"When you defend, you cannot be moved if your feet are planted firmly upon the ground."},{"name":"Elf","text":"You know what patience is. For you, non-violent protest counts as making camp and recovering, even under harsh conditions."},{"name":"Halfling","text":"It takes only two days of recovery for you to remove a debility, or one if you are tended by a healer."},{"name":"Human","text":"When you suffer a debility, take +1 forward to do anything other than fight back."}]},{"name":"Martial Hero","archetype":"Disciple","page":148,"blurb":"You are a fighter, for sure. But you fight with honour!","compendium":"Once you have finished training under a master of the martial arts, whether as part of their school or as their only student, you may consider the martial hero specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Fight with Honour","text":"When you enter a fight, roll+CON. On a 10+, hold 3 chi. On a 7-9, hold 2 chi. On a miss, hold 1 chi anyway, but your enemies already have the drop on you. Spend a chi during the fight to achieve one of the following effects:\n- Block a blow meant for you or someone else (you take half damage).\n- Break free from bonds or other confinement.\n- Cross the distance between yourself and a foe, bypassing all obstacles.\n- Deal your damage to a foe within reach.\n- Leap over or across a physical obstacle.\nYou lose any remaining chi once the fight is over.","stat":"CON","page":148},{"name":"Fists of Fury","text":"You are never unarmed—your body, and each of your limbs, is a weapon (hand, 0 weight), just as good as any other.","page":148}],"advanced":[{"name":"Arrows in Hand","text":"When you block or dodge a missile attack, roll+DEX. On a 10+, you snatch the missile out of the air and it deals no damage. On a 7-9, choose one:\n- You avoid the attack completely.\n- You snatch the missile out of the air and take half damage.","stat":"DEX","page":149,"tier":2,"requires":["Fists of Fury"]},{"name":"Fuelled by Honour","text":"If you accomplish your alignment condition during a fight, gain one chi, up to a maximum of three total.","page":149,"tier":2,"requires":["Fight with Honour"]},{"name":"Hand of Monkey","text":"If you are unarmoured and carry no shield, you have 2 armour against hand-held weapons. If this reduces the damage you take to zero, you may also disarm your foe.","page":149,"tier":2,"requires":["Fists of Fury"]},{"name":"Honourable Society","text":"You are a respected member of an honourable fighting society. When you send word to them for aid, you may recruit as if you have a useful reputation and are paying generously, even though you are not paying at all. Any hirelings they send you have at least loyalty +1 and warrior +1.","page":149,"tier":2},{"name":"Light as a Feather","text":"When you run across a surface that cannot hold your weight, roll+DEX. On a 10+, you actually do it, gracefully and without trouble. On a 7-9, you make it across, but with consequences. The GM will tell you what.","stat":"DEX","page":149,"tier":2},{"name":"Glorious Honour","text":"When you fight with honour, hold an extra chi, even on a miss.","page":150,"tier":6,"requires":["Fight with Honour"]},{"name":"Hands of the Monkey King","text":"If you are unarmoured and carry no shield, you have 4 armour against hand-held weapons. If this reduces the damage you take to zero, you may also disarm your foe.","page":150,"tier":6,"replaces":["Hand of Monkey"]},{"name":"Superior Technique","text":"Add these to the list of deeds you can spend a chi to perform:\n- Break through a physical obstacle.\n- Deal your damage to a foe within sight.\n- Grab an item within reach. Now it is yours.","page":150,"tier":6,"requires":["Fight with Honour"]}],"alignments":[{"type":"Chaotic","text":"Fight agents of the oppressive status quo."},{"type":"Good","text":"Fight honourably on behalf of someone who does not deserve the misfortunes they have suffered."},{"type":"Lawful","text":"Expose corruption amongst the authorities."},{"type":"Neutral","text":"Bring fame and renown to your honourable fighting society."}],"bonds":["__________ has stood by me in battle and can be trusted completely.","__________ is in constant danger, but I will keep them safe.","__________ would benefit greatly from following my path."],"gear":"If you belong to an honourable fighting society, you have a token of your membership, such as a robe, sash, or scroll. Describe it.","races":[{"name":"Dwarf","text":"As long as you have chi left, you cannot be pushed, thrown, tripped, or knocked over."},{"name":"Elf","text":"As long as you have chi left, you may defend with DEX instead of CON, and hack and slash with DEX instead of STR."},{"name":"Halfling","text":"When you fight with honour, add this to the list of deeds you can spend a chi to perform:\n- Dodge a blow meant for you."},{"name":"Human","text":"When you arrive at a new settlement, an honourable fighting society will accept you as their guest and provide you with friendship, hospitality, and advice. If you also agree to help them solve a problem they have, take +1 forward."}]},{"name":"Miracle Worker","archetype":"Disciple","page":152,"blurb":"You have been imbued with divine abilities as a reward for your faith in a higher power. These abilities take the form of spells.","compendium":"Once you have been infused with divine power as a result of your faith and devotion, you may consider the miracle worker specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Cast a Miraculous Spell","text":"When you unleash a spell granted to you by your devotion, roll+WIS. On a 10+, the spell is successfully cast and your devotion does not revoke the spell, so you may cast it again. On a 7-9, the spell is cast, but choose one:\n- After you cast it, the spell is revoked. You cannot cast the spell again until you commune and have it granted to you.\n- You draw unwelcome attention or put yourself in a spot. The GM will tell you how.\n- Your casting strains your devotion—take -1 ongoing to cast a spell until the next time you commune.\nNote that maintaining spells with ongoing effects will sometimes cause a penalty to your roll to cast a spell.","stat":"WIS","page":152},{"name":"Commune","text":"When you spend uninterrupted time (an hour or so) in quiet contemplation of your devotion, you:\n- Lose any spells already granted to you.\n- Are granted new spells of your choice, whose total levels don’t exceed your own level+1, and none of which is a higher level than your own level.\n- Prepare all of your rotes, which never count against your limit.\nYour spheres of insight determine which spells you can cast—you cannot be granted spells from other spheres, or from other classes.","page":153}],"advanced":[{"name":"Chosen One","text":"Choose one spell. You are granted that spell as if it was one level lower.","page":154,"tier":2,"requires":["Cast a Spell"]},{"name":"Empower","text":"When you cast a spell, on a 10+, you have the option of choosing from the 7-9 list. If you do, you may choose one of these effects as well:\n- The spell’s effects are doubled.\n- The spell’s targets are doubled.","page":154,"tier":2,"requires":["Cast a Spell"]},{"name":"Serenity","text":"When you cast a spell, you ignore the first -1 penalty from ongoing spells.","page":154,"tier":2,"requires":["Cast a Spell"]},{"name":"Anointed","text":"Choose one spell in addition to the one you picked for chosen one. You are granted that spell as if it was one level lower.","page":154,"tier":6,"requires":["Chosen One"]},{"name":"Evidence of Faith","text":"When you see divine magic as it happens, you can ask the GM which deity granted the spell and its effects. Take +1 when acting on the answers.","page":154,"tier":6},{"name":"Greater Empower","text":"When you cast a spell, on a 10-11, you have the option of choosing from the 7-9 list. If you do, you may choose one of these effects as well. On a 12+, you get to choose one of these effects for free.\n- The spell’s effects are doubled.\n- The spell’s targets are doubled.","page":155,"tier":6,"replaces":["Empower"]},{"name":"Providence","text":"You ignore the -1 penalty from two spells you maintain.","page":155,"tier":6,"replaces":["Serenity"]}],"alignments":[{"type":"Chaotic","text":"Disrupt the natural order with the power of your miracles."},{"type":"Evil","text":"Use your miraculous powers to harm or endanger another."},{"type":"Good","text":"Assist someone whose cause you believe in."}],"bonds":["__________ has stood by me in battle and can be trusted completely.","__________ helped my complete an important task.","__________ is in constant danger, but I will keep them safe.","__________ would benefit greatly from following my path."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight) and a backpack.\n○ Antitoxin and 12 coins.\n○ Healing potion.\n○ Keg of Dwarven stout (4 weight).","races":[{"name":"Dwarf","text":"You are one with stone. When you commune, you are also granted a special version of Words of the Unspeaking as a rote which only works on stone."},{"name":"Human","text":"Your faith is diverse. Choose one spell from another sphere or class. You can cast and be granted that spell as if it belonged to your own spheres of influence."}]},{"name":"Oracle","archetype":"Disciple","page":158,"blurb":"To know the future absolutely is to be trapped inside the future absolutely. Time collapses, the present swallows everything. You have more freedom than that, though: the freedom to choose your own future.","compendium":"Once you have drunk the water of life and successfully filtered out the poisons while experienced the intoxicating visions, thus surviving the spice agony, you may consider the oracle specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Truth and Consequences","text":"When you examine the strands of possible futures, describe an event that is yet to occur and roll+WIS. On a 10+, name three people, groups, or social institutions. On a 7-9, only two. On a miss, name one anyway, in addition to whatever else the GM tells you. For each subject you name, the GM will tell you what sort of consequences this future event will have for them. You may only examine each event once.","stat":"WIS","page":158}],"advanced":[{"name":"Foreshadowing","text":"When you look into the future for possible dangers, name a person, place, or thing and roll+WIS. On a 10+, the GM will tell you two things from the list below. On a 7-9, only one. On a miss, the GM will tell you one anyway, but also something else that is not true. Which one is which you will have to divine for yourself.\n- The nature of a danger (its type and impulse) that threatens the subject or that the subject is part of.\n- One grim portent, related to the subject, that is yet to occur.\n- One stakes question related to the subject.\n- What kind of threat the subject is.","stat":"WIS","page":159,"tier":2},{"name":"Prophetic Lineage","text":"When you use truth or consequences, on a 12+, name three people, groups, or social institutions and you may use this move again to examine the same event.","page":159,"tier":2,"requires":["Truth and Consequences"]},{"name":"Weakness Prophesied","text":"When you fight someone whose futures you have prophesied, choose one stat. Until you take damage, you may roll with WIS instead of this stat. Choose again each time you enter a fight.","page":159,"tier":2},{"name":"Accurate Prediction","text":"When you parley with someone whose futures you have prophesied, on a 10-11, the GM will tell you how your deal will affect them in the future. On a 12+, you say how your deal will affect them in the future.","page":159,"tier":6},{"name":"Martial Oracle","text":"When you fight someone whose futures you have prophesied, choose one stat. Until the fight is over, you may roll with WIS instead of this stat. Choose again each time you enter a fight.","page":160,"tier":6,"replaces":["Weakness Prophesied"]},{"name":"Parting Shadows","text":"When you look into the future for possible dangers, on a 12+, choose three options from the list.","page":160,"tier":6,"requires":["Foreshadowing"]}],"alignments":[{"type":"Evil","text":"Oppose someone who will cause trouble in the future."},{"type":"Good","text":"Use your prophecy to help someone else avoid tragedy."},{"type":"Neutral","text":"Profit financially from your prophetic powers."}],"bonds":["__________ will play a part in important future events. I have seen it!","I keep telling __________, but they won’t listen.","I must protect __________ from the doom that is coming for them."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Antitoxin and bandages (3 uses, slow).\n○ Bag of books (5 uses, 2 weight).\n○ Halfling pipeleaf (6 uses).","races":[{"name":"Dwarf","text":"Your mind can see into the earth. When you handle metal or stone, you may ask one question from the discern realities list about it. The GM will answer from the earth’s perspective."},{"name":"Elf","text":"You have great insights into the natural world. When you handle plants, you may ask one question from the discern realities list about it. The GM will answer from the plant’s perspective."},{"name":"Human","text":"When you discern realities, the GM will always tell you what is about to happen, in addition to the move’s other results."}]},{"name":"Pilgrim","archetype":"Disciple","page":163,"blurb":"What better way could there be to show your piety than to make a pilgrimage to the homes of the gods? Even dead saints will do!","compendium":"Once you have made a pilgrimage to the five most holy sites in the known world, you may consider the pilgrim specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the pilgrim specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Pilgrimage","text":"When you arrive at a well-respected place after a dangerous journey, hold 2 blessings. You can spend a blessing at any time to:\n- Create a rumour in a well-travelled location.\n- Restore yourself to max HP.\n- Use a move that another PC has but you don’t.","page":163}],"advanced":[{"name":"Follow Me","text":"When you undertake a perilous journey, you can take two jobs. You make a separate roll for each.","page":164,"tier":2},{"name":"Pilgrim’s Progress","text":"Choose a school of magic or a sphere of influence. You may spend a blessing to cast a spell from that school or sphere, of your level or lower. When you cast a spell, roll+WIS. On a 10+, the spell takes effect as normal. On a 7-9, choose one:\n- The spell has only half its normal effect.\n- You are exhausted and suffer a debility.\n- You attract unwanted attention or produce additional effects.","stat":"WIS","page":164,"tier":2,"requires":["Pilgrimage"]},{"name":"Uncanny Senses","text":"Choose a type of energy: divine influence, emotional residues, infernal taint, or magic, for example. While you hold blessings, you can sense this type of energy as if it were tangible and visible. You can only sense one type of energy at a time, but you can switch the type whenever you have spent all your blessings.","page":164,"tier":2,"requires":["Pilgrimage"]},{"name":"The Power of Pilgrimage","text":"When you cast a spell, on a miss, the spell takes effect as normal, in addition to what the GM tells you. On a 12+, also choose one:\n- The spell’s effects are doubled.\n- The spell’s targets are doubled.","page":164,"tier":6,"requires":["Pilgrim’s Progress"]},{"name":"Shrinewalker","text":"The first time you pray at a shrine or temple, hold 2 blessings.","page":165,"tier":6,"requires":["Pilgrimage"]},{"name":"Strider","text":"When you undertake a perilous journey you can take two jobs. Roll twice and use the better result for both jobs.","page":165,"tier":6,"replaces":["Follow Me"]}],"alignments":[{"type":"Evil","text":"Prevent someone else from making the same pilgrimage as you."},{"type":"Good","text":"Defend a travel route or the people on it from threats."}],"bonds":["__________ is a lovely travelling companion, and very devout.","__________ is not mature enough to undertake this journey."],"gear":"You get adventuring gear (5 uses, 1 weight), dungeon rations (5 uses, 1 weight), and a holy symbol of some kind, in addition to whatever your other specialties give you.","races":[{"name":"Human","text":"You may spend a blessing to negate the effects of one attack against you."}]},{"name":"Psychopomp","archetype":"Disciple","page":167,"blurb":"Your work is done on the borderlands between life and death.","compendium":"Once you have been to Death’s black gate and been allowed to return to the world of the living, you may consider the psychopomp specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Turn Undead","text":"When you hold your holy symbol aloft and call on your devotion for protection, roll+WIS. On a hit, so long as you continue to pray and brandish your holy symbol, no undead may come within reach of you. On a 10+, you also momentarily daze intelligent undead and cause mindless undead to flee. Aggression breaks the effects and they are able to act as normal. Intelligent undead may still find ways to harry you from afar. They’re clever like that.","stat":"WIS","page":167}],"advanced":[{"name":"Ashes to Ashes","text":"The first time you brandish your holy symbol at an undead creature, deal your damage to it (ignores armour).","page":168,"tier":2,"requires":["Turn Undead"]},{"name":"Ghost Talker","text":"You can see and interact with all ghosts and spirits of the dead, and peer into the spiritual workings of the undead, even if they are mindless. When you study an undead creature, ask whatever questions you like, from the discern realities list or not.","page":168,"tier":2},{"name":"Necromancy","text":"When you cast a spell from the sphere of death, take +1.","page":168,"tier":2,"requires":["Cast a Spell"]},{"name":"The Scales of Life and Death","text":"When someone takes their last breath in your presence, they take +1 to their roll.","page":168,"tier":2},{"name":"Armour of Faith","text":"While you are turning the undead, you and any allies you are protecting get +2 armour. This bonus lasts only as long as there are undead present.","page":169,"tier":6,"requires":["Turn Undead"]},{"name":"Cheat Death Again","text":"When you have zero HP, instead of taking your last breath, roll+WIS. On a 10+, you live and choose one:\n- You discover one of Death’s dark secrets.\n- You have a moment with a soul that has already passed on.\n- You manage to stay beneath Death’s notice.\nOn a 7-9, you live but Death takes notice and you discover something terrible. On a miss, you can cheat death no longer and you must pass through the Black Gate forever.","stat":"WIS","page":169,"tier":6},{"name":"Dust to Dust","text":"When you reduce a creature to zero HP, its soul is put to rest and it cannot be raised again as any kind of undead creature. If the creature is already undead, its evil influence is also defeated, at least in part.","page":169,"tier":6,"requires":["Ashes to Ashes"]},{"name":"Reaper","text":"When you take time after a conflict to dedicate your victory to your ideals and deal with the dead, take +1 forward.","page":169,"tier":6}],"alignments":[{"type":"Evil","text":"use your knowledge of death to frighten or intimidate someone."},{"type":"Good","text":"Save someone from a premature death."},{"type":"Lawful","text":"Put the undead to their rightful rest."}],"bonds":["__________’s misguided behaviour endangers their very soul!","I have shown __________ a glimpse of what lies beyond."],"gear":"You have a symbol of your understanding of death: a shirt made of bones, a drinking cup made from a skull, or a map of the shadowlands, for instance. Describe it.","races":[{"name":"Dwarf","text":"When you deal damage to the undead, deal +1d4 damage."},{"name":"Elf","text":"When you discern realities, on a hit, your keen senses also tell you what here is dead or undead."},{"name":"Human","text":"When you turn the undead, you may also ask one question about them, as if you had discerned realities and got a 7-9."}]},{"name":"Sacred Lamb","archetype":"Disciple","page":172,"blurb":"Your suffering is a sacrifice, to save others from pain. It is your gift.","compendium":"Once you have sacrificed your life for the life of another and been returned to life, you may consider the sacred lamb specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Sacrifice","text":"When you touch someone and make a demand of them, if they do what you ask, take the debility of your choice and choose one:\n- They are healed for half your current HP.\n- They are healed of a debility.\n- They are healed of one injury (like a broken arm).\n- They gain 1d8 temporary HP. Damage must reduce these before affecting the character’s normal HP, but they cannot be healed.\nYou must ask for something immediate, not long-term, and if you already have all six debilities you cannot heal them.","page":172}],"advanced":[{"name":"Devoted Healer","text":"When you heal someone else of damage, add your level to the amount of damage healed.","page":174,"tier":2},{"name":"Divine Protection","text":"When you wear no armour or shield, you get 2 armour.","page":174,"tier":2},{"name":"First Aid","text":"Cure Light Wounds is a rote for you, and therefore doesn’t count against your limit of granted spells.","page":174,"tier":2,"requires":["Cast a Spell"]},{"name":"Penitent","text":"When you take damage and embrace the pain, you may take +1d4 damage (ignores armour). If you do, take +1 forward.","page":174,"tier":2},{"name":"Stigmata","text":"When you display your bleeding, take 1d4 damage (ignores armour) and choose one person who can see. They heal 2d8 damage. Your wounds leave bloody stains that do not come out until the damage caused by their infliction is repaired.","page":174,"tier":2},{"name":"Caretaker’s Insight","text":"When you discern realities, if you study someone who is afflicted, injured, or in pain, you may ask questions from this list instead:\n- What do you hope for the future?\n- What do you intend to do now?\n- What do you want from me?\n- What makes you feel beautiful or loved?\n- What’s wrong with you and how could I help you?\nWhen you heal someone, also ask one of these questions.","page":175,"tier":6},{"name":"Divine Armour","text":"When you wear no armour or shield, you get 3 armour.","page":175,"tier":6,"replaces":["Divine Protection"]},{"name":"Greater First Aid","text":"Cure Moderate Wounds is a rote for you, and therefore doesn’t count against your limit of granted spells.","page":175,"tier":6,"requires":["First Aid"]},{"name":"Greater Stigmata","text":"When you display your bleeding, take 1d4 damage (ignores armour) and choose one person who can see. They heal 2d8 damage, and all your other allies who can see you heal 1d8 damage each. Your wounds leave bloody stains that do not come out until the damage caused by their infliction is repaired.","page":175,"tier":6,"replaces":["Stigmata"]},{"name":"Martyr","text":"When you take damage and embrace the pain, you may take +1d4 damage (ignoring armour). If you do, take +1 forward and add your level to any damage done or healed by your next action.","page":175,"tier":6,"replaces":["Penitent"]},{"name":"Sacrificial Bounty","text":"When you use sacrifice, choose two options, instead of one.","page":176,"tier":6,"requires":["Sacrifice"]}],"alignments":[{"type":"Chaotic","text":"Help someone take impulsive, even reckless action."},{"type":"Good","text":"Endanger yourself to heal another."}],"bonds":["__________ has hurt me before, but I forgave them.","__________ is not worth suffering for, not yet.","I respect the beliefs of __________ but hope they will someday see the true way.","I would die for __________."],"gear":"You get bandages (3 uses, slow) and a backpack or shoulderbag, which is empty, in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"When you are wounded or suffer a debility, you may choose to take an additional 1d4 damage (ignores armour) and +1 forward."},{"name":"Elf","text":"You are always graceful, even in suffering. When you take the debility shaky, also take +1 forward. While you have the shaky debility, you suffer a -1 penalty to another stat of your choice, but never to DEX."},{"name":"Halfling","text":"When you are wounded and bleeding, you get +DEX armour."},{"name":"Human","text":"You can have two debilities affecting your WIS score. Each gives you a -1 penalty, and having both gives you a -2 penalty. This brings your maximum number of debilities up to seven."}]},{"name":"Venerator","archetype":"Disciple","page":178,"blurb":"You worship the ancestors, venerate them, and for your dutiful attention, they reward you.","compendium":"Once you have paid homage to your ancestors of at least seven generations back, either by building shrines to them or praying for them at three sacred sites, you may consider the venerator specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Prayers to the Dead","text":"You are able to converse with spirits of the dead as if they were living. They can sense this, and will be more inclined to appear before you.","page":178},{"name":"Words from Beyond","text":"When you venerate your ancestors and ask for advice, roll+WIS. On a hit, a spirit gives you advice about your situation, but on a 7-9, it comes with strings attached. They want something from you as well—a favour, a sacrifice, or just an ear that will listen, perhaps. The GM will tell you what. If you act on the advice the spirit gives you, take +1 forward.","stat":"WIS","page":178}],"advanced":[{"name":"Ancestor Song","text":"When you perform an ancestor veneration ceremony for a community, roll+WIS. On a 10+, they are impressed and feel the need to reciprocate. On a 7-9, they are merely impressed and treat you with respect. Not everyone in the community may feel this way, but the majority do.","stat":"WIS","page":179,"tier":2},{"name":"Medium","text":"When you allow a spirit to inhabit your body, roll+WIS. On a 10+, it may use your body to converse with the living until you banish it or move to a new location. On a 7-9, it may use your body only as long as you are unconscious—choose how much time you will allow it beforehand.","stat":"WIS","page":179,"tier":2},{"name":"Spirits of Knowledge","text":"When you arrive at a new settlement, the spirits of the dead will tell you a fact from the history of that location or something that has changed since you were there last.","page":179,"tier":2,"requires":["Prayers to the Dead"]},{"name":"Curse of Ghosts","text":"When you pronounce a curse upon someone, name one condition that will lift the curse and roll+WIS. On a 10+,
