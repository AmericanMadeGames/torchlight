when you shapeshift.","page":109,"tier":6,"requires":["Formcrafter"]},{"name":"Chimera","text":"When you shapeshift, you may create a merged form of up to three different shapes. You may be a bear with the wings of an eagle and the head of a ram, for example. Each feature will grant you a different move to make. Your chimera form follows the same rules as shapeshifter otherwise.","page":109,"tier":6},{"name":"Weather Weaver","text":"When you are under open skies when the sun rises the GM will ask you what the weather will be that day. Tell them whatever you like, it comes to pass.","page":109,"tier":6}],"extra":false},"Fighter":{"dmg":"d10","hp":10,"load":12,"alignments":[{"type":"Good","text":"Defend those weaker than you."},{"type":"Evil","text":"Kill a defenseless or surrendered enemy."},{"type":"Neutral","text":"Defeat a worthy opponent."}],"bonds":["__________ owes me their life, whether they admit it or not.","I have sworn to protect __________.","I worry about the ability of __________ to survive in the dungeon.","__________ is soft, but I will make them hard like me."],"races":[{"name":"Dwarf","text":"When you share a drink with someone, you may Parley with them using CON instead of CHA."},{"name":"Elf","text":"Choose one weapon-you can always treat weapons of that type as if they had the precise tag."},{"name":"Halfling","text":"When you Defy Danger and use your small size to your advantage, take +1."},{"name":"Human","text":"Once per battle you may reroll a single damage roll (yours or someone else's)."}],"gear":[{"label":"Choose your defenses","max":1,"options":[{"label":"Chainmail","items":[{"name":"Chainmail","desc":"","tags":[{"n":"Armor","v":1},{"n":"Worn","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Scale Armor","items":[{"name":"Scale Armor","desc":"","tags":[{"n":"Armor","v":2},{"n":"Worn","v":null},{"n":"Weight","v":3}],"amount":1.0}],"coins":0.0}]},{"label":"Choose two","max":2,"options":[{"label":"2 Healing Potions","items":[{"name":"Healing Potion","desc":"When you drink an entire healing potion, heal yourself of 10 damage or remove one debility, your choice.","tags":[{"n":"Coins","v":50},{"n":"Weight","v":0}],"amount":2.0}],"coins":0.0},{"label":"Shield","items":[{"name":"Shield","desc":"","tags":[{"n":"Armor","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0},{"label":"Antitoxin","items":[{"name":"Antitoxin","desc":"When you drink antitoxin, you're cured of one poison affecting you.","tags":[{"n":"Coins","v":10},{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"22 coins","items":[],"coins":22.0}]}],"spellcaster":false,"page":111,"names":"Dwarf: Ozruk, Surtur, Brunhilda, Annika, Janos, Greta, Dim, Rundrig, Jarl, Xotoq\nElf: Elohiir, Sharaseth, Hasrith, Shevaral, Cadeus, Eldar, Kithracet, Thelian\nHalfling: Finnegan, Olive, Randolph, Bartleby, Aubrey, Baldwin, Becca\nHuman: Hawke, Rudiger, Gregor, Brianne, Walton, Castor, Shanna, Ajax, Hob","looks":["Hard Eyes, Dead Eyes, or Eager Eyes","Wild Hair, Shorn Hair, or Battered Helm","Calloused Skin, Tanned Skin, or Scarred Skin","Built Body, Lithe Body, or Ravaged Body"],"blurb":"It's a thankless job-living day to day by your armor and the skill of your arm. To dive heedlessly into danger. They won't be playing golden horns for the time you took that knife to the ribs for them in the bar in Bucksberg. No flock of angels to sing of the time you dragged them, still screaming, from the edge of the Pits of Madness, no.\n\nForget them.\n\nYou do this for the guts and the glory. The scream of battle and the hot, hot blood of it. You are a beast of iron. Your friends may carry blades of forged steel but, fighter, you are steel. While your traveling companions might moan about their wounds over a campfire in the wilderness, you bear your scars with pride.\n\nYou are the wall-let every danger smash itself to nothing on you. In the end, you'll be the last one standing.","moves":[{"name":"Multiclass Dabbler","text":"Get one move from another class. Treat your level as one lower for choosing the move.","page":116,"tier":2},{"name":"Multiclass Initiate","text":"Get one move from another class. Treat your level as one lower for choosing the move.","page":117,"tier":6,"requires":["Multiclass Dabbler"]},{"name":"Bend Bars, Lift Gates","text":"When you use pure strength to destroy an inanimate obstacle, roll+Str.\n* On a 10+, choose 3.\n* On a 7-9 choose 2.\n\n* It doesn't take a very long time\n* Nothing of value is damaged\n* It doesn't make an inordinate amount of noise\n* You can fix the thing again without a lot of effort","stat":"STR","page":112,"tier":0},{"name":"Armored","text":"You ignore the clumsy tag on armor you wear.","page":112,"tier":0},{"name":"Signature Weapon","text":"This is your weapon. There are many like it, but this one is yours. Your weapon is your best friend. It is your life. You master it as you master your life. Your weapon, without you, is useless. Without your weapon, you are useless. You must wield your weapon true.\n\nChoose a base description, all are 2 weight:\n\n* Sword\n* Axe\n* Hammer\n* Spear\n* Flail\n* Fists\n\nChoose the range that best fits your weapon:\n\n* Hand\n* Close\n* Reach\n\nChoose two enhancements:\n\n* Hooks and spikes. +1 damage, but +1 weight.\n* Sharp. +2 piercing.\n* Perfectly weighted. Add precise.\n* Serrated edges. +1 damage.\n* Glows in the presence of one type of creature, your choice.\n* Huge. Add messy and forceful.\n* Versatile. Choose an additional range.\n* Well-crafted. -1 weight.\n\nChoose a look:\n\n* Ancient\n* Unblemished\n* Ornate\n* Blood-stained\n* Sinister","page":113,"tier":0},{"name":"Merciless","text":"When you deal damage, deal +1d4 damage.","page":115,"tier":2},{"name":"Heirloom","text":"When you consult the spirits that reside within your signature weapon, they will give you an insight relating to the current situation, and might ask you some questions in return, roll+CHA.\n* On a 10+, the GM will give you good detail.\n* On a 7-9, the GM will give you an impression.","stat":"CHA","page":115,"tier":2},{"name":"Armor Mastery","text":"When you make your armor take the brunt of damage dealt to you, the damage is negated but you must reduce the armor value of your armor or shield (your choice) by 1. The value is reduced each time you make this choice. If the reduction leaves the item with 0 armor it is destroyed.","page":115,"tier":2},{"name":"Improved Weapon","text":"Choose one extra enhancement for your signature weapon.","page":115,"tier":2},{"name":"Seeing Red","text":"When you Discern Realities during combat, you take +1.","page":115,"tier":2},{"name":"Interrogator","text":"When you Parley using threats of impending violence as leverage, you may use STR instead of CHA.","page":115,"tier":2},{"name":"Scent of Blood","text":"When you Hack & Slash an enemy, your next attack against that same foe deals +1d4 damage.","page":115,"tier":2},{"name":"Iron Hide","text":"You gain +1 armor.","page":116,"tier":2},{"name":"Blacksmith","text":"When you have access to a forge you can graft the magical powers of a weapon onto your signature weapon. This process destroys the magical weapon. Your signature weapon gains the magical powers of the destroyed weapon.","page":116,"tier":2},{"name":"Bloodthirsty","text":"When you deal damage, deal +1d8 damage.","page":116,"tier":6,"replaces":["Merciless"]},{"name":"Armored Perfection","text":"When you choose to let your armor take the brunt of damage dealt to you, the damage is negated and you take +1 forward against the attacker, but you must reduce the armor value of your armor or shield (your choice) by 1. The value is reduced each time you make this choice. If the reduction leaves the item with 0 armor it is destroyed.","page":116,"tier":6,"replaces":["Armor Mastery"]},{"name":"Evil Eye","text":"When you enter combat, roll+CHA.\n* On a 10+, hold 2.\n* On a 7-9, hold 1. Spend your hold to make eye contact with an NPC present, who freezes or flinches and can't act until you break it off.\n* On a 6-, your enemies immediately identify you as their biggest threat.","stat":"CHA","page":116,"tier":6,"requires":["Seeing Red"]},{"name":"Taste of Blood","text":"When you Hack & Slash an enemy, your next attack against that same foe deals +1d8 damage.","page":117,"tier":6,"replaces":["Scent of Blood"]},{"name":"Steel Hide","text":"You gain +2 armor.","page":117,"tier":6,"replaces":["Iron Hide"]},{"name":"Through Death's Eyes","text":"When you go into battle, roll+WIS.\n* On a 10+, name someone who will live and someone who will die.\n* On a 7-9, name someone who will live or someone who will die. Name NPCs, not player characters. The GM will make your vision come true, if it's even remotely possible.\n* On a 6- you see your own death and consequently take -1 ongoing throughout the battle.","stat":"WIS","page":117,"tier":6},{"name":"Eye for Weaponry","text":"When you look over an enemy's weaponry, ask the GM how much damage they do.","page":117,"tier":6},{"name":"Superior Warrior","text":"When you Hack & Slash on a 12+ you deal your damage, avoid their attack, and impress, dismay, or frighten your enemy.","page":117,"tier":6}],"extra":false},"Paladin":{"dmg":"d10","hp":10,"load":12,"alignments":[{"type":"Good","text":"Endanger yourself to protect someone weaker than you."},{"type":"Lawful","text":"Deny mercy to a criminal or unbeliever."}],"bonds":["__________'s misguided behavior endangers their very soul!","__________ has stood by me in battle and can be trusted completely.","I respect the beliefs of __________ but hope they will someday see the true way.","__________ is a brave soul, I have much to learn from them."],"races":[{"name":"Human","text":"When you pray for guidance, even for a moment, and ask, \"What here is evil?\" the GM will tell you, honestly."}],"gear":[{"label":"Choose your weapon","max":1,"options":[{"label":"Halberd","items":[{"name":"Halberd","desc":"","tags":[{"n":"Reach","v":null},{"n":"Damage","v":1},{"n":"Two_handed","v":null},{"n":"Coins","v":9},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0},{"label":"Long Sword","items":[{"name":"Long Sword","desc":"","tags":[{"n":"Close","v":null},{"n":"Damage","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one","max":1,"options":[{"label":"Adventuring Gear","items":[{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Dungeon rations","items":[{"name":"Dungeon Rations","desc":"Not tasty, but not bad either.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":5},{"n":"Coins","v":3},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]}],"spellcaster":false,"page":119,"names":"Thaddeus, Augustine, Lux, Cassius, Hadrian, Lucia, Octavia, Regulus, Valeria, Sanguinus, Titanius","looks":["Kind Eyes, Fiery Eyes, or Glowing Eyes","Helmet, Styled Hair, or Bald","Worn Holy Symbol or Fancy Holy Symbol","Fit Body, Bulky Body, or Thin Body"],"blurb":"Hell awaits. An eternity of torment in fire or ice or whatever best suits the sins of the damned throngs of Dungeon World. All that stands between the pits of that grim torture and salvation is you. Holy man, armored war machine, templar of the Good and the Light, right? The cleric may say his prayers at night to the gods, dwelling in their heavens. The fighter may wield his sharp sword in the name of \"good\" but you know. Only you.\n\nEyes, hands, and sweet killing blow of the gods, you are. Yours is the gift of righteousness and virtue. Of justice. Vision, too. A purity of intent that your companions do not have.\n\nSo guide these fools, paladin. Take up your holy cause and bring salvation to the wastrel world.\n\nVae victis, right?","moves":[{"name":"Divine Protection","text":"You get +2 armor while on a quest.","page":124,"tier":6,"replaces":["Holy Protection"]},{"name":"Armored","text":"You ignore the clumsy tag on armor you wear.","page":120,"tier":0},{"name":"Lay on Hands","text":"When you touch someone, skin to skin, and pray for their well-being , roll+CHA.\n* On a 10+ you heal 1d8 damage or remove one disease.\n* On a 7-9, they are healed, but the damage or disease is transferred to you.","stat":"CHA","tier":0},{"name":"I Am the Law","text":"When you give an NPC an order based on your divine authority, roll+Cha.\n* On a 7+, they choose one:\n\n\t* Do what you say\n\t* Back away cautiously, then flee\n\t* Attack you\n* On a 10+, you also take +1 forward against them.\n* On a miss, they do as they please and you take -1 forward against them.","stat":"CHA","page":120,"tier":0},{"name":"Quest","text":"When you dedicate yourself to a mission through prayer and ritual cleansing, state what you set out to do:\n\n* Slay __________, a great blight on the land\n* Defend __________ from the iniquities that beset them\n* Discover the truth of __________\n\nThen choose up to two boons:\n\n* An unwavering sense of direction to __________.\n* Invulnerability to __________ (e.g., edged weapons, fire, enchantment, etc.)\n* A mark of divine authority\n* Senses that pierce lies\n* A voice that transcends language\n* A freedom from hunger, thirst, and sleep\n\nThe GM will then tell you what vow or vows is required of you to maintain your blessing:\n\n* Honor (forbidden: cowardly tactics and tricks)\n* Temperance (forbidden: gluttony in food, drink, and pleasure of the flesh)\n* Piety (required: observance of daily holy services)\n* Valor (forbidden: suffering an evil creature to live)\n* Truth (forbidden: lies)\n* Hospitality (required: comfort to those in need, no matter who they are)","page":121,"tier":0},{"name":"Divine Favor","text":"Dedicate yourself to a deity (name a new one or choose one that's already been established). You gain the commune and cast a spell cleric moves. When you select this move, treat yourself as a cleric of level 1 for using spells. Every time you gain a level thereafter, increase your effective cleric level by 1.","page":122,"tier":2},{"name":"Bloody Aegis","text":"When you take damage you can grit your teeth and accept the blow. If you do you take no damage but instead suffer a debility of your choice. If you already have all six debilities you can't use this move.","page":122,"tier":2},{"name":"Smite","text":"While on a quest you deal +1d4 damage.","page":123,"tier":2},{"name":"Exterminatus","text":"When you speak aloud your promise to defeat an enemy, you deal +2d4 damage against that enemy and -4 damage against anyone else. This effect lasts until the enemy is defeated. If you fail to defeat the enemy or give up the fight, you can admit your failure, but the effect continues until you find a way to redeem yourself.","page":123,"tier":2},{"name":"Charge!","text":"When you lead the charge into combat, those you lead take +1 forward.","page":123,"tier":2},{"name":"Staunch Defender","text":"When you Defend you always get +1 hold, even on a 6-.","page":123,"tier":2},{"name":"Setup Strike","text":"When you Hack & Slash, choose an ally. Their next attack against your target does +1d4 damage.","page":123,"tier":2},{"name":"Holy Protection","text":"You get +1 armor while on a quest.","page":123,"tier":2},{"name":"Voice of Authority","text":"Take +1 to order hirelings.","page":123,"tier":2},{"name":"Hospitaller","text":"When you heal an ally, you heal +1d8 damage.","page":123,"tier":2},{"name":"Evidence of Faith","text":"When you see divine magic as it happens, you can ask the GM which deity granted the spell and its effects. Take +1 when acting on the answers.","page":124,"tier":6,"requires":["Divine Favor"]},{"name":"Holy Smite","text":"While on a quest you deal +1d8 damage.","page":124,"tier":6,"replaces":["Smite"]},{"name":"Ever Onward","text":"When you lead the charge into combat, those you lead take +1 forward and +2 armor forward.","page":124,"tier":6,"replaces":["Charge!"]},{"name":"Impervious Defender","text":"When you Defend you always get +1 hold, even on a 6-. When you get a 12+ to defend instead of getting hold the nearest attacking creature is stymied giving you a clear advantage, the GM will describe it.","page":124,"tier":6,"replaces":["Staunch Defender"]},{"name":"Tandem Strike","text":"When you Hack & Slash, choose an ally. Their next attack against your target does +1d4 damage and they take +1 forward against them.","page":124,"tier":6,"replaces":["Setup Strike"]},{"name":"Divine Authority","text":"Take +1 to order hirelings. When you roll a 12+ the hireling transcends their moment of fear and doubt and carries out your order with particular effectiveness or efficiency.","page":125,"tier":6,"replaces":["Voice of Authority"]},{"name":"Perfect Hospitaller","text":"When you heal an ally, you heal +2d8 damage.","page":125,"tier":6,"replaces":["Hospitaller"]},{"name":"Indomitable","text":"When you suffer a debility (even through Bloody Aegis) take +1 forward against whatever caused it.","page":125,"tier":6},{"name":"Perfect Knight","text":"When you Quest you choose three boons instead of two.","page":125,"tier":6}],"extra":false},"Ranger":{"dmg":"d8","hp":8,"load":11,"alignments":[{"type":"Good","text":"Endanger yourself to combat an unnatural threat."},{"type":"Neutral","text":"Help an animal or spirit of the wild."},{"type":"Chaotic","text":"Free someone from literal or figurative bonds."}],"bonds":["I have guided ______________________ before and they owe me for it.","______________________ is a friend of nature, so I will be their friend as well.","______________________ has no respect for nature, so I have no respect for them.","______________________ does not understand life in the wild, so I will teach them."],"races":[{"name":"Elf","text":"When you Undertake a Perilous Journey through wilderness whatever job you take you succeed as if you rolled a 10+."},{"name":"Human","text":"When you Make Camp in a dungeon or city, you don't need to consume a ration."}],"gear":[{"label":"Choose your armament","max":1,"options":[{"label":"Hunter's bow and short sword","items":[{"name":"Hunter's Bow","desc":"","tags":[{"n":"Near","v":null},{"n":"Far","v":null},{"n":"Weight","v":1}],"amount":1.0},{"name":"Short Sword","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":8},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Hunter's bow and spear","items":[{"name":"Hunter's Bow","desc":"","tags":[{"n":"Near","v":null},{"n":"Far","v":null},{"n":"Weight","v":1}],"amount":1.0},{"name":"Spear","desc":"","tags":[{"n":"Reach","v":null},{"n":"Thrown","v":null},{"n":"Near","v":null},{"n":"Coins","v":5},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one","max":1,"options":[{"label":"Adventuring Gear","items":[{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}],"amount":1.0},{"name":"Dungeon Rations","desc":"Not tasty, but not bad either.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":5},{"n":"Coins","v":3},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Adventuring Gear","items":[{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}],"amount":1.0},{"name":"Bundle of Arrows","desc":"","tags":[{"n":"Ammo","v":3},{"n":"Coins","v":1},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]}],"spellcaster":false,"page":127,"names":"Elf: Throndir, Elrosine, Aranwe, Celion, Dambrath, Lanethe\nHuman: Jonah, Halek, Brandon, Emory, Shrike, Nora, Diana","looks":["Wild Eyes, Sharp Eyes, or Animal Eyes","Hooded Head, Wild Hair, or Bald","Cape, Camouflage, or Traveling Clothes","Lithe Body, Wild Body, or Sharp Body"],"blurb":"These city-born folk you travel with. Have they heard the call of the wolf? Felt the winds howl in the bleak deserts of the East? Have they hunted their prey with the bow and the knife like you? Hell no. That's why they need you.\n\nGuide. Hunter. Creature of the wilds. You are these things and more. Your time in the wilderness may have been solitary until now, but the call of some greater thing-call it fate if you like-has cast your lot with these folk. Brave, they may be. Powerful and strong, too. You know the secrets of the spaces between, though.\n\nWithout you, they'd be lost. Blaze a trail through the blood and dark, strider.","moves":[{"name":"Hunt and Track","text":"When you follow a trail of clues left behind by passing creatures, roll+WIS.\n* On a 7+, you follow the creature's trail until there's a significant change in its direction or mode of travel.\n* On a 10+, you also choose 1:\n\n* Gain a useful bit of information about your quarry, the GM will tell you what\n* Determine what caused the trail to end","stat":"WIS","tier":0},{"name":"Called Shot","text":"When you attack a defenseless or surprised enemy at range, you can choose to deal your damage or name your target and roll+DEX.\n\n* Head 10+: As 7-9, plus your damage 7-9: They do nothing but stand and drool for a few moments.\n* Arms 10+: As 7-9, plus your damage 7-9: They drop anything they're holding.\n* Legs 10+: As 7-9, plus your damage 7-9: They're hobbled and slow moving.","stat":"DEX","page":128,"tier":0},{"name":"Animal Companion","text":"You have a supernatural connection with a loyal animal. You can't talk to it per se but it always acts as you wish it to. Name your animal companion and choose a species:\nWolf, cougar, bear, eagle, dog, hawk, cat, owl, pigeon, rat, mule\n\nChoose a base:\n\n* Ferocity +2, Cunning +1, 1 Armor, Instinct +1\n* Ferocity +2, Cunning +2, 0 Armor, Instinct +1\n* Ferocity +1, Cunning +2, 1 Armor, Instinct +1\n* Ferocity +3, Cunning +1, 1 Armor, Instinct +2\n\nChoose as many strengths as its ferocity:\nFast, burly, huge, calm, adaptable, quick reflexes, tireless, camouflage, ferocious, intimidating, keen senses, stealthy\n\nYour animal companion is trained to fight humanoids. Choose as many additional trainings as its cunning:\nHunt, search, scout, guard, fight monsters, perform, labor, travel\n\nChoose as many weaknesses as its instinct:\nFlighty, savage, slow, broken, frightening, forgetful, stubborn, lame","page":129,"tier":0},{"name":"Command","text":"When you work with your animal companion on something it's trained in…\n\n* …and you attack the same target, add its ferocity to your damage\n* …and you track, add its cunning to your roll\n* …and you take damage, add its armor to your armor\n* …and you Discern Realities, add its cunning to your roll\n* …and you parley, add its cunning to your roll\n* …and someone interferes with you, add its instinct to their roll","page":129,"tier":0},{"name":"Half-Elven","text":"Somewhere in your lineage lies mixed blood and it begins to show its presence. You gain the elf starting move if you took the human one at character creation or vice versa.\n\nYou may take this move only if it is your first advancement.","page":131,"tier":2},{"name":"Wild Empathy","text":"You can speak with and understand animals.","page":131,"tier":2},{"name":"Familiar Prey","text":"When you Spout Lore about a monster you use WIS instead of INT.","page":131,"tier":2},{"name":"Viper's Strike","text":"When you strike an enemy with two weapons at once, add an extra 1d4 damage for your off-hand strike.","page":131,"tier":2},{"name":"Camouflage","text":"When you keep still in natural surroundings, enemies never spot you until you make a movement.","page":131,"tier":2},{"name":"Man's Best Friend","text":"When you allow your animal companion to take a blow that was meant for you, the damage is negated and your animal companion's ferocity becomes 0. If its ferocity is already 0 you can't use this ability. When you have a few hours of rest with your animal companion its ferocity returns to normal.","page":131,"tier":2},{"name":"Blot Out the Sun","text":"When you Volley you may spend extra ammo before rolling. For each point of ammo spent you may choose an extra target. Roll once and apply damage to all targets.","page":131,"tier":2},{"name":"Well-Trained","text":"Choose another training for your animal companion.","page":131,"tier":2},{"name":"God Amidst the Wastes","text":"Dedicate yourself to a deity (name a new one or choose one that's already been established). You gain the Commune and Cast a Spell cleric moves. When you select this move, treat yourself as a cleric of level 1 for using spells. Every time you gain a level thereafter, increase your effective cleric level by 1.","page":132,"tier":2},{"name":"Follow Me","text":"When you Undertake a Perilous Journey you can take two roles. You make a separate roll for each.","page":132,"tier":2},{"name":"A Safe Place","text":"When you set the watch for the night, everyone takes +1 to Take Watch.","page":132,"tier":2},{"name":"Wild Speech","text":"You can speak with and understand any non-magical, non-planar creature.","page":132,"tier":6,"replaces":["Wild Empathy"]},{"name":"Hunter's Prey","text":"When you Spout Lore about a monster you use WIS instead of INT.\n* On a 12+, in addition to the normal effects, you get to ask the GM any one question about the subject.","page":132,"tier":6,"replaces":["Familiar Prey"]},{"name":"Viper's Fangs","text":"When you strike an enemy with two weapons at once, add an extra 1d8 damage for your off-hand strike.","page":132,"tier":6,"replaces":["Viper's Strike"]},{"name":"Smaug's Belly","text":"When you know your target's weakest point your arrows have 2 piercing.","page":133,"tier":6},{"name":"Strider","text":"When you Undertake a Perilous Journey you can take two roles. Roll twice and use the better result for both roles.","page":133,"tier":6,"replaces":["Follow Me"]},{"name":"A Safer Place","text":"When you set the watch for the night everyone takes +1 to Take Watch. After a night in camp when you set the watch everyone takes +1 forward.","page":133,"tier":6,"replaces":["A Safe Place"]},{"name":"Observant","text":"When you Hunt and Track, on a hit you may also ask one question about the creature you are tracking from the Discern Realities list for free.","page":133,"tier":6},{"name":"Special Trick","text":"Choose a move from another class. So long as you are working with your animal companion you have access to that move.","page":133,"tier":6},{"name":"Unnatural Ally","text":"Your animal companion is a monster, not an animal. Describe it. Give it +2 ferocity and +1 instinct, plus a new training.","page":133,"tier":6}],"extra":false},"Thief":{"dmg":"d8","hp":6,"load":9,"alignments":[{"type":"Evil","text":"Shift danger or blame from yourself to someone else."},{"type":"Neutral","text":"Avoid detection or infiltrate a location."},{"type":"Chaotic","text":"Leap into danger without a plan."}],"bonds":["I stole something from __________.","__________ has my back when things go wrong.","__________ knows incriminating details about me.","__________ and I have a con running."],"races":[{"name":"Halfling","text":"When you attack with a ranged weapon, deal +2 damage."},{"name":"Human","text":"You are a professional. When you Spout Lore or Discern Realities about criminal activities, take +1."}],"gear":[{"label":"Choose your arms","max":1,"options":[{"label":"Dagger","items":[{"name":"Dagger","desc":"","tags":[{"n":"Hand","v":null},{"n":"Coins","v":2},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Rapier","items":[{"name":"Rapier","desc":"","tags":[{"n":"Close","v":null},{"n":"Precise","v":null},{"n":"Coins","v":25},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]},{"label":"Choose a ranged weapon","max":1,"options":[{"label":"3 Throwing Daggers","items":[{"name":"Throwing Dagger","desc":"","tags":[{"n":"Thrown","v":null},{"n":"Near","v":null},{"n":"Coins","v":1},{"n":"Weight","v":0}],"amount":3.0}],"coins":0.0},{"label":"Ragged Bow","items":[{"name":"Ragged Bow","desc":"","tags":[{"n":"Near","v":null},{"n":"Coins","v":15},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one","max":1,"options":[{"label":"Adventuring Gear","items":[{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Healing Potion","items":[{"name":"Healing Potion","desc":"When you drink an entire healing potion, heal yourself of 10 damage or remove one debility, your choice.","tags":[{"n":"Coins","v":50},{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0}]}],"spellcaster":false,"page":135,"names":"Halfling: Felix, Rook, Mouse, Sketch, Trixie, Robin, Omar, Brynn, Bug\nHuman: Sparrow, Shank, Jack, Marlow, Dodge, Rat, Pox, Humble, Farley","looks":["Shifty Eyes or Criminal Eyes","Hooded Head, Messy Hair, or Cropped Hair","Dark Clothes, Fancy Clothes, or Common Clothes","Lithe Body, Knobby Body, or Flabby Body"],"blurb":"You've heard them, sitting around the campfire. Bragging about this battle or that. About how their gods are smiling on your merry band. You count your coins and smile to yourself-this is the thrill above all. You alone know the secret of Dungeon World-filthy filthy lucre.\n\nSure, they give you lip for all the times you've snuck off alone but without you, who among them wouldn't have been dissected by a flying guillotine or poisoned straight to death by some ancient needle trap? So, let them complain. When you're done with all this delving you'll toast their hero's graves.\n\nFrom your castle. Full of gold. You rogue.","moves":[{"name":"Trap Expert","text":"When you spend a moment to survey a dangerous area, roll+DEX.\n* On a 10+, hold 3.\n* On a 7-9, hold 1. Spend your hold as you walk through the area to ask these questions:\n\n\t* Is there a trap here and if so, what activates it?\n\t* What does the trap do when activated?\n\t* What else is hidden here?","stat":"DEX","page":136,"tier":0},{"name":"Tricks of the Trade","text":"When you pick locks or pockets or disable traps, roll+DEX.\n* On a 10+, you do it, no problem.\n* On a 7-9, you still do it, but the GM will offer you two options between suspicion, danger, or cost.","stat":"DEX","page":136,"tier":0},{"name":"Backstab","text":"When you attack a surprised or defenseless enemy with a melee weapon, you can choose to deal your damage or roll+DEX.\n* On a 10+ choose two.\n* On a 7-9 choose one.\n\n* You don't get into melee with them\n* You deal your damage+1d6\n* You create an advantage, +1 forward to you or an ally acting on it\n* Reduce their armor by 1 until they repair it","stat":"DEX","page":136,"tier":0},{"name":"Flexible Morals","text":"When someone tries to detect your alignment you can tell them any alignment you like.","page":136,"tier":0},{"name":"Poisoner","text":"You've mastered the care and use of a poison. Choose a poison from the list below; that poison is no longer dangerous for you to use. You also start with three uses of the poison you choose. Whenever you have time to gather materials and a safe place to brew you can make three uses of the poison you choose for free. Note that some poisons are applied, meaning you have to carefully apply it to the target or something they eat or drink. Touch poisons just need to touch the target, they can even be used on the blade of a weapon.\n\n* Oil of Tagit (applied): The target falls into a light sleep\n* Bloodweed (touch): The target deals -1d4 damage ongoing until cured\n* Goldenroot (applied): The target treats the next creature they see as a trusted ally, until proved otherwise\n* Serpent's Tears (touch): Anyone dealing damage to the target rolls twice and takes the better result.","page":137,"tier":0},{"name":"Cheap Shot","text":"When using a precise or hand weapon, your Backstab deals an extra +1d6 damage.","page":138,"tier":2},{"name":"Cautious","text":"When you use Trap Expert you always get +1 hold, even on a 6-.","page":138,"tier":2},{"name":"Wealth and Taste","text":"When you make a show of flashing around your most valuable possession, choose someone present. They will do anything they can to obtain your item or one like it.","page":138,"tier":2},{"name":"Shoot First","text":"You're never caught by surprise. When an enemy would get the drop on you, you get to act first instead.","page":139,"tier":2},{"name":"Poison Master","text":"After you've used a poison once it's no longer dangerous for you to use.","page":139,"tier":2},{"name":"Envenom","text":"You can apply even complex poisons with a pinprick. When you apply a poison that's not dangerous for you to use to your weapon it's touch instead of applied.","page":139,"tier":2},{"name":"Brewer","text":"When you have time to gather materials and a safe place to brew you can create three doses of any one poison you've used before.","page":139,"tier":2},{"name":"Underdog","text":"When you're outnumbered, you have +1 armor.","page":139,"tier":2},{"name":"Connections","text":"When you put out word to the criminal underbelly about something you want or need, roll+CHA.\n* On a 10+, someone has it, just for you.\n* On a 7-9, you'll have to settle for something close or it comes with strings attached, your call.","stat":"CHA","page":139,"tier":2},{"name":"Dirty Fighter","text":"When using a precise or hand weapon, your backstab deals an extra +1d8 damage and all other attacks deal +1d4 damage.","page":139,"tier":6,"replaces":["Cheap Shot"]},{"name":"Extremely Cautious","text":"When you use Trap Expert you always get +1 hold, even on a 6-.\n* On a 12+ you get 3 hold and the next time you come near a trap the GM will immediately tell you what it does, what triggers it, who set it, and how you can use it to your advantage.","page":140,"tier":6,"replaces":["Cautious"]},{"name":"Alchemist","text":"When you have you have time to gather materials and a safe place to brew you can create three doses of any poison you've used before. Alternately you can describe the effects of a poison you'd like to create. The GM will tell you that you can create it, but with one or more caveats:\n\n* It will only work under specific circumstances\n* The best you can manage is a weaker version\n* It'll take a while to take effect\n* It'll have obvious side effects","page":140,"tier":6,"replaces":["Brewer"]},{"name":"Serious Underdog","text":"You have +1 armor. When you're outnumbered, you have +2 armor instead.","page":140,"tier":6,"replaces":["Underdog"]},{"name":"Evasion","text":"When you Defy Danger on a 12+, you transcend the danger. You not only do what you set out to, but the GM will offer you a better outcome, true beauty, or a moment of grace.","page":140,"tier":6},{"name":"Strong Arm, True Aim","text":"You can throw any melee weapon, using it to Volley. A thrown melee weapon is gone; you can never choose to reduce ammo on a 7-9.","page":140,"tier":6},{"name":"Escape Route","text":"When you're in too deep and need a way out, name your escape route and roll+DEX.\n* On a 10+ you're gone.\n* On a 7-9 you can stay or go, but if you go it costs you: leave something behind or take something with you, the GM will tell you what.","stat":"DEX","page":141,"tier":6},{"name":"Disguise","text":"When you have time and materials you can create a disguise that will fool anyone into thinking you're another creature of about the same size and shape. Your actions can give you away but your appearance won't.","page":141,"tier":6},{"name":"Heist","text":"When you take time to make a plan to steal something, name the thing you want to steal and ask the GM these questions. When acting on the answers you and your allies take +1 forward.\n\n* Who will notice it's missing?\n* What's its most powerful defense?\n* Who will come after it?\n* Who else wants it?","page":141,"tier":6}],"extra":false},"Wizard":{"dmg":"d4","hp":4,"load":7,"alignments":[{"type":"Good","text":"Use magic to directly aid another."},{"type":"Evil","text":"Use magic to cause terror and fear."},{"type":"Neutral","text":"Discover something about a magical mystery."}],"bonds":["__________ will play an important role in the events to come. I have foreseen it!","__________ is keeping an important secret from me.","__________ is woefully misinformed about the world; I will teach them all that I can."],"races":[{"name":"Elf","text":"Magic is as natural as breath to you. Detect Magic is a cantrip for you."},{"name":"Human","text":"Choose one Cleric spell. You can cast it as if it was a Wizard spell."}],"gear":[{"label":"Choose your defenses","max":1,"options":[{"label":"Leather Armor","items":[{"name":"Leather Armor","desc":"","tags":[{"n":"Armor","v":1},{"n":"Worn","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Bag of Books","items":[{"name":"Bag of Books","desc":"When your bag of books contains just the right book for the subject you're spouting lore on, consult the book, mark off a use, and take +1 to your roll.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":10},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0}]},{"label":"Choose your weapon","max":1,"options":[{"label":"Dagger","items":[{"name":"Dagger","desc":"","tags":[{"n":"Hand","v":null},{"n":"Coins","v":2},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Staff","items":[{"name":"Staff","desc":"","tags":[{"n":"Close","v":null},{"n":"Two_handed","v":null},{"n":"Coins","v":1},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one","max":1,"options":[{"label":"Healing Potion","items":[{"name":"Healing Potion","desc":"When you drink an entire healing potion, heal yourself of 10 damage or remove one debility, your choice.","tags":[{"n":"Coins","v":50},{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"3 Antitoxins","items":[{"name":"Antitoxin","desc":"When you drink antitoxin, you're cured of one poison affecting you.","tags":[{"n":"Coins","v":10},{"n":"Weight","v":0}],"amount":3.0}],"coins":0.0}]}],"spellcaster":true,"page":143,"names":"Elf: Galadiir, Fenfaril, Lilliastre, Phirosalle, Enkirash, Halwyr\nHuman: Avon, Morgan, Rath, Ysolde, Ovid, Vitus, Aldara, Xeno, Uri","looks":["Haunted Eyes, Sharp Eyes, or Crazy Eyes","Styled Hair, Wild Hair, or Pointed Hat","Worn Robes, Stylish Robes, or Strange Robes","Pudgy Body, Creepy Body, or Thin Body"],"blurb":"Dungeon World has rules. Not the laws of men or the rule of some petty tyrant. Bigger, better rules. You drop something-it falls. You can't make something out of nothing. The dead stay dead, right?\n\nOh, the things we tell ourselves to feel better about the long, dark nights.\n\nYou've spent so very long poring over those tomes of yours. The experiments that nearly drove you mad and all the botched summonings that endangered your very soul. For what? For power. What else is there? Not just the power of King or Country but the power to boil a man's blood in his veins. To call on the thunder of the sky and the churn of the roiling earth. To shrug off the rules the world holds so dear.\n\nLet them cast their sidelong glances. Let them call you \"warlock\" or \"diabolist.\" Who among them can hurl fireballs from their eyes?\n\nYeah. We didn't think so.","moves":[{"name":"Spellbook","text":"You have mastered several spells and inscribed them in your spellbook. You start out with three first level spells in your spellbook as well as the cantrips. Whenever you gain a level, you add a new spell of your level or lower to your spellbook. You spellbook is 1 weight.","page":144,"tier":0},{"name":"Prepare Spells","text":"When you spend uninterrupted time (an hour or so) in quiet contemplation of your spellbook, you:\nLose any spells you already have prepared\n\nPrepare new spells of your choice from your spellbook whose total levels don't exceed your own level+1.\n\nPrepare your cantrips which never count against your limit.\n* Lose any spells you already have prepared\n* Prepare new spells of your choice from your spellbook whose total levels don't exceed your own level+1.\n* Prepare your cantrips which never count against your limit.","page":144,"tier":0},{"name":"Cast a Spell","text":"When you release a spell you’ve prepared, roll+Int.\n* On a 10+, the spell is successfully cast and you do not forget the spell—you may cast it again later.\n* On a 7-9, the spell is cast, but choose one:\n\n* You draw unwelcome attention or put yourself in a spot. The GM will tell you how.\n* The spell disturbs the fabric of reality as it is cast—take -1 ongoing to cast a spell until the next time you Prepare Spells.\n* After it is cast, the spell is forgotten. You cannot cast the spell again until you prepare spells.\nNote that maintaining spells with ongoing effects will sometimes cause a penalty to your roll to cast a spell.","stat":"INT","page":144,"tier":0},{"name":"Spell Defense","text":"You may end any ongoing spell immediately and use the energy of its dissipation to deflect an oncoming attack. The spell ends and you subtract its level from the damage done to you.","page":145,"tier":0},{"name":"Ritual","text":"When you draw on a place of power to create a magical effect, tell the GM what you're trying to achieve. Ritual effects are always possible, but the GM will give you one to four of the following conditions:\n\n* It's going to take days/weeks/months\n* First you must __________\n* You'll need help from __________\n* It will require a lot of money\n* The best you can do is a lesser version, unreliable and limited\n* You and your allies will risk danger from __________\n* You'll have to disenchant __________ to do it","page":145,"tier":0},{"name":"Prodigy","text":"Choose a spell. You prepare that spell as if it were one level lower.","page":146,"tier":2},{"name":"Empowered Magic","text":"When you Cast a Spell, on a 10+ you have the option of choosing from the 7-9 list. If you do, you may choose one of these as well:\nThe spell's effects are maximized\n\nThe spell's targets are doubled\n* The spell's effects are maximized\n* The spell's targets are doubled","page":146,"tier":2},{"name":"Fount of Knowledge","text":"When you Spout Lore about something no one else has any clue about, take +1.","page":146,"tier":2},{"name":"Know-It-All","text":"When another player's character comes to you for advice and you tell them what you think is best, they get +1 forward when following your advice and you mark experience if they do.","page":147,"tier":2},{"name":"Expanded Spellbook","text":"Add a new spell from the spell list of any class to your spellbook.","page":147,"tier":2},{"name":"Enchanter","text":"When you have time and safety with a magic item you may ask the GM what it does, the GM will answer you truthfully.","page":147,"tier":2},{"name":"Logical","text":"When you use strict deduction to analyze your surroundings, you can Discern Realities with INT instead of WIS.","page":147,"tier":2},{"name":"Arcane Ward","text":"As long as you have at least one prepared spell of first level or higher, you have +2 armor.","page":147,"tier":2},{"name":"Counterspell","text":"When you attempt to counter an arcane spell that will otherwise affect you, stake one of your prepared spells on the defense and roll+Int.\n* On a 10+, the spell is countered and has no effect on you.\n* On a 7-9, the spell is countered and you forget the spell you staked. Your counterspell protects only you; if the countered spell has other targets they get its effects.","stat":"INT","page":147,"tier":2},{"name":"Quick Study","text":"When you see the effects of an arcane spell, ask the GM the name of the spell and its effects. You take +1 when acting on the answers.","page":147,"tier":2},{"name":"Master","text":"Choose one spell in addition to the one you picked for prodigy. You prepare that spell as if it were one level lower.","page":148,"tier":6,"requires":["Prodigy"]},{"name":"Greater Empowered Magic","text":"When you Cast a Spell, on a 10-11 you have the option of choosing from the 7-9 list. If you do, you may choose one of these effects as well.\n* On a 12+ you get to choose one of these effects for free:\nThe spell's effects are doubled\n\nThe spell's targets are doubled\n* The spell's effects are doubled\n* The spell's targets are doubled","page":148,"tier":6,"replaces":["Empowered Magic"]},{"name":"Enchanter's Soul","text":"When you have time and safety with a magic item in a place of power you can empower that item so that the next time you use it its effects are amplified, the GM will tell you exactly how.","page":148,"tier":6,"requires":["Enchanter"]},{"name":"Highly Logical","text":"When you use strict deduction to analyze your surroundings, you can Discern Realities with Int instead of Wis.\n* On a 12+ you get to ask the GM any three questions, not limited by the list.","page":148,"tier":6,"replaces":["Logical"]},{"name":"Arcane Armor","text":"As long as you have at least one prepared spell of first level or higher, you have +4 armor.","page":148,"tier":6,"replaces":["Arcane Ward"]},{"name":"Protective Counter","text":"When an ally within sight of you is affected by an arcane spell, you can counter it as if it affected you. If the spell affects multiple allies you must counter for each ally separately.","page":148,"tier":6,"requires":["Counterspell"]},{"name":"Ethereal Tether","text":"When you have time with a willing or helpless subject you can craft an ethereal tether with them. You perceive what they perceive and can Discern Realities about someone tethered to you or their surroundings no matter the distance. Someone willingly tethered to you can communicate with you over the tether as if you were in the room with them.","page":149,"tier":6},{"name":"Mystical Puppet Strings","text":"When you use magic to control a person's actions they have no memory of what you had them do and bear you no ill will.","page":149,"tier":6},{"name":"Spell Augmentation","text":"When you deal damage to a creature you can shunt a spell's energy into them-end one of your ongoing spells and add the spell's level to the damage dealt.","page":149,"tier":6},{"name":"Self-Powered","text":"When you have time, arcane materials, and a safe space, you can create your own place of power. Describe to the GM what kind of power it is and how you're binding it to this place, the GM will tell you one kind of creature that will have an interest in your workings.","page":149,"tier":6}],"extra":false},"Immolator":{"dmg":"d8","hp":4,"load":9,"alignments":[{"type":"Evil","text":"Sacrifice an unwilling victim to the flames."},{"type":"Neutral","text":"Exchange a sacrifice, freely given, for a service rendered."},{"type":"Chaotic","text":"Spread a dangerous new idea"}],"bonds":["__________ has felt the hellish touch of fire, now they know my strength.","I will teach __________ the true meaning of sacrifice.","I cast something into the fire for __________ and still owe them their due."],"races":[{"name":"Salamander","text":"Non-magical heat and fire cannot harm you."},{"name":"Human","text":"When you Make Camp next to a large, open flame, regain all of your HP."}],"gear":[{"label":"You carry no weapon and need no armor but the flames the burn within you. Choose two:","max":2,"options":[{"label":"Dungeon Rations","items":[{"name":"Dungeon Rations","desc":"Not tasty, but not bad either.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":5},{"n":"Coins","v":3},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"1 Healing Potion","items":[{"name":"Healing Potion","desc":"When you drink an entire healing potion, heal yourself of 10 damage or remove one debility, your choice.","tags":[{"n":"Coins","v":50},{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"10 coins","items":[],"coins":10.0}]}],"spellcaster":false,"page":null,"blurb":"","moves":[{"name":"Burning Brand","text":"When you conjure a weapon of pure flame, roll+CON.\n* On a 10+ choose two of the following tags, on a 7-9 choose one. You may treat your INT as your STR or DEX in regards to making attacks with this weapon. The weapon always begins with the fiery, touch, dangerous, and 3 uses tags. Each attack with the weapon consumes one use.\n\n\n\n- hand\n\n- thrown, near\n\n- +1 damage\n\n- remove the dangerous tag","stat":"CON","tier":0},{"name":"Fighting Fire With Fire","text":"When you take damage, and that damage is odd (after armor) the flames within you come to your aid. Roll 1d4 and either add that many uses to your burning brand (if active), take that result forward to summon your burning brand, or reduce the damage by that amount, your choice.","tier":0},{"name":"Zuko Style","text":"When you bend a flame to your will, roll+WIS.\n* On a 10+ it does as you command, taking the shape and movement you desire for as long as it has fuel on which to burn.\n* On a 7-9 the effect is short-lived, lasting only a moment.","stat":"WIS","tier":0},{"name":"Give Me Fuel Give Me Fire","text":"When you **gaze intensely into someone eyes**, you may ask their player \"what fuels the flames of your desire?\" they'll answer with the truth, even if the character does not know or would otherwise keep this hidden.","tier":0},{"name":"Hand Crafted","text":"You may use your hands in place of tools and fire to craft metal objects. Mundane weapons, armor and metal jewelry can all be formed from their raw components. You may unmake these things, as well, but to do so without time and safety might require that you Defy Danger first.","tier":0},{"name":"Lore of Flame","text":"When you **stare into a source of fire, looking for answers**, roll+WIS On a hit, the GM will tell you something new and interesting about the current situation.\n* On a 10+, the GM will give you good detail.\n* On a 7-9, the GM will give you an impression. If you already know all there is to know, the GM will tell you that.","stat":"WIS","tier":2},{"name":"Burns Twice As Bright","text":"When you **channel the flames of fate**, you may treat a missed roll as a 7-9 or a 7-9 result as a 10+. This may be a roll you or another character has made. Tell the GM something you've lost; an emotion, a memory or some innate piece of your being. You may not use this move again until you've used Burns Half As Long.","tier":2},{"name":"Burns Half As Long","text":"You gain this move when you gain Burns Twice as Bright.\n\nWhen you sacrifice a victory to the flames of fate, treat any roll of 10+ as a miss.","tier":2},{"name":"This Killing Fire","text":"Add the following tags to your options for Burning Brand: **messy, forceful, reach, near, far**","tier":2},{"name":"Firebrand","text":"When you **introduce a new idea to an NPC**, roll+CHA.\n* On a 10+ They believe the idea to be their own and take to it with fervor\n* On a 7-9, Their passion fades after a day or two. On a miss, they respond negatively, speaking out against the idea.","stat":"CHA","tier":2},{"name":"Ogdru Jahad","text":"Gain the Wizard move Ritual. The GM will always tell you what you have to sacrifice to gain the effect you desire.","tier":2},{"name":"Moth To The Flame","text":"When you tempt a weak mind with your inner fire, roll+WIS.\n* On a 10+ their will is suppressed, they'll follow you and do as you desire, so long as nothing startles or surprises them.\n* On a 7-9, the effect is only strong enough to distract or confuse them. On a miss, they become agitated and upset, your fire having sparked their hidden desires.","stat":"WIS","tier":2},{"name":"Burning Bridges","text":"When you would take your last breath, don't. Instead, you may erase one of your Bonds. This is permanent and lowers your total available Bonds forever. You are alive and have 1d6 hp. If you have no more Bonds, take your last breath as normal.","tier":2},{"name":"The Enkindler","text":"When you bolster the courage of others roll+CHA.\n* On a 10+ they shake off all fear and doubt, becoming brave in an instant.\n* On a 7-9, this effect is fleeting, they realize its superficiality and resort to cowardice after a moment or two. On a miss, they're cowed or terrified by your presence.","stat":"CHA","tier":2},{"name":"Sick Burn","text":"When you insult an NPC, roll + CHA.\n* On a 10+ you leave them no room to react, they bear your insult and the scorn of all who hear it.\n* On a 7-9 you cross a line, they will have their revenge, someday. On a miss you've gone too far, they blow up here and now.","tier":2},{"name":"From Hell's Heart","text":"Whenever you summon fire with any of your moves, you can replace it with the black fires of hell itself. This fire does not burn with heat and ignores armor, scorching the soul itself. Those creatures without souls cannot be harmed by this type of flame.","tier":6},{"name":"Burning Ring Of Fire","text":"When you **fuse a willing person's soul to yours**, roll+CHA. On a hit you are bound together, able to sense each other at any distance, as well as sharing your emotional state.\n* On a 7-9, the connection is unstable and dangerous, when you take a debility, so do they (and vice versa).\n* On a miss, the branding is rejected and you both erase any Bonds you have to each other. You may write new Bonds with them at the End of Session as usual. This fusion, once performed, cannot be undone by mortal means.","stat":"CHA","tier":6},{"name":"Fanning The Flame","text":"You may apply the effects of your Firebrand move to a group of people - a dozen or so - all at once.","tier":6},{"name":"Watch the World Burn","text":"When you **open a channel to the burning planes and call a firestorm**, tell the GM what you're sacrificing and roll+WIS. The sky opens up and fire pours like rain from it within an area about equal to a small village. Everyone and everything in the area takes damage as appropriate.\n* On a 10+ you can extinguish the storm with a little effort.\n* On a 7-9 the fires rage out of your control, spreading and gusting where they are carried by wind and weather. On a miss, something cruel, intelligent and hungry comes with the storm.","stat":"WIS","tier":6}],"extra":true},"Barbarian":{"dmg":"d10","hp":8,"load":8,"alignments":[{"type":"Neutral","text":"Teach someone the ways of your people."},{"type":"Chaotic","text":"You eschew a convention of the civilized world."}],"bonds":["______________________ is puny and foolish, but amusing to me.","______________________ 's ways are strange and confusing.","______________________ is always getting into trouble - I must protect them from themselves.","______________________ shares my hunger for glory; the earth will tremble at our passing!"],"races":[{"name":"Outsider","text":"You may be elf, dwarf, halfling, or human, but you and your people are not from around here. At the beginning of each session, the GM will ask you something about your homeland, why you left, or what you left behind. If you answer them, mark XP."}],"gear":[{"label":"You carry dungeon rations (5 uses, 1 weight), a dagger (hand, 1 weight) some token of where you've traveled or where you're from","max":null,"options":[{"label":"Dungeon Rations","items":[{"name":"Dungeon Rations","desc":"Not tasty, but not bad either.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":5},{"n":"Coins","v":3},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Dagger","items":[{"name":"Dagger","desc":"","tags":[{"n":"Hand","v":null},{"n":"Coins","v":2},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Token Of Origin","items":[{"name":"Token Of Origin","desc":"A token of where you've traveled or where you're from.","tags":[{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0}]},{"label":"Choose a weapon","max":1,"options":[{"label":"Axe","items":[{"name":"Axe","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":8},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Two handed sword","items":[{"name":"Two Handed Sword","desc":"","tags":[{"n":"Close","v":null},{"n":"Damage","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one","max":1,"options":[{"label":"Adventuring gear and dungeon rations","items":[{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}],"amount":1.0},{"name":"Dungeon Rations","desc":"Not tasty, but not bad either.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":5},{"n":"Coins","v":3},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Chainmail","items":[{"name":"Chainmail","desc":"","tags":[{"n":"Armor","v":1},{"n":"Worn","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]}],"spellcaster":false,"page":null,"blurb":"","moves":[{"name":"Herculean Appetites","text":"Others may content themselves with just a taste of wine, or dominion over a servant or two, but you want more. Choose two appetites. While pursuing one of your appetites if you would roll for a move, instead of rolling 2d6 you roll 1d6+1d8. If the d6 is the higher die of the pair, the GM will also introduce a complication or danger that comes about due to your heedless pursuits.\n\n* Pure destruction\n* Power over others\n* Mortal pleasures\n* Conquest\n* Riches and property\n* Fame and glory","tier":0},{"name":"The Upper Hand","text":"You take +1 ongoing to last breath rolls. When you take your last breath, on a 7-9 you make an offer to Death in return for your life. If Death accepts he will return you to life. If not, you die.","tier":0},{"name":"Musclebound","text":"While you wield a weapon it gains the forceful and messy tags.","tier":0},{"name":"What Are You Waiting For?","text":"When you cry out a challenge to your enemies, roll+Con.\n\n* On a 10+ they treat you as the most obvious threat to be dealt with and ignore your companions, take +2 damage ongoing against them.\n* On a 7-9 only a few (the weakest or most foolhardy among them) fall prey to your taunting.","stat":"CON","tier":0},{"name":"Full Plate and Packing Steel","text":"You ignore the clumsy tag on armor you wear.","tier":2},{"name":"Unencumbered, Unharmed","text":"So long as you are below your Load and neither wear armor nor carry a shield, take +1 armor.","tier":2},{"name":"Still Hungry","text":"Choose an additional appetite.","tier":2},{"name":"Appetite for Destruction","text":"Take a move from the fighter, bard or thief class list. You may not take multiclass moves from those classes.","tier":2},{"name":"My Love For You Is Like a Truck","text":"When you perform a feat of strength, name someone present whom you have impressed and take +1 forward to parley with them.","tier":2},{"name":"What Is Best In Life","text":"At the end of a session, if during this session you have crushed your enemies, seen them driven before you, or have heard the lamentations of their kinfolk, mark XP.","tier":2},{"name":"Wide Wanderer","text":"You've traveled the wide world over. When you arrive someplace ask the GM about any important traditions, rituals, and so on, they'll tell you what you need to know.","tier":2},{"name":"Usurper","text":"When you prove yourself superior to a person in power, take +1 forward with their followers, underlings, and hangers on.","tier":2},{"name":"Khan Of Khans","text":"Your hirelings always accept the gratuitous fulfillment of one of your appetites as payment.","tier":2},{"name":"Samson","text":"You may take a debility to immediately break free of any physical or mental restraint.","tier":2},{"name":"Smash!","text":"When you hack and slash, on a 12+ deal your damage and choose something physical your target has (a weapon, their position, a limb): they lose it.","page":289,"tier":2},{"name":"Indestructible Hunger","text":"When you take damage you can choose to take 1 ongoing until you sate one of your appetites instead of taking the damage. If you already have this penalty you cannot choose this option.","tier":2},{"name":"Eye For Weakness","text":"When you discern realities add \"What here is weak or vulnerable?\" to the list of questions you can ask.","tier":2},{"name":"On The Move","text":"When you defy a danger caused by movement (maybe falling off a narrow bridge or rushing past an armed guard) take +1.","tier":2},{"name":"A Good Day To Die","text":"As long as you have less than your Con in current HP (or 1, whichever is higher) take +1 ongoing.","tier":6},{"name":"Kill 'Em All","text":"**Requires:** Appetite for Destruction\n\nTake another move from the fighter, bard or thief class list. You may not take multiclass moves from those classes.","tier":6},{"name":"War Cry","text":"When you enter battle with a show of force (a shout, a rallying cry, a battle dance) roll+Cha.\n\n* On a 10+ both,\n* On a 7-9 one or the other.\n\t* Your allies are rallied and take +1 forward\n\t* Your enemies feel fear and act accordingly (avoiding you, hiding, attacking with fear driven abandon)","stat":"CHA","tier":6},{"name":"Mark Of Might","text":"When you take this move and spend some uninterrupted time reflecting on your past glories you may mark yourself with a symbol of your power (a long braid tied with bells, ritual scars or tattoos, etc.) Any intelligent mortal creature who sees this symbol knows instinctively that you are a force to be reckoned with and treats you appropriately.","tier":6},{"name":"More! Always More!","text":"When you satisfy an appetite to the extreme (destroying something unique and significant, gaining enormous fame, riches, power, etc.) you may choose to resolve it. Cross it off the list and mark XP. While you may pursue that appetite again, you no longer feel the burning desire you once did. In its place, choose a new appetite from the list or write your own.","tier":6},{"name":"The One Who Knocks","text":"When you defy danger, on a 12+ you turn the danger back on itself, the GM will describe how.","tier":6},{"name":"Healthy Distrust","text":"Whenever the unclean magic wielded by mortal men causes you to defy danger, treat any result of 6 as a 7-9.","tier":6},{"name":"For The Blood God","text":"You are initiated in the old ways, the ways of sacrifice. Choose something your gods (or the ancestor spirits, or your totem, etc) value-gold, blood, bones or the like. When you sacrifice those things as per your rites and rituals, roll+Wis.\n\n* On a 10+ the GM will grant you insight into your current trouble or a boon to help you.\n* On a 7-9 the sacrifice is not enough and your gods take of your flesh as well, but still grant you some insight or boon.\n* On a miss, you earn the ire of the fickle spirits.","stat":"WIS","tier":6}],"extra":true}},"basic":[{"name":"Hack and Slash","text":"When you **attack an enemy in melee**, roll+Str.\n* On a 10+ you deal your damage to the enemy and avoid their attack. At your option, you may choose to do +1d6 damage but expose yourself to the enemy's attack.\n* On a 7-9, you deal your damage to the enemy and the enemy makes an attack against you.","stat":"STR","page":56},{"name":"Defy Danger","text":"When you act despite an imminent threat or suffer a calamity, say how you deal with it and roll. If you do it...\n\n * by powering through, +Str\n * by getting out of the way or acting fast, +Dex\n * by enduring, +Con\n * with quick thinking, +Int\n * through mental fortitude, +Wis\n * sing charm and social grace, +Cha\n\nOn a 10+, you do what you set out to, the threat doesn't come to bear.\n\nOn a 7-9, you stumble, hesitate, or flinch: the GM will offer you a worse outcome, hard bargain, or ugly choice.","stat":"","page":60},{"name":"Defend","text":"When you stand in defense of a person, item, or location under attack, roll+Con.\n* On a 10+, hold 3.\n* On a 7-9, hold 1. So long as you stand in defense, when you or the thing you defend is attacked you may spend hold, 1 for 1, to choose an option:\n\n * Redirect an attack from the thing you defend to yourself\n * Halve the attack's effect or damage\n * Open up the attacker to an ally giving that ally +1 forward against the attacker\n * Deal damage to the attacker equal to your level","stat":"CON","page":62},{"name":"Volley","text":"When you take aim and **shoot at an enemy at range**, roll+Dex.\n* On a 10+ you have a clear shot-deal your damage.\n* On a 7-9, choose one (whichever you choose you deal your damage):\n\n \t* You have to move to get the shot placing you in danger of the GM's choice\n\t* You have to take what you can get: -1d6 damage\n\t* You have to take several shots, reducing your ammo by one.","stat":"DEX","page":58},{"name":"Discern Realities","text":"When you **closely study a situation or person**, roll+Wis.\n* On a 10+ ask the GM three questions from the list below.\n* On a 7-9 ask only one. Take +1 forward when acting on the answers.\n\n * What happened here recently?\n * What is about to happen?\n * What should I be on the lookout for?\n * What here is useful or valuable to me?\n * Who's really in control here?\n * What here is not what it appears to be?","stat":"WIS","page":66},{"name":"Parley","text":"When you **have leverage on a GM character and manipulate them**, roll+Cha. Leverage is something they need or want. On a hit they ask you for something and do it if you make them a promise first.\n* On a 7-9, they need some concrete assurance of your promise, right now.","stat":"CHA","page":68},{"name":"Spout Lore","text":"When you **consult your accumulated knowledge about something**, roll+Int.\n* On a 10+ the GM will tell you something interesting and useful about the subject relevant to your situation.\n* On a 7-9 the GM will only tell you something interesting-it's on you to make it useful. The GM might ask you \"How do you know this?\" Tell them the truth, now.","stat":"INT","page":64},{"name":"Aid or Interfere","text":"When you **help or hinder someone you have a Bond with**, roll+Bond with them. On a hit they take +1 or -2, your choice.\n* On a 7-9 you also expose yourself to danger, retribution, or cost.","stat":"BOND","page":70}],"special":[{"name":"Encumbrance","text":"When you **make a move while carrying weight up to or equal to Load**, you're fine. When you make a move while carrying weight equal to load+1 or load+2, you take -1. When you make a move while carrying weight greater than load+2, you have a choice: drop at least 1 weight and roll at -1, or automatically fail.","stat":"","page":74},{"name":"Make Camp","text":"When you **settle in to rest** consume a ration. If you're somewhere dangerous decide the watch order as well. If you have enough XP you may level up. When you wake from at least a few uninterrupted hours of sleep heal damage equal to half your max HP.","stat":"","page":74},{"name":"Take Watch","text":"When you're on watch and something approaches the camp roll+Wis.\n* On a 10+, you're able to wake the camp and prepare a response, everyone in the camp takes +1 forward.\n* On a 7-9, you react just a moment too late; your companions in camp are awake but haven't had time to prepare. They have weapons and armor but little else.\n* On a miss, whatever lurks outside the campfire's light has the drop on you.","stat":"WIS","page":75},{"name":"Bolster","text":"When you **spend your leisure time in study, meditation, or hard practice**, you gain preparation. If you prepare for a week or more, take 1 preparation. If you prepare for a month or longer, take 3 instead. When your preparation pays off spend 1 preparation for +1 to any roll. You can only spend one preparation per roll.","stat":"","page":79},{"name":"Supply","text":"When you go to **buy something with gold on hand**, if it's something readily available in the settlement you're in, you can buy it at market price. If it's something special, beyond what's usually available here, or non-mundane, roll+Cha.\n* On a 10+, you find what you're looking for at a fair price.\n* On a 7-9, you'll have to pay more or settle for something that's not exactly what you wanted, but close. The GM will tell you what your options are.","stat":"CHA","page":77},{"name":"Undertake a Perilous Journey","text":"When you travel through hostile territory, choose one member of the party to act as trailblazer, one to scout ahead, and one to be quartermaster. Each character with a job to do rolls+Wis.\n* On a 10+:\n\n* the quartermaster reduces the number of rations required by one\n* the trailblazer reduces the amount of time it takes to reach your destination (the GM will say by how much)\n* the scout will spot any trouble quick enough to let you get the drop on it\n\n\n* On a 7-9, each role performs their job as expected: the normal number of rations are consumed, the journey takes about as long as expected, no one gets the drop on you but you don't get the drop on them either.","stat":"","page":75},{"name":"Recover","text":"When you **do nothing but rest in comfort and safety** after a day of rest you recover all your HP. After three days of rest you remove one debility of your choice. If you're under the care of a healer (magical or otherwise) you heal a debility for every two days of rest instead.","stat":"","page":77},{"name":"Carouse","text":"When you return triumphant and throw a big party, spend 100 coins and roll +1 for every extra 100 coins spent.\n* On a 10+, choose 3.\n* On a 7-9, choose 1.\n* On a miss, you still choose one, but things get really out of hand (the GM will say how).\n\nYour choices are:\n\n* You befriend a useful NPC.\n* You hear rumors of an opportunity.\n* You gain useful information.\n* You are not entangled, ensorcelled, or tricked.\n\nYou can only carouse when you return triumphant. That's what draws the crowd of revelers to surround adventurers as they celebrate their latest haul. If you don't proclaim your success or your failure, then who would want to party with you anyway?","stat":"","page":77},{"name":"Recruit","text":"When you put out word that you're looking to hire help, roll:\n\n* +1 if you make it known that your pay is generous\n* +1 if you make it known what you're setting out to do\n* +1 if you make it known that they'll get a share of whatever you find\n* +1 if you have a useful reputation around these parts\n\n\n* On a 10+, you've got your pick of a number of skilled applicants, your choice who you hire, no penalty for not taking them along.\n* On a 7-9, you'll have to settle for someone close to what you want or turn them away.\n* On a miss someone influential and ill-suited declares they'd like to come along (a foolhardy youth, a loose-cannon, or a veiled enemy, for example), bring them and take the consequences or turn them away. If you turn away applicants you take -1 forward to recruit.","stat":"","page":78},{"name":"End of Session","text":"When you **reach the end of a session**, choose one of your bonds that you feel is resolved (completely explored, no longer relevant, or otherwise). Ask the player of the character you have the bond with if they agree. If they do, mark XP and write a new bond with whomever you wish.\n\nOnce bonds have been updated look at your alignment. If you fulfilled that alignment at least once this session, mark XP. Then answer these three questions as a group:\n\n* Did we learn something new and important about the world?\n* Did we overcome a notable monster or enemy?\n* Did we loot a memorable treasure?\n\nFor each \"yes\" answer everyone marks XP.","stat":"","page":76},{"name":"Level","text":"When you **have downtime (hours or days) and XP equal to (or greater than) your current level+7**, you can reflect on your experiences and hone your skills.\n\n* Subtract your current level+7 from your XP.\n* Increase your level by 1.\n* Choose a new advanced move from your class.\n* If you are the wizard, you also get to add a new spell to your spellbook.\n* Choose one of your stats and increase it by 1 (this may change your modifier). Changing your Constitution increases your maximum and current HP. Ability scores can't go higher than 18.","stat":"","page":97},{"name":"Outstanding Warrants","text":"When you return to a civilized place in which you've caused trouble before, roll+Cha.\n* On a 10+, word has spread of your deeds and everyone recognizes you.\n* On a 7-9, as above, and the GM chooses a complication:\n\n* The local constabulary has a warrant out for your arrest.\n* Someone has put a price on your head.\n* Someone important to you has been put in a bad spot as a result of your actions","stat":"CHA","page":78},{"name":"Last Breath","text":"When you're dying you catch a glimpse of what lies beyond the Black Gates of Death's Kingdom (the GM will describe it). Then roll (just roll, +nothing-yeah, Death doesn't care how tough or cool you are).\n* On a 10+ you've cheated death- you're in a bad spot but you're still alive.\n* On a 7-9 Death will offer you a bargain. Take it and stabilize or refuse and pass beyond the Black Gates into whatever fate awaits you. On a miss, your fate is sealed. You're marked as Death's own and you'll cross the threshold soon. The GM will tell you when.","stat":"","page":72}],"spells":{"Cleric":[{"name":"Light","level":"cantrip","ongoing":false,"text":"An item you touch glows with arcane light, about as bright as a torch. It gives off no heat or sound and requires no fuel, but it is otherwise like a mundane torch. You have complete control of the color of the flame. The spell lasts as long as it is in your presence.","page":96},{"name":"Sanctify","level":"rote","ongoing":false,"text":"Food or water you hold in your hands while you cast this spell is consecrated by your deity. In addition to now being holy or unholy, the affected substance is purified of any mundane spoilage.","page":96},{"name":"Guidance","level":"rote","ongoing":false,"text":"The symbol of your deity appears before you and gestures towards the direction or course of action your deity would have you take then disappears. The message is through gesture only; your communication through this spell is severely limited.","page":96},{"name":"Bless","level":"1","ongoing":true,"text":"Your deity smiles upon a combatant of your choice. They take +1 ongoing so long as battle continues and they stand and fight. While this spell is ongoing you take -1 to cast a spell.","page":97},{"name":"Cure Light Wounds","level":"1","ongoing":false,"text":"At your touch wounds scab and bones cease to ache. Heal an ally you touch of 1d8 damage.","page":97},{"name":"Detect Alignment","level":"1","ongoing":false,"text":"When you cast this spell choose an alignment: Good, Evil, Lawful, or Chaotic. One of your senses is briefly able to detect that alignment. The GM will tell you what here is of that alignment.","page":97},{"name":"Cause Fear","level":"1","ongoing":true,"text":"Choose a target you can see and a nearby object. The target is afraid of the object so long as you maintain the spell. Their reaction is up to them: flee, panic, beg, fight. While this spell is ongoing you take -1 to cast a spell. You cannot target entities with less than animal intelligence (magical constructs, undead, automatons, and the like).","page":97},{"name":"Magic Weapon","level":"1","ongoing":true,"text":"The weapon you hold while casting does +1d4 damage until you dismiss this spell. While this spell is ongoing you take -1 to cast a spell.","page":97},{"name":"Sanctuary","level":"1","ongoing":false,"text":"As you cast this spell, you walk the perimeter of an area, consecrating it to your deity. As long as you stay within that area you are alerted whenever someone acts with malice within the sanctuary (including entering with harmful intent). Anyone who receives healing within a sanctuary heals +1d4 HP.","page":97},{"name":"Speak With Dead","level":"1","ongoing":false,"text":"A corpse converses with you briefly. It will answer any three questions you pose to it to the best of the knowledge it had in life and the knowledge it gained in death.","page":97},{"name":"Animate Dead","level":"3","ongoing":true,"text":"You invoke a hungry spirit to possess a recently-dead body and serve you. This creates a zombie that follows your orders to the best of its limited abilities. Treat the zombie as a character, but with access to only the basic moves. It has a +1 modifier for all stats and 1 HP. The zombie also gets your choice of 1d4 of these traits:\n\n* It's talented. Give one stat a +2 modifier.\n* It's durable. It has +2 HP for each level you have.\n* It has a functioning brain and can complete complex tasks.\n* It does not appear obviously dead, at least for a day or two.\nThe zombie lasts until it is destroyed by taking damage in excess of its HP, or until you end the spell. While this spell is ongoing you take -1 to cast a spell.","page":98},{"name":"Cure Moderate Wounds","level":"3","ongoing":false,"text":"You staunch bleeding and set bones through magic. Heal an ally you touch of 2d8 damage.","page":98},{"name":"Darkness","level":"3","ongoing":true,"text":"Choose an area you can see: it's filled with supernatural darkness and shadow. While this spell is ongoing you take -1 to cast a spell.","page":98},{"name":"Resurrection","level":"3","ongoing":false,"text":"Tell the GM you would like to resurrect a corpse whose soul has not yet fully departed this world. Resurrection is always possible, but the GM will give you one or more (possibly all) of these conditions to fulfill:\n\n* It's going to take days/weeks/months\n* You must get help from ____\n* It will require a lot of money\n* You must sacrifice ____ to do it\nThe GM may, depending on the circumstances, allow you to resurrect the corpse now, with the understanding that the conditions must be met before it's permanent, or require you to meet the conditions before the corpse is resurrected.","page":98},{"name":"Hold Person","level":"3","ongoing":false,"text":"Choose a person you can see. Until you cast a spell or leave their presence they cannot act except to speak. This effect ends immediately if the target takes damage from any source.","page":98},{"name":"Revelation","level":"5","ongoing":false,"text":"Your deity answers your prayers with a moment of perfect understanding. The GM will shed light on the current situation. When acting on the information, you take +1 forward.","page":99},{"name":"Cure Critical Wounds","level":"5","ongoing":false,"text":"Heal an ally you touch of 3d8 damage.","page":99},{"name":"Divination","level":"5","ongoing":false,"text":"Name a person, place, or thing you want to learn about. Your deity grants you visions of the target, as clear as if you were there.","page":99},{"name":"Contagion","level":"5","ongoing":true,"text":"Choose a creature you can see. Until you end this spell, the target suffers from a disease of your choice. While this spell is ongoing you take -1 to cast a spell.","page":99},{"name":"Words of the Unspeaking","level":"5","ongoing":false,"text":"With a touch you speak to the spirits within things. The non-living object you touch answers three questions you pose, as best it can.","page":null},{"name":"True Seeing","level":"7","ongoing":true,"text":"You see all things as they truly are. This effect persists until you tell a lie or dismiss the spell. While this spell is ongoing you take -1 to cast a spell.","page":99},{"name":"Trap Soul","level":"5","ongoing":false,"text":"You trap the soul of a dying creature within a gem. The trapped creature is
