 aware of its imprisonment but can still be manipulated through spells, parley, and other effects. All moves against the trapped creature are at +1. You can free the soul at any time but it can never be recaptured once freed.","page":99},{"name":"Word of Recall","level":"7","ongoing":false,"text":"Choose a word. The first time after casting this spell that you speak the chosen word, you and any allies touching you when you cast the spell are immediately returned to the exact spot where you cast the spell. You can only maintain a single location; casting Word of Recall again before speaking the word replaces the earlier spell.","page":100},{"name":"Heal","level":"7","ongoing":false,"text":"Touch an ally and you may heal their damage a number of points up to your maximum HP.","page":100},{"name":"Harm","level":"7","ongoing":false,"text":"Touch an enemy and strike them with divine wrath-deal 2d8 damage to them and 1d6 damage to yourself. This damage ignores armor.","page":100},{"name":"Sever","level":"7","ongoing":true,"text":"Choose an appendage on the target such as an arm, tentacle, or wing. The appendage is magically severed from their body, causing no damage but considerable pain. Missing an appendage may, for example, keep a winged creature from flying, or a bull from goring you on its horns. While this spell is ongoing you take -1 to cast a spell.","page":100},{"name":"Mark of Death","level":"7","ongoing":false,"text":"Choose a creature whose true name you know. This spell creates permanent runes on a target surface that will kill that creature, should they read them.","page":100},{"name":"Control Weather","level":"7","ongoing":false,"text":"Pray for rain-or sun, wind, or snow. Within a day or so, your god will answer. The weather will change according to your will and last a handful of days.","page":100},{"name":"Storm of Vengeance","level":"9","ongoing":false,"text":"Your deity brings the unnatural weather of your choice to pass. Rain of blood or acid, clouds of souls, wind that can carry away buildings, or any other weather you can imagine: ask and it shall come.","page":101},{"name":"Repair","level":"9","ongoing":false,"text":"Choose one event in the target's past. All effects of that event, including damage, poison, disease, and magical effects, are ended and repaired. HP and diseases are healed, poisons are neutralized, magical effects are ended.","page":101},{"name":"Divine Presence","level":"9","ongoing":true,"text":"Every creature must ask your leave to enter your presence, and you must give permission aloud for them to enter. Any creature without your leave takes an extra 1d10 damage whenever they take damage in your presence. While this spell is ongoing you take -1 to cast a spell.","page":101},{"name":"Consume Unlife","level":"9","ongoing":false,"text":"The mindless undead creature you touch is destroyed and you steal its death energy to heal yourself or the next ally you touch. The amount of damage healed is equal to the HP that the creature had remaining before you destroyed it.","page":101},{"name":"Plague","level":"9","ongoing":true,"text":"Name a city, town, encampment, or other place where people live. As long as this spell is active that place is beset by a plague appropriate to your deity's domains (locusts, death of the first born, etc.) While this spell is ongoing you take -1 to cast a spell.","page":101}],"Wizard":[{"name":"Light","level":"cantrip","ongoing":false,"text":"An item you touch glows with arcane light, about as bright as a torch. It gives off no heat or sound and requires no fuel, but it is otherwise like a mundane torch. You have complete control of the color of the flame. The spell lasts as long as it is in your presence.","page":96},{"name":"True Seeing","level":"7","ongoing":true,"text":"You see all things as they truly are. This effect persists until you tell a lie or dismiss the spell. While this spell is ongoing you take -1 to cast a spell.","page":99},{"name":"Prestidigitation","level":"cantrip","ongoing":false,"text":"You perform minor tricks of true magic. If you touch an item as part of the casting you can make cosmetic changes to it: clean it, soil it, cool it, warm it, flavor it, or change its color. If you cast the spell without touching an item you can instead create minor illusions no bigger than yourself. Prestidigitation illusions are crude and clearly illusions-they won't fool anyone, but they might entertain them.","page":150},{"name":"Unseen Servant","level":"cantrip","ongoing":true,"text":"You conjure a simple invisible construct that can do nothing but carry items. It has Load 3 and carries anything you hand to it. It cannot pick up items on its own and can only carry those you give to it. Items carried by an unseen servant appear to float in the air a few paces behind you. An unseen servant that takes damage or leaves your presence is immediately dispelled, dropping any items it carried. Otherwise the unseen servant serves you until you end the spell.","page":150},{"name":"Contact Spirits","level":"1","ongoing":false,"text":"Name the spirit you wish to contact (or leave it to the GM). You pull that creature through the planes, just close enough to speak to you. It is bound to answer any one question you ask to the best of its ability.","page":151},{"name":"Detect Magic","level":"1","ongoing":false,"text":"One of your senses is briefly attuned to magic. The GM will tell you what here is magical.","page":151},{"name":"Telepathy","level":"1","ongoing":true,"text":"You form a telepathic bond with a single person you touch, enabling you to converse with that person through your thoughts. You can only have one telepathic bond at a time.","page":151},{"name":"Charm Person","level":"1","ongoing":true,"text":"The person (not beast or monster) you touch while casting this spell counts you as a friend until they take damage or you prove otherwise.","page":151},{"name":"Invisibility","level":"1","ongoing":true,"text":"Touch an ally: nobody can see them. They're invisible! The spell persists until the target attacks or you dismiss the effect. While the spell is ongoing you can't cast a spell.","page":151},{"name":"Magic Missile","level":"1","ongoing":false,"text":"Projectiles of pure magic spring from your fingers. Deal 2d4 damage to one target.","page":151},{"name":"Alarm","level":"1","ongoing":false,"text":"Walk a wide circle as you cast this spell. Until you prepare spells again your magic will alert you if a creature crosses that circle. Even if you are asleep, the spell will shake you from your slumber.","page":151},{"name":"Dispel Magic","level":"3","ongoing":false,"text":"Choose a spell or magic effect in your presence: this spell rips it apart. Lesser spells are ended, powerful magic is just reduced or dampened so long as you are nearby.","page":152},{"name":"Visions Through Time","level":"3","ongoing":false,"text":"Cast this spell and gaze into a reflective surface to see into the depths of time. The GM will reveal the details of a grim portent to you-a bleak event that will come to pass without your intervention. Theyll tell you something useful about how you can interfere with the grim portent's dark outcomes. Rare is the portent that claims \"You'll live happily ever after.\" Sorry.","page":null},{"name":"Fireball","level":"3","ongoing":false,"text":"You evoke a mighty ball of flame that envelops your target and everyone nearby, inflicting 2d6 damage which ignores armor.","page":152},{"name":"Mimic","level":"3","ongoing":true,"text":"You take the form of someone you touch while casting this spell. Your physical characteristics match theirs exactly but your behavior may not. This change persists until you take damage or choose to return to your own form. While this spell is ongoing you lose access to all your wizard moves.","page":152},{"name":"Mirror Image","level":"3","ongoing":false,"text":"You create an illusory image of yourself. When you are attacked, roll a d6.\n* On a 4, 5, or 6 the attack hits the illusion instead, the image then dissipates and the spell ends.","page":152},{"name":"Sleep","level":"3","ongoing":false,"text":"1d4 enemies you can see of the GM's choice fall asleep. Only creatures capable of sleeping are affected. They awake as normal: loud noises, jolts, pain.","page":152},{"name":"Cage","level":"5","ongoing":true,"text":"The target is held in a cage of magical force. Nothing can get in or out of the cage. The cage remains until you cast another spell or dismiss it. While the spell is ongoing, the caged creature can hear your thoughts and you cannot leave sight of the cage.","page":153},{"name":"Contact Other Plane","level":"5","ongoing":false,"text":"You send a request to another plane. Specify who or what you'd like to contact by location, type of creature, name, or title. You open a two-way communication with that creature. Your communication can be cut off at any time by you or the creature you contacted.","page":null},{"name":"Polymorph","level":"5","ongoing":false,"text":"Your touch reshapes a creature entirely, they stay in the form you craft until you cast a spell. Describe the new shape you craft, including any stat changes, significant adaptations, or major weaknesses. The GM will then tell you one or more of these:\n* The form will be unstable and temporary\n* The creature's mind will be altered as well\n* The form has an unintended benefit or weakness","page":153},{"name":"Summon Monster","level":"5","ongoing":true,"text":"A monster appears and aids you as best it can. Treat it as your character, but with access to only the basic moves. It has +1 modifier for all stats, 1 HP, and uses your damage dice. The monster also gets your choice of 1d6 of these traits:\n* It has +2 instead of +1 to one stat\n* It's not reckless\n* It does 1d8 damage\n* Its bond to your plane is strong: +2 HP for each level you have\n* It has some useful adaptation\nThe GM will tell you the type of monster you get based on the traits you select. The creature remains on this plane until it dies or you dismiss it. While the spell is ongoing you take -1 to cast a spell.","page":153},{"name":"Dominate","level":"7","ongoing":true,"text":"Your touch pushes your mind into someone else's. You gain 1d4 hold. Spend one hold to make the target take one of these actions:\n* Speak a few words of your choice\n* Give you something they hold\n* Make a concerted attack on a target of your choice\n* Truthfully answer one question\n\nIf you run out of hold the spell ends. If the target takes damage you lose 1 hold. While the spell is ongoing you cannot cast a spell.","page":154},{"name":"Shadow Walk","level":"7","ongoing":false,"text":"The shadows you target with this spell become a portal for you and your allies. Name a location, describing it with a number of words up to your level. Stepping through the portal deposits you and any allies present when you cast the spell at the location you described. The portal may only be used once by each ally.","page":154},{"name":"Contingency","level":"7","ongoing":false,"text":"Choose a 5th level or lower spell you know. Describe a trigger condition using a number of words equal to your level. The chosen spell is held until you choose to unleash it or the trigger condition is met, whichever happens first. You don't have to roll for the held spell, it just takes effect. You may only have a single contingent spell held at a time; if you cast Contingency while you have a held spell, the new held spell replaces the old one.","page":154},{"name":"Cloudkill","level":"7","ongoing":true,"text":"A cloud of fog drifts into this realm from beyond the Black Gates of Death, filling the immediate area. Whenever a creature in the area takes damage it takes an additional, separate 1d6 damage which ignores armor. This spell persists so long as you can see the affected area, or until you dismiss it.","page":154},{"name":"Antipathy","level":"9","ongoing":true,"text":"Choose a target and describe a type of creature or an alignment. Creatures of the specified type or alignment cannot come within sight of the target. If a creature of the specified type does find itself within sight of the target, it immediately flees. This effect continues until you leave the target's presence or you dismiss the spell. While the spell is ongoing you take -1 to cast a spell.","page":155},{"name":"Alert","level":"9","ongoing":false,"text":"Describe an event. The GM will tell you when that event occurs, no matter where you are or how far away the event is. If you choose, you can view the location of the event as though you were there in person. You can only have one Alert active at a time.","page":155},{"name":"Soul Gem","level":"9","ongoing":false,"text":"You trap the soul of a dying creature within a gem. The trapped creature is aware of its imprisonment but can still be manipulated through spells, parley, and other effects. All moves against the trapped creature are at +1. You can free the soul at any time but it can never be recaptured once freed.","page":155},{"name":"Shelter","level":"9","ongoing":true,"text":"You create a structure out of pure magical power. It can be as large as a castle or as small as a hut, but is impervious to all non-magical damage. The structure endures until you leave it or you end the spell.","page":155},{"name":"Perfect Summons","level":"9","ongoing":false,"text":"You teleport a creature to your presence. Name a creature or give a short description of a type of creature. If you named a creature, that creature appears before you. If you described a type of creature, a creature of that type appears before you.","page":155}]},"items":[{"name":"Token Of Origin","desc":"A token of where you've traveled or where you're from.","tags":[{"n":"Weight","v":0}]},{"name":"Father's Mandolin","desc":"Your father's mandolin, repaired.","tags":[{"n":"Weight","v":0}]},{"name":"Fine Lute","desc":"A fine lute, a gift from a noble.","tags":[{"n":"Weight","v":0}]},{"name":"Memorable Pipes","desc":"The pipes with which you courted your first love","tags":[{"n":"Weight","v":0}]},{"name":"Stolen Horn","desc":"A stolen horn","tags":[{"n":"Weight","v":0}]},{"name":"Unplayed Fiddle","desc":"A fiddle, never before played.","tags":[{"n":"Weight","v":0}]},{"name":"Forgotten Songbook","desc":"A songbook in a forgotten tongue.","tags":[{"n":"Weight","v":0}]},{"name":"Ragged Bow","desc":"","tags":[{"n":"Near","v":null},{"n":"Coins","v":15},{"n":"Weight","v":2}]},{"name":"Fine Bow","desc":"","tags":[{"n":"Near","v":null},{"n":"Far","v":null},{"n":"Coins","v":60},{"n":"Weight","v":2}]},{"name":"Hunter's Bow","desc":"","tags":[{"n":"Near","v":null},{"n":"Far","v":null},{"n":"Weight","v":1}]},{"name":"Crossbow","desc":"","tags":[{"n":"Near","v":null},{"n":"Damage","v":1},{"n":"Reload","v":null},{"n":"Coins","v":35},{"n":"Weight","v":3}]},{"name":"Bundle of Arrows","desc":"","tags":[{"n":"Ammo","v":3},{"n":"Coins","v":1},{"n":"Weight","v":1}]},{"name":"Elven Arrows","desc":"","tags":[{"n":"Ammo","v":4},{"n":"Coins","v":20},{"n":"Weight","v":1}]},{"name":"Club","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":1},{"n":"Weight","v":1}]},{"name":"Shillelagh","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":1},{"n":"Weight","v":1}]},{"name":"Staff","desc":"","tags":[{"n":"Close","v":null},{"n":"Two_handed","v":null},{"n":"Coins","v":1},{"n":"Weight","v":1}]},{"name":"Dagger","desc":"","tags":[{"n":"Hand","v":null},{"n":"Coins","v":2},{"n":"Weight","v":1}]},{"name":"Shiv","desc":"","tags":[{"n":"Hand","v":null},{"n":"Coins","v":2},{"n":"Weight","v":1}]},{"name":"Throwing Dagger","desc":"","tags":[{"n":"Thrown","v":null},{"n":"Near","v":null},{"n":"Coins","v":1},{"n":"Weight","v":0}]},{"name":"Short Sword","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":8},{"n":"Weight","v":1}]},{"name":"Axe","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":8},{"n":"Weight","v":1}]},{"name":"Warhammer","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":8},{"n":"Weight","v":1}]},{"name":"Mace","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":8},{"n":"Weight","v":1}]},{"name":"Spear","desc":"","tags":[{"n":"Reach","v":null},{"n":"Thrown","v":null},{"n":"Near","v":null},{"n":"Coins","v":5},{"n":"Weight","v":1}]},{"name":"Long Sword, Battle Axe, Flail","desc":"","tags":[{"n":"Close","v":null},{"n":"Damage","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}]},{"name":"Long Sword","desc":"","tags":[{"n":"Close","v":null},{"n":"Damage","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}]},{"name":"Two Handed Sword","desc":"","tags":[{"n":"Close","v":null},{"n":"Damage","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}]},{"name":"Battle Axe","desc":"","tags":[{"n":"Close","v":null},{"n":"Damage","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}]},{"name":"Flail","desc":"","tags":[{"n":"Close","v":null},{"n":"Damage","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}]},{"name":"Halberd","desc":"","tags":[{"n":"Reach","v":null},{"n":"Damage","v":1},{"n":"Two_handed","v":null},{"n":"Coins","v":9},{"n":"Weight","v":2}]},{"name":"Rapier","desc":"","tags":[{"n":"Close","v":null},{"n":"Precise","v":null},{"n":"Coins","v":25},{"n":"Weight","v":1}]},{"name":"Dueling Rapier","desc":"","tags":[{"n":"Close","v":null},{"n":"Piercing","v":1},{"n":"Precise","v":null},{"n":"Coins","v":50},{"n":"Weight","v":2}]},{"name":"Chainmail","desc":"","tags":[{"n":"Armor","v":1},{"n":"Worn","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}]},{"name":"Scale Armor","desc":"","tags":[{"n":"Armor","v":2},{"n":"Worn","v":null},{"n":"Weight","v":3}]},{"name":"Scale Mail","desc":"","tags":[{"n":"Armor","v":2},{"n":"Worn","v":null},{"n":"Clumsy","v":null},{"n":"Coins","v":50},{"n":"Weight","v":3}]},{"name":"Plate","desc":"","tags":[{"n":"Armor","v":3},{"n":"Worn","v":null},{"n":"Clumsy","v":null},{"n":"Coins","v":350},{"n":"Weight","v":4}]},{"name":"Shield","desc":"","tags":[{"n":"Armor","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}]},{"name":"Ostentatious clothes","desc":"Clothes that are vulgar or pretentious, designed to impress attract notice.","tags":[{"n":"Weight","v":0}]},{"name":"Leather Armor","desc":"","tags":[{"n":"Armor","v":1},{"n":"Worn","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}]},{"name":"Hide Armor","desc":"","tags":[{"n":"Armor","v":1},{"n":"Weight","v":1}]},{"name":"Wooden Shield","desc":"","tags":[{"n":"Armor","v":1},{"n":"Weight","v":1}]},{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}]},{"name":"Bandages","desc":"When you have a few minutes to bandage someone else's wounds, heal them of 4 damage and expend a use.","tags":[{"n":"Uses","v":3},{"n":"Slow","v":null},{"n":"Coins","v":5},{"n":"Weight","v":0}]},{"name":"Poultices and Herbs","desc":"When you carefully treat someone's wounds with poultices and herbs, heal them of 7 damage and expend a use.","tags":[{"n":"Uses","v":2},{"n":"Slow","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}]},{"name":"Healing Potion","desc":"When you drink an entire healing potion, heal yourself of 10 damage or remove one debility, your choice.","tags":[{"n":"Coins","v":50},{"n":"Weight","v":0}]},{"name":"Keg of Dwarven Stout","desc":"When you open a keg of dwarven stout and let everyone drink freely, take +1 to your Carouse roll. If you drink a whole keg yourself, you are very, very drunk.","tags":[{"n":"Coins","v":10},{"n":"Weight","v":4}]},{"name":"Bag of Books","desc":"When your bag of books contains just the right book for the subject you're spouting lore on, consult the book, mark off a use, and take +1 to your roll.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":10},{"n":"Weight","v":2}]},{"name":"Spellbook","desc":"You have mastered several Spells and inscribed them in your spellbook. You start out with three first level Spells in your spellbook as well as the cantrips. Whenever you gain a level, you add a new spell of your level or lower to your spellbook. You spellbook is 1 weight.","tags":[{"n":"Weight","v":1}]},{"name":"Antitoxin","desc":"When you drink antitoxin, you're cured of one poison affecting you.","tags":[{"n":"Coins","v":10},{"n":"Weight","v":0}]},{"name":"Dungeon Rations","desc":"Not tasty, but not bad either.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":5},{"n":"Coins","v":3},{"n":"Weight","v":1}]},{"name":"Personal Feast","desc":"Ostentatious to say the least.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":1},{"n":"Coins","v":10},{"n":"Weight","v":1}]},{"name":"Dwarven Hardtack","desc":"Dwarves say it tastes like home. Everyone else says it tastes like home, if home is a hog farm, and on fire.","tags":[{"n":"Requires Dwarf","v":null},{"n":"Ration","v":null},{"n":"Uses","v":7},{"n":"Coins","v":3},{"n":"Weight","v":1}]},{"name":"Elven Bread","desc":"Only the greatest of elf-friends are treated to this rare delicacy.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":7},{"n":"Coins","v":10},{"n":"Weight","v":1}]},{"name":"Halfling Pipeleaf","desc":"When you share halfling pipeleaf with someone, expend two uses and take +1 forward to Parley with them.","tags":[{"n":"Uses","v":6},{"n":"Coins","v":5},{"n":"Weight","v":0}]},{"name":"Oil of Tagit","desc":"The target falls into a light sleep.","tags":[{"n":"Dangerous","v":null},{"n":"Applied","v":null},{"n":"Coins","v":15},{"n":"Weight","v":0}]},{"name":"Bloodweed","desc":"Until cured, whenever the afflicted rolls damage, they roll an additional d4 and subtract that result from their normal damage.","tags":[{"n":"Dangerous","v":null},{"n":"Touch","v":null},{"n":"Coins","v":12},{"n":"Weight","v":0}]},{"name":"Goldenroot","desc":"The target treats the next creature they see as a trusted ally, until proved otherwise.","tags":[{"n":"Dangerous","v":null},{"n":"Applied","v":null},{"n":"Coins","v":20},{"n":"Weight","v":0}]},{"name":"Serpent's Tears","desc":"Anyone dealing damage against the target rolls twice and takes the better result.","tags":[{"n":"Dangerous","v":null},{"n":"Touch","v":null},{"n":"Coins","v":10},{"n":"Weight","v":0}]},{"name":"Argo-Thaan, Holy Avenger","desc":"There are many swords in this world, but there is only one Argo-thaan. It is a blade of gold, silver and light, revered as a holy relic by all orders and religions for whom Good rings true. Its touch is a blessing and to many, the sight of it brings tears of joy.\nIn the hands of a paladin, it strikes true and strong. A paladin wielding it increases their damage die to d12 and has access to every paladin move. As well, Argo-thaan can harm any creature of Evil, regardless of any defenses it may have. No Evil creature may touch it without suffering agony. In the hands of any non-paladin, it is merely a sword, heavier and more cumbersome than most-it gains the awkward tag.\nArgo-thaan, while not intelligent, will forever be drawn to a cause of true Good, like iron to a magnet.","tags":[{"n":"Close","v":null},{"n":"Weight","v":2}]},{"name":"Arrows of Acheron","desc":"Crafted in darkness by a blind fletcher, these arrows can find their target in even the deepest darkness. An archer may fire them blind, in the dark, with his eyes bound by heavy cloth and still be assured of a clean shot. If the light of the sun ever touches the arrows, however, they come apart like shadows and dust.","tags":[{"n":"Ammo","v":1},{"n":"Weight","v":1}]},{"name":"Axe of the Conqueror-King","desc":"It is crafted of shining steel, glowing with a golden light and imbued with mythical powers of authority. When you bear the axe, you become a beacon of inspiration to all you lead. Any hirelings in your employ have +1 Loyalty, no matter the quality of your leadership.","tags":[{"n":"Close","v":null},{"n":"Weight","v":1}]},{"name":"Barb of the Black Gate","desc":"A nail or spike, twisted and forever cold, said to have been pried from the Gates of Death. When hammered into a corpse, it disappears and ensures that corpse will never be risen again-no magic short of that of Death himself can reignite the flame of life (natural or otherwise) in the body.","tags":[{"n":"Weight","v":0}]},{"name":"Bag of Holding","desc":"A bag of holding is larger on the inside than the outside, it can contain an infinite number of items, and its weight never increases. When you try to retrieve an item from a bag of holding, roll+WIS.\n* On a 10+, it's right there.\n* On a 7-9, choose one:\nYou get the exact item, but it takes a while\n\nYou get a similar item of the GM's choice, but it only takes a moment\nNo matter how many items it contains, a bag of holding is always 0 weight.","tags":[{"n":"Weight","v":0}]},{"name":"The Burning Wheel","desc":"An ancient wooden wheel, as might appear on a war-wagon, banded with steel. On a glance, it appears to be nothing special-many spokes are shattered and the thing seems mundane. Under the scrutiny of magic or the eyes of an expert, its true nature is revealed: the Burning Wheel is a gift from the God of Fire and burns with his authority.\nWhen you hold The Burning Wheel and speak a god's name, roll+CON.\n* On a 7+, the god you name takes notice and grants you an audience. An audience with a god is not without a price: on a 10+, you choose one of your stats and reduce it to the next lowest modifier (for example, a 14 is +1, so it would be reduced to 12, a +0).\n* On a 7-9, the GM chooses which stat to reduce.\nOnce used, the Burning Wheel ignites and burns with brilliant light. It does not confer any protection from those flames, nor does it provide any bonus to swimming.","tags":[{"n":"Weight","v":2}]},{"name":"Captain Bligh's Cornucopia","desc":"A brass naval horn, curled and ornate, carved with symbols of the gods of Plenty. When blown, in addition to sound, the horn spills forth food. Enough to feed a meal to everyone who hears its sound.","tags":[{"n":"Weight","v":1}]},{"name":"The Carcosan Spire","desc":"None know from whence this spear of twisted white coral comes. Those who bear it too long find their minds full of alien dreams and begin to hear the strange thoughts of the Others. None are impervious. Used against any \"natural\" target (men, goblins, owlbears and the like) the Spire acts as a mere mortal spear. Its true purpose is to do harm to those things whose strange natures protect them against mundane weapons. Used thus, the Spire can wound foes otherwise invulnerable to harm. The wielder will recognize these twisted foes on sight-the Spire knows its own.","tags":[{"n":"Reach","v":null},{"n":"Thrown","v":null},{"n":"Weight","v":3}]},{"name":"Cloak of Silent Stars","desc":"A cape of rich black velvet outside and sparkling with tiny points of light within, this cloak bends fate, time and reality around it to protect the wearer, who may Defy Danger with whatever stat they like. To do this, the wearer invokes the cloak's magic and their player describes how the cloak helps \"break the rules.\" They can deflect a fireball with CHA by convincing it they deserve to live or elude a fall by applying the mighty logic of their INT to prove the fall won't hurt. The cloak makes it so. It can be used once for each stat before losing its magic.","tags":[{"n":"Weight","v":1}]},{"name":"Coin of Remembering","desc":"What appears, at a glance, to be a simple copper coin is, in truth, an enchanted coin. Its bearer can, at any time, redeem it to know immediately one fact that has been forgotten. The coin vanishes thereafter. It does not have to be a thing forgotten by the bearer, but it cannot be \"known.\" Interpretation of this stipulation is left to the gods. If the coin is unsuccessful, it will still paint an image in the mind's eye of someone or something that does remember what was sought.","tags":[{"n":"Weight","v":0}]},{"name":"Common Scroll","desc":"A common scroll has a spell inscribed on it. The spell must be castable by you or on your class's spell list for you to be able to cast it. When you cast a spell from a scroll, the spell takes effect, simple as that.","tags":[{"n":"Use","v":1},{"n":"Weight","v":0}]},{"name":"Devilsbane Oil","desc":"A holy oil, created in limited supply by a mute sect of mountain monks whose order protected humanity from the powers of the Demon Pits in ancient epochs. Only a few jars remain. When applied to any weapon and used to strike a denizen of any outer plane, the oil undoes the magic that binds that creature. In some cases, this will return it to its home. In others, it merely undoes any magic controlling it. The oil stays on the weapon for a few hours before it dries and flakes away.\nIf applied to the edges of a doorway or drawn in a circle, the oil will repel creatures whose home is any of the outer planes. They cannot pass across it. The oil lasts for one full day before it soaks in or evaporates.","tags":[{"n":"Use","v":1},{"n":"Weight","v":0}]},{"name":"Earworm Wax","desc":"A yellowish candle. Seems never to burn out and the light it casts is strange and weak. Its wax is always cool, too. Drip the wax into the ear of a target and gain 3 hold. Spend that hold and ask your target a question. They find themselves telling you the whole truth, despite themselves. The consequences, after the fact? Those are up to you to deal with.","tags":[{"n":"Use","v":1},{"n":"Weight","v":0}]},{"name":"The Echo","desc":"A seemingly empty bottle. Once unstoppered, the whispers of another plane resound once and fall silent. In the silence, the bearer learns in his soul the coming of one great danger and how he can avoid it. At any point after you use the Echo, you can ignore the results of any single die roll-yours or another player's-and roll again. Once opened, the Echo is released and gone forever.","tags":[{"n":"Weight","v":0}]},{"name":"The Epoch Lens","desc":"An archmage, old and too frail to leave his tower, crafted this intricate and fragile device of glass and gold to examine the histories and relics he so loved. Looking at an object through the lens reveals visions of who made it and where it came from.","tags":[{"n":"Weight","v":1}]},{"name":"Farsight Stone","desc":"Swirling clouds fill this smoky orb and those in its presence often hear strange whispers. In ancient times, it was part of a network of such stones, used to communicate and surveil across great distances. When you gaze into the stone, name a location and roll+WIS.\n* On a 10+, you see a clear vision of the location and can maintain it as long as you concentrate on the orb.\n* On a 7-9, you still see the vision, but you draw the attention of some other thing (an angel, a demon, or the holder of another Farsight stone) that uses the stone to surveil you, as well.","tags":[{"n":"Weight","v":1}]},{"name":"The Fiasco Codex","desc":"A thick tome, said to be penned in the blood of poor fools and robber-barons by some demon prince possessed of dark humor, this tome details tales and stories of those whose ambition overwhelmed their reason. Reading from this tome teaches one the value of clear-headedness but leaves a sense of dread behind. When you read from the Fiasco Codex, Roll+WIS.\n* On a 10+, ask two of the questions below.\n* On a 7-9, ask one.\nWhat is my greatest opportunity, right now?\n\nWho can I betray to gain an advantage?\n\nWho is an ally I should not trust?\nThe codex gives up its answers only once to each reader and takes 2 to 3 hours to read.","tags":[{"n":"Weight","v":0}]},{"name":"Flask of Breath","desc":"A simple thing, but useful when you need a breath of fresh air. The flask appears empty but cannot be filled, anything added to it simply spills out. This is because the flask is eternally full of air. If placed underwater, it will bubble forever. If pressed to the mouth, one can breathe normally-smoke is no concern, for example. I'm sure you'll find all sorts of unusual uses for it.","tags":[{"n":"Weight","v":0}]},{"name":"Folly Held Aloft, The Wax Wings, A Huge Mistake","desc":"Who hasn't always wanted to soar the pretty blue sky? In an attempt to grant the wishes of land-bound folk, these great magical wings were created. Known by many names and crafted by as many mages, they commonly take the shape of the wings of whatever local birds hold affection. Worn by means of a harness or, in some dire cases, a surgical procedure.\nWhen you take to the air with these magical wings, roll+DEX.\n* On a 10+, your flight is controlled and you may stay aloft as long as you like.\n* On a 7-9, you make it aloft but your flight is short or erratic and unpredictable, your choice.\n* On a 6-, you make it aloft, but the coming-down part and everything between is up to the GM.","tags":[{"n":"Weight","v":1}]},{"name":"Immovable Rod","desc":"A funny metal rod with a button on it. Press the button and the rod just sticks. It freezes in place-in midair, standing up or lying down. It can't be moved. Pull it, push it, try as hard as you like, the rod stays. Maybe it can be destroyed, maybe it can't. Push the button again and it's free-take it along with you. Might be useful to have such a stubborn thing along.","tags":[{"n":"Weight","v":0}]},{"name":"Infinite Book","desc":"This book contains an infinite number of pages in a finite space. With no limit to the pages, everything that ever was, is, or will be is contained somewhere in the book. Luckily the index is great.\nWhen you Spout Lore while consulting the book you gain an extra clause: On a 12+, the GM will give a solution to a problem or situation you're in.","tags":[{"n":"Weight","v":1}]},{"name":"Inspectacles","desc":"Rough-hewn glass in wooden frames. Dinged up and barely held together, they somehow allow the wearer to see much more than their naked eyes might. When you Discern Realities wearing these gifted lenses, you get to bend the rules a little. On a roll of 10+, ask any three questions you like. They don't have to be on the list. As long as sight could give you answers, the GM will tell you what you want to know.","tags":[{"n":"Weight","v":0}]},{"name":"The Ku'meh Maneuver","desc":"A great, leathery tome worn shiny by the hands of a hundred great generals, this book is often passed from warrior to warrior, from father to son along the great battle lines that have divided Dungeon World's past. Anyone reading it may, upon finishing for the first time, roll+INT.\n* On a 10+, hold 3.\n* On a 7-9, hold 1. You may spend your hold to advise a companion on some matter of strategic or tactical significance. This advice allows you to, at any time, regardless of distance, roll to aid them on any one roll. On a miss, the GM can hold 1 and spend it to apply -2 to any roll of yours or the poor sap who listened to your advice.","tags":[{"n":"Weight","v":1}]},{"name":"Lamented Memento","desc":"Taking the form of a single lock of bright red hair, bound in a black ribbon and immune to the ravages of time, the Lamented Memento bears a grim enchantment. In it are the memories and emotions of a girl who dealt with Death at the Black Gates so many times that, in the end, they fell in love and she left the world to be with him for a time. Her memory protects the wielder. If he finds himself at the Gates, the Memento can be traded for an automatic result of 10+ on the Last Breath move.","tags":[{"n":"Weight","v":0}]},{"name":"Lodestone Shield","desc":"What mixed-up dummy made this? Shields are meant to repel metal, not draw it in! Emblazoned with a lion rampant, the Lodestone Shield has the power to pull blades and arrows to it. When you Defend against enemies using metal weapons you can spend one hold, per target, to disarm them. Also, sometimes you'll find a handful of loose change stuck to it.","tags":[{"n":"Armor","v":1},{"n":"Weight","v":1}]},{"name":"Map of the Last Patrol","desc":"An ancient order of brave rangers once patrolled the land, protecting villages and warning kings and queens of encroaching danger. They're long gone, now, but their legacy remains. This map, when marked with the blood of a group of people, will always show their location-so long as they remain within the bounds of the map.","tags":[{"n":"Weight","v":0}]},{"name":"Ned's Head","desc":"An old skull, missing its jaw and very much worse-for-wear. The skull remembers the folly of its former owner-a man with more honor than sense. Once per night, the owner of the skull can ask \"Who has it in for me?\" and the skull will give up one name in a sad, lonely voice. If the owner of the skull is ever killed, it disappears surreptitiously. No one knows where it might turn up next.","tags":[{"n":"Weight","v":1}]},{"name":"Nightsider's Key","desc":"This key unlocks any door for you, provided you don't belong where you intend to go. So long as you do nothing that would alert another to your presence (remaining unheard, unseen and unnoticed) and takes nothing more than your memories out with you, the key's magic will prevent your intrusion from ever being discovered. It's like you were never there at all.","tags":[{"n":"Weight","v":0}]},{"name":"Sacred Herbs","desc":"The sacred herbs, collected and prepared by an order of lost wizard-monks, can be found in bundles with two or three uses to them. Kept dry, they last indefinitely. When smoked in a pipe or consumed in an incense burner and the thick, blue smoke inhaled, these herbs will grant you strange visions of faraway places and distant times. If you focus your will on a particular person, place or thing, the herbs will respond: roll+WIS.\n* On a 10+, the vision is clear and useful-yielding some valid information.\n* On a 7-9, the vision is about the thing desired, but is unclear, fraught with metaphor or somehow difficult to understand.\n* On a miss, the GM will ask you, \"What is it you fear most?\" You must answer honestly, of course.","tags":[{"n":"Weight","v":0}]},{"name":"The Sartar Duck","desc":"An odd, hand-carved wooden duck. Who would make such a funny thing? While you bear it, you find yourself an exceptionally gifted storyteller-no matter the language, you can make yourself and your story clear to any audience. They will understand your meaning, if not your words.","tags":[{"n":"Weight","v":0}]},{"name":"Tears of Annalise","desc":"Cloudy red gemstones the size of a thumbnail, the Tears of Annalise are always found in pairs. When swallowed by two different people, they bind the swallowers together-when either feels strong emotions (particularly sadness, loss, fear or desire) the other feels it, as well. The effects last until one spills the blood of the other.","tags":[{"n":"Weight","v":0}]},{"name":"Teleportation Room","desc":"James Ninefingers, eccentric genius mage, created these room-sized magical apparati. A stone chamber etched with runes and scribblings, glowing with a faint blue light. When you enter and say aloud the name of a location, roll+INT.\n* On a 10+, you arrive exactly where you'd intended.\n* On a 7-9, the GM chooses a safe location nearby.\n* On a miss, you end up someplace. Maybe it's nearby? It's definitely not safe. Strange things sometimes happen to those who bend time and space with these devices.","tags":[{"n":"Slow","v":null}]},{"name":"Timunn's Armor","desc":"A stealthy suit of armor, it appears as many things to many people and blends in with appropriate apparel. The wearer always seems the height of fashion to any who gaze upon him.","tags":[{"n":"Armor","v":1},{"n":"Weight","v":1}]},{"name":"Titus' Truthful Tallow","desc":"A candle of ivory- and copper-colored tallow with a wick of spun silver. When lit, none upon whom its light falls is able to tell a lie. They may keep silent or dissemble but when asked a question directly, they can speak naught but truth.","tags":[{"n":"Weight","v":0}]},{"name":"Tricksy Rope","desc":"A rope that listens. Does tricks, too, like a smart and more obedient snake might. Tell it \"Coil\" or \"Slack\" or \"Come here, rope\" and it will.","tags":[{"n":"Weight","v":1}]},{"name":"The Sterling Hand","desc":"Crafted by dwarven whitesmiths, this mirrored-metal hand is deeply scored with runes of power and rejuvenation. Meant to replace wounded or destroyed limbs from mining accidents, the Sterling Hand bonds to the wound, old or new, and is strong and stout. It can be used as a weapon (Near range) and is made of pure enough silver to harm creatures affected by such.","tags":[{"n":"Weight","v":0}]},{"name":"Vellius's Gauntlets","desc":"Crafted in the name of Vellius the Clumsy, Vellius the Butter-Fingered, Vellius the Clod, these gloves of simple cloth prevent you from dropping any object you don't intent to. You cannot be disarmed and will not fall from any rope or ladder, for example. This item can get very messy if you have something strong pulling at your legs while you grip onto something solid.","tags":[{"n":"Weight","v":1}]},{"name":"Violation Glaive","desc":"A legendary blade, said to have been thrust backwards in time from some grim future, the violation glaive is crafted of strange green iron. The blade strikes at the mind of those it wounds, as well as the body. When you Hack & Slash on a 10+ you have an additional option: you can deal your normal damage, let them counterattack you, and instill the emotion of your choice (maybe fear, reverence, or trust).","tags":[{"n":"Reach","v":null},{"n":"Weight","v":2}]},{"name":"Vorpal Sword","desc":"Snicker-snack and all that. Sharp as anything, this simple-seeming sword means to separate one thing from another-the limb from the body or folk from their lives. When you deal damage with the Vorpal Sword, your enemy must choose something (an item, an advantage, a limb) and lose it, permanently.","tags":[{"n":"Close","v":null},{"n":"Piercing","v":3},{"n":"Weight","v":2}]}]}}</script>
<script>
/* ================= RULES ENGINE (no DOM) ================= */
const STATS=['STR','DEX','CON','INT','WIS','CHA'];
const DEB={STR:'Weak',DEX:'Shaky',CON:'Sick',INT:'Stunned',WIS:'Confused',CHA:'Scarred'};
const STATNAME={STR:'Strength',DEX:'Dexterity',CON:'Constitution',INT:'Intelligence',WIS:'Wisdom',CHA:'Charisma'};
const DICE=['d4','d6','d8','d10','d12'];
const scoreMod=s=>{s=+s||0;return s<=3?-3:s<=5?-2:s<=8?-1:s<=12?0:s<=15?1:s<=17?2:3};
const sgn=n=>(n>=0?'+':'−')+Math.abs(n);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const normName=s=>String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/&/g,'and').replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const stepDie=(d,n)=>DICE[Math.max(0,Math.min(DICE.length-1,DICE.indexOf(d)+n))]||d;

/* Archetype rules, from Class Warfare pp. 38–41, 106–109, 216–219, 330–333, 402–405 */
const ARCH={
  Adventurer:{dmg:'d6',load:7,hp:6,bonds:5,page:38,pen:{Magician:{dmg:-1}},other:{early:1,late:2},blurb:'Jack of all trades, master of none.'},
  Disciple:{dmg:'d6',load:9,hp:8,bonds:4,page:106,pen:{Magician:{dmg:-1,hp:-2},Rogue:{hp:-2},Adventurer:{hp:-2},Warrior:{}},other:{early:0,late:2},blurb:'Devotion to a calling, a deity, a mission or a philosophy.'},
  Magician:{dmg:'d4',load:6,hp:6,bonds:3,page:216,pen:{},other:{early:1,late:1},blurb:'Handles sources of power no one else would touch.'},
  Rogue:{dmg:'d8',load:8,hp:6,bonds:4,page:330,pen:{Warrior:{},Adventurer:{dmg:-1},Disciple:{dmg:-1},Magician:{dmg:-1}},other:{early:1,late:2},blurb:'Experts in deceit: stealing, lying, staying out of sight.'},
  Warrior:{dmg:'d10',load:10,hp:10,bonds:4,page:402,pen:{Disciple:{dmg:-1},Magician:{dmg:-1,hp:-2},Rogue:{hp:-2},Adventurer:'choice'},other:{early:1,late:1},blurb:'Fighting is their business, and war is their way.'}
};
const ARCH_ORDER=['Warrior','Rogue','Disciple','Magician','Adventurer'];

/* ---------- data access (DATA injected at build) ---------- */
let SPEC_BY={}, ALL_CW_MOVES=[], DW_CLASS=null, CW_ARCH_DATA={}, ALL_SPELLS=[];
function initData(D){
  DW_CLASS=D.dw.classes;
  SPEC_BY={}; D.cw.specs.forEach(s=>SPEC_BY[s.name]=s);
  CW_ARCH_DATA=D.cw.arch;
  ALL_CW_MOVES=[]; D.cw.specs.forEach(s=>[...s.starting.map(m=>({...m,tier:0})),...s.advanced].forEach(m=>ALL_CW_MOVES.push({...m,spec:s.name,arch:s.archetype})));
  ALL_SPELLS=[];
  Object.entries(D.dw.spells).forEach(([cls,l])=>l.forEach(s=>ALL_SPELLS.push({...s,list:cls,book:'DW'})));
  D.cw.spells.holy.forEach(g=>g.spells.forEach(s=>ALL_SPELLS.push({...s,list:g.name,kind:'sphere',book:'CW'})));
  D.cw.spells.magic.forEach(g=>g.spells.forEach(s=>ALL_SPELLS.push({...s,list:g.name,kind:'school',book:'CW'})));
}

/* ---------- derived character values ---------- */
function cwBase(c){
  const A=ARCH[c.cw.archetype]; if(!A) return {dmg:'d6',hp:6,load:7,notes:[]};
  let dmg=0,hp=0,load=0;const notes=[];
  const start=c.cw.specs.filter(s=>s.how!=='compendium');
  const outsiders=start.filter(s=>SPEC_BY[s.name]&&SPEC_BY[s.name].archetype!==c.cw.archetype);
  outsiders.forEach(s=>{
    const oa=SPEC_BY[s.name].archetype; let p=A.pen[oa];
    if(p==='choice') p=c.cw.penaltyChoice==='hp'?{hp:-2}:{dmg:-1};
    if(p&&(p.dmg||p.hp)){dmg+=p.dmg||0;hp+=p.hp||0;notes.push(`${oa} specialty: ${[p.dmg?'damage die −1 size':'',p.hp?'max HP −2':''].filter(Boolean).join(', ')}`)}
  });
  start.forEach(s=>{const m=SPEC_BY[s.name]&&SPEC_BY[s.name].mods||{};
    if(m.dmg){dmg+=m.dmg;notes.push(`${s.name}: damage die ${m.dmg>0?'+1':'−1'} size`)}
    if(m.hp){hp+=m.hp;notes.push(`${s.name}: max HP ${sgn(m.hp)}`)}
    if(m.load){load+=m.load;notes.push(`${s.name}: load +${m.load}`)}});
  return {dmg:stepDie(A.dmg,dmg),hp:A.hp+hp,load:A.load+load,notes};
}
function base(c){
  if(c.kind==='core'&&DW_CLASS[c.cls]){const k=DW_CLASS[c.cls];return {dmg:k.dmg,hp:k.hp,load:k.load,notes:[]}}
  if(c.kind==='cw') return cwBase(c);
  return {dmg:c.custom.dmg||'d6',hp:+c.custom.hp||0,load:+c.custom.load||0,notes:[]};
}
const hasMove=(c,name)=>c.moves.some(m=>normName(m.name)===normName(name));
const statMod=(c,s)=>scoreMod(c.stats[s])-(c.deb[s]?1:0);
function maxHp(c){
  const con=+c.stats.CON||0;let v=base(c).hp+con+(+c.hpAdj||0);
  if(c.kind==='cw') v=Math.max(v,4+con);
  return v;
}
function itemTags(i){return (i.tags||[]).map(t=>String(t).toLowerCase().trim())}
function tagNum(i,re){for(const t of itemTags(i)){const m=t.match(re);if(m)return +m[1]}return 0}
const isShield=i=>/shield/i.test(i.n)||itemTags(i).some(t=>/^\+\d+ armou?r$/.test(t));
const itemArmor=i=>tagNum(i,/^\+?(\d+) armou?r$/);
const isWeapon=i=>itemTags(i).some(t=>/^(hand|close|reach|near|far|thrown|precise)$/.test(t)||/damage$|piercing$/.test(t));
function armorInfo(c){
  const eq=c.items.filter(i=>i.eq);
  const body=Math.max(0,...eq.filter(i=>!isShield(i)).map(itemArmor));
  const plus=eq.filter(isShield).reduce((a,i)=>a+itemArmor(i),0);
  const moveBonus=movesArmorBonus(c);
  const total=body+plus+moveBonus.total+(+c.armorAdj||0);
  const clumsy=eq.filter(i=>itemTags(i).includes('clumsy')).length;
  const ignoresClumsy=c.moves.some(m=>/ignore the clumsy tag/i.test(m.text));
  return {body,plus,moveBonus,total,clumsy:ignoresClumsy?0:clumsy,clumsyIgnored:ignoresClumsy&&clumsy>0};
}
/* armor and damage bonuses read from move text */
function moveBonuses(c){
  const names=new Set(c.moves.map(m=>normName(m.name)));

const CLUMSY=/^(scale|plate)/i;
function itemFromSrd(it,amount){
  const tags=[];let w=0,u=null,cost=null;
  (it.tags||[]).forEach(t=>{const n=String(t.n||t.name).replace('_','-').toLowerCase();const v=t.v??t.value;
    if(n==='weight')w=+v||0;

/* "Duelling rapier (close, precise, 2 weight)" -> item(s) */
function parseItems(str){
  const out=[];const s=String(str).replace(/\s+/g,' ');
  const re=/([A-Z0-9a-z][^(),.;:]*?)\s*\(([^)]*)\)/g;let m;let found=false;
  while((m=re.exec(s))){found=true;
    let name=m[1].replace(/^(and|or|a|an|some|your|with)\s+/i,'').replace(/^.*\b(and|choose one|choose two|a|an)\s+/i,'').trim();
    name=name.charAt(0).toUpperCase()+name.slice(1);
    const tags=m[2].split(',').map(x=>x.trim().replace(/armour/i,'armor')).filter(Boolean);
    let w=0,u=null;const keep=[];
    tags.forEach(t=>{let k;if((k=t.match(/^(\d+) weight$/i)))w=+k[1];else{if((k=t.match(/^(\d+) (uses|ammo)$/i)))u=+k[1];keep.push(t.toLowerCase())}});
    if(CLUMSY.test(name)&&!keep.includes('clumsy'))keep.push('clumsy');
    if(/armor$/i.test(name)&&!keep.includes('worn')&&keep.some(t=>/^\d+ armor$/.test(t)))keep.push('worn');
    out.push({id:uid(),n:name,w,u,um:u,tags:keep,desc:'',eq:false});
  }
  if(!found&&s.trim()){const t=s.trim().replace(/\.$/,'');let w=0;const mm=t.match(/\s(\d+)\s*$/);let n=t;if(mm){w=+mm[1];n=t.slice(0,mm.index)}out.push({id:uid(),n,w,u:null,um:null,tags:[],desc:'',eq:false})}

}

function migrate(c){
  if(c.v===2)return c;
  const n=Object.assign(blankChar(),c,{v:2});
  n.custom=n.custom||{name:'',dmg:'d6',hp:6,load:9};
  const oldCw=c.cw||{};
  if(c.kind==='cw'){
    const specs=(oldCw.specs||[]).filter(s=>SPEC_BY[s.name]);
    if(ARCH[oldCw.archetype]){
      n.cw={archetype:oldCw.archetype,specs:specs.map(s=>({name:s.name,how:'start',origin:''})),borrow:{same:0,early:0,late:0},penaltyChoice:'dmg'};
    }else{
      n.kind='custom';n.custom={name:oldCw.archetype||'Custom class',dmg:oldCw.dmg||'d6',hp:+oldCw.hp||0,load:+oldCw.load||0};
      n.cw={archetype:'',specs:specs.map(s=>({name:s.name,how:'compendium',origin:''})),borrow:{}};
    }
    n.moves=(c.moves||[]).map(m=>{const sp=(oldCw.specs||[]).find(s=>s.id===m.src);return {...m,src:sp?'spec:'+sp.name:(m.src==='class'?'custom':m.src)}});
  }else n.cw={archetype:'',specs:[],borrow:{},penaltyChoice:'dmg'};
  n.spells=[];
  n.moves=(n.moves||[]).filter(m=>{
    if(m.src==='spell'){const lv=(m.text.match(/\*\*(Cantrip|Rote|Level (\d))\*\*/i)||[]);
      n.spells.push({id:uid(),name:m.name.replace(/ ✦$/,''),level:lv[2]||(lv[1]||'1').toLowerCase(),text:m.text.replace(/^\*\*[^*]+\*\*[^\n]*\n?/,''),ongoing:/ongoing/i.test(m.text),prepared:/✦/.test(m.name),known:true});return false}
    return true;
  });
  if(c.kind==='core'&&DW_CLASS[c.cls]) n.moves.forEach(m=>{const d=DW_CLASS[c.cls].moves.find(x=>normName(x.name)===normName(m.name));if(d){m.page=d.page;m.book='DW';m.tier=d.tier;if(d.replaces)m.replaces=d.replaces}});
  const al=String(c.alignment||'').split(':');n.alignment=al[0].trim();n.alignText=(al[1]||'').trim();
  n.items=(c.items||[]).map(i=>{const p=parseItems(i.n)[0]||{};return {id:i.id||uid(),n:p.n||i.n,w:+i.w||0,u:i.u??null,um:i.um??null,tags:i.tags||p.tags||[],desc:i.desc||'',eq:!!i.eq}});
  n.hpAdj=c.hpAdj||0;n.loadAdj=c.loadAdj||0;
  return n;
}

/* ---------- storage: per-player cloud docs when published, browser otherwise ---------- */
const Store={mode:'connecting',db:null,uid:null,timers:{},inflight:{},again:{},localOk:true,moved:0,
  async init(){
    this.localOk=(()=>{try{localStorage.setItem('torchlight.t','1');const ok=localStorage.getItem('torchlight.t')==='1';localStorage.removeItem('torchlight.t');return ok}catch(e){return false}})();
    try{if(window.claude&&claude.use){const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(db&&user){const id=await user.id();if(id){this.db=db;this.uid=id;this.mode='cloud';return}}}}catch(e){}
    this.mode=this.localOk?'local':'none';
  },
  col(){return this.db.collection('data/users/'+this.uid)},
  readLocal(){try{return JSON.parse(localStorage.getItem('torchlight.chars')||'[]')}catch(e){return []}},
  writeLocal(without){if(!this.localOk)return false;try{localStorage.setItem('torchlight.chars',JSON.stringify(S.chars.filter(x=>!x.example&&x.id!==without)));return true}catch(e){return false}},
  async list(){
    if(this.mode==='cloud'){
      // the store hands back frozen snapshots; copy them so edits stick
      const s=await this.col().get();
      const all=s.docs.map(d=>{try{return JSON.parse(JSON.stringify(d.data()))}catch(e){return null}});
      this.meta=all.find(d=>d&&d.kind==='meta')||{};
      const cloud=all.filter(d=>d&&d.id&&d.kind!=='meta');
      // characters that fell back to this browser earlier: bring them into the account
      const local=this.localOk?this.readLocal():[];
      local.forEach(l=>{const i=cloud.findIndex(c=>c.id===l.id);
        if(i<0){cloud.push(l);this.moved++;this.queueRaw(l)}
        else if((l.updatedAt||0)>(cloud[i].updatedAt||0)){cloud[i]=l;this.moved++;this.queueRaw(l)}});
      // they now live in the account; clear the browser copy so they can't be copied into someone else's account on a shared device
      if(local.length){try{localStorage.setItem('torchlight.chars.moved',localStorage.getItem('torchlight.chars'));localStorage.removeItem('torchlight.chars')}catch(e){}}
      return cloud;
    }
    return this.readLocal();
  },
  meta:{},
  getFlag(k){if(this.mode==='cloud')return !!this.meta[k];try{return !!JSON.parse(localStorage.getItem('torchlight.flags')||'{}')[k]}catch(e){return false}},
  async setFlag(k){
    if(this.mode==='cloud'){this.meta={...this.meta,[k]:true};try{await this.col().doc('meta').set({kind:'meta',...this.meta})}catch(e){}return}
    try{const f=JSON.parse(localStorage.getItem('torchlight.flags')||'{}');f[k]=true;localStorage.setItem('torchlight.flags',JSON.stringify(f))}catch(e){}
  },
  queueRaw(c){setTimeout(()=>this.write(c),300)},
  queue(c){if(c.example)return;clearTimeout(this.timers[c.id]);setStatus('pending');this.timers[c.id]=setTimeout(()=>this.write(c),700)},
  async write(c){
    const live=S.chars.find(x=>x.id===c.id)||c;
    if(this.inflight[c.id]){this.again[c.id]=true;return}   // one write at a time per character
    live.updatedAt=Date.now();const body=JSON.parse(JSON.stringify(live));
    if(this.mode==='cloud'){
      this.inflight[c.id]=true;
      try{await this.col().doc(c.id).set(body);this.fails=0}
      catch(e){
        const code=e&&e.code;
        this.fails=(this.fails||0)+1;
        if(code==='unavailable'||code==='resource_exhausted'||(!code&&this.fails<4)){this.again[c.id]=true;await new Promise(r=>setTimeout(r,1200+Math.random()*1500))}
        else if(code==='quota_exceeded'){toastInfo("Your account's storage for this page is full. Delete a character you don't need, or back up and remove old ones.")}
        else{this.mode=this.localOk?'local':'none';this.writeLocal();
          toastInfo(code==='invalid_argument'?"You can view this page but not save to it. Ask the owner to share it with you as a Contributor. For now your characters are kept in this browser.":"Couldn't save to your account, so this browser is keeping your characters for now.")}
      }
      finally{this.inflight[c.id]=false}
      if(this.again[c.id]){this.again[c.id]=false;return this.write(c)}
      setStatus();return;
    }
    if(!this.writeLocal()&&this.mode!=='none'){this.mode='none';toastInfo("This browser won't let the page save. Use Manage → Back up all characters to keep your work.")}
    setStatus();
  },
  async remove(id){
    clearTimeout(this.timers[id]);
    if(this.mode==='cloud'){try{await this.col().doc(id).delete()}catch(e){}}
    else this.writeLocal(id);
  }
};

  el.className='status '+cls;el.querySelector('span').textContent=txt;

const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function hl(s){const t=esc(s);if(!S.q)return t;const q=S.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return t.replace(new RegExp('('+esc(q)+')','gi'),'<mark>$1</mark>')}
const TIER_RE=/(✴?\s*On an? (?:12\+|10\+|7[-–]9|6[-−]|miss|hit)|(?:^|\s)(?:12\+|10\+|7[-–]9)(?=:))/gi;
function tierClass(x){return /12\+/.test(x)?'t-12':/10\+|hit/i.test(x)?'t-hit':/7/.test(x)?'t-weak':'t-miss'}
function md(text,{q=true}={}){
  const lines=String(text||'').replace(/✴/g,'').split('\n');let out='',ul=false;
  for(const L of lines){
    const isLi=/^\s*[-*•○]\s+/.test(L);
    if(isLi&&!ul){out+='<ul>';ul=true} if(!isLi&&ul){out+='</ul>';ul=false}
    if(!L.trim())continue;
    let h=(q?hl:esc)(isLi?L.replace(/^\s*[-*•○]\s+/,''):L)
      .replace(/\*\*(.+?)\*\*/g,(m,x)=>`<b>${x}</b>`)
      .replace(TIER_RE,m=>`<b class="tier ${tierClass(m)}">${m}</b>`);
    out+=isLi?`<li>${h}</li>`:`<p>${h}</p>`;
  }
  if(ul)out+='</ul>';return out;
}

function srcGroup(c,m){
  if(m.src==='class')return c.kind==='core'?c.cls+' moves':'Class moves';

  if(m.src==='race')return 'Race';
  if(m.src==='multiclass')return 'Multiclass';
  return 'Your moves';
}
function allMoveEntries(c){
  const mine=c.moves.map(m=>({...m,group:srcGroup(c,m),mine:true}));
  return [...mine,...BASIC.map(m=>({...m,id:'b:'+m.name,group:'Basic moves',book:'DW'})),...SPECIAL.map(m=>({...m,id:'s:'+m.name,group:'Special moves',book:'DW'}))];
}
function rollBtns(c,m){
  let stat=m.stat;
  if(!stat){const mm=(m.text||'').match(/roll\s*\+\s*(STR|DEX|CON|INT|WIS|CHA|Str|Dex|Con|Int|Wis|Cha|nothing|bond|loyalty)/);if(mm)stat=mm[1].toUpperCase()}
  if(!stat)return '';
  if(stat==='NOTHING')stat='NONE';

function renderMoves(c){
  const recon=reconcileSuggestions(c);
  const entries=allMoveEntries(c);
  const specNames=(c.cw&&c.cw.specs||[]).map(s=>s.name).filter(n=>SPEC_BY[n]);
  const groups=[...new Set(entries.map(e=>e.group))];
  specNames.forEach(n=>{if(!groups.includes(n))groups.splice(Math.max(0,groups.indexOf('Basic moves')),0,n)});
  const q=S.q.toLowerCase();
  const pass=e=>(S.filter==='all'||(S.filter==='mine'&&e.mine)||e.group===S.filter)&&(!q||e.name.toLowerCase().includes(q)||(e.text||'').toLowerCase().includes(q));
  const shown=entries.filter(pass);
  const count=g=>entries.filter(e=>e.group===g).length;
  return `${recon.length?`<div class="banner" style="margin:0 0 12px"><span><b>${recon.length} move${recon.length>1?'s':''} may belong to another class.</b> ${recon.slice(0,3).map(s=>esc(s.move.name)).join(', ')}${recon.length>3?'…':''} match ${[...new Set(recon.map(s=>s.pick.type==='spec'?s.pick.spec:s.pick.cls))].slice(0,3).map(esc).join(', ')} by name.</span><button class="btn pri sm" data-act="reconcile">Review and file them</button></div>`:''}

        <input id="q" type="search" placeholder="Search moves and rules text" value="${esc(S.q)}" aria-label="Search moves"><kbd>/</kbd></label>
      <button class="btn" data-act="expand">${Object.values(S.open).some(Boolean)?'Collapse all':'Expand all'}</button>
    </div>
    <div class="chips" role="group" aria-label="Filter moves">
      <button class="fchip" data-act="filter" data-f="all" aria-pressed="${S.filter==='all'}">All</button>
      <button class="fchip" data-act="filter" data-f="mine" aria-pressed="${S.filter==='mine'}">Mine<span class="n">${c.moves.length}</span></button>
      ${groups.map(g=>`<button class="fchip" data-act="filter" data-f="${esc(g)}" aria-pressed="${S.filter===g}">${esc(g)}<span class="n">${count(g)}</span></button>`).join('')}
    </div>
    ${groups.map(g=>{const list=shown.filter(e=>e.group===g);const isSpec=specNames.includes(g)&&(S.filter==='all'||S.filter===g||S.filter==='mine')&&!q;
      if(!list.length&&!isSpec)return '';
      const borrowedOf=/ \(borrowed\)$/.test(g)?g.replace(/ \(borrowed\)$/,''):null;
      const specOf=specNames.includes(g)?g:borrowedOf&&SPEC_BY[borrowedOf]?borrowedOf:null;
      return `<div class="mgroup ${S.flash===g?'flash':''}" id="grp-${slug(g)}"><h3>${esc(g)}${isSpec?`<span class="ref">${specHow(c,g)}</span>`:''}${borrowedOf?`<span class="ref">Moves taken when levelling up · CW p.${SPEC_BY[borrowedOf]?SPEC_BY[borrowedOf].page:'?'}</span>`:''}${specOf?`<button class="btn sm ghost" data-act="specstatus" data-spec="${esc(specOf)}" title="Starting specialty, compendium class, or borrowed moves">Change</button>`:''}</h3><div class="mlist">${list.map(e=>moveCard(c,e)).join('')}</div>${isSpec?specAdvanced(c,g):''}</div>`}).join('')||`<p class="empty">No moves match “${esc(S.q)}”.</p>`}
    <div style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px">
      <button class="btn" data-act="addmove">+ Write a custom move</button>
      <button class="btn" data-act="browse">Browse all moves</button>
      <button class="btn" data-act="compendium">+ Add a compendium class</button>

}
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-');
function specHow(c,name){const s=c.cw.specs.find(x=>x.name===name);const d=SPEC_BY[name];return `${s&&s.how==='compendium'?'Compendium class':'Starting specialty'} · ${esc(d.archetype)} · CW p.${d.page}`}
function specAdvanced(c,name){
  const d=SPEC_BY[name];const L=+c.level||1;
  const owned=new Set(c.moves.map(m=>normName(m.name)));
  const list=d.advanced.filter(m=>!owned.has(normName(m.name)));
  if(!list.length)return '<p class="hint" style="margin:6px 0 0">You have every move from this one.</p>';
  const open=!!S.openAdv[name];
  return `<details class="advlist" ${open?'open':''} data-adv="${esc(name)}"><summary><span>Advanced moves you can take from ${esc(name)}</span><span class="pill">${list.length}</span></summary>
    <p class="hint" style="margin:4px 0 8px">Pick one of these when you level up. ${L<5?'Moves marked 6–10 open at level 6.':''}</p>
    <div class="optlist">${list.map(m=>{const met=reqsMet(c,m);const tierOk=m.tier===2||L>=5;
      return `<div class="lopt ${met&&tierOk?'':'unmet'}"><div class="h"><b>${esc(m.name)}</b><span class="ref">${m.tier===6?'levels 6–10':'levels 2–5'} · CW p.${m.page}</span>
        ${m.requires?`<span class="hint" style="font-size:.78rem">${met?'✓':'✗'} Requires ${esc(m.requires.join(', ').replace(/\|/g,' or '))}</span>`:''}${m.replaces?`<span class="hint" style="font-size:.78rem">Replaces ${esc(m.replaces.join(', '))}</span>`:''}
        <span class="spacer"></span><button class="btn sm ghost" data-act="takemove" data-spec="${esc(name)}" data-name="${esc(m.name)}" title="Skips the level-up rules">Add now</button></div>
        <div class="txt">${md(m.text,{q:false})}</div></div>`}).join('')}</div></details>`;
}

/* ---------- spells tab ---------- */
function spellSourcesDefault(c){
  if(c.spellSources&&c.spellSources.length)return c.spellSources;
  const out=[];
  if(c.kind==='core'&&(c.cls==='Wizard'||c.cls==='Cleric'))out.push(c.cls);
  (c.spheres||[]).forEach(s=>out.push(s));
  return out;
}
function renderSpells(c){
  const cast=casting(c),bud=spellBudget(c);

  const pen=castPenalty(c);
  const L=+c.level||1;
  const prepWord=cast&&cast.mode==='commune'?'Commune':'Prepare spells';
  const over=bud&&(bud.used>bud.max||(bud.countMax&&bud.count>bud.countMax));
  return `<div class="budget">
      ${cast?`<span class="chip acc">${esc(cast.label)} · cast with ${cast.stat}</span>`:''}
      ${bud?`<span class="pill ${over?'bad':'ok'}">${bud.mode==='vancian'?`${bud.count}/${bud.countMax} spells · `:''}${bud.used}/${bud.max} ${bud.unit} prepared</span>`:''}
      ${pen?`<span class="pill warn">−${pen} to cast</span>`:''}
      <span class="spacer"></span>
      <button class="btn sm" data-act="spellrest">${prepWord}</button>
      <button class="btn sm pri" data-act="spelladd">${cast&&cast.mode==='commune'?'Choose granted spells':'Add to spellbook'}</button>
    </div>
    <p class="hint" style="margin:0 0 8px">${cast&&cast.mode==='vancian'?`Memorize up to ${L+2} spells with total magnitude up to ${L+1}. Magnitude is half the spell's level, rounded up. Cantrips are free.`:
      cast&&cast.mode==='commune'?`Commune to be granted spells with total level up to ${L+1}, none above level ${L}. Rotes are always granted.`:
      `Prepare spells with total level up to ${L+1}, none above level ${L}. Cantrips are always prepared. Gain a new spell for your book each level.`}
      Sources: ${spellSourcesDefault(c).map(esc).join(', ')||'none yet'} <button class="btn sm ghost" data-act="spellsrc">Change</button></p>
    ${list.length?list.map(s=>{const free=isFree(s);const prep=free||s.prepared;const open=S.openSpell[s.id];
      return `<div class="spell ${prep?'prep':''} ${s.forgotten?'gone':''} ${open?'open':''}">
        <span class="lv">${levelLabel(s.level)}</span>
        <div style="min-width:0"><button class="t" style="border:0;background:none;padding:0;text-align:left" data-act="spellopen" data-id="${s.id}"><span class="nm">${esc(s.name)}</span></button>
          <div class="st">${[s.ongoing?'Ongoing':'',s.list?esc(s.list):'',s.page?`${s.book||''} p.${s.page}`:'',s.forgotten?(cast&&cast.mode==='commune'?'Revoked':'Forgotten'):'',s.active?'In effect':''].filter(Boolean).join(' · ')}</div>
          <div class="body">${md(s.text,{q:false})}</div></div>
        <div class="acts">
          ${free?'':`<button class="btn sm ${s.prepared?'pri':''}" data-act="spellprep" data-id="${s.id}" aria-pressed="${!!s.prepared}">${s.prepared?'Prepared':'Prepare'}</button>`}
          ${prep&&!s.forgotten?`<button class="rollb" data-act="cast" data-id="${s.id}">Cast</button>`:''}
          ${s.ongoing&&prep?`<button class="btn sm ${s.active?'pri':''}" data-act="spellactive" data-id="${s.id}">${s.active?'End':'Active'}</button>`:''}
          <button class="x" data-act="spelldel" data-id="${s.id}" aria-label="Remove ${esc(s.name)}">×</button>
        </div></div>`}).join(''):`<p class="empty">No spells yet. ${cast&&cast.mode==='commune'?'Choose the spells your deity grants you.':'Add spells to your spellbook to get started.'}</p>`}`;
}

function extraSuggestions(c){
  const out=[];const has=t=>c.extras.some(x=>x.type===t);

/* derived values update in place so typing never loses focus */
function dmgExpr(c){const parts=damageParts(c).filter(p=>p.on);return parts.map((p,i)=>i?p.expr:p.expr).join('').replace(/\+\+/g,'+')}
function refresh(){
  const c=cur();if(!c)return;
  const hpM=maxHp(c),li=loadInfo(c),need=xpNeed(c),ai=armorInfo(c);
  const vals={hp:c.hp,hpMax:hpM,xp:c.xp,xpNeed:need,loadCur:li.cur,loadMax:li.max,armor:ai.total,dmgExpr:dmgExpr(c)};
  STATS.forEach(s=>vals['mod-'+s]=sgn(statMod(c,s)));
  document.querySelectorAll('[data-d]').forEach(el=>{
    const k=el.dataset.d;
    if(k in vals)el.textContent=vals[k];
    else if(k==='hpBar')el.style.width=Math.max(0,Math.min(100,c.hp/(hpM||1)*100))+'%';
    else if(k==='xpBar')el.style.width=Math.min(100,c.xp/need*100)+'%';
    else if(k==='lvlBtn'){const ok=c.xp>=need;el.classList.toggle('ready',ok);el.style.opacity=ok?1:.6;el.textContent=ok?'Level up available':'Level up at '+need+' XP'}
    else if(k==='loadPill'){const st=li.cur<=li.max?['ok','OK']:li.cur<=li.max+2?['warn','−1 to moves']:['bad','Overloaded'];el.className='pill '+st[0];el.textContent=st[1]}
    else if(k==='armorLine'){
      const bits=[];if(ai.body)bits.push(`Armor <b>${ai.body}</b>`);if(ai.plus)bits.push(`Shield <b>+${ai.plus}</b>`);
      ai.moveBonus.list.forEach(b=>bits.push(b.cond==='always'?`${esc(b.src)} <b>+${b.val}</b>`:`<label title="${esc(b.why||'While on a quest')}" style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" data-act="${b.cond==='quest'?'quest':'dmgtoggle'}" data-key="${esc(b.key)}" ${bonusOn(c,b)?'checked':''}>${esc(b.src)} <b>+${b.val}</b></label>`));
      bits.push(`Other <input data-bind="armorAdj" data-num value="${c.armorAdj||0}" style="width:3.5ch;border:1px solid var(--line);background:var(--bg);border-radius:5px;text-align:center" aria-label="Other armor bonus" id="f-armoradj">`);
      if(ai.clumsy)bits.push(`<span class="pill warn">Clumsy −${ai.clumsy} ongoing</span>`);
      if(ai.clumsyIgnored)bits.push('<span class="pill ok">Clumsy ignored</span>');
      if(!el.contains(document.activeElement))el.innerHTML=bits.join(' · ');
    }
  });
}

/* ================= ACTIONS ================= */
function touch(c,{full=false}={}){if(c.example){c.example=false;renderBanner();renderTop()}Store.queue(c);full?renderAll():refresh()}
function setPath(c,path,v){
  const p=path.split('.');let o=c;
  for(let i=0;i<p.length-1;i++){const k=p[i];o=Array.isArray(o)?o.find(x=>x.id===k):o[k];if(!o)return}
  const last=p[p.length-1];if(Array.isArray(o))return;o[last]=v;
}
const d6=()=>1+Math.floor(Math.random()*6);
function roll(what,stat,{extraMod=0,extraLabel='',onResult}={}){
  const c=cur();if(!c)return;
  const a=d6(),b=d6();const parts=[];let mod=0;
  if(STATS.includes(stat)){const m=statMod(c,stat);mod+=m;parts.push(`${stat} ${sgn(m)}`+(c.deb[stat]?' (incl. '+DEB[stat].toLowerCase()+')':''))}
  if(extraMod){mod+=extraMod;parts.push(`${extraLabel} ${sgn(extraMod)}`)}
  if(+c.ongoing){mod+=+c.ongoing;parts.push('ongoing '+sgn(+c.ongoing))}
  const ai=armorInfo(c);if(ai.clumsy){mod-=ai.clumsy;parts.push('clumsy −'+ai.clumsy)}
  const li=loadInfo(c);if(li.cur>li.max){const p=li.cur<=li.max+2?1:1;mod-=p;parts.push('encumbered −1')}
  if(+c.forward){mod+=+c.forward;parts.push('forward '+sgn(+c.forward));c.forward=0;const f=document.getElementById('f-fwd');if(f)f.value=0}
  if(S.sit){mod+=S.sit;parts.push((stat==='BOND'?'bond ':'situational ')+sgn(S.sit));S.sit=0;renderTop()}
  const total=a+b+mod;
  const twelve=total>=12;
  const [cls,tier,short]=total>=10?['t-hit',twelve?'Strong hit · 12+':'Strong hit',twelve?'12+':'10+']:total>=7?['t-weak','Weak hit','7–9']:['t-miss','Miss','6−'];
  let extra='';if(total<=6&&c.autoXp!==false){c.xp=(+c.xp||0)+1;extra='Marked 1 XP for the miss.'}
  S.hist.unshift({total,what,cls,short});S.hist=S.hist.slice(0,40);
  const actions=onResult?onResult(total):'';
  showResult(`<div class="tot ${cls}">${total}</div><div><div class="what">${esc(what)}</div><div class="tier ${cls}">${tier}</div>
    <div class="dice"><span class="die">${a}</span><span class="die">${b}</span></div>
    <div class="parts">${parts.length?parts.map(esc).join(' · '):'no modifiers'}${extra?'<br><b>'+extra+'</b>':''}</div></div>${actions?`<div class="res-actions">${actions}</div>`:''}`);
  touch(c);renderL();refresh();
  return total;
}
function rollDmg(){
  const c=cur();const parts=damageParts(c).filter(p=>p.on);
  const expr=parts.map(p=>p.expr).join('');
  const r=rollExpr(expr);const tot=Math.max(0,r.total);
  S.hist.unshift({total:tot,what:'Damage '+expr,cls:'',short:'dmg'});
  showResult(`<div class="tot">${tot}</div><div><div class="what">Damage</div><div class="tier">${esc(expr)}</div>
    <div class="dice">${r.rolls.map(x=>`<span class="die" title="${x.die}">${x.r}</span>`).join('')}</div>
    <div class="parts">${parts.map(p=>esc(p.label+' '+p.expr)).join(' · ')}</div></div>`);
  renderL();refresh();
}
function showResult(html){
  const r=document.getElementById('result');r.hidden=false;r.className='result pop';
  r.innerHTML=html+`<button class="x" data-act="closeres" aria-label="Dismiss" style="grid-column:3;grid-row:1">×</button>`;void r.offsetWidth;
}
function toastInfo(msg){showResult(`<div></div><div class="parts" style="font-size:.9rem;color:var(--ink)">${esc(msg)}</div>`)}

function castSpell(id){
  const c=cur();const s=c.spells.find(x=>x.id===id);const cast=casting(c);if(!s||!cast)return;
  if(cast.mode==='vancian'){
    if(!isFree(s)){s.forgotten=true;s.prepared=false}
    if(s.ongoing)s.active=true;
    showResult(`<div class="tot t-12">12+</div><div><div class="what">${esc(s.name)}</div><div class="tier t-12">Cast successfully</div><div class="parts">Vancian spells always work.${isFree(s)?'':' It leaves your memory until you prepare again.'}</div></div>`);
    touch(c,{full:true});return;
  }
  const pen=castPenalty(c);
  const revoke=cast.mode==='commune'?'Revoked until you commune':'Forget the spell';
  roll('Cast '+s.name,cast.stat,{extraMod:-pen,extraLabel:'spell penalties',onResult:t=>{
    if(t>=7&&s.ongoing){s.active=true}
    if(t>=10||t<7)return '';
    return `<span class="hint" style="width:100%">Choose one:</span>
      <button class="btn sm" data-act="cast79" data-id="${s.id}" data-c="forget">${revoke}</button>
      <button class="btn sm" data-act="cast79" data-id="${s.id}" data-c="pen">−1 ongoing to cast</button>
      <button class="btn sm" data-act="cast79" data-id="${s.id}" data-c="spot">Unwelcome attention</button>`;
  }});
  renderM();
}

function reconcileModal(c,{afterImport=false}={}){
