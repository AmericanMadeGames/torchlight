ghosts will haunt this person until they fulfill the condition or until one week after you curse another person. On a 7-9, ghosts will pursue them for a few weeks, until they fulfil the condition, or until you curse another person. On a miss, the ghosts rebel against you, and it is you who suffers a curse.","stat":"WIS","page":180,"tier":6},{"name":"Grave Digger","text":"When you first encounter a ghost, you may ask its player one of the following questions:\n- How could I put this ghost to rest?\n- What caused this ghost’s death?\n- Where is this ghost’s grave?\n- Whom does this ghost haunt?\nAdd all of these questions to the discern realities list when you closely study a ghost.","page":180,"tier":6},{"name":"Spirit of Warning","text":"When you consult the spirits of those who died at your location, roll+CHA. On a 10+, a spirit will guide you past danger, keep you from becoming lost, or show you something hidden. On a 7-9, a spirit will show you a danger, but no more than that.","stat":"CHA","page":180,"tier":6,"requires":["Spirits of Knowledge"]}],"alignments":[{"type":"Evil","text":"Take revenge on someone who acted against your ancestors."},{"type":"Good","text":"Use the advice of your ancestors to bring useful knowledge to someone else."}],"bonds":["__________ also respects the ancestors, so I will respect them.","__________ helped my complete an important task.","__________’s misguided behaviour endangers their very soul!"],"gear":"You have an item that connects you to your ancestors. Describe it.","races":[{"name":"Elf","text":"You have many ancestors and their lives stretch back for many ages. When you ask them for advice, they will also tell you something about your location and its past. You take +1 forward when acting on this information, too."},{"name":"Human","text":"When acting on the advice a spirit gives you, you may ignore the presence of all other spirits of the dead. They may not appear before you are speak to you while you ignore them.\nSome disciple specialties grant you the ability to prepare and cast spells. If you choose the embodiment specialty, you may cast spells related to one of your three spheres of influence, as determined by your devotion move. If you choose the miracle worker specialty, you may cast spells related to all three of your spheres of influence.\nThere are eleven spheres of influence:\n- Animals\n- Battle\n- Death\n- The Earth\n- Healing\n- Judgment\n- Plants\n- Protection\n- Revelation\n- The Sky\n- Wisdom\nEach sphere includes a list of eight or more spells. If you have command over a sphere of influence, you may prepare any of the spells included in it whose level is equal to, or exceeded by, your own level, plus the rotes, which you always prepare when you prepare spells."}]},{"name":"Arcane Ritualist","archetype":"Magician","page":220,"blurb":"Not all magic is flashy, not all magic is rolled off the cuffs of fluttering mage-hands in the heat of the moment. Indeed, the greatest of all magic takes time, sustained effort, and deep concentration. When you have time to change your mind and don’t, you know the result is worth the toil.","compendium":"Once you have successfully completed a complex, week-long magical ritual, you may consider the arcane ritualist specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Ritual","text":"When you draw on a place of power to create a magical effect, tell the GM what you’re trying to achieve. Ritual effects are always possible, but the GM will give you one to four of the following conditions:\n- First you must __________.\n- It will require a lot of money.\n- It will take days/weeks/months.\n- The best you can do is a lesser version, unreliable and limited.\n- You and your allies will risk danger from ________.\n- You’ll have to disenchant ________ to do it.\n- You’ll need help from ________.","page":220}],"advanced":[{"name":"Arcane Library","text":"When you spout lore about magical writings, on a 10+, the GM will also ask you a question. Whatever you answer, it is the truth.","page":221,"tier":2},{"name":"Logical","text":"When you use strict deduction or logic to analyze your surroundings, you can discern realities with INT instead of WIS.","page":221,"tier":2},{"name":"Scrying Pool","text":"When you perform a ritual to investigate the doings of someone, and you have a piece of their body or an item that is important to them, roll+INT. On a 10+, ask the GM two questions from the list. On a 7-9, ask one. On a miss, they get to ask two questions about you:\n- How could I get to them, physically or emotionally?\n- What are they really up to?\n- What is their weakness?\n- Who are their allies?\n- Who are their enemies?","stat":"INT","page":221,"tier":2},{"name":"Astral Scryer","text":"When you use your scrying pool, you can ask an extra question, even on a miss.","page":221,"tier":6,"requires":["Scrying Pool"]},{"name":"Ethereal Tether","text":"When you have time with a willing or helpless subject, you can craft an ethereal tether with them. You perceive what they perceive and can discern realities about someone tethered to you or their surroundings no matter the distance. Someone willingly tethered to you can communicate with you over the tether as if you were in the room with them.","page":222,"tier":6},{"name":"Highly Logical","text":"When you use strict deduction to analyze your surroundings, you can discern realities with INT instead of WIS. On a 12+, you get to ask the GM any three questions, not limited by the list.","page":222,"tier":6,"replaces":["Logical"]},{"name":"Self-Powered","text":"When you have time, arcane materials, and a safe space, you can create your own place of power. Describe to the GM what kind of power it is and how you’re binding it to this place, the GM will tell you one kind of creature that will have an interest in your workings.","page":222,"tier":6,"requires":["Ritual"]}],"alignments":[{"type":"Lawful","text":"Exploit the letter of the law (or an agreement) for your own benefit."},{"type":"Neutral","text":"Make an ally of someone powerful."}],"bonds":["__________ and I shared a mystical vision, after performing a ritual together.","I need __________’s help to perform a particularly important ritual.","I went to school with __________."],"gear":"Choose one:\n○ Bag of books (5 uses, 2 weight).\n○ Ritual carpet (2 weight).\n○ Ritual dagger (hand, 1 weight).\n○ Small mirror.\n○ Staff (close, two-handed, 1 weight).\n○ Sword (close, 1 weight).\n○ Small pet animal.","races":[{"name":"Dwarf","text":"While you are working magic, you have +1 armour."},{"name":"Elf","text":"You may consider any forested area to be a place of power."},{"name":"Halfling","text":"You never need a lot of money to successfully perform a ritual."},{"name":"Human","text":"You may consider any site a place of power after you perform a human sacrifice on it."}]},{"name":"Awakened Mind","archetype":"Magician","page":224,"blurb":"It is the noblest endeavour, to find enlightenment even here, in a world of flame and steel and coin. There are those among us who walk a secret path, the eye of their mind open in darkness.","compendium":"Once you have discovered the latent abilities that lie within your mind, you may consider the awakened mind specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Expanded Consciousness","text":"When you project your mind from your body, choose two to describe your mind’s form (it’s always insubstantial):\n- It is invisible.\n- It moves quickly.\n- Its senses are not clouded.\nYour mental form can roam the physical world for as long as you like. While it does, your body lies comatose. While in your mental form you have no access to your body’s senses.","page":224}],"advanced":[{"name":"Mindmeld","text":"When you touch a willing or sleeping subject, your senses are tuned to their thoughts. The GM will give you an impression of what’s going on inside their head.","page":225,"tier":2},{"name":"Sleep Walk With Me","text":"When your mental form passes through the body of a sleeping person, you may choose to inhabit their body. Your control is limited as if they were sleepwalking: movement, maybe even simple conversations at most. The eyes of the body you inhabit never open; if they do open, you are immediately expelled.","page":225,"tier":2,"requires":["Expanded Consciousness"]},{"name":"Talisman","text":"Choose an item of importance to you. From now on you can hear the thoughts of whomever holds that item.","page":225,"tier":2},{"name":"Thoughts Beyond","text":"When you project your mind from your body, you can also choose one of these options:\n- You can communicate with the minds of people you are near.\n- You can move small physical objects that have recently been touched by someone.\n- You hear nearby thoughts instead of sounds.","page":225,"tier":2,"requires":["Expanded Consciousness"]},{"name":"From Beyond","text":"You can see spirits and other invisible or insubstantial beings whenever you concentrate. While you can see them, you can also interact with them as if they were solid.","page":226,"tier":6},{"name":"Sleep Walk Inside Me","text":"When your mental form passes through the body of a sleeping person, you may choose to inhabit their body. You can use their body as if it were your own until they would have awoken had you not possessed them. At that moment, they awaken and you are immediately expelled.","page":226,"tier":6,"replaces":["Sleep Walk With Me"]},{"name":"Thoughts Beyond Thought","text":"When you project your mind from your body, you can also choose two of these options:\n- You can become visible, if only as a ghostly figure.\n- You can communicate with the minds of people you are near.\n- You can move small physical objects that have recently been touched by someone.\n- You hear nearby thoughts instead of sounds.","page":226,"tier":6,"replaces":["Thoughts Beyond"]}],"alignments":[{"type":"Chaotic","text":"Reveal a hidden truth about someone of importance."},{"type":"Neutral","text":"Discover a useful secret."}],"bonds":["__________ does not use the full potential of their mind, and is worse off for it.","__________ has some strange insight into my powers.","I watch out for __________ sometimes, when they need it."],"gear":"Choose one:\n○ Bag of books (5 uses, 2 weight).\n○ Healing potion.\n○ Leather armour (1 armour, 1 weight).\n○ Personal feast (1 use, 1 weight).","races":[{"name":"Dwarf","text":"When you project your mind from your body, add this to your list of options:\n- Your physical body turns to stone until your mind returns."},{"name":"Elf","text":"When someone touches your sleeping or comatose body, you may immediately return to it and awaken."},{"name":"Halfling","text":"When you consume a ration right before projecting your mind from your body, it counts as making camp if you roam the world in spirit form for more than a few hours."},{"name":"Human","text":"When you project your mind from your body, you can choose all three options if you take either 1d8 damage or a debility."}]},{"name":"Blue Mage","archetype":"Magician","page":228,"blurb":"You live in a world full of magic. Why create your own style when you can just copy what others do? What really matters is whether it works or not—and your magic works, all right.","compendium":"Once you have absorbed a slain enemy’s essence—by consuming their body, or shattering a crystal made of air that you have imprisoned them inside of, for example—you may consider the blue mage specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Cast a Mimicked Spell","text":"When you cast a spell you have mimicked, roll+INT. On a 10+, the spell is successfully cast and you may cast it again. On a 7-9, the spell is successfully cast, but choose one:\n- The spell is forgotten. You may not cast it again.\n- You cause unintended harm or damage.\nMaintaining spells with ongoing effects imposes a -1 penalty to using this move.","stat":"INT","page":228},{"name":"Spell Mimicry","text":"When you see or experience a magical effect and try to copy it, roll+INT. On a hit, you have memorized it like a spell, but on a 7-9, you must forget a spell you already have memorized. If you have no spells to forget, you can memorize this new one only if you also take a debility. When you forget this spell, you may not memorize it again. If you memorize an offensive ability, your magic does the same damage as the original.","stat":"INT","page":229}],"advanced":[{"name":"Beyond Mimicry","text":"Requirements: Spellbook If you want to write a mimicked spell you successfully memorized into your spellbook permanently, you can take it as your next spell when you level up, or you can replace one of the spells you already have in your spellbook.","page":229,"tier":2},{"name":"Face Like a Mask","text":"You can mimic the appearance of another person as if it were a spell, if you touch them.","page":229,"tier":2,"requires":["Spell Mimicry"]},{"name":"Monster Mash","text":"You can mimic non-magical monster moves, as if they were spells.","page":229,"tier":2,"requires":["Spell Mimicry"]},{"name":"Better Mimic","text":"When you cast a spell you have mimicked, on a 10-11, you may choose from the 7-9 list in order to double the effects of the spell or ignore the -1 penalty if it is ongoing. On a 12+, you may choose either of those options with no consequences.","page":230,"tier":6,"requires":["Cast a Mimicked Spell"]},{"name":"Face Dancer","text":"You can mimic someone’s appearance and mannerisms just like a spell, if you touch them. While disguised, you sound and move like them, and only your lack of their memories will give you away.","page":230,"tier":6,"replaces":["Face Like a Mask"]},{"name":"Perfect Replica","text":"You can mimic the non-magical abilities of other people, as if they were spells.","page":230,"tier":6,"requires":["Monster Mash"]}],"alignments":[{"type":"Chaotic","text":"Risk your life to get access to a magical spell."},{"type":"Neutral","text":"Make a profit off of a magical spell you mimicked."}],"bonds":["__________ brings trouble with them wherever they go.","__________ is woefully misinformed about the world. I will teach them what I can."],"gear":"Choose one:\n○ Antitoxin.\n○ Healing potion.\n○ Keg of Dwarven stout (4 weight).\n○ Leather armour (1 armour, 1 weight).\n○ Shield (+1 armour, 2 weight).","races":[{"name":"Elf","text":"You can mimic the abilities of forest creatures as if they were spells."},{"name":"Human","text":"If a harmful spell is cast on you and you successfully mimic it, the damage is halved (round up)."}]},{"name":"Conjurer","archetype":"Magician","page":232,"blurb":"Parlour tricks? Pulling rabbits out of hats? I don’t think so.","compendium":"Once you have obtained a magic hat or bag and a magical box, and performed onstage with them for an appreciative audience, you may consider the conjurer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Conjuration","text":"When you conjure an item, hand-sized and neither unique nor extremely valuable, roll+INT. On a 10+, it appears in your hand or on your person somewhere. On a 7-9, it’s not quite what you had in mind, but vaguely similar. On a miss, what you conjure up is the opposite of useful.","stat":"INT","page":232}],"advanced":[{"name":"Abjuration","text":"When you banish a creature from another plane of existence, roll+INT. On a 10+, it may not approach you further and if it lacks an anchor in this world, it must return to whence it came. On a 7-9, it may not approach you further unless you allow it to (or you let your guard down). On a miss, you cannot banish it.","stat":"INT","page":232,"tier":2},{"name":"From Beyond the Black Gate","text":"When you summon a monster from beyond this world, say what it’s for, one thing it is, and one thing it’s not. Then roll+INT, and find out what comes through. On a 10+, both. On a 7-9, choose one or the other:\n- It fulfills its purpose and leaves.\n- It’s perfect for the job.\nOn a miss, it isn’t what you said it is, but it is what you said it’s not.","stat":"INT","page":233,"tier":2},{"name":"The Summoner’s Trick","text":"Choose a summoning spell of your level or lower. If you cast spells, add it to your spellbook, but prepare and cast it as if it were one level lower. If you don’t cast spells, you can now cast this one. When you do, roll+INT. On a hit, it works, but on a 7-9, you also choose one:\n- You can’t cast this spell again until the next dawn or dusk.\n- You lose control of the spell’s effects.\n- You take a debility of your choice.","stat":"INT","page":233,"tier":2},{"name":"Vanishing Act","text":"When you obscure an item from sight for a moment, roll+INT. On a 10+, it vanishes and reappears in the exact location of your choosing (but not in the same place as something else). On a 7-9, it vanishes and reappears in your life at some unpredictable point in the future.","stat":"INT","page":233,"tier":2},{"name":"What’s Mine is Mine","text":"When you give someone an item you’d rather keep, roll+INT. On a hit, it returns to you in good time but on a 7-9, there are strings attached. On a miss, it’s gone forever.","stat":"INT","page":233,"tier":2},{"name":"Arch-Summoner","text":"Choose another two summoning spells that you can either add to your spellbook and cast as if they were one level lower or cast as described in the summoner’s trick.","page":234,"tier":6,"requires":["The Summoner’s Trick"]},{"name":"Conjuratorium","text":"You can dedicate a location to be a special arcane sanctum where you can summon all manner of things into existence, limited only by the size of this conjuratorium. In order to summon something, you need an antecedent that resonates with the summoned thing’s true nature. Discuss what you can use as a proper antecedent with the GM. When you use an antecedent to begin the summoning process, roll+INT. On a 10+, choose two. On a 7-9, choose one:\n- It’s a secret.\n- Nothing else is summoned.\n- The antecedent remains in this world.","stat":"INT","page":234,"tier":6},{"name":"Summons","text":"When you summon someone by name with magic, roll+INT. On a 10+, choose two. On a 7-9, they come directly and choose one:\n- They arrive at exactly the location you specify.\n- They arrive exactly when you specify, no matter the distance.\n- You have some form of defence when they arrive.","stat":"INT","page":234,"tier":6}],"alignments":[{"type":"Chaotic","text":"Upset the existing social order."},{"type":"Evil","text":"Bring something evil into the world that other people have to deal with."}],"bonds":["__________ knows a secret about my powers that no one else does.","I was summoned here by __________."],"gear":"Choose one or two:\n○ Fancy robes.\n○ Painted box.\n○ Strange hat.\n○ Wand.\n○ White gloves.","races":[{"name":"Human","text":"You can use DEX for your conjurer moves, instead of INT."}]},{"name":"Dominator","archetype":"Magician","page":237,"blurb":"What else is magic for, if not to control others?","compendium":"Once you have completely broken the will of another person and made them your slave, you may consider the dominator specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Hypnotist","text":"When you make eye contact with someone and exert your will over them, roll+INT. On a hit, they are paralysed and cannot move, but on a 7-9, the effect is broken if you move. When you break off eye contact, they can move again.","stat":"INT","page":237}],"advanced":[{"name":"Control","text":"When you touch someone and force your will upon them, roll+INT. On a 10+, hold 2. On a 7-9, hold 1. You can spend your hold to give them an order. They must obey or suffer 1d6 damage. You may only have a hold over one person at a time.","stat":"INT","page":237,"tier":2},{"name":"Dominating Power","text":"Choose an enchantment spell of your level or lower. If you cast spells, add it to your spellbook, but prepare and cast it as if it were one level lower. If you don’t cast spells, you can now cast this one. When you do, roll+INT. On a hit, it works, but on a 7-9, you also choose one:\n- You can’t cast this spell again until the next dawn or dusk.\n- You lose control of the spell’s effects.","stat":"INT","page":238,"tier":2},{"name":"Iron Will","text":"When you are subject to mind control or magic that influences your feelings, you may choose to take 1d4 damage (ignores armour) and ignore the influence.","page":238,"tier":2},{"name":"Arch-Enchanter","text":"Choose another two enchantment spells that you can either add to your spellbook and cast as if they were one level lower or cast as described in dominating power.","page":238,"tier":6,"requires":["Dominating Power"]},{"name":"Jaws Around Your Spine","text":"When you touch someone and force your will upon them, roll+INT. On a 10+, hold 2. On a 7-9, hold 1. You can spend a hold to give them an order. They must obey or they suffer 1d8 damage. You may have hold over a number of people equal to your INT, but no more than that.","stat":"INT","page":238,"tier":6,"replaces":["Control"]},{"name":"Mystical Puppet Strings","text":"When you use magic to control a person’s actions, they have no memory of what you had them do and bear you no ill will.","page":238,"tier":6}],"alignments":[{"type":"Chaotic","text":"Expose corruption and abuse of power."},{"type":"Evil","text":"Use your powers to make people you don’t control fear you."}],"bonds":["__________ has seen my bad side, and they’re still here.","I am deeply intrigued by __________.","The world has not been kind to __________, but I will be."],"gear":"You get 30 coins, in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"When you use magic to control a person’s actions, take +1d4 damage forward against them."},{"name":"Elf","text":"When you use magic to control a person’s actions, you may ask one question about them, as if you had discerned realities and rolled a 7-9."},{"name":"Human","text":"When you use magic to control a person’s actions, take +1 forward to parley with them."}]},{"name":"Enchanter","archetype":"Magician","page":240,"blurb":"To change the soul with but a small, simple item—all this task requires is a unique and magical talent. The art of enchantment is the creation of the catalyst for change, and thus the change itself.","compendium":"Once you have discovered how to extract an emotion from someone, distil it into a physical form, and then transfer it to someone else, you may consider the enchanter specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Wondrous Creations","text":"When you create a magic item or a work of art, tell the GM what effect you want it to have on people and the GM will tell you how long you need to work on it and if you need any special materials. The first time you use or unveil your creation, roll+INT. On a hit, it has the effect you desired, but on a 7-9, it has an additional effect chosen by the GM. On a miss, you have created something terrible.","stat":"INT","page":240}],"advanced":[{"name":"Enchanted","text":"When you cast an enchantment spell, take +1.","page":241,"tier":2,"requires":["Cast a Spell"]},{"name":"Enchanter","text":"When you have time and safety with a magic item, you may ask the GM what it does. The GM will answer you truthfully.","page":241,"tier":2},{"name":"Knack for Enchantments","text":"Choose one enchantment spell of your level or lower. If you cast spells, add this spell to your spellbook, but prepare and cast it as if it were one level lower. If you don’t cast spells, when you use this spell, roll+INT. On a hit, it works, but on a 7-9, choose one:\n- You can’t use it again for the rest of the day.\n- You take a debility of your choice.","stat":"INT","page":241,"tier":2},{"name":"Operator of Magical Mechanisms","text":"When you use a magical item and force it to obey your will, roll+INT. On a 10+, you control the degree and extent of its effects. On a 7-9, you direct its effects, but choose one:\n- It is broken and cannot be used again until fixed.\n- It slips out of your control, creating additional, unwanted effects.","stat":"INT","page":241,"tier":2},{"name":"Arch-Enchanter","text":"Choose another two enchantment spells that you can either add to your spellbook and cast as if they were one level lower or cast as described in knack for enchantments.","page":242,"tier":6,"requires":["Knack for Enchantments"]},{"name":"Enchanter’s Soul","text":"When you have time and safety with a magic item in a place of power, you can empower that item so that its effects are amplified the next time you use it. The GM will tell you exactly how.","page":242,"tier":6,"requires":["Enchanter"]},{"name":"Permanent Wonder","text":"When you create a magic item or a work of art, ask the GM what component you need to make its effect permanent and the GM will tell you. The more powerful the effect, the more dangerous the component is to obtain and handle, but of you do just that, your item or work of art will effect people even after its first use.","page":242,"tier":6,"requires":["Wondrous Creations"]},{"name":"Transference","text":"As long as you have time and space to work, you may remove the magical properties of an enchanted item and transfer them to another item. The recipient item may already possess magical properties or it may be a mundane item.","page":242,"tier":6}],"alignments":[{"type":"Chaotic","text":"Create an item that changes the balance of power."},{"type":"Evil","text":"Cause chaos and terror by unveiling a magic item."},{"type":"Good","text":"Make an item that changes someone’s life for the better."}],"bonds":["__________ once saw me safely through a dangerous situation.","Ironically, __________ seems to have enchanted me."],"gear":"You get one mundane item that you intend (or intended) to enchant, and whatever your other specialties give you.","races":[{"name":"Halfling","text":"When you affect someone with a magic item, take +1 forward to parley with them."},{"name":"Human","text":"When you affect someone with a magic item, take +1d4 damage forward against them."}]},{"name":"Flux","archetype":"Magician","page":244,"blurb":"That cloak of phasing tickled that rift of chaos just right, and in the moment before you rematerialized, a slice from off the foundation of reality was captured within you.","compendium":"Once you have touched the mind of a god, while travelling through dimensions, you may consider the flux specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the flux specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Bind","text":"When you call upon the fundamental force within yourself, if you are touching two objects no heavier than yourself, roll+CON. On a hit, the objects are attracted to each other like Newton’s apple to the ground. On a 10+, also choose two options from the list below. On a 7-9, choose one:\n- There are no adverse side effects.\n- This bond lasts until you choose to break it.\n- You are able to weaken the bond without breaking it.","stat":"CON","page":244}],"advanced":[{"name":"Due North","text":"You always know where you are with respect to the northernmost point of the world. You never get lost and you can always find your way back to a place you have been to before.","page":245,"tier":2},{"name":"Faraday’s Law","text":"Magnetism pulses from your flesh stirring loose the charge that lives in all metal. When you stir the charge within a weapon you hold, it does +1d4 damage ongoing. Until you dismiss this effect you take -1 to bind.","page":245,"tier":2,"requires":["Bind"]},{"name":"Subtle Sense","text":"When you discern realities, add this question to the list:\n- What nearby is metal?","page":245,"tier":2},{"name":"Velocitas Eradico","text":"You can volley with any object up to 2 weight by repelling it from yourself. Objects launched this way are far range only. When volleying this way use CON instead of DEX.","page":245,"tier":2},{"name":"Artillery","text":"You can volley with any object up to 2 weight by repelling it from yourself. Objects launched this way count as weapons (near, far) and your base damage with them is a d8 instead of a d4. When volleying this way use CON instead of DEX.","page":246,"tier":6,"replaces":["Velocitas Eradico"]},{"name":"Binding Field","text":"You can bind any two objects you can see, not just those you touch.","page":246,"tier":6,"requires":["Bind"]},{"name":"Repel","text":"When you bind two objects, you can choose to have them repel each other instead of attracting each other. The force is the same.","page":246,"tier":6,"requires":["Bind"]}],"alignments":[{"type":"Chaotic","text":"Stymie or frustrate someone else’s plans in an amusing manner."},{"type":"Evil","text":"Ruin something valuable with your powers."},{"type":"Neutral","text":"Impress someone important with your wondrous powers."}],"bonds":["__________ and I are friendly rivals.","__________ is a great friend to me, we are bound together like one.","__________ needs to respect me and my powers more than they do right now, for serious.","I will show __________ that my abilities surpass theirs."],"gear":"You have adventuring gear (5 uses, 1 weight), in addition to whatever your other specialties give you.","races":[{"name":"Halfling","text":"You may bind an object to yourself instead of another object, treating your body as if it were one of the two bound objects."},{"name":"Human","text":"You can use any object you can pick up as a melee weapon. It has a range tag appropriate to its size and can do +1 damage if it is particularly heavy or dangerous."}]},{"name":"Golemist","archetype":"Magician","page":248,"blurb":"Who needs spells when you can make slaves out of the very elements themselves?","compendium":"Once you have built a humanoid figure out of a single element and infused it with your own blood and life essence, then anointed it with five different magical oils, and brought it to life, you may consider the golemist specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Elemental Golem","text":"When you summon an elemental being, choose an element at hand and roll+CON. On a 10+, you create a golem under your control, made out of this element, and you hold 3 control over it. On a 7-9, either you create a golem made out of this element and you have 1 control over it, or you have 2 control over it and choose one:\n- The golem is hostile and will resent you later.\n- The golem is made out of a different element, the GM will tell you which.\nYou can only control one golem at a time. As long as you have control over your golem, you can use your golem moves and command it to take simple actions. When you spend all your control, your golem acts on its own, and has hit points equal to twice your level.","stat":"CON","page":248},{"name":"Golem Attack","text":"When you command your golem to attack, roll+control. On a hit, it does what you want, but on a 7-9, you also lose 1 control. Your golem deals 1d8 damage.","stat":"CON","page":249},{"name":"Golem Protection","text":"When your golem takes damage, you lose 1 control and the damage is negated.","page":249}],"advanced":[{"name":"Automaton","text":"You can make a golem out of bits and pieces of physical items, not just base elements.","page":249,"tier":2,"requires":["Elemental Golem"]},{"name":"Banish Golem","text":"When you banish an elemental golem, roll+CON. On a 10+, the golem is removed from the world. On a 7-9, the golem is removed, but choose one:\n- Take -1 ongoing to your golem moves until you make camp.\n- You take 1d6 damage (ignores armour).","stat":"CON","page":249,"tier":2,"requires":["Elemental Golem"]},{"name":"Golem Puppet Strings","text":"While you control a golem, you can use it like your own character to undertake complicated actions other than fighting. You can use its senses as your own, but use your own stats to make moves.","page":249,"tier":2,"requires":["Elemental Golem"]},{"name":"Elemental Shield","text":"While you control an elemental golem, you are immune to damage caused by whatever it is made out of.","page":250,"tier":6,"requires":["Elemental Golem"]},{"name":"Osmosis","text":"When you banish an elemental golem, roll+CON. On a 10+, the golem is removed from the world and you heal 1d6 damage. On a 7-9, the golem is removed, but choose one:\n- Take -1 ongoing to your golem moves until you make camp.\n- You take 1d6 damage (ignores armour).","stat":"CON","page":250,"tier":6,"replaces":["Banish Golem"]},{"name":"Reckless Summoner","text":"When you summon an elemental being, on a 10+, you can choose an option from the 7-9 list and choose a second element that the golem is made out of.","page":250,"tier":6,"requires":["Elemental Golem"]}],"alignments":[{"type":"Evil","text":"Use your golems to extort profit out of someone important."},{"type":"Neutral","text":"Make a golem do something important for no other reason than so other people can see you."}],"bonds":["__________ doesn’t sufficiently respect the power of the elements.","__________ earned my respect the hard way.","__________ keeps cramping my style."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Bag full of sand (1 weight).\n○ Bandages (3 uses, slow).\n○ Five torches and a tinderbox (1 weight).\n○ Jug full of water (2 weight).\n○ Poultices and herbs (2 uses, 1 weight).","races":[{"name":"Dwarf","text":"When you summon an elemental golem on a mountain, hold +1 control over it."},{"name":"Elf","text":"When you summon an elemental golem in a forest, hold +1 control over it."},{"name":"Human","text":"When you control a golem, it deals +1d4 damage."}]},{"name":"Illusionist","archetype":"Magician","page":252,"blurb":"One day they’ll understand. Image is everything.","compendium":"Once you have studied under the tutelage of a master illusionist and managed to fool them with your magic, you may consider the illusionist specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Smoke and Mirrors","text":"When you create a magical illusion, roll+INT. On a hit, you can change the appearance of someone or something that you can see. This illusion lasts as long as you concentrate on it. Additionally, on a 10+, you may also choose an options from the list below:\n- Your illusion can include smells and flavours.\n- Your illusion can include sounds.\n- Your illusion can move, independent of its original appearance.\n- You illusion lasts for a few moments after you stop concentrating.","stat":"INT","page":252}],"advanced":[{"name":"The Image Itself","text":"You do not need to disguise someone or something when you create an illusion—it can exist independent of other objects.","page":253,"tier":2,"requires":["Smoke and Mirrors"]},{"name":"Just Because You Feel It","text":"You may add a tactile element to your illusions. This can change the way they feel, or make something feel substantial even though it is not. This can be used to cause pain, but does not deal damage, and will not stand up to close scrutiny (it cannot be used to actually bar passage through an open doorway, for example).","page":253,"tier":2,"requires":["Smoke and Mirrors"]},{"name":"Knack for Illusions","text":"Choose one illusion spell of your level or lower. If you cast spells, add this spell to your spellbook, but prepare and cast it as if it were one level lower. If you don’t cast spells, when you use this spell, roll+INT. On a hit, it works, but on a 7-9, you can’t use it again for the rest of the day.","stat":"INT","page":253,"tier":2},{"name":"The Next Best Thing","text":"When you create an illusion, on a hit, you may choose an additional option.","page":253,"tier":2,"requires":["Smoke and Mirrors"]},{"name":"Doesn’t Mean It’s There","text":"When you create an illusion, it always lasts a few moments after you stop concentrating; replace that option with this one:\n- Your illusion lasts for days after you stop concentrating.","page":254,"tier":6},{"name":"Master of Illusions","text":"Choose another two illusion spells that you can either add to your spellbook and cast as if they were one level lower or cast as described in knack for illusions.","page":254,"tier":6,"requires":["Knack for Illusions"]},{"name":"Phantom Pains","text":"When you add a tactile element to your illusions, you may use them to deal your damage. This does not cause actual wounds—the effects only exist in the victim’s mind. Victims with weak hearts may die if reduced to zero HP from this; others will faint. Damage caused by an illusion is healed when the illusion is revealed to be false.","page":254,"tier":6,"requires":["Just Because You Feel It"]}],"alignments":[{"type":"Evil","text":"Use your illusions to steal something valuable."},{"type":"Good","text":"Use your illusions to comfort or entertain someone."},{"type":"Neutral","text":"Use your illusions to cover up an awful truth."}],"bonds":["__________ is too gullible for my liking. If we’re in this together, they need to smarten up!","__________ thinks my powers are all style and no substance. I’ll show them how useful I can be!"],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Bag of wooden nickels.\n○ Dungeon rations (5 uses, 1 weight).\n○ Fancy clothes and fake jewels.","races":[{"name":"Elf","text":"When you create an illusion, you may add the smell or sound of a forest to it, at your option."},{"name":"Halfling","text":"When you create an illusion your size or larger, you can also hide behind it. Unless you reveal yourself or the illusion is dispelled, you cannot be found."},{"name":"Human","text":"While you are concentrating on an illusion, you get +1 armour."}]},{"name":"Mind-Mover","archetype":"Magician","page":257,"blurb":"The mind is a powerful thing, more powerful than the body is, certainly. You think we need a body for life? Then what of ghosts and spirits? You think we need a body to move things around in the physical world? I beg to differ.","compendium":"Once you have disciplined your mind, focuses it, and been able to project your will upon a physical object through the strain of multiple physical shocks and traumas, you may consider the mind-mover specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the mind-mover specialty, lower your maximum HP by 2, but not below 4+Constitution.","mods":{"hp":-2},"starting":[{"name":"Telekinesis","text":"You can use your mind to move objects smaller than yourself without touching them. It is easy to move objects nearby as long as they can fit in one hand. When you move an object larger than that and smaller than yourself with your mind, roll+INT. On a 10+, you can move it wherever you want it to go, within sight. On a 7-9, you can move it a short distance in one direction. You must concentrate while the object is moving.","stat":"INT","page":257}],"advanced":[{"name":"Aquakinesis","text":"You can move liquids with your mind as if they were objects.","page":258,"tier":2,"requires":["Telekinesis"]},{"name":"Hold Person","text":"You can move people as if they were objects, even if they are larger than you. On a 10+, you may also immobilize them, as long as you maintain your concentration.","page":258,"tier":2,"requires":["Telekinesis"]},{"name":"Telekinetic Weapons","text":"When you throw objects with your mind, they count as weapons in near range, and you volley with INT instead of DEX.","page":258,"tier":2},{"name":"Friend of the Sky","text":"You can fly, whenever you want, without having to concentrate.","page":258,"tier":6},{"name":"Mind Warrior","text":"When you attack with telekinetic weapons, your base damage is d10, instead of d4.","page":258,"tier":6,"requires":["Telekinetic Weapons"]},{"name":"Telekinetic Mastery","text":"You can move objects with your mind that are larger than yourself.","page":258,"tier":6,"requires":["Telekinesis"]}],"alignments":[{"type":"Evil","text":"Destroy something of value with your psychic powers."},{"type":"Neutral","text":"Increase your personal reputation."}],"bonds":["__________ is ignorant of the evil that we face.","__________ is too full of anger and darkness for my liking.","I have a friendly rivalry going with __________."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Antitoxin and bandages (3 uses, slow).\n○ Dungeon rations (5 uses, 1 weight).\n○ Healing potion.\n○ Staff (close, two-handed, 1 weight).","races":[{"name":"Halfling","text":"You may move objects with your mind that are smaller than a house, instead of smaller than yourself."},{"name":"Human","text":"When you use your psychic powers, you may roll with WIS instead of INT."}]},{"name":"Objectivist","archetype":"Magician","page":260,"blurb":"You can tell so much about a person just from the things they own.","compendium":"Once you have conducted a thorough study on the inner life of objects and reported your findings at great length, you may consider the objectivist specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the object reader specialty, you get +2 load.","mods":{"load":2},"starting":[{"name":"Psychometry","text":"When you handle an interesting object, roll+INT. On a 10+, ask the GM three questions from the list below. On a 7-9, ask two. On a miss, ask one anyway, in addition to whatever the GM tells you:\n- What are the most recent words spoken near it?\n- What has been done to or with it recently?\n- What strong emotions has it been close to?\n- What’s wrong with it and how could it be fixed?\n- Who handled it last?\n- Who made it?","stat":"INT","page":260}],"advanced":[{"name":"Concealed Object","text":"When you hide an object on your person, it cannot be found unless you want it to. Only one object may be concealed like this at a time.","page":261,"tier":2},{"name":"Improvised Objection","text":"You can use any object as an effective melee weapon. It has a range—hand, close, or reach—based on it’s size.","page":261,"tier":2},{"name":"Psychic Phrenology","text":"You can use psychometry on plants and animals when you handle them, as well as inanimate objects.","page":261,"tier":2,"requires":["Psychometry"]},{"name":"Wealth and Taste","text":"When you make a show of flashing around your most valuable possession, the GM chooses an NPC who can see you. They will do anything they can to obtain your item or one like it.","page":261,"tier":2},{"name":"Eye for Weaponry","text":"When you look over an enemy’s weaponry, ask the GM how much damage they do.","page":261,"tier":6},{"name":"Forceful Objection","text":"When you attack with an improvised weapon, your damage die is a d8, not a d4.","page":261,"tier":6,"requires":["Improvised Objection"]},{"name":"Psychic Psychology","text":"You can use psychometry on humans and other sentient creatures, alive or dead, when you handle them, as well as inanimate objects.","page":262,"tier":6,"requires":["Psychic Phrenology"]},{"name":"Strong Arm, True Aim","text":"You can throw any melee weapon, using it to volley. A thrown melee weapon is gone from your possession; you can never choose to reduce ammo on a 7-9.","page":262,"tier":6}],"alignments":[{"type":"Lawful","text":"Return lost or stolen property to its rightful owner."},{"type":"Neutral","text":"Acquire something valuable for much less than it is worth."}],"bonds":["__________ has an amazing collection of possessions.","__________ has little respect for inanimate objects. I will show them how much these things matter to me.","I’d like to get my hands on __________’s stuff at some point.","I’ve seen __________ eyeing my things before. I need to keep an eye out for when they decide to take a closer look."],"gear":"Choose one or two:\n○ Adventuring gear (5 uses, 1 weight).\n○ Bag of books (5 uses, 2 weight).\n○ Bag of human bones (1 weight).\n○ Chess set (1 weight).\n○ Key ring.\n○ Mechanical bird that sings when wound up (1 weight).\n○ Melee weapon of your choice.\n○ Unopened letter from a relative.","races":[{"name":"Dwarf","text":"When you handle an interesting piece of stone, you need not be limited by the questions on the psychometry list. Ask whatever questions you like."},{"name":"Elf","text":"When you handle an interesting object made of wood or other once-living plant material, you need not be limited by the questions on the psychometry list. Ask whatever questions you like."},{"name":"Halfling","text":"When you handle an interesting tool, you need not be limited by the questions on the psychometry list. Ask whatever questions you like."},{"name":"Human","text":"When you handle an interesting object made of precious gems or metals, you need not be limited by the questions on the psychometry list. Ask whatever questions you like."}]},{"name":"Prepared Caster","archetype":"Magician","page":264,"blurb":"You are the kind of wizard who prepares spells and holds onto them, so you can use them later. Spells are like tools for you—make sure you choose which ones to pack with care and forethought, and try not to wear them out.","compendium":"Once you learn to capture magic and imprison it inside your head, after being instructed by a magical tome or an archmage tutor, you may consider the prepared caster specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the prepared caster specialty, you get +1 load, and lower your maximum HP by 2, but not lower than 4+Constitution.","mods":{"load":1,"hp":-2},"starting":[{"name":"Cast a Magic Spell","text":"When you release a spell you’ve prepared, roll+INT. On a 10+, the spell is successfully cast and you do not forget the spell—you may cast it again later. On a 7-9, the spell is cast, but choose one:\n- After it is cast, the spell is forgotten. You cannot cast the spell again until you prepare spells.\n- The spell disturbs the fabric of reality as it is cast—take -1 ongoing to cast a spell until the next time you prepare spells.\n- You draw unwelcome attention or put yourself in a spot. The GM will tell you how.\nNote that maintaining spells with ongoing effects will sometimes cause a penalty to your roll to cast a spell.","stat":"INT","page":264},{"name":"Magic Spellbook","text":"You have mastered several spells and inscribed them in your spellbook. Choose three schools of magic. You start with all the cantrips from each school and three first level spells chosen from those offered by your three schools. When you gain a level, add a new spell of your level or lower to your spellbook, chosen from those offered by your three schools. Your spellbook is 1 weight.","page":265},{"name":"Prepare Magic Spells","text":"When you spend uninterrupted time (an hour or so) in quiet contemplation of your spellbook, you:\n- Lose any spells you already have prepared.\n- Prepare new spells of your choice from your spellbook whose total levels don’t exceed your own level+1.\n- Prepare your cantrips which never count against your limit.","page":265}],"advanced":[{"name":"Empowered Magic","text":"When you cast a spell, on a 10+, you have the option of choosing from the 7-9 list. If you do, you may choose one of these as well:\n- The spell’s effects are maximized.\n- The spell’s targets are doubled.","page":265,"tier":2,"requires":["Cast a Magic Spell"]},{"name":"Expanded Spellbook","text":"Add a new spell from the spell list of any class or archetype to your spellbook.","page":265,"tier":2,"requires":["Magic Spellbook"]},{"name":"Prodigy","text":"Choose a spell. You prepare that spell as if it were one level lower.","page":265,"tier":2,"requires":["Prepare a Magic Spell"]},{"name":"Quick Study","text":"When you see the effects of an arcane spell, ask the GM the name of the spell and its effects. You take +1 when acting on the answers.","page":266,"tier":2},{"name":"Greater Empowered Magic","text":"When you cast a spell, on a 10-11, you have the option of choosing from the 7-9 list. If you do, you may choose one of the these effects as well. On a 12+, you get to choose one of these effects for free:\n- The spell’s effects are doubled.\n- The spell’s targets are doubled.","page":266,"tier":6,"replaces":["Empowered Magic"]},{"name":"Master","text":"Choose one spell in addition to the one you picked for prodigy. You prepare that spell as if it were one level lower.","page":266,"tier":6,"requires":["Prodigy"]},{"name":"Spell Augmentation","text":"When you deal damage to a creature, you can shunt a spell’s energy into them—end one of your ongoing spells and add the spell’s level to the damage dealt.","page":266,"tier":6,"requires":["Cast a Magic Spell"]}],"alignments":[],"bonds":["__________ is keeping an important secret from me.","__________ is woefully misinformed about the world. I will teach them what I can.","__________ once saw me safely through a dangerous situation."],"gear":"You get your spellbook (1 weight), and some writing implements, in addition to whatever your other specialties give you.","races":[{"name":"Elf","text":"Magic is as natural as breath to you. You know Detect Magic in addition to your other spells, and you cast it as if it were a cantrip."},{"name":"Halfling","text":"Choose one of your first level spells. When you cast this spell, one aspect of its effects—area, damage, range, targets, etc—is doubled."},{"name":"Human","text":"Choose one spell from another archetype, or from a school of magic you have not studied. You can cast it as if it were one of your own spells."}]},{"name":"Psychic Healer","archetype":"Magician","page":268,"blurb":"There are those who train their whole lives in the arts of medicine, so they can heal others. There are those who cry out to their gods to give them the power to heal. You have no need for either training or the gods, you can heal with nothing but your mind.","compendium":"Once you have experienced a vision of the internal structure of the body—either your own or someone else’s—and found that structure imprinted upon your mind, you may consider the psychic healer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Psychic Surgery","text":"When you touch someone, skin to skin, and concentrate on healing them, roll+INT. On a 10+, you heal 1d8 damage or remove one disease. On a 7-9, they are healed, but the damage or disease is transferred to you.","stat":"INT","page":268}],"advanced":[{"name":"Hospitaller","text":"When you heal an ally, you heal +1d8 damage.","page":269,"tier":2},{"name":"Martyr’s Touch","text":"When you heal someone, you can swap any one debility, disease, impairment, injury, or wound they have with another person, including yourself, who is either willing or unconscious.","page":269,"tier":2,"requires":["Psychic Surgery|The Cure"]},{"name":"The Sick Will See","text":"You can heal a mental illness or insanity as if it were damage or a disease—removing it on a 10+, transferring it to yourself on a 7-9.","page":269,"tier":2,"requires":["Psychic Surgery|The Cure"]},{"name":"The Cure","text":"When you touch someone, skin to skin, and concentrate on healing them, roll+INT. On a 10+, you heal 1d8 damage and remove one disease, if one is present. On a 7-9, they heal 1d8 damage and you may remove a disease if you take 1d8 damage yourself.","stat":"INT","page":270,"tier":6,"replaces":["Psychic Surgery"]},{"name":"Mad Scientist","text":"When you heal someone, you can swap any one physical feature they display or possess with the same feature of another person, including yourself, who is either willing or unconscious.","page":270,"tier":6,"replaces":["Martyr’s Touch"]},{"name":"Perfect Hospitaller","text":"When you heal an ally, you heal +2d8 damage.","page":270,"tier":6,"replaces":["Hospitaller"]}],"alignments":[{"type":"Good","text":"Heal someone in spite of their animosity toward you."},{"type":"Neutral","text":"Heal someone in exchange for an appropriate favour."}],"bonds":["__________ needs someone to look out for them.","I keep telling __________, but they won’t listen.","This isn’t the first time __________ and I have been in a mess together."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Antitoxin and bandages (3 uses, slow).\n○ Bag of books (5 uses, 1 weight).\n○ Dungeon rations (5 uses, 1 weight).\n○ Healing potion.\n○ Personal feast (1 use, 1 weight).\n○ Poultices and herbs (2 uses, slow, 1 weight).","races":[{"name":"Dwarf","text":"When you heal someone, you can heal an additional 1d6 damage if you take 1d4 damage (ignores armour) yourself."},{"name":"Elf","text":"While you are healing others or tending to their welfare, as long as you take no aggressive actions, you get +1 armour."},{"name":"Halfling","text":"When you heal someone, you can heal an extra 1d6 damage if you consume a ration."},{"name":"Human","text":"When you heal someone, they take +2 damage forward."}]},{"name":"Shadowmancer","archetype":"Magician","page":272,"blurb":"If all our lives are nothing more than shadows and dust, then the master of shadows becomes the master of life.","compendium":"Once you have travelled to the astral plane of shadows and darkness, and been infused with its essence, you may consider the shadowmancer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Gather Darkness","text":"You can gather shadows and darkness around you, as long as you are not in direct sunlight, making light sources less effective and you harder to notice. You can also snuff out small flames or other light sources within your presence, or cause large fires to dim, by concentrating on them.\nAnd either one of these two:","page":272},{"name":"Dark, Dark Hands","text":"When you call forth a piece of the shadows, roll+INT. On a hit, a solid limb of any kind emerges, under your command. It uses your INT in place of all stats if you need to roll for anything. As long as you command it, take -1 ongoing to do anything else. You may banish it at any time. On a 10+, it has HP equal to 5+your level and deals d8 damage. On a 7-9, it has HP equal to 2+your level and deals d6 damage.","stat":"INT","page":272},{"name":"Walking Through Darkness","text":"When you step into a dark patch of shadow, you can step out of another one less than a hundred yards away. The whole of you must step through, with all that you carry.","page":273}],"advanced":[{"name":"Artifacts of Darkness","text":"When you reach into shadows or darkness in search of an object, roll+INT. On a 10+, you draw forth just such an object, only made of shadows and darkness. It has no other magical properties, but behaves just like the object it mimics. If you desire a unique object and you know what it looks like—a particular key, perhaps—this object will work in its stead. On a 7-9, you draw forth an object that is similar, but the GM will add a tag to it. The object lasts as long as you are using it, no longer.","stat":"INT","page":273,"tier":2},{"name":"The Darkening Path","text":"You can travel through the plane of shadows, from one patch of darkness to another. When you travel through darkness, name your destination and roll+CON. On a 10+, you emerge as close to your intended destination as possible. On a 7-9, the way is long and hard. Choose one:\n- You bail out early, some distance from your intended destination.\n- You bring something else out with you when you emerge into the light.\n- You stick it out and emerge with a debility, the GM will tell you which.","stat":"CON","page":273,"tier":2},{"name":"Fixation on the Darkness","text":"You had only one before, now you have both Dark, Dark Hands and Walking Through Darkness.","page":273,"tier":2,"requires":["Dark, Dark Hands|Walking Through Darkness"]},{"name":"My Shadow and Me","text":"When your shadow attacks the same target you do, instead of their shadow, deal +1d4 damage.","page":274,"tier":2},{"name":"Shadow Thief","text":"When you take someone’s shadow, roll+DEX. On a 10+, you can use it for two purposes from the list below. On a 7-9, only one:\n- You can command it to accompany you.\n- You can command it to perform one task, which can be continuous.\n- You can wear it over your face to disguise yourself as it’s caster.\nWhile you have someone’s shadow, they cast none and you take -1 ongoing to use your shadow-related moves unless you seal it in a bottle or other container.","stat":"DEX","page":274,"tier":2},{"name":"Faces in the Dark","text":"As long as you concentrate and do little else, you may cause illusions to emerge from the shadows that can move and talk but are otherwise insubstantial.","page":274,"tier":6},{"name":"Gate of Darkness","text":"When you open a gate between dark places far apart, others can travel through. They must each use the shadow travel move individually and you choose the destination. A gate lasts as long as it is dark or until you cancel it.","page":274,"tier":6,"requires":["The Darkening Path"]},{"name":"Murder in the Shadows","text":"When your shadow attacks the same target you do, instead of their shadow, deal +1d8 damage.","page":274,"tier":6,"replaces":["My Shadow and Me"]},{"name":"Reaching Through Darkness","text":"When you reach into a dark patch of shadow, you can reach out of another one less than a hundred yards away. Only part of you need reach through and you may push others through before you.","page":275,"tier":6,"requires":["Walking Through Darkness"]},{"name":"Shadow Master","text":"When you command someone’s shadow to accompany you or to perform a set task, you do not take -1 ongoing to use your shadow-related moves, and the shadow counts as a hireling with points equal to your level.","page":275,"tier":6,"requires":["Shadow Thief"]}],"alignments":[{"type":"Neutral","text":"Avoid detection or infiltrate a secure location."}],"bonds":["__________ is keeping an important secret from me."],"gear":"Choose one:\n○ Extra set of black clothes.\n○ Five torches and a tinderbox (1 weight).\n○ Leather armour (1 armour, 1 weight).\n○ Small mirror.\n○ Two antitoxins.","races":[]},{"name":"Shield Arcanus","archetype":"Magician","page":276,"blurb":"You are a master of the Omnipotent Sphere.","compendium":"Once you have built an observatory keyed to the stars of the Shield Nebula and used their light to form the Omnipotent Sphere, you may consider the shield arcanus specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the shield arcanus specialty, reduce your damage die by one size, but not below a d4.","mods":{"dmg":-1},"starting":[{"name":"Spell Defence","text":"You may end any ongoing magical effect immediately and use the energy of its dissipation to deflect an oncoming attack. The effect ends and you subtract its level from the damage done to you, if it is a spell, or your level if not.","page":276}],"advanced":[{"name":"Arcane Shield","text":"By using arcane words and gestures, you can defend with INT instead of CON.","page":277,"tier":2},{"name":"Arcane Ward","text":"As long as you have at least one prepared spell of first level or higher, you have +2 armour.","page":277,"tier":2,"requires":["Prepare Spells"]},{"name":"Counterspell","text":"When you attempt to counter an arcane spell that will otherwise affect you, stake one of your prepared spells on the defence and roll+INT. On a 10+, the spell is countered and has no effect on you. On a 7-9, the spell is countered and you forget/lose the spell you staked. Your counterspell protects only you; if the countered spell has other targets they get its effects.","stat":"INT","page":277,"tier":2,"requires":["Prepare Spells"]},{"name":"Magical Sphere","text":"When you make camp, you can create a magical sphere around you. If something approaches, this sphere warns you as if it had kept watch and rolled a 10+.","page":277,"tier":2},{"name":"Arcane Armour","text":"As long as you have at least one prepared spell of first level or higher, you have +4 armour.","page":278,"tier":6,"replaces":["Arcane Ward"]},{"name":"Dangerous Dreams","text":"When you demand prophetic truth from your dreams, roll+INT. On a hit, the GM will describe a vision of an immanent grim portent. On a 10+, you also take +1 forward against it if you encounter it. On a miss, take -1 forward due to unpleasant visions.","stat":"INT","page":278,"tier":6},{"name":"Omnipotent Sphere","text":"In addition to keeping watch for you, your magical sphere can also protect you from poison gas and drowning while you keep it around yourself and up to a small handful of others.","page":278,"tier":6,"requires":["Magical Sphere"]},{"name":"Protective Counter","text":"When an ally within sight of you is affected by an arcane spell, you can counter it as if it affected you. If the spell affects multiple allies you must counter each ally separately.","page":278,"tier":6,"requires":["Counterspell"]}],"alignments":[{"type":"Good","text":"Defend those weaker than you."},{"type":"Lawful","text":"Fulfill a promise to protect someone during a dangerous journey or situation."}],"bonds":["__________ has a great destiny to fulfill—if I can keep them from getting killed, that is!","__________ is woefully misinformed about the world. I will teach them what I can.","I have sworn to guide and protect __________, because of what they have done."],"gear":"Choose one:\n○ Healing potion.\n○ Leather armour (1 armour, 1 weight).\n○ Longsword (close, +1 damage, 1 weight).\n○ Three antitoxins.","races":[{"name":"Dwarf","text":"When you defend or protect someone else with your magic, take +1 armour forward."},{"name":"Elf","text":"When you discern realities while protecting someone, on a hit, you can also ask this question:\n- How can I get my ward out of here?"}]},{"name":"Soothsayer","archetype":"Magician","page":280,"blurb":"Knowing is half the battle, but so many others ignore it. Then they wonder how they lost the war. Not you, no, you know all to well what the future holds.","compendium":"Once you have fasted for weeks, consumed the milk of the dreaming plant, and completed a vision quest that led you through seven realms of heaven, you may consider the soothsayer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Forebodings of Doom","text":"When you warn an NPC off a future course of action, roll+INT. On a 10+, they decide not to do it. If someone forces them, things go badly. On a 7-9, they do it anyway, if they want to, and of course it goes badly. On a miss, whatever they choose it ends up going badly for you, as well.","stat":"INT","page":280}],"advanced":[{"name":"Foreshadowing","text":"When you look into the future for possible dangers, name a person, place, or thing and roll+INT. On a 10+, the GM will tell you two things from the list below. On a 7-9, only one. On a miss, the GM will tell you one anyway, but also something else that is not true. Which one is which you will have to divine for yourself.\n- The nature of a danger (its type and impulse) that threatens the subject or that the subject is part of.\n- One grim portent, related to the subject, that is yet to occur.\n- One stakes question related to the subject.\n- What kind of threat the subject is.","stat":"INT","page":281,"tier":2},{"name":"Magical Senses","text":"When you discern realities with the aid of magic, or with magic present, you may use INT instead of WIS.","page":281,"tier":2},{"name":"Omens of the Future","text":"When you spend a few hours interpreting omens, say what you desire most, and the omens will show you a way it can be achieved. Take +1 forward if you act on this information, until you consult the omens again.","page":281,"tier":2},{"name":"The Golden Path","text":"When you spend a few hours interpreting omens, describe an event or state of things that has not yet come to pass, and the omens will show you a way this event or state can be achieved, if it is possible. Take +1 forward if you act on this information, even if you are thwarting the event, until you consult the omens again.","page":281,"tier":6,"replaces":["Omens of the Future"]},{"name":"Parting Shadows","text":"When you look into the future for possible dangers, on a 12+, choose three options from the list.","page":282,"tier":6,"requires":["Foreshadowing"]},{"name":"Scrying Power","text":"When you have something closely connected with another person (one of their possessions, a piece of their body, etc), you may aid, interfere, or study them closely, wherever they might actually be at the time.","page":282,"tier":6},{"name":"Truth and Consequences","text":"When you examine the strands of possible futures, describe an event that is yet to occur and roll+INT. On a 10+, name three people, groups, or social institutions. On a 7-9, only two. On a miss, name one anyway, in addition to whatever else the GM tells you. For each subject you name, the GM will tell you what sort of consequences this future event will have for them. You may only examine each event once.","stat":"INT","page":282,"tier":6}],"alignments":[{"type":"Evil","text":"Harm someone whose plans will cause you trouble in the future."},{"type":"Good","text":"Use your prophecy to help someone else avoid tragedy."},{"type":"Neutral","text":"Profit financially from your prophetic powers."}],"bonds":["__________ and I share a common purpose.","__________ doesn’t trust my powers, but I won’t let them stop me."],"gear":"Choose one:\n○ Golden water bowl.\n○ Knucklebones in a cloth bag.\n○ Pair of dice.\n○ Silvered mirror.","races":[{"name":"Dwarf","text":"When you fight someone whose futures you have prophesied, you may hack and slash with INT instead of STR."},{"name":"Elf","text":"When you discern realities with the aid of magic, the GM will also tell you what else is magic nearby, in addition to your other questions."}]},{"name":"Spellsinger","archetype":"Magician","page":284,"blurb":"Magic and music are intimately linked inside your soul.","compendium":"Once you have learned to perform the six great classics of song and how to weave magic into the space between your breaths, you may consider the spellsinger specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the spellsinger specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Vox Arcanus","text":"When you perform a magnificent song, choose an ally and one effect:\n- Their mind is shaken clear of one enchantment.\n- They get +1d4 forward to damage.\n- They get +2 instead of +1 the next time they receive aid.\n- They heal 1d8 damage.\nThen roll+CHA. On a hit, your ally gets the selected effect, but on a 7-9, you also draw unwanted attention or your magic reverberates to other targets, affecting them as well, GM’s choice.","stat":"CHA","page":284}],"advanced":[{"name":"Eldritch Tones","text":"Your arcane art is strong, allowing you to choose two effects instead of one.","page":285,"tier":2,"requires":["Vox Arcanus"]},{"name":"Healing Song","text":"When you heal with vox arcanus, you heal +1d8 damage.","page":285,"tier":2,"requires":["Vox Arcanus"]},{"name":"Metal Hurlant","text":"When you shout with great force or play a shattering note, choose a target and roll+CON. On a 10+, the target takes 1d10 damage and is deafened for a few minutes. On a 7-9, you still damage your target, but they’re out of control: the GM will choose an additional target nearby.","stat":"CON","page":285,"tier":2},{"name":"Vicious Cacophony","text":"When you grant bonus damage with vox arcanus, you grant an extra +1d4 damage.","page":285,"tier":2,"requires":["Vox Arcanus"]},{"name":"An Ear for Magic","text":"When you hear an enemy cast a spell, the GM will tell you the name of the spell and its effects. Take +1 forward when acting on the answers.","page":286,"tier":6},{"name":"Eldritch Chord","text":"When you use vox arcanus, you choose two effects. You also get to choose one of those effects to double.","page":286,"tier":6,"replaces":["Eldritch Tones"]},{"name":"Healing Chorus","text":"When you heal with vox arcanus, you heal +2d8 damage.","page":286,"tier":6,"replaces":["Healing Song"]},{"name":"Vicious Blast","text":"When you grant bonus damage with vox arcanus, you grant an extra +2d4 damage.","page":286,"tier":6,"replaces":["Vicious Cacophony"]}],"alignments":[{"type":"Chaotic","text":"Spur others to significant and unplanned decisive action."},{"type":"Good","text":"Provide a positive role model for someone in trouble."},{"type":"Neutral","text":"Avoid a conflict or defuse a tense situation."}],"bonds":["__________ is woefully misinformed about the world. I will teach them what I can.","I sang stories of __________ long before I ever met them in person."],"gear":"You get a change of clothes, a musical instrument (1+ weight), and choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Halfling pipeleaf (6 uses).\n○ Rapier (close, precise, 1 weight).","races":[{"name":"Elf","text":"When you give aid to someone while performing a magnificent song, also add your CHA to your roll."},{"name":"Human","text":"When you first enter a civilized settlement, someone who respects the custom of hospitality to minstrels will take you in as their guest."}]},{"name":"Telepath","archetype":"Magician","page":288,"blurb":"How much closer could you get to another person than to “see” into their mind, to think their thoughts, to experience the world as they experience it? There is nothing else like it.","compendium":"Once you have experienced someone else’s thoughts as if they were your own, either through mental trauma or some kind of magical influence, and decided to pursue this experience further, you may consider the telepath specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the telepath specialty, lower your maximum HP by 2, but not lower than 4+Constitution.","mods":{"hp":-2},"starting":[{"name":"Brainworm","text":"When you have a few moments of physical contact with someone, you can read their mind. When you do so, roll+INT. On a 10+, ask their player three questions from the list below. On a 7-9, ask two. On a miss, ask one anyway, but they also get to ask two of you, in addition to whatever the GM tells you.\n- How is your character’s mind and psyche vulnerable?\n- What does your character want most?\n- What is your character trying to hide?\n- What pain does your character carry around with them?\n- Who or what does your character value most?","stat":"INT","page":288}],"advanced":[{"name":"Far Speaking","text":"You can send a telepathic message to someone you know, or someone you have met before. If they are willing, you can carry on a psychic conversation.","page":289,"tier":2},{"name":"Fast Read","text":"You only need to touch someone, skin to skin, to read their mind.","page":289,"tier":2,"requires":["Brainworm"]},{"name":"Mind Sense","text":"When you discern realities, you can also sense the presence of any mental activity within bowshot.","page":289,"tier":2},{"name":"Mindmeld","text":"When you touch a willing or sleeping subject, your senses are tuned to their thoughts. The GM will give you an impression of what’s going on inside their head.","page":289,"tier":2},{"name":"Wild Empathy","text":"You can speak with and understand animals.","page":289,"tier":2},{"name":"Erasure","text":"Instead of asking a question, you may erase a short memory, or temporarily obscure their memory of an answer they gave you.","page":289,"tier":6,"requires":["Brainworm"]},{"name":"Far Read","text":"You can read the mind of anyone you can see—physical contact is not required. It still takes time and concentration.","page":290,"tier":6,"requires":["Brainworm"]},{"name":"Great Wyrm","text":"When you read someone’s mind, ask an extra question, even on a miss.","page":290,"tier":6,"requires":["Brainworm"]},{"name":"Inquisitor","text":"When you read someone’s mind, on a 12+, ask whatever questions you want, from the list or not.","page":290,"tier":6,"requires":["Brainworm"]},{"name":"Wild Speech","text":"You can speak with and understand any non-magical, non-planar creature.","page":290,"tier":6,"requires":["Wild Empathy"]}],"alignments":[{"type":"Chaotic","text":"Publicly reveal information about someone in power."},{"type":"Evil","text":"Use someone else’s secrets to hurt them."},{"type":"Good","text":"Separate truth from lies and reveal it to others."}],"bonds":["__________ thinks my powers are hideous, and I must find out why.","I have been inside __________’s mind before.","What an intriguing mind __________ has!"],"gear":"You have an item that reminds you of how you gained or honed your psychic powers. Describe it.","races":[{"name":"Dwarf","text":"Your mind can see into the earth. When you handle metal or stone, you may ask one question from the discern realities list about it. The GM will answer from the earth’s perspective."},{"name":"Elf","text":"You have great insights into the natural world. When you handle plants, you may ask one question from the discern realities list about it. The GM will answer from the plant’s perspective."},{"name":"Halfling","text":"When you read someone’s mind, you may also heal them of 1d6 damage."},{"name":"Human","text":"When you read someone’s mind, you may also deal your damage to them."}]},{"name":"Vancian Caster","archetype":"Magician","page":292,"blurb":"Spells are creatures you hold inside your memory, that flee when cast into the world.","compendium":"Once you have stolen one of the last remaining books of Phandaal’s magical spells and memorized its contents, you may consider the Vancian caster specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the Vancian caster specialty, you get +1 load, and lower your maximum HP by 2, but not lower than 4+Constitution.","mods":{"load":1,"hp":-2},"starting":[{"name":"Cast a Vancian Spell","text":"When you release a spell you’ve memorized, it is cast successfully (as if you had rolled 12+, if it matters), but you forget it and cannot cast this spell again until your re-memorize it. If a spell would give you a -1 ongoing penalty to cast a spell, ignore it and take -1 forward instead.","page":292},{"name":"Prepare Vancian Spells","text":"When you spend uninterrupted time (an hour or so) in quiet contemplation of your spellbook, you:\n- Forget any spells you already memorized.\n- Memorize new spells whose number does not exceed your level+2, and whose total magnitude does not exceed your level+1. You cannot memorize the same spell more than once.\nFor you, the magnitude of a spell is equal to half its level rounded up. Cantrips are magnitude zero.","page":293},{"name":"Vancian Spellbook","text":"You have mastered several spells and inscribed them in your spellbook. Choose three schools of magic. You start with all the cantrips from each school and three first level spells chosen from those offered by your three schools. When you gain a level, add to your spellbook a new spell whose magnitude is equal to your level or lower, chosen from those offered by your three schools. For you, the magnitude of a spell is equal to half its level rounded up. Your spellbook is 1 weight.","page":293}],"advanced":[{"name":"Expanded Spellbook","text":"Add a new spell from the spell list of any class or archetype to your spellbook.","page":293,"tier":2,"requires":["Vancian Spellbook"]},{"name":"Prodigy","text":"Choose a spell. You prepare that spell as if it were one level lower.","page":293,"tier":2,"requires":["Prepare Vancian Spells"]},{"name":"Quick Study","text":"When you see the effects of an arcane spell, ask the GM the name of the spell and its effects. You take +1 when acting on the answers.","page":294,"tier":2},{"name":"Master","text":"Choose one spell in addition to the one you picked for prodigy. You prepare that spell as if it were one level lower.","page":294,"tier":6,"requires":["Prodigy"]},{"name":"Risky Magic","text":"When you cast a spell, you can choose to double the spell’s effects or double the number of targets affected, but you must also choose one:\n- Mark a debility of your choice.\n- The spell has additional, unwanted effects. The GM will tell you what.\n- You draw unwanted attention or put yourself in a spot. The GM will tell you how.","page":294,"tier":6,"requires":["Cast a Vancian Spell"]},{"name":"Spell Augmentation","text":"When you deal damage to a creature, you can shunt a spell’s energy into them—end one of your ongoing spells and add the spell’s level to the damage dealt.","page":294,"tier":6}],"alignments":[{"type":"Evil","text":"Deal out gruesome, terrible vengeance to someone who has crossed you."},{"type":"Neutral","text":"Get the better of someone in a duel of wits."}],"bonds":["__________ and I have been to another world together.","I have travelled long and hard through dangerous lands with __________ at my side."],"gear":"You get your spellbook (1 weight), some writing implements, and whatever your other specialties give you.","races":[{"name":"Elf","text":"Magic is as natural as breath to you. You know Detect Magic in addition to your other spells, and you cast it as if it were a cantrip."},{"name":"Human","text":"Choose one spell from another archetype, or from a school of magic you have not studied. You can cast it as if it were one of your own spells.\nThe prepared caster and Vancian caster specialties give you the ability to cast spells. If you have one of these specialties, you have studied three schools of magic.\nChoose from the list of magical schools:\n- Alteration\n- Divination\n- Enchantment\n- Evo
