<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A Dungeon World character sheet with a Class Warfare class builder, level-up rules, spells, gear, journal and Dungeon Paper import. Characters are saved in your browser.">
<meta name="theme-color" content="#12262c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2312262c'/%3E%3Cpath d='M50 13 C61 27 69 38 63 51 C59 59 41 59 37 51 C31 38 40 29 50 13 Z' fill='%23f59e0b'/%3E%3Cpath d='M50 27 C56 36 59 44 55 50 C52 54 48 54 45 50 C41 44 45 36 50 27 Z' fill='%23fde68a'/%3E%3Cpath d='M40 56 H60 L57 64 H43 Z' fill='%23c9a227'/%3E%3Cpath d='M44 64 H56 L53 90 H47 Z' fill='%238a5a3c'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Torchlight Sheets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: a play-table sheet — vitals rail left, move codex center, pack & bonds right; collapses to tabs on phones */
:root{
  --bg:#e7ecef; --surface:#f6f8f9; --sunk:#dde4e9; --ink:#1a2330; --muted:#566473; --line:#c3cdd6;
  --accent:#2c6b66; --accent-soft:#d3e6e3; --on-accent:#ffffff;
  --hit:#2d7a48; --weak:#a8720c; --miss:#a2352f; --hp:#b03a33;
  --f-display:"IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#0d1217; --ink:#e5eaee; --muted:#93a1ae; --line:#2b3642;
  --accent:#5db1a7; --accent-soft:#1c3633; --on-accent:#0c1714;
  --hit:#5cc07e; --weak:#e2ab3d; --miss:#e46a5f; --hp:#e46a5f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#0d1217; --ink:#e5eaee; --muted:#93a1ae; --line:#2b3642;
  --accent:#5db1a7; --accent-soft:#1c3633; --on-accent:#0c1714;
  --hit:#5cc07e; --weak:#e2ab3d; --miss:#e46a5f; --hp:#e46a5f; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.lbl{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-inline:16px;max-width:1500px;margin:0 auto}
.brand{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:20px;color:var(--accent)}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:240px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--miss)}
.btn.sm{padding:3px 8px;font-size:.82rem}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:var(--hit)} .status.warn i{background:var(--weak)}
.sit{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 10px;background:var(--surface)}
.sit b{min-width:2.2ch;text-align:center}
.step{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:800;line-height:1;padding:0}

/* frame */
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 120px}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:minmax(270px,310px) minmax(0,1fr) minmax(280px,350px);align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.panel-h h2{font-family:var(--f-display);font-weight:400;font-size:1.25rem}

/* identity */
.name-in{font-family:var(--f-display);font-size:1.7rem;width:100%;border:0;background:transparent;padding:0;border-bottom:1px dashed transparent}
.name-in:hover,.name-in:focus{border-bottom-color:var(--line);outline:none}
.idrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.stat.deb{border-color:var(--miss)}
.stat .k{font-size:.72rem;letter-spacing:.12em;font-weight:800;color:var(--muted)}
.stat .mod{font-size:1.65rem;font-weight:800;line-height:1.05;border:0;background:none;padding:2px 10px;border-radius:7px;color:var(--ink)}
.stat .mod:hover{background:var(--accent-soft);color:var(--accent)}
.stat .score{width:3.2ch;text-align:center;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:.85rem;color:var(--muted);padding:0}
.stat .dbt{font-size:.7rem;border:0;background:none;color:var(--muted);padding:1px 4px;border-radius:4px;margin-top:2px}
.stat.deb .dbt{color:var(--on-accent);background:var(--miss)}
.hint{font-size:.78rem;color:var(--muted)}

/* vitals */
.hp{display:flex;align-items:center;gap:10px}
.hp-num{font-size:2.2rem;font-weight:800;line-height:1}
.hp-num small{font-size:1rem;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--hp);transition:width .25s}
.bar.xp>i{background:var(--accent)}
.hpbtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.vbox{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--bg);display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.vbox input{width:100%;border:0;background:transparent;font-size:1.2rem;font-weight:800;padding:0}
.vbox .big{font-size:1.2rem;font-weight:800;border:0;background:none;padding:0;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.xprow{display:flex;align-items:center;gap:10px}
.lvl{font-family:var(--f-display);font-size:1.5rem}
.ready{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--accent-soft)}}

/* history */
.hist{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.hrow{display:grid;grid-template-columns:2.3ch 1fr auto;gap:8px;align-items:baseline;font-size:.88rem;padding:3px 0;border-bottom:1px solid var(--line)}
.hrow b{text-align:right}
.t-hit{color:var(--hit)} .t-weak{color:var(--weak)} .t-miss{color:var(--miss)}

/* moves */
.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.search{flex:1 1 220px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:9px 12px 9px 34px;font-size:1rem}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .n{opacity:.6;margin-left:4px;font-weight:500}
.mgroup{margin-bottom:18px}
.mgroup>h3{font-family:var(--f-display);font-weight:400;font-size:1.1rem;color:var(--muted);margin:0 0 8px;display:flex;gap:10px;align-items:center}
.mgroup>h3::after{content:"";flex:1;border-top:1px solid var(--line)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px;align-items:start}
.move{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);overflow:hidden}
.move.mine{border-left:3px solid var(--accent)}
.mh{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px}
.mh .t{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-weight:800;font-size:1rem;display:flex;align-items:center;gap:6px}
.mh .t svg{width:12px;height:12px;color:var(--muted);transition:transform .15s;flex:none}
.move.open .mh .t svg{transform:rotate(90deg)}
.rollb{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:7px;padding:3px 9px;font-weight:800;font-size:.82rem;white-space:nowrap}
.rollb:hover{background:var(--accent);color:var(--on-accent)}
.mb{padding:0 12px 12px;font-size:.93rem;display:none}
.move.open .mb{display:block}
.mb p{margin:.35em 0}
.mb ul{margin:.3em 0;padding-left:1.2em}
.mb b{color:var(--ink)}
.mb .tier{font-weight:800}
.mfoot{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.empty{color:var(--muted);font-size:.92rem;padding:10px 0}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}

/* inventory */
.load{display:flex;align-items:baseline;gap:8px}
.load b{font-size:1.3rem}
.pill{font-size:.75rem;font-weight:800;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--weak);color:var(--on-accent)} .pill.bad{background:var(--miss);color:var(--on-accent)} .pill.ok{background:var(--accent-soft);color:var(--accent)}
.items{display:flex;flex-direction:column;margin-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 3.4ch auto auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.item input{border:0;background:transparent;padding:3px 2px;min-width:0;width:100%}
.item input:focus{background:var(--bg);outline:1px solid var(--line);border-radius:4px}
.item .w{text-align:center;font-weight:700}
.uses{display:flex;align-items:center;gap:3px;font-size:.8rem;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:5px;font-size:1rem;line-height:1}
.x:hover{color:var(--miss);background:var(--sunk)}
.coin{display:flex;align-items:center;gap:8px;margin-top:10px}
.coin input{width:7ch;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 8px;font-weight:800}

/* bonds */
.bond{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)}
.bond textarea{flex:1;border:0;background:transparent;resize:none;min-height:2.6em;padding:3px 2px;field-sizing:content}
.bond textarea:focus{background:var(--bg);outline:1px solid var(--line);border-radius:4px}
.bond.res textarea{text-decoration:line-through;color:var(--muted)}
.notes{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;resize:vertical}

/* roll result */
.result{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgb(0 0 0 / .22);padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.result .tot{font-size:2.6rem;font-weight:800;line-height:1;min-width:2.2ch;text-align:center}
.result .what{font-weight:800}
.result .tier{font-family:var(--f-display);font-size:1.25rem;line-height:1.1}
.result .parts{font-size:.8rem;color:var(--muted)}
.result.pop{animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.96);opacity:.4}}
.dice{display:flex;gap:4px;margin-top:4px}
.die{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:.85rem}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(10 14 18 / .55);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.modal h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin-bottom:4px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.ccard{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.ccard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ccard b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.ccard span{font-size:.8rem;color:var(--muted)}
.cw{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-top:6px}
.cw[aria-pressed="true"]{border-style:solid;border-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:10px}
.spec-row{display:flex;gap:6px}
.spec-row input{flex:1}
.check{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.check input{margin-top:4px}
textarea.inp{min-height:140px;resize:vertical}

/* tabs (phones) */
.tabs{display:none}
@media (max-width:1180px){
  .grid{grid-template-columns:minmax(260px,300px) minmax(0,1fr)}
  .colR{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
}
@media (max-width:780px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{flex:1;border:0;background:none;padding:12px 0;font-weight:700;color:var(--muted)}
  .tabs button[aria-pressed="true"]{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
  body[data-tab="sheet"] .colM, body[data-tab="sheet"] .colR{display:none}
  body[data-tab="moves"] .colL, body[data-tab="moves"] .colR{display:none}
  body[data-tab="gear"] .colL, body[data-tab="gear"] .colM{display:none}
  .result{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .top-in .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v2 additions ---- */
.ctabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 12px;flex-wrap:wrap}
.ctabs button{border:0;background:none;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ctabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ctabs .n{font-weight:500;opacity:.6;margin-left:4px}
.ref{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.04em;white-space:nowrap}
.move.super{opacity:.55}
.move .sub{font-size:.78rem;color:var(--muted);padding:0 12px 6px 32px;margin-top:-6px}
.holdc{display:inline-flex;align-items:center;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
.holdc b{min-width:1.6ch;text-align:center;color:var(--ink)}
.holdc .step{width:22px;height:22px}
.t-12{color:var(--accent)}
.res-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}

/* damage */
.dmgparts{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.dmgpart{display:flex;align-items:center;gap:8px;font-size:.88rem}
.dmgpart input{margin:0}
.dmgpart .e{margin-left:auto;font-weight:800}
.quest{display:flex;align-items:center;gap:6px;font-size:.85rem;margin-top:6px}

/* gear */
.item{grid-template-columns:auto minmax(0,1fr) 3.4ch auto}
.tagrow .uses{margin-right:4px}
.tagrow .uses .step{width:22px;height:22px}
.eqb{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);padding:0;font-size:.8rem;color:var(--muted)}
.eqb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.eqb.na{visibility:hidden}
.tagrow{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:4px;margin-top:-2px}
.tag{font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.tag.hot{background:var(--accent-soft);color:var(--accent)}
.armorline{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:.85rem;color:var(--muted);margin-top:6px}
.armorline b{color:var(--ink)}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:6px;max-height:50vh;overflow:auto;margin-top:10px}
.citem{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:3px}
.citem:hover{border-color:var(--accent)}
.citem b{font-size:.95rem}
.citem span{font-size:.78rem;color:var(--muted)}

/* builder */
.modal.wide{width:min(1100px,100%)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 14px}
.steps button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:700;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button.done{color:var(--accent);border-color:var(--accent)}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,320px);gap:16px;align-items:start}
@media (max-width:780px){.bgrid{grid-template-columns:minmax(0,1fr)}}
.summary{position:sticky;top:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.summary .big{font-family:var(--f-display);font-size:1.3rem}
.summary ul{margin:0;padding-left:1.1em}
.speclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:8px;max-height:56vh;overflow:auto;padding:2px}
.scard{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}

.scard b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}

.scard .mv{font-size:.8rem;font-weight:700}
.scard.dis{opacity:.45}
.archgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:8px}
.optlist{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);cursor:pointer}

.arr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:500px){.arr{grid-template-columns:repeat(2,1fr)}}

/* level up */
.lgroup{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.lgroup>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:baseline;background:var(--bg)}
.lgroup>summary::-webkit-details-marker{display:none}
.lgroup>summary b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.lgroup .litems{display:flex;flex-direction:column;gap:6px;padding:8px 12px 12px}
.lopt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.lopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lopt.unmet{opacity:.5}
.lopt .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lopt .h b{font-size:1rem}
.lopt .txt{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lopt[aria-pressed="true"] .txt{-webkit-line-clamp:unset;color:var(--ink)}
.locked{opacity:.55}

/* spells */
.budget{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

.spell .lv{font-size:.72rem;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--sunk);color:var(--muted);min-width:3.2em;text-align:center;margin-top:2px}
.spell.prep .lv{background:var(--accent);color:var(--on-accent)}
.spell.gone{opacity:.5}
.spell .nm{font-weight:800}
.spell .st{font-size:.75rem;font-weight:700;color:var(--muted)}
.spell .body{font-size:.88rem;margin-top:4px;display:none}
.spell.open .body{display:block}
.spell .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* extras */
.xcard{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}

.xcard h3 input{font:inherit;border:0;background:transparent;flex:1;min-width:0;border-bottom:1px dashed var(--line)}
.xstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.xstats label{display:flex;flex-direction:column;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.xstats input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-size:.95rem;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.xcard textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-height:60px;resize:vertical}
.suggest{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.origin{font-size:.85rem;color:var(--muted);font-style:italic}
.speclines{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.specline{display:flex;gap:6px;align-items:baseline;font-size:.85rem;flex-wrap:wrap}

.advlist{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.advlist>summary{cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:700;font-size:.92rem;list-style:none}
.advlist>summary::-webkit-details-marker{display:none}
.advlist>summary::before{content:"▸";color:var(--muted)}
.advlist[open]>summary::before{content:"▾"}
.mgroup>h3 .ref{font-family:var(--f-body)}
.mgroup.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent);border-radius:10px}100%{box-shadow:0 0 0 3px transparent}}
#lsum.need{color:var(--weak);font-weight:700}
.mgroup{scroll-margin-top:84px}

.warnline{color:var(--weak);font-weight:700;margin-top:0}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.rrow{grid-template-columns:minmax(0,1fr)}}
.rrow select{width:100%}

/* journal */
.jtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ghostchip{border-style:dashed}
.jlist{display:flex;flex-direction:column;gap:8px}
.jentry{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:84px}
.jentry.pinned{border-color:var(--accent)}
.jentry.isdone .jtitle{text-decoration:line-through;color:var(--muted)}
.jentry.editing{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.jentry.flashj{animation:flash 1.6s ease-out}
.jrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jtitle{font-size:1rem;min-width:0;overflow-wrap:anywhere}

.jbody p{margin:.3em 0}.jbody ul{margin:.3em 0;padding-left:1.2em}

.catedit{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.catrow{display:flex;gap:8px;align-items:center}.catrow .inp{max-width:240px}
.jsum{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;align-items:flex-start}
.jlink{border:0;background:none;padding:0;text-align:left;font-weight:700;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.jgoalrow{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}

.bkpill{border-color:var(--weak);color:var(--weak)}
.bkbanner{border-color:var(--weak);background:color-mix(in srgb,var(--weak) 12%,var(--surface))}

.status.bad i{background:var(--miss)}

.eyeb{display:inline-grid;place-items:center;width:30px;height:30px;color:var(--muted)}
.eyeb[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.bondveil{width:100%;border:1px dashed var(--line);border-radius:10px;background:repeating-linear-gradient(135deg,var(--sunk) 0 8px,var(--bg) 8px 16px);padding:16px;display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:700;color:var(--ink)}
.rspec{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

@keyframes spFlicker{0%{transform:scale(1,1)}35%{transform:scale(.96,1.04) skewX(-2deg)}70%{transform:scale(1.03,.97) skewX(1.5deg)}100%{transform:scale(.98,1.02)}}

<script id="data" type="application/json">{"cw":{"arch":{"Adventurer":{"title":"Dumb Luck","page":38,"blurb":"Jack of all trades, master of none. The adventurer’s specialties are a mish-mash of strange things that don’t fit the other archetypes.","statsText":"The specialties you choose may modify these scores: Your base damage is d6. Your load is 7+STR. Your maximum HP is 6+Constitution.","startIntro":"Choose three adventurer specialties. You get all the starting moves from each. Make a note of any stat modifiers from your specialties. Each time you level up, choose one advanced move from those offered by your three specialties.\nYou may instead choose only two adventurer specialties instead of three. Take a level 2-5 move from one of them right away, but no other bonuses.\nYou may instead choose two adventurer specialties and one specialty from another archetype, but:\n- If you choose a magician specialty, reduce your base damage by one die size (from d6 to d4).\n- If you choose a specialty from any other archetype, your stats remain unchanged.","advIntro":"Each time you level up, choose an advanced move from one of your specialties. Or choose one of the following options:\n- At any level, instead of a move from one of your specialties, you may choose a move from one of the other adventurer specialties. You may do this twice only.\n- Once between levels 2-5, instead of a move from one of your specialties, you may choose a move from any other archetype.\n- Twice between levels 6-10, instead of a move from one of your specialties, you may choose a move from any other archetype.","starting":[],"alignments":[{"type":"Chaotic","text":"Spur others to significant and unplanned action."},{"type":"Evil","text":"Shift danger or blame from yourself to someone else."},{"type":"Good","text":"Endanger yourself to combat an unnatural threat."},{"type":"Lawful","text":"Help a criminal receive their just rewards."},{"type":"Neutral","text":"Avoid a conflict or defuse a tense situation."}],"bonds":["__________ does not understand me or my culture. I will explain myself to them, no matter how long it takes.","__________ doesn’t think I’m cut out for this life. I’ll show them!","__________ got me involved in a dubious adventure, and now I’m having second thoughts.","__________ has been through hardships that would break me. They can stand against the darkness I see looming over the world.","__________ has seen the lands of my home, more recently than me.","__________ is a friend of a friend, so if they don’t get me out of this mess, they’re going to be in trouble!","__________ knows I have a secret map.","__________ owes me a favour.","__________ talked me into it.","I am in love with __________."],"gear":"You get whatever you were wearing when the adventure started, and choose one:\n○ 13 coins.\n○ Adventuring gear (5 uses, 1 weight).\n○ Dungeon rations (5 uses, 1 weight).\n○ Healing potion.\n○ Horse or other steed.\n○ Makeshift club (close, 1 weight).\n○ Spare change of clothes.","races":[{"name":"Dwarf","text":"When you share a drink with someone, you may parley with them using CON instead of CHA."},{"name":"Elf","text":"When you enter an important location (your call), you can ask the GM for one fact from the history of that location."},{"name":"Halfling","text":"When you attack with a ranged weapon, deal +2 damage."},{"name":"Human","text":"When you make camp in a dungeon or city, you don’t need to consume a ration."}]},"Disciple":{"title":"Strength of Will","page":106,"blurb":"The disciple follows the narrow path of devotion. Whether to a code of honour or a sentient deity, the disciple’s faith is a beacon in the darkness, a strength that moves mountains—an inspiration.","statsText":"The specialties you choose may modify these scores: Your base damage is d6. Your load is 9+STR. Your maximum HP is 8+Constitution.","startIntro":"Choose three disciple specialties. You get all the starting moves from each. Make a note of any stat modifiers from your specialties. Each time you level up, choose one advanced move from those offered by your three specialties.\nYou may instead choose only two disciple specialties instead of three. Take a level 2-5 move from either one of them right away, but no other bonuses.\nYou may instead choose two disciple specialties and one specialty from another archetype, but:\n- If you choose a magician specialty, reduce both your base damage by one die size (from d6 to d4) and your maximum hit points by 2.\n- If you choose a rogue or adventurer specialty, reduce your maximum hit points by 2.\n- If you choose a warrior specialty, your stats do not change.\nDisciples also start with this move in addition to starting moves from specialties:","advIntro":"Each time you level up, choose an advanced move from one of your specialties. Or choose one of the following options:\n- At any level, instead of a move from one of your specialties, you may choose a move from one of the other disciple specialties. You may do this twice only.\n- Twice between levels 6-10, instead of a move from one of your specialties, you may choose a move from any other archetype.","starting":[{"name":"Devotion","text":"You are devoted to something larger than yourself: a calling, a deity, a mission, or a philosophy. Whatever it is, it fills your life with purpose, your soul with enthusiasm, and your limbs with strength. Choose up to three spheres of influence (but always at least one) that your devotion gives you special insight into:\n○ Animals.\n○ Battle (or any specific aspect of it).\n○ Death (or any specific aspect of it).\n○ The Earth (or the chthonic goddesses, or nature).\n○ Healing (or fertility, medicine, or renewal).\n○ Judgment (or conquest, law, or social order).\n○ Plants (or agriculture, or the natural world).\n○ Protection (or mercy).\n○ Revelation (or knowledge, learning, or truth).\n○ The Sky (or weather).\n○ Wisdom.\nAlso, choose a set of codes, strictures or tenets that you live by— some things you are supposed to do, some things you are forbidden to do. You can also flesh out your lifestyle during play.","page":107}],"alignments":[{"type":"Evil","text":"Harm another to prove the superiority of your devotion."},{"type":"Good","text":"Give someone aid according to the spheres you have insight into."},{"type":"Lawful","text":"Endanger yourself in order to follow the precepts you are devoted to."},{"type":"Neutral","text":"Avoid trouble or loss by following your ideals."}],"bonds":["__________ does not understand my faith and devotion. I will help them understand, no matter how long it takes.","__________ has been through hardships that would break me. They can stand against the darkness I see looming over the world.","__________ has insulted my devotion. I do not trust them.","__________ is a good and faithful person. I trust them implicitly.","__________ showed me true insights into the path I must follow.","I am working on getting __________ to share my ideals.","I have heard of __________’s exploits and am suitably impressed.","I have shared the secrets of my devotion with __________."],"gear":"You have clothes appropriate to your calling and present situation, dungeon rations (5 uses, 1 weight), an item that symbolizes your devotion, and choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Bandages (3 uses, slow) and a healing potion.\n○ Chainmail (1 armour, 1 weight).\n○ Shield (+1 armour, 2 weight).\n○ Staff (close, two-handed, 1 weight).","races":[{"name":"Dwarf","text":"When you swear an oath according to the precepts of your faith, take +1 forward to accomplish it. If you fail to do so, or you turn away from your oath (to swear another one, for example), take -1 forward."},{"name":"Elf","text":"When you spend a day in contemplation, gain 1 preparation if you take action the next day."},{"name":"Halfling","text":"You sing the healing songs of spring and brook. When you make camp, you and your allies heal +1d6."},{"name":"Human","text":"When you pray for guidance, even for a moment, if you ask “What here is evil?” the GM will tell you, honestly."}]},"Magician":{"title":"The Colour of Magic","page":216,"blurb":"Magicians handle sources of power that no one else would dream of getting mixed up with.","statsText":"The specialties you choose may modify these scores: Your base damage is d4. Your load is 6+STR. Your maximum HP is 6+Constitution.","startIntro":"Choose two magician specialties and one of the following:\n- A level 2-5 move from either magician specialty.\n- A specialty from another archetype.\n- A third magician specialty.\nYou get all the starting moves from each specialty. Make a note of any stat modifiers from your specialties. Each time you level up, choose one advanced move from those offered by your specialties.","advIntro":"Each time you level up, choose an advanced move from one of your specialties. Or choose one of the following options:\n- At any level, instead of a move from one of your specialties, you may choose a move from one of the other magician specialties. You may do this twice only.\n- Once between levels 2-5, instead of a move from one of your specialties, you may choose a move from any other archetype.\n- Once between levels 6-10, instead of a move from one of your specialties, you may choose a move from any other archetype.","starting":[],"alignments":[{"type":"Chaotic","text":"Add more magic to the civilized world."},{"type":"Evil","text":"Use magic to cause terror and fear."},{"type":"Good","text":"Use magic to directly aid another."},{"type":"Neutral","text":"Discover something about a magical mystery."}],"bonds":["__________ does not trust me, and for good reason.","__________ has supplied me with forbidden tomes.","__________ seems suitably impressed by my powers and I just can’t help showing off in front of them.","__________ will play an important role in the events to come. I have foreseen it!","I have used my magic on behalf of __________ before.","This is not my first adventure with __________."],"gear":"You start with your clothes, a backpack or shoulder bag, dungeon rations (5 uses, 1 weight), and choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Bag of books (5 uses, 2 weight).\n○ Dagger (hand, 1 weight).\n○ Staff (close, two-handed, 1 weight).\n○ Three healing potions.","races":[{"name":"Dwarf","text":"Your race is hardy, even in the face of sorcery. When you are the target of a magical effect or spell, you get +1 armour forward or +1 armour ongoing until the spell wears off if the effect is ongoing."},{"name":"Elf","text":"Magic is as natural as breath to you. When you discern realities, on a hit, the GM will also tell you if anything you are studying is magical."},{"name":"Halfling","text":"You sing the healing songs of spring and brook. When you make camp, you and your allies heal +1d6."},{"name":"Human","text":"Battle magic is like food and drink to you. When you cause harm with magic, deal +2 damage."}]},"Rogue":{"title":"In the Shadows","page":330,"blurb":"Rogues are pretty much experts in some form of deceit, be it stealing, lying, or staying out of sight.","statsText":"The specialties you choose may modify these scores: Your base damage is d8. Your load is 8+STR. Your maximum HP is 6+Constitution.","startIntro":"Choose three rogue specialties. You get all the starting moves from each. Make a note of any stat modifiers from your specialties. Each time you level up, choose one advanced move from those offered by your three specialties.\nYou may instead choose only two rogue specialties instead of three. Take a level 2-5 move from one of them right away, but no other bonuses.\nYou may instead choose two rogue specialties and one specialty from another archetype, but:\n- If you choose a warrior specialty, your stats remain unchanged.\n- If you choose a specialty from any other archetype, your base damage is d6 instead of d8.\nRogues also start with this move in addition to starting moves from specialties:","advIntro":"Each time you level up, choose an advanced move from one of your specialties. Or choose one of the following options:\n- At any level, instead of a move from one of your specialties, you may choose a move from one of the other rogue specialties.\nYou may do this twice only.\n- Once between levels 2-5, instead of a move from one of your specialties, you may choose a move from any other archetype.\n- Twice between levels 6-10, instead of a move from one of your specialties, you may choose a move from any other archetype.","starting":[{"name":"Flexible Morals","text":"When someone tries to detect your alignment, you can tell them any alignment you like.","page":330}],"alignments":[{"type":"Chaotic","text":"Leap into danger without a plan."},{"type":"Evil","text":"Shift danger or blame from yourself to someone else."},{"type":"Good","text":"Give to the poor what you take from the rich."},{"type":"Neutral","text":"Tell an elaborate lie and get away with it."}],"bonds":["__________ and I have a con running.","__________ has my back when things go wrong.","__________ helped me make some important contacts. I owe them.","__________ is my lover, or was, or would have been, or… it’s complicated.","__________ knows incriminating details about me.","__________ left me in a pinch when they were supposed to come through for me.","__________ still owes me for some stuff they were supposed to fence for me.","Me and __________ are the only survivors of a dubious adventure."],"gear":"You start with your own clothes (or someone else’s), some dungeon rations (5 uses, 1 weight), and choose one piece of roguish gear:\n○ Backpack and adventuring gear (5 uses, 1 weight).\n○ Dagger (hand, 1 weight).\n○ Healing potion.\n○ Lantern (2 weight) and oil (5 uses).\n○ Ragged bow (near, 2 weight) and a bundle of arrows (3 ammo, 1 weight).","races":[{"name":"Dwarf","text":"You have a nose for gold and gems. When you discern realities, add this to the list of questions you can ask:\n- Is there treasure here?"},{"name":"Elf","text":"Choose one weapon—you can always treat weapons of that type as if they had the precise tag."},{"name":"Halfling","text":"When you attack with a ranged weapon, deal +2 damage."},{"name":"Human","text":"You are a professional. When you spout lore or discern realities about criminal activities, take +1."}]},"Warrior":{"title":"Why We Fight","page":402,"blurb":"The warrior is someone whose business it is to fight, to wage battle, to handle violence like a lover. The war is the warrior’s way.","statsText":"The specialties you choose may modify these scores: Your base damage is d10. Your load is 10+STR. Your maximum HP is 10+Constitution.","startIntro":"Choose three warrior specialties. You get all the starting moves from each. Make a note of any stat modifiers from your specialties. Each time you level up, choose one advanced move from those offered by your three specialties.\nYou may instead choose only two warrior specialties instead of three. Take a level 2-5 move from either of them right away, but no other bonuses.\nYou may instead choose two warrior specialties and one specialty from another archetype, but:\n- If you choose a disciple specialty, reduce your base damage by one die size (from d10 to d8).\n- If you choose a magician specialty, reduce both your base damage by one die size (from d10 to d8) and your maximum hit points by 2.\n- If you choose a rogue specialty, reduce your maximum hit points by 2.\n- If you choose an adventurer specialty, either reduce your base damage by one die size (from d10 to d8), or reduce your maximum hit points by 2.","advIntro":"Each time you level up, choose an advanced move from one of your specialties. Or choose one of the following options:\n- At any level, instead of a move from one of your specialties, you may choose a move from one of the other warrior specialties. You may do this twice only.\n- Once between levels 2-5, instead of a move from one of your specialties, you may choose a move from any other archetype.\n- Once between levels 6-10, instead of a move from one of your specialties, you may choose a move from any other archetype.","starting":[],"alignments":[{"type":"Chaotic","text":"Free someone from literal or figurative bonds."},{"type":"Evil","text":"Kill a defenceless or surrendered enemy."},{"type":"Good","text":"Endanger yourself to protect someone weaker than you."},{"type":"Lawful","text":"Deny mercy to a criminal or unbeliever."},{"type":"Neutral","text":"Defeat a worthy opponent."}],"bonds":["__________ gave me food and shelter when I had nothing.","__________ got me involved in a questionable adventure and I’m having second thoughts about it now.","__________ is a brave soul, I have much to learn from them.","__________ is always getting into trouble—I must protect them from themselves.","__________ owes me their life, whether they admit it or not.","__________ was once my enemy, but we’ve since reconciled.","I have sworn to protect __________.","I worry about the ability of __________ to survive in the dungeon."],"gear":"You start with your clothes, a backpack, a torch, some dungeon rations (5 uses, 1 weight), and choose one piece of fighting gear:\n○ Adventuring gear (5 uses, 1 weight).\n○ Chainmail (1 armour, 1 weight).\n○ Dagger (hand, 1 weight).\n○ Shield (+1 armour, 2 weight).\n○ Short sword (close, 1 weight).\n○ Spear (reach, 1 weight).","races":[{"name":"Dwarf","text":"When you share a drink with someone, you may parley with them using CON instead of CHA."},{"name":"Elf","text":"Choose one weapon—you can always treat weapons of that type as if they had the precise tag."},{"name":"Halfling","text":"When you defy danger and use your small size to your advantage, take +1."},{"name":"Human","text":"Once per battle you may reroll a single damage roll (yours or someone else’s)."}]}},"specs":[{"name":"Bard","archetype":"Adventurer","page":42,"blurb":"A performer’s life is the one for you, travelling the world, singing its songs, and telling its tales.","compendium":"Once you have trained for a year at the feet of a master bard and passed the examination by proving your knowledge, you may consider the bard specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the bard specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Bardic Lore","text":"Choose an area of expertise:\n○ A Bestiary of Creatures Unusual.\n○ The Dead and Undead.\n○ Gods and their Servants.\n○ Grand Histories of the Known World.\n○ Legends of Heroes Past.\n○ The Planar Spheres.\n○ Spells and Magicks.\nWhen you first encounter an important creature, location, or item (your call) covered by your bardic lore, you can ask the GM any one question about it; the GM will answer truthfully. The GM may then ask you what legend, song, or tale you heard that information in.","page":42},{"name":"A Port in the Storm","text":"When you return to a civilized settlement you’ve visited before, tell the GM when you were last here. They’ll tell you how it’s changed since then.","page":43}],"advanced":[{"name":"Bamboozle","text":"When you parley with someone, on a hit, you also take +1 forward with them.","page":43,"tier":2},{"name":"Bardic Expert","text":"Choose a second area of expertise from the bardic lore list.","page":43,"tier":2,"requires":["Bardic Lore"]},{"name":"Fount of Knowledge","text":"When you spout lore about something no one else has any clue about, take +1.","page":43,"tier":2},{"name":"A Little Help From my Friends","text":"When you successfully aid someone, you take +1 forward as well.","page":43,"tier":2},{"name":"Con","text":"When you parley with someone, on a hit, you also take +1 forward with them and get to ask their player one question which they must answer truthfully.","page":44,"tier":6,"replaces":["Bamboozle"]},{"name":"An Ear for Magic","text":"When you hear an enemy cast a spell, the GM will tell you the name of the spell and its effects. Take +1 forward when acting on the answers.","page":44,"tier":6},{"name":"Reputation","text":"When you first meet someone who’s heard of you, roll+CHA. On a 10+, tell the GM two things they’ve heard about you. On a 7-9, tell the GM one thing they’ve heard, and the GM tells you one thing.","stat":"CHA","page":44,"tier":6},{"name":"Unforgettable Face","text":"When you meet someone you’ve met before (your call) after some time apart, you take +1 forward against them.","page":44,"tier":6}],"alignments":[{"type":"Good","text":"Leave someone more knowledgeable than when you met them."},{"type":"Neutral","text":"Uncover a secret truth."}],"bonds":["__________ trusted me with a secret.","This is not my first adventure with __________."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Halfling pipeleaf (6 uses).\n○ Leather armour (1 armour, 1 weight).\n○ Ostentatious clothes.\n○ Worn bow (near, 2 weight), and bundle of arrows (3 ammo, 1 weight).","races":[{"name":"Dwarf","text":"You can also count the dwarves and their mountains as part of your bardic lore."},{"name":"Elf","text":"You can also count the elves and their forests as part of your bardic lore."},{"name":"Halfling","text":"You can also count the halflings and their shires as part of your bardic lore."},{"name":"Human","text":"When you first enter a civilized settlement, someone who respects the custom of hospitality to bards will take you in as their guest."}]},{"name":"Caver","archetype":"Adventurer","page":46,"blurb":"Where do monsters hide their treasures? Deep underground, in caves. Who knows how to find those treasures? You do.","compendium":"Once you have fully explored a legendary cave, you may consider the caver specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the caver specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Dungeon Crawl","text":"When you defy danger to get through a difficult or dangerous passageway, on a hit, you may bring one of your companions through with you safely. Whatever you roll, you may sacrifice a piece of your gear to ignore a consequence—whichever piece is most readily at hand or makes the most sense. If this is adventuring gear that is still undefined, say what it is now.","page":46}],"advanced":[{"name":"Bug Eater","text":"When you make camp in a cave, or undertake a perilous journey through a cave, you do not need to consume any rations. If you act as quartermaster underground, you automatically succeed as if you had rolled a 10+, and you may take on a second job as well.","page":47,"tier":2},{"name":"Lynx-Eyed, Like Burning Coals","text":"Your eyes cut through the night and you need bring neither lamp nor torch to see in even the most Stygian darkness.","page":47,"tier":2},{"name":"Mental Map","text":"You have perfect recall of the places you have explored. You can always find your way back to an underground location you have been to, without considering it a perilous journey. If anything has changed since your last visit, you spot it right away.","page":47,"tier":2},{"name":"Rope Tricks","text":"With time and room to use your rope, you can safely traverse a dangerous environment (don’t roll) and take others with you, provided they follow your instructions. You can also use your rope as a weapon (reach, near, forceful) that does stun damage.","page":47,"tier":2},{"name":"Tremors","text":"You can feel vibrations echoing through the earth. You can never be ambushed or surprised underground, even in the dark. When an enemy, trap, or accident would get the drop on you, you get to act first unless they never touch the earth.","page":47,"tier":2},{"name":"Cavedancer","text":"When you use the natural formations of a cave to your advantage, take +1 to defend and defy danger.","page":48,"tier":6},{"name":"Cavespeaker","text":"When you ask a cave about someone or something else inside it, roll+INT. On a 10+, the cave tells where it is, what it’s doing, and answers any one question you ask about it. On a 7-9, the cave tells you either where it is or what it’s doing.","stat":"INT","page":48,"tier":6,"requires":["Tremors"]},{"name":"Strange Medicine","text":"When you have time to gather supplies in a natural cave, you can prepare a poultice that will heal one debility next time you make camp.","page":48,"tier":6,"requires":["Bug Eater"]}],"alignments":[{"type":"Evil","text":"Use something you found underground to harm another."},{"type":"Good","text":"Remove a threat to others that emanates from underground."},{"type":"Neutral","text":"Recover something from underground that is useful even though it is not valuable."}],"bonds":["__________ shares my thirst for adventure.","I worry about __________’s ability to survive underground."],"gear":"You get adventuring gear (5 uses, 1 weight), dungeon rations (5 uses, 1 weight), and choose one weapon:\n○ Axe (close, 2 weight).\n○ Dagger (hand, 1 weight).\n○ Sword (close, 2 weight).","races":[{"name":"Elf","text":"Choose one weapon—you can always treat weapons of that type as if they had the precise tag."},{"name":"Halfling","text":"You know how to take advantage of your small size underground, where you get +1 armour if you’re at all able to defend yourself."}]},{"name":"Engineer","archetype":"Adventurer","page":50,"blurb":"Wizards and warlords think their powers are the mightiest of all, but how could their triumphs ever be as useful as the machines you build?","compendium":"Once you have successfully built a machine, you may consider the engineer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the engineer specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Mother of Invention","text":"When you build a machine, the GM will name one requirement for each function the machine will perform:\n- It will take a long time.\n- You need help or someone else’s expertise.\n- You need materials above and beyond what you have now.\n- You need to build something else first.\n- You need to take something else apart to build it.\nOnce you meet the requirements, roll+INT. On a hit, it works like you want it to, as far as the materials it is made out of can handle, but on a 7-9, there is also a flaw in your design. The GM will tell you what. On a miss, it doesn’t work the way you want it to.","stat":"INT","page":50}],"advanced":[{"name":"Land Surveyor","text":"When you search or survey a location, roll+INT. On a 10+, you may ask the GM three questions from the list below. On a 7-9, ask two. On a miss, ask one anyway, but you may not like the answer much. Take +1 forward when you act on the answers.\n- How could this place be ruined?\n- Is there a way out, past, or through?\n- What here could cause someone harm?\n- Who else has been here and what were they doing?","stat":"INT","page":51,"tier":2},{"name":"Mechanical Aptitude","text":"You may study machines and mechanisms as if they were people. When you do, you may discern realities with INT instead of WIS.","page":51,"tier":2},{"name":"Mining Engineer","text":"When you discern realities underground, the GM will also tell you about any natural hazards nearby, such as flooding, gas, or the risk of a cave in.","page":51,"tier":2},{"name":"Demolition","text":"When you prepare materials in order to demolish or destroy a location, the GM will choose one or two requirements:\n- These materials will have to be applied very carefully.\n- These materials will have to be transported very carefully.\n- You need arcane ingredients to harm this location.\n- You need to spend a lot of coin on these ingredients.\nMeet the requirements and your compounds will get rid of this location or change it irrevocably.","page":51,"tier":6},{"name":"Mechanical Genius","text":"You may study machines and mechanisms as if they were people. When you do, you may discern realities with INT instead of WIS. On a 12+, you may ask any three questions you like, not limited to the list.","page":52,"tier":6,"requires":["Mechanical Aptitude"]},{"name":"Renovation","text":"When you make alterations to an existing structure, natural or built, roll+INT. On a 10+, choose two. On a 7-9, choose one:\n- Your work contains hidden elements.\n- Your work is artfully done, exquisite, or extravagantly grand.\n- Your work is durable and will last.\nIf you have spent either a great deal of coin or an unreasonable amount of time, you can choose one extra option.","stat":"INT","page":52,"tier":6}],"alignments":[{"type":"Chaotic","text":"Build machines that give power to the powerless."},{"type":"Evil","text":"Strike terror into the hearts of others with your machines."},{"type":"Neutral","text":"Gain tangible profits by building or operating machines."}],"bonds":["__________ has offered to help me build something truly amazing."],"gear":"You get a kit full of tools (2 weight), in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"Gold and gems are what you crave, so much so that you can smell them! When you discern realities, the GM will always tell you if there’s treasure here without you asking."},{"name":"Human","text":"When you use an engineer move that lets you ask the GM questions, you may also ask how you can make things more comfortable for humans and less hospitable to non-humans, in addition to your other questions."}]},{"name":"Fool","archetype":"Adventurer","page":54,"blurb":"What are you doing, you idiot? Don’t touch that!","compendium":"Once you have done something so blusteringly idiotic that everyone around you is stunned speechless in amazement, you may consider the fool specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the fool specialty, lower your damage die by one size, but not lower than d4, and raise your maximum HP by 2.","mods":{"dmg":-1,"hp":2},"starting":[{"name":"Lucky Charm","text":"You have a blessed charm that grants you great Luck, which is an extra stat for you. When you make camp, reset your Luck to 3. When you roll and miss, you may lower your Luck by 1 to re-roll. Take the second result, and if it is a hit, explain how you succeeded only through sheer luck. When your Luck is zero, you may not lower it further, and you take -1 ongoing until you gain more.","page":54}],"advanced":[{"name":"Curiosity","text":"When you put yourself at risk to check something out, ask the GM any one question related to the risks and roll+Luck. On a 10+, the GM will answer it, as clearly as the circumstances allow. On a 7-9, the GM will tell you what more you need to do to find the answer yourself.","page":55,"tier":2,"requires":["Lucky Charm"]},{"name":"A Fool and His Money","text":"When you pay too much for something, the GM will tell you something useful and interesting about the item you bought, and you take +1 forward when using it—even though you were swindled.","page":55,"tier":2},{"name":"Lucky for You!","text":"When you take damage that was intended for someone else, you get +1 Luck. You may not spend Luck to negate this damage.","page":55,"tier":2,"requires":["Lucky Charm"]},{"name":"The Mouths of Babes","text":"If you blurt out whatever comes into your head when you spout lore, take +1 to your roll.","page":55,"tier":2},{"name":"Supremely Lucky","text":"When you make camp, reset your Luck to 4 instead of 3. When you take damage, you may lower your Luck by 1 to ignore it. Describe the comedic, contrived, or outright miraculous circumstances that saved you from harm.","page":56,"tier":6,"requires":["Lucky Charm"]},{"name":"Three Stooges","text":"You can lower your Luck by 1 to deal 1d10 damage to an enemy. Describe how you embarrass, humiliate, or accidentally clobber them.","page":56,"tier":6,"requires":["Lucky Charm"]}],"alignments":[{"type":"Chaotic","text":"Endanger yourself in order to experience something new."},{"type":"Good","text":"Remove something dangerous from someone else’s presence."}],"bonds":["I will never give up on __________.","I will protect __________ from the danger that looms over us."],"gear":"You get a stick (close, 1 weight) and a sack, in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"When you suffer a debility, you get +1 Luck."},{"name":"Elf","text":"What? Elves aren’t fools! You get nothing."},{"name":"Halfling","text":"When you eat to excess and suffer the consequences, you get +1 Luck."}]},{"name":"Good Samaritan","archetype":"Adventurer","page":58,"blurb":"The real reason the world is a terrible place is because it has terrible people in it. If everyone would just treat others with kindness and respect, the way you do, we wouldn’t need adventurers!","compendium":"Once you save a person’s life, with no thought to the consequences or of profit, you may consider the good Samaritan specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"You must be of Good alignment to take this specialty.","statsText":"","mods":{},"starting":[{"name":"Charming and Open","text":"When you speak frankly with someone, you can ask their player a question from the list below. They must answer it truthfully, then they may ask you a question from the list (which you must answer truthfully):\n- How can I get you to __________?\n- What are you feeling right now?\n- What do you most desire?\n- What do you wish I’d do?\n- Whom do you serve?","page":58}],"advanced":[{"name":"Ask Me Anything","text":"When another PC comes to you for advice about a difficult problem, if you tell them what you really think they should do, they take +1 forward if they follow your advice, and you mark XP if they succeed.","page":59,"tier":2},{"name":"Helpful","text":"When you aid another PC, treat a miss as a 7-9 result. They always take +1 to their roll.","page":59,"tier":2},{"name":"A Little Help From my Friends","text":"When you successfully aid someone, you take +1 forward as well.","page":59,"tier":2},{"name":"Show Me the Way","text":"When you give a receptive NPC heartfelt advice about what they should do, roll+WIS. On a 10+, they follow your advice in whatever way they think is most beneficial for them. On a 7-9, they only follow your advice if you back them up and help them do it.","stat":"WIS","page":59,"tier":2},{"name":"Show Me the Right Way","text":"When you give a receptive NPC heartfelt advice about what they should do, roll+WIS. On a 12+, they do exactly what you tell them to do. On a 10-11, they follow your advice in whatever way they think is most beneficial for them. On a 7-9, they only follow your advice if you back them up and help them do it.","stat":"WIS","page":59,"tier":6,"replaces":["Show Me the Way"]},{"name":"Tough Love","text":"When you tell another PC that they did something wrong, they take +1 forward to fixing it.","page":60,"tier":6},{"name":"Very Helpful","text":"When you aid another PC, you don’t roll. They take +1 to their roll and if you would share in the consequences of their actions, you always get a chance to defend yourself first.","page":60,"tier":6,"replaces":["Helpful"]}],"alignments":[{"type":"Good","text":"Help someone without them even asking."}],"bonds":["__________ has some problems I could help them solve.","__________ is a valuable friend."],"gear":"Choose one:\n○ Antitoxin and bandages (3 uses, slow).\n○ Healing potion.\n○ Poultices and herbs (2 uses, 1 weight).","races":[{"name":"Dwarf","text":"When you share a drink with someone, choose one:\n- It counts as consuming a ration for both of you.\n- They heal 1d4 damage."},{"name":"Halfling","text":"When you share a ration with someone, it counts as consuming a full ration for both of you and they heal 1d4 damage."}]},{"name":"Householder","archetype":"Adventurer","page":63,"blurb":"Not everyone is lucky enough to own vast estates. But then, not everyone is savvy enough to keep them, either.","compendium":"Once you take possession of a vast estate and acquire the staff to run it, you may consider the householder specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Dominion","text":"You are the master of wealthy estates, either tracks of land, mercantile operations, or governmental offices. When you request an expensive item from your estates, as long as it is not unique, roll+WIS. On a 10+, your estates supply you with your heart’s desire. On a 7-9, you are supplied with the item, but your estates are exhausted until you put them back in order, by doing any one of the following:\n- Close out an old, presumably-problematic account.\n- Set up a new profitable venture.\n- Spend time in your offices reorganizing your accounts.\n- Take a tour of your estates, correcting any errors you encounter.\nOnce you put your estates back in order, you can once again use this move. On a miss, your estates are in disarray.","stat":"WIS","page":63}],"advanced":[{"name":"Cultured Host","text":"When you provide hospitality to someone, take +1 forward to discern realities about them or parley with them.","page":64,"tier":2},{"name":"A Long and Storied History","text":"When you spout lore about your house and its lands, take +1.","page":64,"tier":2},{"name":"Profitable Enterprise","text":"When you return to your estates after an absence, roll+WIS. On a hit, your estates have produced surplus income for you. On a 10+, take 2 income. On a 7-9, take 1 income. You can spend your income this session to put your estates back in order or purchase a moderately expensive item, like a house, from someone else.","stat":"WIS","page":64,"tier":2,"requires":["Dominion"]},{"name":"A Long and Rather Singular History","text":"When you spout lore about your house and its lands, take +1. On a 12+, the GM will ask you one question about the topic. Whatever you answer, it is the truth.","page":64,"tier":6,"replaces":["A Long and Storied History"]},{"name":"Mortgages","text":"When you leverage your estates to purchase something ridiculously expensive (an army, ship, or castle, say), take -1 forward to dominion and roll+WIS. On a 10+, it is yours. On a 7-9, it is mostly yours but there are strings attached and your estates are exhausted.","stat":"WIS","page":64,"tier":6,"requires":["Dominion"]},{"name":"This is my Domain","text":"When you provide hospitality to someone, take +1 ongoing to discern realities about them or parley with them while they stay with you, and take +1 forward against them when they leave.","page":65,"tier":6,"replaces":["Cultured Host"]}],"alignments":[{"type":"Evil","text":"Take someone else’s possessions or position for your own."},{"type":"Good","text":"Use your wealth and power to directly benefit the least fortunate."},{"type":"Lawful","text":"Increase your influence through your economic powers."},{"type":"Neutral","text":"Acquire a new estate or title."}],"bonds":["__________ has worked on my estates before.","__________ is aware of my more sensitive financial arrangements."],"gear":"Choose five different pieces of gear that are not unique items.","races":[]},{"name":"Landed Gentry","archetype":"Adventurer","page":66,"blurb":"To us comes power, land, and title from the divine on high, and so to our lessers do we tend. In swearing true this oath, the lands and people granted to you are not merely yours to command, but to protect, to love as your family as the gods love you as theirs. Under their sight, do you swear it?","compendium":"Once you have been granted a hold by your betters, you may consider the landed gentry specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Landed","text":"You own a stronghold. Give it a name! Add it to the world map as a keep steading with these tags: Poor, Steady, Guard, Oath (protection for nearby lands).Choose two benefits:\n○ Fortified: Your stronghold is nearly impregnable, its walls and siege defences are strong.\n○ Garrisoned: Your stronghold has a Garrison instead of Guard.\n○ Prestigious: Your stronghold is well-known and therefore you are too. Add Personage (you).\n○ Skilled: Your stronghold has people with exceptional skills, such as blacksmithing or magic. Add Craft.\n○ Taxation: Your stronghold provides income, roughly one coin per family within its domain per year.\nThe GM will also give you one complication:\n○ Disputed: Someone else has a claim to your stronghold too.\n○ Infested: There are monsters about.\n○ Unrest: The people are unhappy with the stronghold.","page":66}],"advanced":[{"name":"Call the Banners","text":"When you recruit from your stronghold or the lands it protects, treat any miss as if you had rolled a 7-9 instead.","page":68,"tier":2,"requires":["Landed"]},{"name":"Hold Court","text":"When you hold court and hear the problems of the people, the GM will tell you of at least one opportunity within you stronghold or the areas surrounding it.","page":68,"tier":2,"requires":["Landed"]},{"name":"Long Road Home","text":"No matter where you are, you always know either a long and safe way or a shorter and more dangerous road home to your stronghold. Your choice.","page":68,"tier":2,"requires":["Landed"]},{"name":"Diplomat","text":"When you send a letter requesting a person’s presence in your stronghold, roll+CHA. On a 10+, they agree to visit with the expectation of hospitality. On a 7-9, they name some terms, you must meet them or they refuse.","stat":"CHA","page":68,"tier":6,"requires":["Landed"]},{"name":"Empire","text":"You inherit, by hook or by crook, a second steading. Create it as per the Landed move, but you get the prestigious option for free.","page":68,"tier":6,"requires":["Landed"]},{"name":"In the Service of the People","text":"After either successfully dealing with a problem in your realm set forth by the GM or successfully pursuing an opportunity you heard about while holding court, you may change any one of your stronghold’s tags.","page":69,"tier":6,"requires":["Landed"]}],"alignments":[{"type":"Evil","text":"Intimidate or terrorize the people who live under your rule."},{"type":"Good","text":"Protect the lands you rule from evil."},{"type":"Lawful","text":"Uphold the laws of your lord in the lands you rule."}],"bonds":["__________ helped me get where I am today, and I owe them for it.","__________ is a great help to my stronghold."],"gear":"You start with a stronghold worth of basic supplies, in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"Your stronghold is Dwarven and Wealthy instead of Poor."}]},{"name":"Luminary","archetype":"Adventurer","page":70,"blurb":"Surrounded by your minions, bathed in adulation and respect, you are no flea-bitten, rough-and-tumble mercenary.","compendium":"Once you attract a permanent entourage, either by hiring retainers or becoming famous and admired, you may consider the luminary specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the luminary specialty, lower your damage die by one size, but not lower than d4.","mods":{"dmg":-1},"starting":[{"name":"Entourage","text":"You can surround yourself with up to a dozen or so minions who will back you up, follow your orders, impress people, and help you conduct your business. Choose what type of people compose your entourage:\n- Noble Courtiers: Dissent +2, Eloquence +1, Fighting +1, Learning +1.\n- Obedient Servants: Dissent +0, Eloquence +0, Fighting +1, Learning +1.\n- Savvy Clerks: Dissent +1, Eloquence +1, Fighting +0, Learning +2.\n- Seasoned Mercenaries: Dissent +1, Eloquence +1, Fighting +2, Learning +0.\n- Talented Artistes: Dissent +1, Eloquence +2, Fighting +0, Learning +1.\nYou can order individuals around like hirelings if you want them to do things other than act as part of your entourage. If they are obedient servants, take +1 to order them. If they are noble courtiers, take -1 to order them. Choose your entourage’s accoutrements, as many as their dissent or fighting: Books and instruments, costumes and props, finery and riches, many weapons, metal armour, mounts, samples of your wares, travelling gear.\nChoose their skills, as many as their eloquence or learning: Accounting, appraisal, crime, diplomacy, hospitality, hunting, music and poetry, politics, rhetoric, science, soldiering.\nChoose their weaknesses, as many as their dissent: Arrogant, careless, cowardly, dead inside, feuding, gossiping, greedy, hedonistic, insular, obsequious, religious heresy, treacherous.","page":70},{"name":"Ex Officio","text":"When you’re surrounded by your entourage… …and you attack the same target, add both their dissent and their fighting to your damage. …and you defend the same target, add their fighting to your roll. …and you parley, add their eloquence to your roll. …and you spout lore, add their learning to your roll. …and someone interferes with you, add your entourage’s dissent to their roll.","page":71}],"advanced":[{"name":"Bodyguards","text":"When you are accompanied by your entourage, you get +1 armour.","page":71,"tier":2,"requires":["Entourage"]},{"name":"Dogs of War","text":"When you attack with your entourage, your base damage is d8.","page":72,"tier":2,"requires":["Entourage"]},{"name":"Prestigious Companions","text":"Your entourage gets another pick from accoutrements and another skill, which can be whatever you want.","page":72,"tier":2,"requires":["Entourage"]},{"name":"Influencer","text":"When you parley with someone, on a 12+, not only do they do what you want, they change their mind about you and become your ally. They will no longer advance the GM’s dangers and will instead support your plans.","page":72,"tier":6},{"name":"A Many-Headed Beast","text":"Choose an additional entourage type. You may surround yourself with companions from either type of entourage, but for ex officio you can only use the stats of whichever is most numerous. You can switch between the two types by dismissing some companions and summoning others.","page":72,"tier":6,"requires":["Entourage"]},{"name":"Palace Guard","text":"When you attack with your entourage, your base damage is d12.","page":72,"tier":6,"replaces":["Dogs of War"]},{"name":"Versatile Companions","text":"Choose a move from another class or specialty. You may use this move as long as you are accompanied by your entourage.","page":72,"tier":6,"requires":["Prestigious Companions"]}],"alignments":[{"type":"Chaotic","text":"Run rampant over the plans of someone in a position of authority."},{"type":"Evil","text":"Take someone else’s possessions or position for your own."},{"type":"Good","text":"Provide a good example of leadership for someone else to follow."}],"bonds":["__________ is great to have around, but I wouldn’t trust them with my life.","My entourage is suspicious of __________, but not suspicious enough!"],"gear":"You have enough clothing to always look like the most impressive person amongst your entourage, in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"Your entourage is composed of hardy dwarves, add +1 fighting."},{"name":"Elf","text":"Your entourage is composed of wise elves, add +1 learning."},{"name":"Halfling","text":"Your entourage is composed of proud halflings, and halflings stick together. You entourage’s dissent is one lower (but you cannot choose obedient servants)."},{"name":"Human","text":"Your entourage is silver-tongued and skilled in rhetoric and the laws of mankind, add +1 eloquence."}]},{"name":"Merchant","archetype":"Adventurer","page":76,"blurb":"Money makes the world go ’round.","compendium":"Once you acquire a stable supply of goods and a customer base you can sell them to, you may consider the merchant specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Entrepreneur","text":"You have two or three business ventures:\n○ Apothecary or barber shop (medicine / malpractice).\n○ Brothel (influence or secrets / disease or scandal).\n○ Contracting service (influence / betrayal or scandal).\n○ Extortion racket (influence / turf war).\n○ Grain mill (influence / fire).\n○ Inn (secrets / scandal).\n○ Silver mine (silver / flood or strike).\n○ Smithy (arms and armour / strike or theft).\n○ Trade ships (exotic spices / a ship sinks).\n○ Transportation service (secrets / lost goods).\nWhen you set up a new venture, add it to this list, along with what it produces and possible disasters it could experience. If a venture goes under, remove it from your list. When you have downtime or at the beginning of a session, choose up to three of your ventures to tend to and roll+CHA. On a 10+, each venture you chose produces either its surplus or money for you and you take +1 forward to making requests of your domain. On a 7-9, only one of your ventures produces surplus or money for you, and one venture experiences disaster, such as bankruptcy, legal problems, or the disaster listed. On a miss, all the ventures you chose experience disasters. Ventures you choose not to tend to do not produce for you and do not suffer disasters, but may still experience changes. If a venture produces money, your take is 1d6×100 coins.","stat":"CHA","page":77}],"advanced":[{"name":"Eye for Loot","text":"When you see or come to know about a thing you want, roll+INT. On a 10+, ask the GM three questions about it. On a 7-9, ask two. On a miss, ask one anyway, but your desire is betrayed to everyone who cares (and some who don’t):\n- What happened to it recently?\n- What is it really worth, all things considered?\n- What protects it and keeps it where it is?\n- Who will try to keep it from me?\n- Who will want it once it is mine?","stat":"INT","page":78,"tier":2},{"name":"I Know People Who Know People","text":"When you put the word out that you need someone with certain skills or experience, roll+CHA. On a 10+, you find someone suitable or a hireling with +2 skill points. On a 7-9, you find someone with similar experience or a hireling with +1 skill points.","stat":"CHA","page":78,"tier":2},{"name":"Trade Networks","text":"When you consult your contacts before undertaking a journey to another settlement, the GM will tell you about a person there who can help you.","page":78,"tier":2},{"name":"We All Want Things","text":"When you parley with someone or discern realities connected to them, on a hit you can also ask the GM one of these question:\n- What does this person really want from me?\n- What does this person value most?\n- What is the most valuable thing here?","page":78,"tier":2},{"name":"Back-Up Plan","text":"When you meet with someone on business, you may ask the GM two questions from the list below:\n- Is there an ambush waiting for me?\n- What are they really feeling?\n- What is my best way out of this?\n- Who is watching?","page":79,"tier":6},{"name":"I Must Have It!","text":"When you use your eye for loot, on a 12+, ask the GM an additional question, any question, about the thing you want.","page":79,"tier":6,"requires":["Eye for Loot"]},{"name":"Influencer","text":"When you parley with s
