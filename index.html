hat wears the crown, and though you may have only a small kingdom—your loyal crew—the responsibility or leadership is still a weighty burden.","compendium":"Once you become the leader of a loyal band of sailors, soldiers, or other troops, you may consider the captain specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Loyal Crew","text":"You run a gang. They could be soldiers, pirates, thieves, or mercenaries, but they’re yours and you are their captain and commander. By default, your crew is a medium-sized group (12-15 people), cautious, intelligent, and organized. In the normal course of operations, they obey your orders.\nChoose what type of crew you have:\n○ Your crew are a vicious and brutal gang of thugs. Add the savage tag, remove the cautious tag, and roll+STR to command them.\n○ Your crew are elite troops, a small-sized group (5-10 people).\nRoll+WIS to command them.\n○ Your crew fights for a cause. Add the idealistic tag and roll+CHA to command them. At your option, you may remove the cautious tag.\nChoose two advantages:\n○ They control a fortress or headquarters of some kind.\n○ They engage in commerce or have jobs. Add the rich tag.\n○ They run a ship or caravan.\n○ They are not ordinary people, but wondrous creations. Add the construct and/or magical tags.\n○ They were summoned by magic. Add the magical and/or planar tags.\n○ They’re armed to the teeth, ready for war.\n○ They’re skilled infiltrators. Add the stealthy tag.\n○ They’re very social and know a lot of people.\n○ Your crew is a large-sized group (20-30 people).\nChoose one drawback:\n○ They have heretical and possibly anti-social beliefs.\n○ They’re a loose-knit group, members come and go.\n○ They’re dissolute, hedonistic, and perverse without your guidance.\n○ They’re filthy and unwell. Remove the cautious tag.\n○ They’re poor, with shoddy equipment and no money. Add the poor tag.\n○ You and you crew are in significant debt to someone.\n○ Your crew is a small-sized group (5-10 people).","stat":"STR","page":432},{"name":"The Weight of Command","text":"When you issue commands to your crew during a charged situation, roll+your command stat. On a 10+, your crew obeys you. On a 7-9, you have a problem to deal with first. Either they demand rewards, fight back, or try to back down until you make an example of one of them or convince them some other way. On a miss, either one of them makes a concerted effort to supplant you as leader or they fall prey to their drawbacks, GM’s choice.","page":433}],"advanced":[{"name":"Lieutenants","text":"Now, and each time you level up, stat up a member of your crew as a hireling with +1 loyalty and additional points equal to your level.","page":434,"tier":2,"requires":["Loyal Crew"]},{"name":"Pirates and Thieves","text":"When you recruit from a bustling port or a den of thieves, any hirelings you find will take loot, plunder, and pillage as payment, no matter what else they desire.","page":434,"tier":2},{"name":"Plot a Course","text":"When your vessel sets out for a new destination, roll+INT. On a 10+, all three. On a 7-9, choose two:\n- None of your tinkering causes problems for the vessel.\n- The voyage suggests some new improvement for the vessel, the GM will tell you what and how to implement it.\n- You get there as soon as could be hoped for.","stat":"INT","page":434,"tier":2},{"name":"Captain, My Captain","text":"When you publicly impress yourself upon a group of people, by words or deeds, you may spend up to three XP. For each XP spent, the GM chooses an NPC you have impressed and a reaction:\n- They back you up, stand by your side, or support your play.\n- They come to you with something they think you want, need or could use.\n- They come to you with valuable information.\n- They fight by your side.","page":434,"tier":6},{"name":"Don’t Be a Dick","text":"When you’re around your crew, they treat each other with respect and dignity. If trouble finds them, they’ll react as best they can, as a team.","page":435,"tier":6},{"name":"Tactical Commander","text":"When you direct a unit of troops in the heat of battle, roll+CHA. On a 10+, choose three results from the list below. On a 7-9, choose two. On a miss, choose one anyway, but take -1 forward and your enemies see this unit as their main threat.\n- Choose a hazard on the battlefield: Your unit avoids it.\n- Choose a location within reach: Your unit gets to it or deep into the troops defending it.\n- Choose an enemy unit within reach: Your unit engages them and pins them down.\n- Choose an enemy unit you are engaged with: Your unit breaks contact in an orderly fashion.\n- You rally them: No member of your unit is shaken or routed.","stat":"CHA","page":435,"tier":6}],"alignments":[{"type":"Evil","text":"Upset the rightful order."},{"type":"Good","text":"Lead others into righteous battle."},{"type":"Neutral","text":"Make an ally of someone powerful."}],"bonds":[],"gear":"Choose one:\n○ Ceremonial sabre (close, 1 weight).\n○ Infamous flag or standard.\n○ Pet bird.\n○ Spyglass (1 weight).\n○ Warhorse.\n○ Whip (reach, 1 weight).","races":[{"name":"Elf","text":"In the forest, your crew is always disciplined, self-sufficient, and stealthy. Anywhere else, you can take +1 forward to command them if you promise to take them back to the forest, but they become unruly if you do not comply."},{"name":"Human","text":"Your crew is very mobile, as is the way of humans. They are trained to operate either a mighty vessel of some sort or on horseback, and possess the necessary gear to travel in this manner."}]},{"name":"Champion of Law","archetype":"Warrior","page":438,"blurb":"The mighty forces of Law and Order have chosen their champion, and it is you.","compendium":"Once you have devoted yourself to the divine principles of law and defeated one of its mightiest enemies, you may consider the champion of law specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"You must be of lawful alignment to take this specialty.","statsText":"","mods":{},"starting":[{"name":"I am the Law","text":"When you give an NPC an order based on your authority, roll+CHA. On a hit, they choose one:\n- Attack you.\n- Back away cautiously, then flee.\n- Do what you say.\nOn a 10+, you also take +1 forward against them. On a miss, they do as they please and you take -1 forward against them.","stat":"CHA","page":438}],"advanced":[{"name":"Balance","text":"When you deal damage, hold 1 balance. When you touch someone and channel the spirits of life you may spend balance. For each balance spent, heal 1d4 HP.","page":439,"tier":2},{"name":"Charge!","text":"When you lead the charge into combat, those you lead take +1 forward.","page":439,"tier":2},{"name":"Judge of Character","text":"When you parley with someone or discern realities concerning them, you also learn their alignment.","page":439,"tier":2},{"name":"Voice of Authority","text":"Take +1 to order hirelings.","page":439,"tier":2},{"name":"Divine Authority","text":"Take +1 forward to order hirelings. Also, on a 12+, the hireling transcends their moment of fear and doubt and carries out your order with particular effectiveness or efficiency.","page":439,"tier":6,"replaces":["Voice of Authority"]},{"name":"Ever Onward","text":"When you lead the charge into combat, those you lead take +1 forward and +2 armour forward.","page":439,"tier":6,"replaces":["Charge!"]},{"name":"Evidence of Faith","text":"When you see divine magic as it happens, you can ask the GM which deity granted the spell and its effects. Take +1 when acting on the answers.","page":440,"tier":6},{"name":"Healthy Distrust","text":"Whenever the unclean magic wielded by mortal men causes you to defy danger, treat a miss as a 7-9 instead.","page":440,"tier":6},{"name":"Invoking the Gods of Law","text":"When you call upon the gods of law and order, roll+WIS. On a 10+, choose two. On a 7-9, choose one. On a miss, neither and the gods are displeased with you:\n- The gods display you publicly as their champion.\n- The gods point you toward the greatest source of chaos.\n- The gods show you one weakness of chaos in this region.","stat":"WIS","page":440,"tier":6}],"alignments":[{"type":"Lawful","text":"Advance the interests of the Gods of Law."},{"type":"Lawful","text":"Bring a villain to justice."}],"bonds":["__________’s misguided behaviour endangers their very soul!","__________’s ways are strange and confusing.","I respect the beliefs of __________ but hope they will someday see the true way."],"gear":"You get some mark of your faith and choose one additional piece of gear:\n○ Dungeon rations (5 uses, 1 weight) and a healing potion.\n○ Halberd (reach, +1 damage, two-handed, 2 weight).\n○ Long sword (close, +1 damage, 1 weight) and shield (+1 armour, 2 weight).\n○ Scale mail armour (2 armour, clumsy, 3 weight).","races":[{"name":"Dwarf","text":"When you roll for I am the Law, on a hit, you also take +1d4 damage forward against those you are ordering around."},{"name":"Human","text":"When you pray for guidance, even for a moment, and ask “What here is evil?” the GM will tell you, honestly."}]},{"name":"Defender","archetype":"Warrior","page":443,"blurb":"You are the wall, the gate, the moat surrounding someone important. You will not falter in your duty, and you will not see them fall before you do.","compendium":"Once you have save someone’s life from an overwhelming danger, you may consider the defender specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Meatshield","text":"When you are engaged in close combat with an enemy and they make an offensive move against someone else, you may intercept it. Their move affects you instead of its intended target.","page":443}],"advanced":[{"name":"Bodyguard","text":"When you are protecting a client, add these to the list of discern realities questions:\n- How can I get my client out of here?\n- What does my client intend to do now?\n- What here poses the greatest threat to my client?","page":443,"tier":2},{"name":"Martyr’s Shield","text":"When anyone within your reach either makes or is subject to an offensive move, you may intercept it. The move affects you instead of the intended target.","page":444,"tier":2,"replaces":["Meatshield"]},{"name":"Protection","text":"When you defend, you take +2 armour forward.","page":444,"tier":2},{"name":"Staunch Defender","text":"When you defend, you get +1 hold, even on a miss.","page":444,"tier":2},{"name":"Impervious Defender","text":"When you defend, you get +1 hold, even on a miss. On a 12+, instead of getting hold, the nearest attacking creature is stymied, giving you a clear advantage. The GM will describe it.","page":444,"tier":6,"replaces":["Staunch Defender"]},{"name":"Over My Dead Body","text":"When you defend, you take +3 armour forward.","page":444,"tier":6,"replaces":["Protection"]},{"name":"Superior Bodyguard","text":"When you discern realities while protecting a client, you may also ask the GM one of these questions, even on a miss:\n- How can I get my client out of here?\n- What does my client intend to do now?\n- What here poses the greatest threat to my client?\nYou may also ask any of these instead of a question from the discern realities list.","page":444,"tier":6,"replaces":["Bodyguard"]}],"alignments":[{"type":"Good","text":"Defend those weaker than you."},{"type":"Lawful","text":"Fulfill a promise to protect someone during a dangerous journey or situation."}],"bonds":["__________ is on their own. There’s no defending that one.","I have sworn to guide and protect __________, because of what they have done."],"gear":"Choose one:\n○ Healing potion.\n○ Scale mail armour (2 armour, clumsy, 3 weight).\n○ Shield (+1 armour, 2 weight).","races":[{"name":"Dwarf","text":"When you take the damage meant for someone else, you get +1 armour."},{"name":"Elf","text":"When you discern realities while protecting someone, on a hit, you can also ask this question:\n- How can I get my ward out of here?"}]},{"name":"Destroyer","archetype":"Warrior","page":446,"blurb":"Have you come here to conquer? To become a king? No! You have come to destroy!","compendium":"Once you have destroyed something that is famous, unique, valuable, and has a longer history than your family does, you may consider the destroyer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Bend Bars, Lift Gates","text":"When you use pure strength to destroy an inanimate obstacle, roll+STR. On a 10+, choose three. On a 7-9, choose two:\n- It doesn’t make an inordinate amount of noise.\n- It doesn’t take a very long time.\n- Nothing you value is damaged.\n- You can fix the thing again without a lot of effort.","stat":"STR","page":446}],"advanced":[{"name":"Berserker","text":"When you are afflicted by fear, mind control, or enchanting magic, you may ignore the effect as long as you attack the closest enemy in sight. If you have no enemies in sight, the GM chooses who you attack.","page":447,"tier":2},{"name":"Blood Ill-Tempered","text":"When a foe deals damage to you, your next attack against them deals +1d4 damage.","page":447,"tier":2},{"name":"Crushing Blow","text":"When you deal damage to a foe, you can break their weapon, if they have one, or if they have armour, reduce their armour by 1.","page":447,"tier":2},{"name":"Interrogator","text":"When you parley using threats of impending violence as leverage, you may use STR instead of CHA.","page":447,"tier":2},{"name":"Samson","text":"You may take a debility to immediately break free of any physical or mental restraint.","page":447,"tier":2},{"name":"Fire in the Blood","text":"When a foe deals damage to you, your next attack against them deals +1d8 damage.","page":448,"tier":6,"replaces":["Blood Ill-Tempered"]},{"name":"Superior Warrior","text":"When you hack and slash, on a 12+, you deal your damage, avoid their attack, and impress, dismay, or frighten your enemy.","page":448,"tier":6},{"name":"Vandal","text":"When you discern realities, on a hit, you may also ask this question in addition to your other questions:\n- Who or what here is most vulnerable to me?","page":448,"tier":6}],"alignments":[{"type":"Chaotic","text":"Destroy a symbol or a structure of civilization."},{"type":"Evil","text":"Destroy something beautiful."},{"type":"Lawful","text":"Destroy a threat to orderly civilization."}],"bonds":["__________ has stood by me in battle and can be trusted completely.","__________ shares my hunger for glory; the earth will tremble at our passing!","__________ stood up to me and got away with it. That’s how it is, I guess."],"gear":"You get one weapon of your choice in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"Once per battle you may reroll a single damage roll (yours or someone else’s)."},{"name":"Human","text":"When you attack a foe, you may roll a d6 for your damage die instead of a d10, and permanently lower your enemy’s armour by 1."}]},{"name":"Duellist","archetype":"Warrior","page":450,"blurb":"Ah, the duel! A fully self-contained, one-on-one lethal contest of skill. Could there be any endeavour more refined or exciting? I think not!","compendium":"Once you have won a duel with an opponent whose martial abilities are more renowned than yours, you may consider the duellist specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"En Garde!","text":"When you single out a foe in combat, you engage them in a one-on-one duel, whether they like it or not. After a duel begins, the following things are true:\n- If they break off the duel before either of you are defeated, take +1 forward against them and they count as defeated if you encounter them again.\n- If they break off the duel to attack someone else, you may also deal your damage to them for their insolence.\n- If you break off the duel before either of you are defeated, take -1 forward against them and consider yourself defeated.\nHaving allies enter the fight on your side counts as breaking off the duel.","page":450},{"name":"Keeping Score","text":"The first time you encounter a foe again after being defeated by them, take -1 forward. The first time you encounter a foe again after defeating them, take +1 forward.","page":450}],"advanced":[{"name":"Duellist’s Parry","text":"When you hack and slash, you take +1 armour forward.","page":452,"tier":2},{"name":"Exterminatus","text":"When you speak aloud your promise to defeat an enemy, you deal +2d4 damage against that enemy and -4 damage against anyone else. This effect lasts until the enemy is defeated. If you fail to defeat the enemy or give up the fight, you can admit your failure, but the effect continues until you find a way to redeem yourself.","page":452,"tier":2},{"name":"Eye for Technique","text":"Once you have fought against someone, take +1 forward to discern realities about them. If they defeated you, instead take +1 ongoing to discern realties about them until you defeat them.","page":452,"tier":2},{"name":"The Field at Dawn","text":"When you challenge someone to a duel, if they either refuse or fail to appear, choose one:\n- They lose the respect of their peers.\n- They lose the respect of your peers.","page":452,"tier":2},{"name":"How Can You Hope to Defeat Me?","text":"When you encounter a foe you have previously defeated, hold three as if you had defended against them and made the roll with a 10+.","page":452,"tier":2},{"name":"Duellist’s Block","text":"When you hack and slash, you take +2 armour forward.","page":453,"tier":6,"replaces":["Duellist’s Parry"]},{"name":"Gladiator","text":"When you duel an opponent in front of an audience, roll+CHA. On a 10+, choose two NPCs who cannot help but be impressed. On a 7-9, choose one. For each impressed NPC, the GM chooses one:\n- They admire you and will seek you out.\n- They desire your services.\n- They will defend you or your reputation publicly.","stat":"CHA","page":453,"tier":6},{"name":"Respected Duellist","text":"When you challenge someone to a duel, if they either refuse or fail to appear, they lose the respect of both their own peers, and yours. Additionally, you may sully their reputation amongst the general public, if you choose to make their failure widely known.","page":453,"tier":6,"replaces":["The Field at Dawn"]},{"name":"So, We Meet Again","text":"When you encounter a foe who defeated you previously, say what you have learned since then and spend up to 3 XP to prove it. Then roll+XP spent. On a 10+, ask the GM two questions about your foe and take +1 ongoing when acting on the answers. On a 7-9, ask one. On a miss, you have learned nothing! Whatever you roll, if you are the victor this time, take back 1 XP that you spent.","page":453,"tier":6}],"alignments":[{"type":"Evil","text":"Publicly humiliate an enemy."},{"type":"Good","text":"Duel a villain on behalf of someone you respect or care about."}],"bonds":["For complicated reasons, I cannot face __________ in a duel, even though I would like to.","I have duelled __________ before."],"gear":"Choose one or two:\n○ Adventuring gear (5 uses, 1 weight) and bandages (3 uses, slow).\n○ Duelling rapier (close, precise, 2 weight).\n○ Net (reach, stun damage, 2 weight).\n○ Pistol (close, 1 weight) and shot and powder (3 ammo, 1 weight).\n○ Shield (+1 armour, 2 weight).\n○ Trident (reach, 1 piercing, 2 weight).","races":[{"name":"Dwarf","text":"When you get +1 forward because of a duel, you may take +1d6 damage forward instead."},{"name":"Elf","text":"When you engage in a duel, you may consider any weapon you use to have the precise tag."},{"name":"Human","text":"When you have been defeated by an opponent, you gain +1 armour against their attacks in the future, until you defeat them."}]},{"name":"Friend of the Wild","archetype":"Warrior","page":456,"blurb":"You are not alone in the world. You have an animal friend who accompanies you wherever you go.","compendium":"Once you have befriended a wild animal, you may consider the friend of the wild specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the friend of the wild specialty, reduce your base damage by one die size, but not lower than d4.","mods":{"dmg":-1},"starting":[{"name":"Animal Companion","text":"You have a supernatural connection with a loyal animal. You can’t talk to it per se but it always acts as you wish it to.\nName your animal companion and choose a species: Bear, cat, cougar, dog, eagle, hawk, mule, owl, pigeon, rat, or wolf.\nChoose a base:\n- Cunning +1, Ferocity +2, Instinct +1, 1 Armour\n- Cunning +1, Ferocity +3, Instinct +2, 1 Armour\n- Cunning+2, Ferocity +1, Instinct +1, 1 Armour\n- Cunning +2, Ferocity +2, Instinct +1, 0 Armour\nChoose as many strengths as its ferocity: Adaptable, burly, calm, camouflage, careful, fast, ferocious, huge, intimidating, keen senses, quick reflexes, stealthy, tireless. Choose as many weaknesses as its instinct: Broken, flighty, forgetful, frightening, lame, savage, slow, stubborn.\nYour animal companion is trained to fight humanoids. Choose as many additional trainings as its cunning: Fight monsters, guard, hunt, labour, perform, scout, search, travel.","page":456},{"name":"Command","text":"When you work with your animal companion on something it’s trained in…\n- …and you attack the same target, add its ferocity to your damage.\n- …and you discern realities, add its cunning to your cunning.\n- …and you parley, add its cunning to your roll.\n- …and you take damage, add its armour to your armour.\n- …and you track, add its cunning to your roll.\n- …and someone interferes with you, add its instinct to their roll.","page":457}],"advanced":[{"name":"My Best Friend","text":"When you allow your animal companion to take a blow that was meant for you, the damage is negated and your animal companion’s ferocity is reduced to zero. If its ferocity is already zero you can’t use this ability. When you have a few hours rest with your animal companion its ferocity returns to normal.","page":457,"tier":2},{"name":"Two Are Better Than One","text":"When you undertake a perilous journey, you can take two roles (one for yourself and one for your animal companion). You make separate rolls for each.","page":457,"tier":2},{"name":"Well-Trained","text":"Choose another training for your animal companion.","page":458,"tier":2},{"name":"Wild Empathy","text":"You can speak with and understand animals. This means you can closely study and parley with them as if they were people.","page":458,"tier":2},{"name":"Special Trick","text":"Choose one move from another class. So long as you are working with your animal companion you have access to that move.","page":458,"tier":6},{"name":"Striders Two","text":"When you undertake a perilous journey, you can take two roles (one for yourself and one for your animal companion). Roll twice and use the better result for both roles.","page":458,"tier":6,"replaces":["Two Are Better Than One"]},{"name":"Unnatural Ally","text":"Your animal companion is a monster, not an animal. Describe it. Give it an additional +2 ferocity and +1 instinct, plus a new training.","page":458,"tier":6},{"name":"Wild Speech","text":"You can speak with and understand any non-magical, non-planar creature. This means you can closely study and parley with them as if they were people.","page":458,"tier":6,"replaces":["Wild Empathy"]}],"alignments":[{"type":"Chaotic","text":"Eschew a convention of the civilized world."},{"type":"Neutral","text":"Teach someone the ways of your people."}],"bonds":["__________ is a friend of nature, so I will be their friend as well.","My companion seems to like __________. They must be someone I can trust."],"gear":"You get dungeon rations (5 uses, 1 weight) in addition to whatever else your specialties give you. Your animal companion can eat these rations, whatever they are.","races":[{"name":"Elf","text":"When you undertake a perilous journey through the wilderness, whatever job you take you succeed as if you rolled a 10+."},{"name":"Human","text":"Your animal companion can also speak like a human."}]},{"name":"Gorgon","archetype":"Warrior","page":460,"blurb":"The face of the gorgon is the face of death, the face of fear, the face that turns limbs to stone before they are hewn away by claws of brass. This face is your face.","compendium":"Once you have dedicated the slaying of an enemy to the gorgons, while wearing their face on your breastplate or shield, you may consider the gorgon specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"What Are You Waiting For?","text":"When you cry out a challenge to your enemies, roll+CON. On a 10+, they treat you as the most obvious threat to be dealt with and ignore your companions, take +2 damage ongoing against them. On a 7-9, only a few (the weakest or most foolhardy among them) fall prey to your taunting.","stat":"CON","page":460}],"advanced":[{"name":"Berserker","text":"When you are afflicted by fear, mind control, or enchanting magic, you may ignore the effect as long as you attack the closest enemy in sight. If you have no enemies in sight, the GM chooses who you attack.","page":461,"tier":2},{"name":"Gorgoneion","text":"When you draw the face of the gorgon on an object or a location, it will remain unmolested by animals, vermin, and incidental magical influence. If the object or location is also being targeted by a group of attackers, thieves, or vandals, roll+WIS. On a 10+, as a group, they stay away. On a 7-9, they stay away for now, but only until they can get someone else to remove the gorgoneion.","stat":"WIS","page":461,"tier":2},{"name":"Petrifying Visage","text":"When you cry out a challenge to your enemies, on a hit, they also hesitate for a moment and allow you to make the next move unimpeded.","page":461,"tier":2,"requires":["What Are You Waiting For?"]},{"name":"Seeing Red","text":"When you discern realities during combat, you take +1.","page":461,"tier":2},{"name":"Evil Eye","text":"When you enter combat, roll+CHA. On a 10+, hold 2. On a 7-9, hold 1. Spend a hold to make eye contact with an NPC present, who freezes or flinches and can’t act until you break it off. On a miss, your enemies immediately identify you as their biggest threat. If you have the gorgoneion painted on your shield, you can use its eyes instead of your own.","stat":"CHA","page":462,"tier":6,"requires":["Seeing Red"]},{"name":"Through Death’s Eyes","text":"When you go into battle, roll+WIS. On a 10+, name someone who will live and someone who will die. On a 7-9, name someone who will live or someone who will die. Name NPCs, not player characters. The GM will make your vision come true, if it’s even remotely possible. On a miss, you see your own death and consequently take -1 ongoing throughout the battle.","stat":"WIS","page":462,"tier":6},{"name":"War Cry","text":"When you enter battle with a show of force (a shout, a rallying cry, etc), roll+CHA. On a 10+, both. On a 7-9, one or the other:\n- Your allies are rallied and take +1 forward.\n- Your enemies feel fear and act accordingly (avoiding you, hiding, attacking with fear-driven abandon, etc).","stat":"CHA","page":462,"tier":6}],"alignments":[{"type":"Chaotic","text":"Eschew a convention of the civilized world."},{"type":"Evil","text":"Convince a terrorized enemy to spread tales of your wrath."}],"bonds":["_________ has plenty of potential, but is yet untested.","__________ needs to respect me more than they do right now."],"gear":"Choose one:\n○ Leather armour (1 armour, 1 weight) with the gorgoneion on the breastplate.\n○ Shield (+1 armour, 2 weight) with the gorgoneion on it.","races":[]},{"name":"Insatiable","archetype":"Warrior","page":464,"blurb":"Too much is never enough.","compendium":"Once you have compared your appetites to a hundred others and been proven the most covetous, the most desirous, the most insatiable, you may consider the insatiable specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Herculean Appetites","text":"Others may content themselves with just a taste of wine, or dominion over a servant or two, but you want more. Choose two appetites. While pursuing one of your appetites, if you would roll for a move, instead of rolling 2d6 you roll 1d6+1d8. If the d6 is the higher die of the pair, the GM will also introduce a complication or danger that comes about due to your heedless pursuits.\n○ Conquest.\n○ Discovering secrets.\n○ Fame and glory.\n○ Mortal pleasures.\n○ Power over others.\n○ Pure destruction.\n○ Riches and property.","page":464}],"advanced":[{"name":"Eye for Loot","text":"When you see or come to know about a thing you want, roll+INT. On a 10+, ask the GM three questions about it from the list below. On a 7-9, ask two. On a miss, ask one anyway, but your desire is betrayed to everyone who cares (and some who don’t):\n- What happened to it recently?\n- What is it really worth, all things considered?\n- What protects it and keeps it where it is?\n- Who will try to keep it from me?\n- Who will want it once it is mine?","stat":"INT","page":465,"tier":2},{"name":"Indestructible Hunger","text":"When you take damage, you can choose to take -1 ongoing until you sate one of your appetites instead of taking the damage. If you already have this penalty you cannot choose this option.","page":465,"tier":2,"requires":["Herculean Appetites"]},{"name":"Khan of Khans","text":"Your hirelings always accept the gratuitous fulfillment of one of your appetites as payment.","page":465,"tier":2,"requires":["Herculean Appetites"]},{"name":"Still Hungry","text":"Choose an additional appetite.","page":465,"tier":2,"requires":["Herculean Appetites"]},{"name":"I Must Have It!","text":"When you use your eye for loot, on a 12+, ask the GM an additional question, any question, about the thing you want.","page":466,"tier":6,"requires":["Eye for Loot"]},{"name":"More! Always More!","text":"When you satisfy an appetite to the extreme (destroying something unique and significant, gaining enormous fame, riches, power, etc), you may choose to resolve it. Cross it off the list and mark XP. While you may pursue that appetite again, you no longer feel the burning desire you once did. In its place, choose a new appetite from the list or write your own.","page":466,"tier":6,"requires":["Herculean Appetites"]},{"name":"Obsession","text":"When you discern realities, on a hit, the GM will also tell you if you can indulge one of your appetites here, and if so, how.","page":466,"tier":6,"requires":["Herculean Appetites"]}],"alignments":[{"type":"Chaotic","text":"Eschew a convention of the civilized world."},{"type":"Neutral","text":"Convince someone else to help you sate your appetites."}],"bonds":["__________ has helped me slake my hungers before. I must keep them close by!","__________ shares my hunger for glory; the earth will tremble at our passing!"],"gear":"You get an item that symbolizes your insatiable appetites, in addition to whatever your other specialties give you. Describe it.","races":[{"name":"Dwarf","text":"When you defend yourself while in pursuit of your appetites, you get +1 hold, even on a miss."},{"name":"Elf","text":"While in pursuit of your appetites, you may consider any weapon you wield to have the precise tag."},{"name":"Human","text":"When you get your hands on an item demanded by your appetites, you may ask one question about it from the eye for loot list, even if you do not have the move."}]},{"name":"Ranger","archetype":"Warrior","page":469,"blurb":"The wilds are your home.","compendium":"Once you have protected a patch of wilderness from intruders, poachers, and villains for a year and a day, you may consider the ranger specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the ranger specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Hunt and Track","text":"When you follow a trail of clues left behind by passing creatures, roll+WIS. On a hit, you follow the creature’s trail until there’s a significant change in its direction or mode of travel. On a 10+, you also choose one:\n- Determine what caused the trail to end.\n- Gain a useful bit of information about your quarry, the GM will tell you what.","stat":"WIS","page":469}],"advanced":[{"name":"Camouflage","text":"When you keep still in natural surroundings, enemies never spot you until you make a movement.","page":470,"tier":2},{"name":"Communion of Whispers","text":"When you spend time in a place, making note of its resident spirits and calling on the spirits of the land, roll+WIS. You will be granted a vision of significance to you, your allies, and the spirits around you. On a 10+, the vision will be clear and helpful to you. On a 7-9, the vision is unclear, its meaning murky. On a miss, the vision is upsetting, frightening, or traumatizing. The GM will describe it. Take -1 forward.","stat":"WIS","page":470,"tier":2},{"name":"Familiar Prey","text":"When you spout lore about a monster, you can roll with WIS instead of INT.","page":470,"tier":2},{"name":"Follow Me","text":"When you undertake a perilous journey, you can take two roles. You make a separate roll for each.","page":470,"tier":2},{"name":"A Safe Place","text":"When you set the watch for the night, everyone takes +1 to take watch.","page":470,"tier":2},{"name":"Wild Empathy","text":"You can speak with and understand animals. This means you can closely study and parley with them as if they were people.","page":470,"tier":2},{"name":"Hunter’s Prey","text":"When you spout lore about a monster, you can roll with WIS instead of INT. On a 12+, in addition to the normal effects, you get to ask the GM any one question about the subject.","page":471,"tier":6,"replaces":["Familiar Prey"]},{"name":"Observant","text":"When you hunt and track, on a hit you may also ask one question about the creature you are tracking from the discern realities list for free.","page":471,"tier":6},{"name":"A Safer Place","text":"When you set the watch for the night, everyone takes +1 to take watch. After a night in camp when you set the watch, everyone takes +1 forward.","page":471,"tier":6,"replaces":["A Safe Place"]},{"name":"Strider","text":"When you undertake a perilous journey, you can take two roles. Roll twice and use the better result for both roles.","page":471,"tier":6,"replaces":["Follow Me"]},{"name":"Weather Sense","text":"When you are under open skies when the sun rises, the GM will ask you what the weather will be that day. tell them whatever you like, it comes to pass.","page":471,"tier":6},{"name":"Wild Speech","text":"You can speak with and understand any non-magical, non-planar creature. This means you can closely study them and parley with them as if they were people.","page":471,"tier":6,"replaces":["Wild Empathy"]}],"alignments":[{"type":"Chaotic","text":"Eschew a convention of the civilized world."},{"type":"Good","text":"Endanger yourself to combat an unnatural threat."},{"type":"Neutral","text":"Help an animal or spirit of the wild."}],"bonds":["__________ does not understand life in the wild, so I will teach them.","__________ has no respect for nature, so I have no respect for them.","__________ once talked me into guiding some halflings on the run through dangerous territory, and never thanked me properly for it.","I have guided __________ before and they owe me for it.","I have shown __________ a secret rite of the land."],"gear":"You get adventuring gear (5 uses, 1 weight) and choose one:\n○ Bundle of arrows (3 ammo, 1 weight).\n○ Dungeon rations (5 uses, 1 weight).\n○ Leather armour (1 armour, 1 weight).\n○ Magnificent fur cloak.","races":[{"name":"Dwarf","text":"When you hunt and track a creature, you also take +1 forward against it."},{"name":"Elf","text":"When you undertake a perilous journey through the wilderness, whatever job you take you succeed as if you rolled a 10+."},{"name":"Human","text":"When you make camp in a dungeon or city, you don’t need to consume a ration."}]},{"name":"Sharpshooter","archetype":"Warrior","page":474,"blurb":"Danger is a greedy mistress, always lurking near adventurers, ever ready to cut them down. And she always gets what she wants in the end. So why give her any more chances to take your life? Only a fool fights an enemy close in. Better to stay away and pick them off from afar.","compendium":"Once you have won a sharpshooting contest against multiple opponents generally considered the best in their field—and certainly better than you—you may consider the sharpshooter specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the sharpshooter specialty, lower your maximum HP by 2, but not lower than 4+Constitution.","mods":{"hp":-2},"starting":[{"name":"Called Shot","text":"When you attack a surprised or defenceless enemy at range, you can choose to deal your damage or name your target and roll+DEX. On a hit, choose your target:\n- Arms: They drop anything they’re holding.\n- Head: They do nothing but stand and drool for a few moments.\n- Legs: They’re hobbled and slow moving.\nOn a 10+, also deal your damage.","stat":"DEX","page":474}],"advanced":[{"name":"Blot Out the Sun","text":"When you volley, you may spend extra ammo before rolling. For each point of ammo spent you may choose an extra target. Roll once and apply damage to all targets.","page":475,"tier":2},{"name":"Camouflaged Position","text":"When you strike with a ranged weapon from hiding, your first shot never gives away your position.","page":475,"tier":2},{"name":"Counterstrike","text":"When you expend your ammo to defend against enemy missile attacks, take +1 for each ammo expended (but no more than +3 total).","page":475,"tier":2},{"name":"Eagle-Eyed","text":"When you observe a far-off location, roll+INT. On a 10+, you may ask three questions from the discern realities list about that location. On a 7-9, ask two. On a miss, you may still ask one, but you are distracted and taking your time while you do it.","stat":"INT","page":475,"tier":2},{"name":"Witch Darts","text":"If you attach a piece of your target—blood, hair, nails—to a missile, if they are within range when you let it loose, it will always hit them.","page":475,"tier":2},{"name":"Darts of Apollo","text":"If a wound caused by one of your missiles is not treated by a skilled healer, it will fester and kill the victim. You can specifically choose to loose a clean missile instead and avoid this result.","page":476,"tier":6},{"name":"Smaug’s Belly","text":"When you know your target’s weakest point, your missile weapons have +2 piercing.","page":476,"tier":6},{"name":"Snapshot","text":"If you are pushed over, swarmed by enemies, or take a blow that reduces your HP to zero, you’re fast enough to get off one last shot. Deal your damage to any one foe.","page":476,"tier":6},{"name":"Strong Arm, True Aim","text":"You can throw any melee weapon, using it to volley. A thrown melee weapon is gone from your possession; you can never choose to reduce ammo on a 7-9.","page":476,"tier":6}],"alignments":[{"type":"Chaotic","text":"Defeat a tyrant."},{"type":"Neutral","text":"Defeat an enemy without getting close to them."}],"bonds":[],"gear":"Choose one:\n○ Hunter’s bow (near, far, 1 weight) and a bundle of arrows (3 ammo, 1 weight).\n○ Ragged bow (near, 2 weight) and two bundles of arrows (6 ammo, 2 weight).\n○ Rifle (near, far, 2 weight) and powder and shot (3 ammo, 1 weight).","races":[{"name":"Dwarf","text":"When you make a called shot, you can also choose to knock your enemy over or off balance."},{"name":"Elf","text":"Eagle-Eyed is a starting move for you."},{"name":"Halfling","text":"When you attack with a ranged weapon, deal +2 damage."}]},{"name":"Slayer","archetype":"Warrior","page":479,"blurb":"Murder at your every footstep. Blood’s cheap, it’s everywhere.","compendium":"Once you have eaten the still-beating heart of an enemy you have slain and drunk their blood from a goblet made from their skull, you may consider the slayer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Spill the Blood","text":"When you deal damage to an enemy, hold 1 blood. When you have a moment to rest, you can spend all your blood on yourself or feed it to someone else, healing 1d6+blood damage. If you go a day without dealing damage to an enemy, lose all the blood you have gained.","page":479}],"advanced":[{"name":"Blood Red","text":"In combat, you can spend your blood, 1-for-1 to:\n- Block a blow meant for someone else. You take the damage instead.\n- Disarm a foe.\n- Free yourself from constraints or bonds.\n- Increase the damage of one attack by +1.","page":480,"tier":2,"requires":["Spill the Blood|Reign in Blood"]},{"name":"Die by the Sword","text":"When you take your last breath and either miss or refuse Death’s bargain, you can still come back to life, but Death will take you during the next combat you participate in, somehow, some way, no matter what.","page":480,"tier":2},{"name":"Merciless","text":"When you deal damage to something that can bleed, deal +1d4 damage.","page":480,"tier":2},{"name":"South of Heaven","text":"When you have less than half your maximum hit points left, your attacks gain the forceful and messy tags and you deal +1d6 damage.","page":480,"tier":2},{"name":"Angel of Death","text":"When you hack and slash or volley, you may spend blood before rolling. For each blood you spend choose an extra target. Roll once and apply damage to all targets, but gain no blood for this attack.","page":481,"tier":6,"requires":["Spill the Blood|Reign in Blood"]},{"name":"Bloodthirsty","text":"When you deal damage to something that can bleed, deal +1d8 damage.","page":481,"tier":6,"replaces":["Merciless"]},{"name":"Reign in Blood","text":"When you deal damage to an enemy, hold 1 blood. When you have a moment to rest, you can spend all your blood on yourself or feed it to someone else, healing 1d6 damage per blood. If you go a day without dealing damage, lose all the blood you have gained.","page":481,"tier":6,"replaces":["Spill the Blood"]}],"alignments":[],"bonds":["__________ has tasted my blood and I theirs. We are bound by it.","__________ saw me kill someone important.","If I am the spirit of Death, __________ is the spirit of Life. They must survive this danger, no matter what."],"gear":"Choose one or more:\n○ Axe (close, 1 weight).\n○ Curved sword (close, 1 weight).\n○ Rapier (close, precise, 1 weight).\n○ Ritual dagger (hand, 1 weight).\n○ Spear (reach, thrown, near, 1 weight).\n○ Throwing dagger (thrown, near, 0 weight).","races":[{"name":"Dwarf","text":"Choose a type of monster that is your enemy. All your attacks against this type of monster gain the forceful and messy tags."},{"name":"Elf","text":"Choose a type of monster that is your enemy. When you deal damage to this type of monster, deal +1d4 damage."},{"name":"Halfling","text":"When you have less than 5 blood and you deal damage at range, gain 2 blood instead of 1."},{"name":"Human","text":"When you attack, you may deal +1d4 damage if you also take 1d4 damage (ignores armour). You still get 1 blood for dealing damage."}]},{"name":"Standard Bearer","archetype":"Warrior","page":484,"blurb":"The mascot, the rally point, a beacon of light in the darkness of war—that’s you. You are the hope and pride that binds these soldiers together.","compendium":"Once you have been appointed the standard bearer for a mighty lord whom you feel an intense loyalty towards, you may consider the standard bearer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the standard bearer specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Standard","text":"You have a symbol of some kind that you use to inspire others— maybe not a literal standard, but something visible and obvious. When you raise your standard in support of a cause, anyone who joins that cause gains 1d6 temporary hit points until you lower your standard (by your own choice or not) or they turn away from your cause. Any damage they take must reduce these temporary hit points before being applied to their own hit points.","page":484}],"advanced":[{"name":"All for One","text":"As long as you wear no armour and carry no shield, allies in your presence who defend get +1 hold, even on a miss.","page":485,"tier":2},{"name":"And One for All","text":"At the end of a session, if any other PC defended you or fought to keep you safe while your standard was raised, they each mark XP. If you lent any of them aid while they did so, you can mark XP, too.","page":485,"tier":2},{"name":"Battlefield Grace","text":"When you help someone with aid, take +2 armour forward.","page":485,"tier":2},{"name":"A Little Help From my Friends","text":"When you successfully aid someone, you take +1 forward as well.","page":485,"tier":2},{"name":"Staunch Defender","text":"When you defend, you always get +1 hold, even on a miss.","page":485,"tier":2},{"name":"Exemplar","text":"When you raise your standard, choose one of your special moves. Any of your allies can use this move while they fight by your side, until you lower your standard.","page":485,"tier":6,"requires":["Standard"]},{"name":"Gold Standard","text":"Those who join the cause you raise your standard for gain 2d6 temporary hit points, instead of 1d6.","page":485,"tier":6,"requires":["Standard"]},{"name":"Impervious Defender","text":"When you defend, you always get +1 hold, even on a miss. On a 12+, instead of getting hold the nearest attacking creature is stymied giving you a clear advantage, the GM will describe it.","page":486,"tier":6,"replaces":["Staunch Defender"]},{"name":"Stand Together","text":"When you show your standard and rally your allies, roll+CHA. On a hit, they hear you and answer. Choose one:\n- NPCs act at a distinct advantage; their next action as a group is a success.\n- One of your allies heals 1d8 damage.\n- PCs take +1 forward if they rally to your standard.\nAdditionally, on a 10+, your enemy is also taken aback and either hesitates or fails to take advantage of the situation.","stat":"CHA","page":486,"tier":6}],"alignments":[{"type":"Good","text":"Ignore danger to aid another."},{"type":"Lawful","text":"Choose honour over personal gain."},{"type":"Neutral","text":"Survive a battle without having to fight anyone."}],"bonds":["__________ has defended me before. I can trust them.","__________ proved a worthy ally in the last war, even considering that one mistake they made."],"gear":"You get your standard (2 weight) in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"Your standard grants 1d8 temporary hit points, instead of 1d6 (and gold standard grants 2d8 instead of 2d6)."},{"name":"Human","text":"When you raise your standard, anyone who was previously your enemy can choose to gain either +1 armour for the remainder of the fight, or +1 forward, in addition to the 1d6 temporary hit points, if they choose to fight on your side this time."}]},{"name":"Strongarm","archetype":"Warrior","page":488,"blurb":"I am Muscle Wizard, I cast fist!","compendium":"Once you have successfully completed three tests of legendary strength—such as wrestling a bear, walking a mile with a boulder on your back, or tearing down the walls of a city, for example—you may consider the strongarm specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the strongarm specialty, you get +2 load.","mods":{"load":2},"starting":[{"name":"Musclebound","text":"While you wield a weapon, it gains the forceful and messy tags.\nAnd either one of these two moves:","page":488},{"name":"Unencumbered, Unharmed","text":"So long as you are below your Load and neither wear armour nor carry a shield, take +1 armour. Show off those muscles.","page":488},{"name":"The Upper Hand","text":"You are so strong you take +1 ongoing to last breath rolls. When you take your last breath, on a 7-9, you make an offer to Death in return for your life. If Death accepts, she will return you to life. If not, you die.","page":488}],"advanced":[{"name":"Interrogator","text":"When you parley using threats of impending violence as leverage, you may use STR instead of CHA.","page":489,"tier":2},{"name":"My Love for You is Like a Truck","text":"When you perform a feat of strength, name someone present whom you have impressed and take +1 forward to parley with them.","page":489,"tier":2},{"name":"Samson","text":"You may take a debility to immediately break free of any physical or mental restraint.","page":489,"tier":2},{"name":"Smash!","text":"When you hack and slash, on a 12+, deal your damage and choose something physical your target has (a weapon, their position, a limb): they lose it.","page":489,"tier":2},{"name":"Submission Hold","text":"When you get your hands on someone, your next attack against them deals +1d4 damage.","page":489,"tier":2},{"name":"A Good Day to Die","text":"As long as you have less than your CON in current HP (or 1, whichever is higher), take +1 ongoing.","page":490,"tier":6},{"name":"Hands Like a Vise","text":"When you get your hands on someone, your next attack against them deals +1d8 damage.","page":490,"tier":6,"replaces":["Submission Hold"]},{"name":"Mark of Might","text":"When you take this move and spend some uninterrupted time reflecting on your past glories, you may mark yourself with a symbol of your power (a long braid tied with bells, ritual scars or tattoos, etc). Any intelligent mortal creature who sees this symbol knows instinctively that you are a force to be reckoned with and treats you appropriately.","page":490,"tier":6},{"name":"Too Brave to Die","text":"You had only one before, now you have both Unencumbered, Unharmed and the Upper Hand.","page":490,"tier":6,"requires":["Unencumbered, Unharmed|The Upper Hand"]}],"alignments":[],"bonds":["__________ is puny and foolish, but amusing to me.","__________ is soft, but I will make them hard like me.","__________ stood up to me and got away with it. That’s how it is, I guess."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Net (reach, stun damage, 2 weight).\n○ Pair of giant weights (4 weight).\n○ Trophy (1 weight).","races":[{"name":"Dwarf","text":"As long as you are touching the ground, you cannot be moved by attacks that also deal damage."},{"name":"Human","text":"When you attack with a thrown weapon, deal +1d4 damage."}]},{"name":"Veteran","archetype":"Warrior","page":492,"blurb":"How many battles have you fought, now? You hardly remember anymore. Life is war.","compendium":"Once you have survived enough battles to think that the business of war is perfectly normal and not the insane shitstorm it actually is, you may consider the veteran specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the veteran specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"The Good Soldier","text":"When you aid an ally in a fight, they take +2 instead of +1 as well as +1d4 damage forward. When a hireling aids you in a fight, you deal an additional +1d4 damage.","page":492}],"advanced":[{"name":"A Little Help From my Friends","text":"When you successfully aid someone, you take +1 forward as well.","page":493,"tier":2},{"name":"Scout","text":"When you spout lore about a military unit or situation you have observed, you may use WIS instead of CHA. Anyone acting on your information takes +1 forward.","page":493,"tier":2},{"name":"Setup Strike","text":"When you hack and slash, choose an ally. Their next attack against your target does +1d4 damage.","page":493,"tier":2},{"name":"Skirmisher","text":"When you enter a battle, roll+WIS. On a 10+, hold 3. On a 7-9, hold 2. On a miss, hold 1 anyway, but take -1 forward and your enemies see you as their main threat. During the battle, spend a hold to:\n- Choose a character that can see or hear you and direct them out of a bad position.\n- Choose a character within your reach and lure them into a bad position.\n- Choose a character within your reach and redirect their attack.\n- Choose a character you can see or hear. You reach them before they can react.","stat":"WIS","page":493,"tier":2},{"name":"Battle Plans","text":"When you make a plan before a battle, roll+WIS. On a 10+, hold 3. On a 7-9, hold 2. On a miss, hold 1 anyway, because you’ll need it when everything goes to hell. Spend a hold at any time before the end of the battle to declare a plan of action. Anyone pursuing that plan of action takes +1 forward.","stat":"WIS","page":494,"tier":6},{"name":"Tactical Commander","text":"When you direct a unit of troops in the heat of battle, roll+CHA. On a 10+, choose three results from the list below. On a 7-9, choose two. On a miss, choose one anyway, but take -1 forward and your enemies see this unit as their main threat.\n- Choose a hazard on the battlefield: Your unit avoids it.\n- Choose a location within reach: Your unit gets to it or deep into the troops defending it.\n- Choose an enemy unit within reach: Your unit engages them and pins them down.\n- Choose an enemy unit you are engaged with: Your unit breaks contact in an orderly fashion.\n- You rally them: No member of your unit is shaken or routed.","stat":"CHA","page":494,"tier":6},{"name":"Tandem Strike","text":"When you hack and slash, choose an ally. Their next attack against your target does +1d4 damage and they take +1 forward against them.","page":494,"tier":6,"replaces":["Setup Strike"]},{"name":"Veteran Scout","text":"When you undertake a perilous journey, you always spot trouble in advance, as if you had rolled 10+ for scout. You can take on a second job, roll for it as normal.","page":494,"tier":6,"requires":["Scout"]}],"alignments":[{"type":"Evil","text":"Take advantage of someone untouched by war."},{"type":"Lawful","text":"Fulfill an important promise."},{"type":"Neutral","text":"Learn a secret about an enemy."}],"bonds":["__________ proved a worthy ally in the last war, even considering that one mistake they made.","__________ saw me kill someone important.","Me and __________ were both hired by a boss who turned on us."],"gear":"You get adventuring gear (5 uses, 1 weight), bandages (3 uses), and choose one additional piece of gear:\n○ Axe (close, 1 weight).\n○ Dungeon rations (5 uses, 1 weight).\n○ Healing potion.\n○ Shield (+1 armour, 2 weight).\n○ Short sword (close, 1 weight).\n○ Warhammer (close, 1 weight).","races":[]},{"name":"War Leader","archetype":"Warrior","page":496,"blurb":"You lead from the front, inspiring others to acts of heroism and sacrifice by your own bravery and prowess.","compendium":"Once you have led an army to victory against a superior enemy, you may consider the war leader specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Recruiting for the Cause","text":"When you recruit, also pick options equal to your CHA. On a 10+, all of them are true. On a 7-9, only one of them is true, GM’s choice. On a miss, none of them are true:\n- You gain the support of the locals, and may carouse in town before leaving.\n- You recruit a small squad of hirelings who do not have skills.\n- You recruit an additional, skilled hireling.\n- You requisition a piece of equipment from the locals.","page":496}],"advanced":[{"name":"Charge!","text":"When you lead the charge into combat, those you lead take +1 forward.","page":497,"tier":2},{"name":"Lead by Example","text":"After you roll for a move, on a hit, your allies take +1 forward when they roll for the same move, until you make another move.","page":497,"tier":2},{"name":"Tactical Commander","text":"When you direct a unit of troops in the heat of battle, roll+CHA. On a 10+, choose three results from the list below. On a 7-9, choose two. On a miss, choose one anyway, but take -1 forward and your enemies see this unit as their main threat.\n- Choose a hazard on the battlefield: Your unit avoids it.\n- Choose a location within reach: Your unit gets to it or deep into the troops defending it.\n- Choose an enemy unit within reach: Your unit engages them and pins them down.\n- Choose an enemy unit you are engaged with: Your unit breaks contact in an orderly fashion.\n- You rally them: No member of your unit is shaken or routed.","stat":"CHA","page":497,"tier":2},{"name":"Voice of Authority","text":"Take +1 to order hirelings.","page":497,"tier":2},{"name":"Ever Onward","text":"When you lead the charge into combat, those you lead take +1 forward and +2 armour forward.","page":498,"tier":6,"replaces":["Charge!"]},{"name":"Mark of Might","text":"When you take this move and spend some uninterrupted time reflecting on your past glories, you may mark yourself with a symbol of your power (a long braid tied with bells, ritual scars or tattoos, etc). Any intelligent mortal creature who sees this symbol knows instinctively that you are a force to be reckoned with and treats you appropriately.","page":498,"tier":6},{"name":"War Cry","text":"When you enter battle with a show of force (a shout, a rallying cry, etc), roll+CHA. On a 10+, both. On a 7–9, one or the other:\n- Your allies are rallied and take +1 forward.\n- Your enemies feel fear and act accordingly (avoiding you, hiding, attacking with fear-driven abandon, etc).","stat":"CHA","page":498,"tier":6}],"alignments":[{"type":"Evil","text":"Profit personally from an act of war."},{"type":"Good","text":"Lead others in righteous battle."}],"bonds":["__________ has stood by me in battle and can be trusted completely.","__________ is soft, but I will make them hard like me.","__________ proved a worthy ally in the last war, even considering that one mistake they made.","__________ shares my hunger for glory; the earth will tremble at our passing!"],"gear":"Choose one:\n○ Banner (1 weight).\n○ Conspicuous helmet (1 weight).\n○ Horse and adventuring gear (5 uses, 1 weight).\n○ Mace (close, 1 weight).\n○ Squire.\n○ War horn (1 weight).","races":[{"name":"Dwarf","text":"When your recruits help you fight, you get +1 armour."},{"name":"Human","text":"When your recruits help you fight, you deal +1d4 damage."}]},{"name":"Wielder","archetype":"Warrior","page":500,"blurb":"You are known by the weapon you wield.","compendium":"Once you have acquired a weapon more famous than you are and been indelibly linked with it in the minds of all who know you, you may consider the wielder specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Signature Weapon","text":"This is your weapon. There are many like it, but this one is yours. Your weapon is your best friend. It is your life. You master it as you master your life. Your weapon, without you, is useless. Without your weapon, you are useless. You must wield your weapon true. Describe your weapon. It has 2 weight. Choose the most appropriate range for your weapon, then pick one enhancement and one special power it has.\nEnhancements:\n○ Alarm: Glows in the presence of one type of creature, your choice.\n○ Blunt: Does stun damage, at your option.\n○ Grisly: +1 damage.\n○ Huge: Add the messy and forceful tags.\n○ Perfectly weighted: Add the precise tag.\n○ Sharp or spiked: +2 piercing.\n○ Versatile: Choose an additional range.\n○ Well-crafted: -1 weight.\n○ Invent a new tag for your weapon.\nSpecial Powers:\n○ Bane: Kills one specific type of monster (your choice) with but a single wound.\n○ Blessed by the Gods: This weapon is divine.\n○ Boomerang: It always returns to your hand.\n○ Flaming: +1d4 damage when on fire.\n○ Protector: Two-handed, gives you +1 armour while you wield it in melee.\n○ Sentient: This weapon is intelligent and can communicate.\n○ Stonecutter: Cuts through stone like butter.\n○ Vorpal blade: Ignores armour.\n○ Choose two more enhancements instead of a special power.","page":500}],"advanced":[{"name":"Blacksmith","text":"When you have access to a forge, you can graft the magical powers of a weapon onto your signature weapon. This process destroys the magical weapon. Your signature weapon gains the magical powers of the destroyed weapon.","page":501,"tier":2,"requires":["Signature Weapon"]},{"name":"Heirloom","text":"When you consult the spirits that reside within your signature weapon, they will give you an insight relating to the current situation, and might ask you some questions in return, roll+CHA. On a 10+, the GM will give you good detail. On a 7-9, the GM will give you an impression.","stat":"CHA","page":501,"tier":2,"requires":["Signature Weapon"]},{"name":"Improved Weapon","text":"Choose one extra enhancement for your signature weapon.","page":501,"tier":2,"requires":["Signature Weapon"]},{"name":"Agent of Destruction","text":"When you deal damage with your signature weapon, if your enemy has armour, reduce their armour by 1, to a minimum of zero.","page":502,"tier":6,"requires":["Signature Weapon"]},{"name":"Eye for Weaponry","text":"When you look over an enemy’s weaponry, ask the GM how much damage they do.","page":502,"tier":6},{"name":"Magic Weapon","text":"Choose one extra special power for your signature weapon.","page":502,"tier":6,"requires":["Signature Weapon"]},{"name":"Superior Warrior","text":"When you hack and slash, on a 12+, you deal your damage, avoid their attack, and impress, dismay, or frighten your enemy.","page":502,"tier":6}],"alignments":[{"type":"Chaotic","text":"Use your signature weapon to stand up to unjust authority."},{"type":"Good","text":"Use your signature weapon to better the life of someone in need."}],"bonds":["__________ has stood by me in battle and can be trusted completely.","__________ is integral to the destiny revealed by my signature weapon."],"gear":"You get your signature weapon in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"You may add the huge enhancement to your signature weapon, in addition to its other powers."},{"name":"Elf","text":"In your hands, your signature weapon and all other weapons of the same type are considered precise."},{"name":"Halfling","text":"You may add the alarm enhancement to your signature weapon, in addition to its other powers."},{"name":"Human","text":"You may add the versatile enhancement to your signature weapon, in addition to its other powers."}]}],"spells":{"holy":[{"name":"Animals","page":185,"intro":"In the great chain of being, the gods set the four mortal races upon the earth to rule it and to worship the heavens. As long as mortals maintain their fealty to the gods, they shall have dominion over all else that is of the earth, over both the rocks and trees, and so too the beasts that crawl and the birds that fly.","spells":[{"name":"Find the Beast","level":"rote","ongoing":true,"text":"You can sense the presence of a type of animal you name, or a particular animal you have met before. You know what direction to look in, and vaguely how far away they are.","page":185},{"name":"Charm Animal","level":"1","ongoing":false,"text":"One animal in your presence regards you as a friend and will perform a single favour for you, such as tracking someone’s passage, showing you something hidden, or allowing you to pass by safely.","page":185},{"name":"Repel Creature","level":"1","ongoing":true,"text":"Name a type of beast or animal (but not a person or a monster). While this spell is ongoing, creatures of that type cannot approach or attack you, and you take -1 to cast a spell.","page":185},{"name":"Animal Summons","level":"3","ongoing":false,"text":"Name a species or type of animal. One specimen of that type is summoned to your presence. It must make its way to you of its own power, but unless its kind are all extinct, one will come.","page":186},{"name":"The Speech of Beasts","level":"3","ongoing":true,"text":"This spell allows you to communicate with one type of animal, which you choose when it is cast. You may use basic moves like parley and discern realities while doing so. While this spell is ongoing, you take -1 to cast a spell.","page":186},{"name":"Conjure Beast","level":"5","ongoing":true,"text":"An animal appears and aids you as best it can. Treat it as your character, but with access to only the basic moves (though it can’t speak to people). It has a +1 modifier for all stats, 1 HP, and uses your damage dice. The animal also gets your choice of 1d6 of these traits:\n- It does 1d8 damage.\n- It has +2 instead of +1 for one stat.\n- It has some useful adaptation.\n- It’s clever.\n- It’s tough: +2 HP for each level you have.\nThe GM will tell you they type of animal you conjure based on the traits you select. The animal remains until it dies or you dismiss it. While this spell is ongoing, you take -1 to cast a spell.","page":186},{"name":"Spirits of the Wild","level":"5","ongoing":true,"text":"You call upon the power of an animal spirit to aid you. Name the animal. While this spell is ongoing, you gain the use of one of that animal’s abilities and take -1 to cast a spell. Unless this spell is revoked, you may use it to call upon another animal spirit.","page":186},{"name":"Summon Swarm","level":"7","ongoing":true,"text":"Name a location you can see. An immense swarm of small animals (your choice what kind) descends upon this location immediately. While this spell is ongoing, these animals do not cease to infest this location, and you take -1 to cast a spell.","page":187},{"name":"Altered Beast","level":"9","ongoing":false,"text":"You permanently alter the form of an animal you touch. You can give it the traits of another animal you are touching, grant the animal traits that describe you, or remove unwanted traits. The only limit is that you cannot give an animal the intelligence of a person.","page":187}]},{"name":"Battle","page":188,"intro":"We are as pawns upon a chess board, fighting on the gaming board that is our world, for the victory of those heavenly forces we pray to, lest the darkness of evil devour us.","spells":[{"name":"The Wisdom of War","level":"rote","ongoing":false,"text":"When cast during a battle, or on the spot of a historical battle, the GM will tell you something interesting and useful about that battle, as if you were spouting lore and you rolled a 10+.","page":188},{"name":"Bless","level":"1","ongoing":true,"text":"Your deity smiles upon a combatant of your choice. They take +1 ongoing so long as battle continues and they stand and fight. While this spell is ongoing you take -1 to cast a spell.","page":188},{"name":"Magic Weapon","level":"1","ongoing":true,"text":"The weapon you hold while casting does +1d4 damage until you dismiss this spell. While this spell is ongoing you take -1 to cast a spell.","page":188},{"name":"Fireball","level":"3","ongoing":false,"text":"You evoke a mighty ball of flame that envelops your target and everyone nearby, inflicting 2d6 damage which ignores armour.","page":188},{"name":"Immunity","level":"3","ongoing":true,"text":"Name one specific source of harm, such as burning, cutting, lightning, or poisonous gas, for example. While this spell is ongoing, you are immune to harm from that source, and you take -1 to cast a spell. You may still be subject to secondary effects—fire that does not burn you produces smoke that can still choke you, and drowning is still uncomfortable, to say the least.","page":188},{"name":"Summon Monster","level":"5","ongoing":true,"text":"A monster appears and aids you as best it can. Treat it as your character, but with access to only the basic moves. It has +1 modifier for all stats, 1 HP, and uses your damage dice. The monster also gets your choice of 1d6 of these traits:\n- It does 1d8 damage.\n- It has +2 instead of +1 to one stat.\n- It has some useful adaptation.\n- It’s not reckless.\n- Its bond to your plane is strong: +2 HP for each level you have.\nThe GM will tell you the type of monster you get based on the traits you select. The creature remains on this plane until it dies or you dismiss it. While the spell is ongoing you take -1 to cast a spell.","page":189},{"name":"Sever","level":"7","ongoing":true,"text":"Choose an appendage on the target such as an arm, tentacle, or wing. The appendage is magically severed from their body, causing no damage but considerable pain. Missing an appendage may, for example, keep a winged creature from flying, or a bull from goring you on its horns. While this spell is ongoing you take -1 to cast a spell.","page":189},{"name":"Rain of Fire","level":"9","ongoing":false,"text":"You call down fire from the sky. Choose a specific area: everyone in that area takes 2d8 damage, which ignore armour.","page":189}]},{"name":"Death","page":191,"intro":"She is not the first of all foes faced by the living, but she is the strongest and the easiest to fear. Such power demands reverence— for understanding comes only with the proper humility.","spells":[{"name":"Corpse Whispers","level":"rote","ongoing":false,"text":"Cast this spell when you touch a corpse. You experience that person’s last moments of life through one of their senses—you see what they saw or hear what they heard, for example.","page":191},{"name":"Ghost Sight","level":"1","ongoing":true,"text":"By peering into the shadowlands, you are able to see or sense the presence of any ghost, restless spirit, or other undead. While this spell is ongoing, you take -1 to cast a spell.","page":191},{"name":"Mask of Death","level":"1","ongoing":true,"text":"You can assume the visage of death, and use it to attract insects, pass as a corpse, or to become invisible to the undead. While this spell is ongoing, you take -1 to cast a spell.","page":191},{"name":"Speak With Dead","level":"1","ongoing":false,"text":"A corpse converses with you briefly. It will answer any three questions you pose to it to the best of the knowledge it had in life and the knowledge it gained in death.","page":191},{"name":"Animate Dead","level":"3","ongoing":true,"text":"You invoke a hungry spirit to possess a recently-dead body and serve you. This creates a zombie that follows your orders to the best of its limited abilities. Treat the zombie as a character, but with access to only the basic moves. It has a +1 modifier for all stats and 1 HP. The zombie also gets your choice of 1d4 of these traits:\n- It does not appear obviously dead, at least for a day or two.\n- It has a functioning brain and can complete complex tasks.\n- It’s durable. It has +2 HP for each level you have.\n- It’s talented. Give one stat a +2 modifier.\nThe zombie lasts until it is destroyed by taking damage in excess of its HP, or until you end the spell. While this spell is ongoing you take -1 to cast a spell.","page":192},{"name":"Resurrection","level":"3","ongoing":false,"text":"Tell the GM you would like to resurrect a corpse whose soul has not yet fully departed this world. Resurrection is always possible, but the GM will give you one or more (possibly all) of these conditions to fulfill:\n- It will require a lot of money.\n- It’s going to take days/weeks/months.\n- You must get help from __________.\n- You must sacrifice __________ to do it.\nThe GM may, depending on the circumstances, allow you to resurrect the corpse now, with the understanding that the conditions must be met before it’s permanent, or require you to meet the conditions before the corpse is resurrected.","page":192},{"name":"Trap Soul","level":"5","ongoing":false,"text":"You trap the soul of a dying creature within a gem. The trapped creature is aware of its imprisonment but can still be manipulated through spells, parley, and other effects. All moves against the trapped creature are at +1. You can free the soul at any time but it can never be recaptured once freed.","page":193},{"name":"Mark of Death","level":"7","ongoing":false,"text":"Choose a creature whose true name you know. This spell creates permanent runes on a target surface that will kill that creature, should they read them.","page":193},{"name":"Consume Unlife","level":"9","ongoing":false,"text":"The mindless undead creature you touch is destroyed and you steal its death energy to heal yourself or the next ally you touch. The amount of damage healed is equal to the HP that the creature had remaining before you destroyed it.","page":193}]},{"name":"The Earth","page":194,"intro":"The oldest faith is the covenant mortals have with the earth, and the chthonic goddesses that dwell there, giving life to the living until the living are done with it.","spells":[{"name":"Pass Without Trace","level":"rote","ongoing":true,"text":"You or an ally you touch may pass over natural terrain without leaving footprints, a scent, or any other trail.","page":194},{"name":"The Fog","level":"1","ongoing":true,"text":"Name a location you can see. It is completely blanketed in thick fog that prevents anyone from seeing further than a foot in front of them. While this spell is ongoing, the fog will not dissipate and cannot be blown away by wind, and you take -1 to cast a spell.","page":194},{"name":"Stonespeak","level":"1","ongoing":false,"text":"With a touch you speak to the spirits within the earth. A piece of stone you touch answers one question you pose, as best it can.","page":194},{"name":"Find the Way","level":"5","ongoing":false,"text":"The earth shows you or an ally you touch the quickest and shortest path, either to a desired destination, or out of the present location. If used during a perilous journey, this counts as being the trailblazer and rolling a 10+.","page":194},{"name":"Cold Snap","level":"5","ongoing":false,"text":"With a snap of your fingers, the temperature in a location you can see plummets below freezing. Crops die, animals flee, and people who aren’t protected may suffer frostbite if they remain in the cold. The temperature and weather does not return to normal for the remainder of the day, unless you wish it to.","page":196},{"name":"Part the Seas","level":"7","ongoing":true,"text":"You cause a body of water to part before you, revealing a pathway across its floor. It can be wide enough for you and twice your level in companions to walk abreast, if you like. While this spell is ongoing, you take -1 to cast a spell.","page":196},{"name":"Servant of the Earth","level":"7","ongoing":true,"text":"You summon an elemental being from the earth itself. It is made of one type of chthonic substance (dust, plants, soil, stone, wood, etc). The GM will give the elemental one or two special abilities based on its composition. Treat it as your character, but with access to only the basic moves. It has +1 modifier for all stats, 6 HP, and uses your damage dice. The elemental also gets your choice of two of the following traits:\n- It deals +1d6 damage.\n- It has +2 for two stats instead of +1.\n- It has 16 HP instead of 6.\n- It has protection worth 3 armour.\nThe elemental remains until it is destroyed or you dismiss it. While this spell is ongoing, you take -1 to cast a spell.","page":196},{"name":"Commune with Nature","level":"9","ongoing":false,"text":"You attune yourself to a location and the earth answers you. Spirits of this location will answer any three questions you pose to them. Anything the land can know, it will tell you.","page":197},{"name":"Earthquake","level":"9","ongoing":true,"text":"A location you can see begins to shake violently. The earth heaves and shudders, tearing itself asunder for miles around. While this spell is ongoing, you take -1 to cast a spell.","page":197}]},{"name":"Healing","page":198,"intro":"Why do we put up with these clerics, with their lectures and their superior attitudes? Because their hands close up wounds and restore health out of a state of abject ruination. Perhaps they really are superior after all.","spells":[{"name":"Sanctify","level":"rote","ongoing":false,"text":"Food or water you hold in your hands while you cast this spell is consecrated by your deity. In addition to now being holy or unholy, the affected substance is purified of any mundane spoilage.","page":198},{"name":"Cure Light Wounds","level":"1","ongoing":false,"text":"At your touch wounds scab and bones cease to ache. Heal an ally you touch of 1d8 damage.","page":198},{"name":"Invigorate","level":"1","ongoing":false,"text":"One ally you touch is cured of fainting, lethargy, paralysis, or unconsciousness, and are instantly able to move again.","page":198},{"name":"Analgesia","level":"3","ongoing":true,"text":"You touch an ally for a second and they are cured of all fear, nausea, and pain, be it mundane or magical. While this spell is ongoing, you take -1 to cast a spell.","page":198},{"name":"Cure Moderate Wounds","level":"3","ongoing":false,"text":"You staunch bleeding and set bones through magic. Heal an ally you touch of 2d8 damage.","page":198},{"name":"Cure Critical Wounds","level":"5","ongoing":false,"text":"Heal an ally you touch of 3d8 damage.","page":199},{"name":"Reverse Poison","level":"5","ongoing":false,"text":"With a touch, you cure an ally of any ill effects caused by a poisonous substance, short of death itself. Damage caused by the poison itself is healed, but damage caused by other sources that was enhanced by the poison remains.","page":199},{"name":"Heal","level":"7","ongoing":false,"text":"Touch an ally and you may heal them of damage by a number of points equal to your own maximum HP.","page":199},{"name":"Repair","level":"9","ongoing":false,"text":"Choose one event in the target’s past. All effects of that event, including damage, poison, disease, and magical effects, are ended and repaired. HP and diseases are healed, poisons are neutralized, magical effects are ended.","page":199}]},{"name":"Judgment","page":200,"intro":"Perhaps the most important responsibility, the heaviest duty, that the gods bear upon their shoulders is that of judgment.","spells":[{"name":"Contract","level":"rote","ongoing":false,"text":"When you sign a contract you have cast this spell upon, you are mystically notified if the other
