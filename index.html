cation\n- Illusions\n- Mind\n- Movement\n- Necromancy\n- Pyromancy\n- Summoning\n- Ward-Weaving\nEach school has a list of eight or more spells associated with it. When you choose which spells you know, choose from those offered."}]},{"name":"Acrobat","archetype":"Rogue","page":334,"blurb":"Who better to perform an impossible heist than the death-defying acrobat?","compendium":"Once you have trained with a troupe of acrobats or a master acrobat for a full tour cycle (every location the circus goes to), you may consider the acrobat specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Perfect Poise","text":"You never lose your balance, even on a high wire, or fall without being pushed. If you are pushed, as long as there is something to break your fall, you can defy danger with DEX to use it and take no damage.","page":334}],"advanced":[{"name":"The Long Climb","text":"When you assess a stretch of dangerous terrain between you and an objective, the GM will sketch out a map or diagram to help you plot your approach. Working together, make note of a number of useful features equal to your level, and take +1 forward when you make use of them.","page":336,"tier":2},{"name":"Nine Lives","text":"When you fall, if there is something that could possibly break your fall, it does so and you take no damage.","page":336,"tier":2,"requires":["Perfect Poise"]},{"name":"Swashbuckler","text":"When you use your surroundings to perform a flamboyant acrobatic maneuver, choose one outcome, in addition to anything else that may happen:\n- You grab something undefended. Now it’s yours!\n- You knock someone down or off-balance.\n- You move from where you are to somewhere else in sight or in reach without difficulty.","page":336,"tier":2},{"name":"Death Defying Grace","text":"When you defy danger using acrobatic maneuvers, on a 7-9, you can choose not to personally suffer the consequences. Someone or something else, possibly your equipment but certainly not you, suffers the consequences instead.","page":336,"tier":6},{"name":"Heroic Swashbuckler","text":"When you use your surroundings to perform a flamboyant acrobatic maneuver, choose one outcome, in addition to anything else that may happen:\n- You grab something, even if someone else is holding it: Now it’s yours!\n- You knock someone down or off-balance. You may deal damage equal to your level.\n- You move from where you are to somewhere else in sight or in reach without difficulty. You may take someone else with you.","page":337,"tier":6,"replaces":["Swashbuckler"]},{"name":"Serpentine","text":"When you employ acrobatics, deft maneuvers, or quick reflexes, you can defend with DEX instead of CON.","page":337,"tier":6}],"alignments":[],"bonds":["I ran away from the circus to be with __________."],"gear":"You get adventuring gear (5 uses, 1 weight) in addition to whatever your other specialties give you.","races":[{"name":"Halfling","text":"When you defy danger and use your small size to your advantage, take +1."},{"name":"Human","text":"When you first enter a civilized settlement, you can always find a circus, tavern, or theatre that will take you in as a guest."}]},{"name":"Assassin","archetype":"Rogue","page":339,"blurb":"Killing people for money isn’t pretty, but it’s a living. Well, sure, not for them.","compendium":"Once you have murdered a well-known person in a position of power without being caught or identified, you may consider the assassin specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Backstab","text":"When you attack a surprised or defenceless enemy with a melee weapon, you can choose to deal your damage or roll+DEX. On a 10+, choose two. On a 7-9, choose one:\n- Their armour is reduced by 1 until the repair it.\n- You create an advantage that gives +1 forward to you or an ally acting on it.\n- You deal your damage +1d6.\n- You don’t get into a fight with them.","stat":"DEX","page":339}],"advanced":[{"name":"Cheap Shot","text":"When using a precise or hand weapon, your backstab deals an extra +1d6 damage.","page":340,"tier":2,"requires":["Backstab"]},{"name":"Improvised Weapon","text":"Anything solid that you can pick up, you can use as a weapon with the appropriate range (usually hand).","page":340,"tier":2},{"name":"Shoot First","text":"You’re never caught by surprise. When an enemy would get the drop on you, you get to act first instead.","page":340,"tier":2},{"name":"Underdog","text":"When you’re outnumbered, you have +1 armour.","page":340,"tier":2},{"name":"Dirty Fighter","text":"When using a precise or hand weapon, your backstab deals an extra +1d8 damage and all other attacks deal +1d4 damage.","page":340,"tier":6,"replaces":["Cheap Shot"]},{"name":"Disguise","text":"When you have time and materials, you can create a disguise that will fool anyone into thinking you’re another creature of about the same size and shape. Your actions can give you away but your appearance won’t.","page":340,"tier":6},{"name":"Serious Underdog","text":"You have +1 armour. When you’re outnumbered, you have +2 armour instead.","page":341,"tier":6,"replaces":["Underdog"]},{"name":"Strong Arm, True Aim","text":"You can throw any melee weapon, using it to volley. A thrown melee weapon is gone from your possession; you can never choose to reduce ammo on a 7-9.","page":341,"tier":6}],"alignments":[{"type":"Chaotic","text":"Murder a tyrant."},{"type":"Lawful","text":"Execute a convicted criminal."}],"bonds":["__________ has promised to help me leave this life behind.","__________ saw me kill someone important.","I’ve worked with __________ before."],"gear":"Choose one:\n○ Backpack and adventuring gear (5 uses, 1 weight).\n○ Leather armour (1 armour, 1 weight).\n○ Rapier (close, precise, 1 weight).\n○ Short sword (close, 1 weight).\n○ Three throwing daggers (thrown, near, 0 weight).","races":[]},{"name":"Body Thief","archetype":"Rogue","page":342,"blurb":"It was horrible. She was stealing my body, crowding me out, making a prisoner of me. You know it was she, that preying wolf in my body. You ought to have known the difference!","compendium":"Once you have experienced a severe mind/body break, and found yourself wandering away from your flesh, due to powerful magic or psychic influence, you may consider the body thief specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the body thief specialty, lower your maximum HP by 2, but not lower than 4+Constitution.","mods":{"hp":-2},"starting":[{"name":"Possession","text":"When you touch a sleeping or unconscious NPC, you may possess their body with your mind. While you possess someone’s body, your own body lies unconscious and you have full control over their body, as if it were yours. Use your own stats. Your new body takes any physical damage you suffer, but you mark a debility if it dies or suffers particularly traumatic injury. Your mind returns to your original body when you want it to or when the person you are possessing wakes up.","page":342}],"advanced":[{"name":"Doll House","text":"When you build a body out of inanimate materials, you can possess it like a sleeping or unconscious person. Do not mark a debility if your constructed body suffers damage or is destroyed.","page":343,"tier":2,"requires":["Possession"]},{"name":"Eyes of the Tiger","text":"When you mark an animal (with blood, dirt, or mud, for example), you can see through that animal’s eyes as if they were your own, no matter what distance separates you. Only one animal may be marked in this way.","page":343,"tier":2},{"name":"Mind Invasion","text":"When you touch a conscious NPC and force your mind into their body, roll+INT. On a hit, you can take possession of their body, but on a 7-9, choose one:\n- It is hard to maintain control. Take -1 ongoing until you leave their body.\n- Their mind must inhabit your body while you possess theirs.\n- They can still speak while you possess their body.\n- You can only possess their body for a few short moments.\nYour mind returns to your body when you want it to, or when your victim finds a way to drive you out.","stat":"INT","page":343,"tier":2,"requires":["Possession"]},{"name":"Callous Master","text":"You never mark a debility if the body you are possessing dies or suffers injury.","page":344,"tier":6,"requires":["Possession"]},{"name":"Far Invasion","text":"You can attempt to possess a conscious person if you make eye contact, even without touching them.","page":344,"tier":6,"requires":["Mind Invasion"]},{"name":"I am the Tiger","text":"When you mark an animal, you can possess it as if it were a sleeping or unconscious person. When you take advantage of the animal’s specific adaptations, take +1.","page":344,"tier":6,"requires":["Eyes of the Tiger"]}],"alignments":[{"type":"Chaotic","text":"Cause embarrassment to someone powerful by possessing them or someone close to them."},{"type":"Evil","text":"Possess an enemy and cause them harm."},{"type":"Neutral","text":"Possess someone in order to increase your material wealth."}],"bonds":["__________ knows what I can do and doesn’t loathe me, for some strange reason.","I wish I were __________, but I can never be them.","I would never possess __________, I cannot stand their body."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Book of “sorcery” (1 weight).\n○ Change of clothes (stolen).\n○ Dungeon rations (5 uses, 1 weight).\n○ Incriminating letters.\n○ Manacles (1 weight).\n○ Someone else’s purse, unopened.","races":[{"name":"Halfling","text":"When you possess someone of a different race, you gain a move that corresponds to their race, for as long as you possess their body."},{"name":"Human","text":"When you discern realities while in a possessed body, add these questions to the list of those you can ask:\n- What does my new body remember about this?\n- What would my new body do in this situation?"}]},{"name":"Breaker","archetype":"Rogue","page":346,"blurb":"Breakin’ in, breakin’ out.","compendium":"Once you have cracked the most famous prison, safe, or stronghold in the land, you may consider the breaker specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the breaker specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Tools of the Trade","text":"When you have time to prepare for a job, you can produce the tools you need later on. When you produce them, say what they are and roll+INT. On a 10+, they work perfectly and aren’t even the only thing inside your black bag. On a 7-9, either there’s plenty more where that one came from but the GM will add a tag or a complication to it, or this is the last thing up your sleeve and it works perfectly. On a miss, there is probably something wrong with your tools.","stat":"INT","page":346},{"name":"Tricks of the Trade","text":"When you pick locks or pockets or disable traps, roll+DEX. On a 10+, you do it, no problem. On a 7-9, you still do it, but the GM will offer you two options between a cost, danger, and suspicion.","stat":"DEX","page":346}],"advanced":[{"name":"Breakin’","text":"When you scout a location with the intention of breaking in, roll+INT. On a 10+, ask the GM three questions from the list below. On a 7-9, ask one:\n- What’s my best way in?\n- What’s out of place here?\n- What’s the greatest danger here?\n- Where do they keep the valuables?\nTake +1 forward when you take advantage of the answers.","stat":"INT","page":347,"tier":2},{"name":"The Long Climb","text":"When you assess a stretch of dangerous terrain between you and an objective, the GM will sketch out a map or diagram to help you plot your approach. Working together, make note of a number of useful features equal to your level, and take +1 forward when you make use of them.","page":347,"tier":2},{"name":"Safecracker","text":"When you use your tools to break through a door, safe, wall, or other sealed obstacle, roll+DEX. On a 10+, choose two option from the list below. On a 7-9, choose one:\n- It doesn’t cost you anything.\n- You do it quickly.\n- You do it quietly.","stat":"DEX","page":347,"tier":2,"requires":["Tools of the Trade"]},{"name":"Buyers","text":"When you see something of great value, ask the GM who would be interested in acquiring it and choose one:\n- The GM will name a number of persons equal to your INT and you can ask one question about each of them, but no more.\n- The GM will name one person, and you can ask a number of questions about them equal to your INT.","page":348,"tier":6},{"name":"Escape Route","text":"When you’re in too deep and need a way out, name your escape route and roll+DEX. On a 10+, you’re gone. On a 7-9, you can stay or go, but if you go it costs you: leave something behind or take something with you, the GM will tell you what.","stat":"DEX","page":348,"tier":6},{"name":"Leg Work","text":"You can spend a preparation to reveal a safe house or a secret stash of supplies close to a place you intend to break into.","page":348,"tier":6}],"alignments":[{"type":"Neutral","text":"Avoid detection or infiltrate a location."}],"bonds":["__________ has fenced goods for me before.","__________ helped me steal something really valuable from someone who is really dangerous.","__________ knows where I stashed some loot.","I don’t think __________ approves of my lifestyle."],"gear":"You have a black bag of tools (1 weight) and choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Bag of books (5 uses, 2 weight).\n○ Lantern (1 weight) and oil.\n○ Small watchdog.\n○ Sword (close, 2 weight).","races":[{"name":"Dwarf","text":"When you produce gemcutting, safecracking, or stonecrafting tools, roll for tools of the trade as normal but treat a miss as a 7-9."},{"name":"Elf","text":"When you study a location, you may ask one question from the breakin’ list, in addition to whatever discern realities questions you also ask."},{"name":"Halfling","text":"When you defy danger and use your small size to your advantage, take +1."},{"name":"Human","text":"When you disarm a trap, as long as you don’t destroy it, you can reset it once you are out of danger."}]},{"name":"Fence","archetype":"Rogue","page":350,"blurb":"The middleman makes all the money.","compendium":"Once you have found a buyer for a famous, unique, and valuable artifact stolen by someone else, you may consider the fence specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Connections","text":"When you put out word to the criminal underbelly about something you want or need, roll+CHA. On a 10+, someone has it, just for you. On a 7-9, you’ll have to settle for something close or it comes with strings attached, your call.","stat":"CHA","page":350}],"advanced":[{"name":"Eye for Loot","text":"When you see or come to know about a thing you want, roll+INT. On a 10+, ask the GM three questions about it. On a 7-9, ask two. On a miss, ask one anyway, but your desire is betrayed to everyone who cares (and some who don’t):\n- What happened to it recently?\n- What is it really worth, all things considered?\n- What protects it and keeps it where it is?\n- Who will try to keep it from me?\n- Who will want it once it is mine?","stat":"INT","page":351,"tier":2},{"name":"Trade Networks","text":"When you consult your contacts before undertaking a journey to another settlement, the GM will tell you about a person there who can help you.","page":351,"tier":2},{"name":"We All Want Things","text":"When you parley with someone or discern realities connected to them, on a hit you can also ask the GM one of these questions:\n- What does this person really want from me?\n- What does this person value most?\n- What is the most valuable thing here?","page":351,"tier":2},{"name":"Wealth and Taste","text":"When you make a show of flashing around your most valuable possession, the GM chooses an NPC who can see you. They will do anything they can to obtain your item or one like it.","page":351,"tier":2},{"name":"Back-Up Plan","text":"When you meet with someone on business, the GM will answer two questions you ask from the list below:\n- Is there an ambush waiting for me?\n- What are they really feeling?\n- What is my best way out of this?\n- Who is watching?","page":352,"tier":6},{"name":"Buyers","text":"When you see something of great value, ask the GM who would be interested in acquiring it and choose one:\n- The GM will name a number of persons equal to your INT and you can ask one question about each of them, but no more.\n- The GM will name one person, and you can ask a number of questions about them equal to your INT.","page":352,"tier":6},{"name":"I Must Have It!","text":"When you use your eye for loot, on a 12+, ask the GM an additional question, any question, about the thing you want.","page":352,"tier":6,"requires":["Eye for Loot"]},{"name":"Magic Mark","text":"When you mark an object in some special way, you can always find out where it is later on by making the mark again on something you have at hand.","page":352,"tier":6},{"name":"Web of Contacts","text":"When you put out the word that you want to meet with someone, roll+CHA. On a 10+, someone can set up a meeting, with circumstances in your favour. On a 7-9, you can meet with them, but there are strings attached or the circumstances are less than ideal.","stat":"CHA","page":352,"tier":6,"requires":["Connections"]}],"alignments":[{"type":"Evil","text":"Prevent someone from getting their possessions back."},{"type":"Neutral","text":"Obtain a unique and valuable treasure."}],"bonds":["__________ knows where I stashed some loot.","I’ve moved goods for __________ before."],"gear":"Choose one:\n○ Bag of books (5 uses, 2 weight).\n○ Fancy clothes.\n○ Rapier (close, precise, 2 weight).\n○ Three throwing daggers (thrown, 0 weight).","races":[{"name":"Elf","text":"When you examine an object, add this to the list of discern realities questions you can ask:\n- Where does this come from?"},{"name":"Human","text":"When you examine a person, add this to the list of discern realities questions you can ask:\n- What kind of things do you consider valuable?"}]},{"name":"Firestarter","archetype":"Rogue","page":354,"blurb":"Fire is seductive. The beauty of it, the power, the sheer freedom of its chaotic dance of destruction. Who wouldn’t want to control that?","compendium":"Once you have miraculously survived a raging inferno, you may consider the firestarter specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Pyrokinesis","text":"When you exert your will over fire, roll+INT. On a 10+, hold 3 commands. On a 7-9, hold 2. Spend a command to:\n- Create fire.\n- Extinguish a single body of fire.\n- Make a body of fire take an action according to your will.\n- Move a body of fire instantaneously.","stat":"INT","page":354}],"advanced":[{"name":"Born of Fire","text":"You are no longer harmed by the touch of fire, nor are you vulnerable to heat.","page":355,"tier":2},{"name":"Inner Heat","text":"You are no longer vulnerable to cold or freezing. You can melt ice with your touch, as if you were on fire.","page":355,"tier":2},{"name":"Teeth of Flame","text":"Whenever you deal damage using fire, you deal 1d10 damage.","page":355,"tier":2},{"name":"Fire Control","text":"When you hold command over fire, you may control a body of fire no larger than yourself that you have created without spending a command.","page":355,"tier":6,"requires":["Pyrokinesis"]},{"name":"Flame Out","text":"When you hold command over fire, you may gain +1 command at any time if you take 1d4 damage (ignores armour).","page":355,"tier":6,"requires":["Pyrokinesis"]},{"name":"Wreathed in Flame","text":"When you summon fire to envelope your body, the following things are true:\n- Anyone who touches you is burned, for at least 1d10 damage.\n- Anything you touch is burned.\n- Nothing you are holding or wearing when you summon the fire burns, unless you want it to.\n- You may act normally, see fine, and you have no need to breathe.\nThe fire that surrounds you lasts as long as you want it to.","page":356,"tier":6,"requires":["Born of Fire"]}],"alignments":[{"type":"Evil","text":"Use your power over fire to destroy and terrorize."},{"type":"Good","text":"Push someone away so there’s no chance of you hurting them by accident."}],"bonds":["__________ thinks my powers are nothing but trouble.","__________ underestimates the amount of danger we are in.","I’ve been burned by __________ before, if you know what I mean."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Dungeon rations (5 uses, 1 weight).\n○ Healing potion.\n○ Leather armour (1 armour, 1 weight).\n○ Staff (close, two-handed, 1 weight).","races":[]},{"name":"Mastermind","archetype":"Rogue","page":358,"blurb":"Whoever plans the heist has the best chance of keeping the loot.","compendium":"Once you have successfully planned and executed a daring heist, you may consider the mastermind specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"I’ve Got a Bad Feeling About This","text":"When you spend a moment surveying an area, ask the GM two of the following questions. The GM will answer truthfully.\n- Is there a trap or ambush here, and if so, where?\n- What can I see that no one else can?\n- What here is the biggest threat to me?\n- Where’s my best way in, out, or through?","page":358}],"advanced":[{"name":"Connections","text":"When you put out the word to the criminal underbelly about something you want or need, roll+CHA. On a 10+, someone has it, just for you. On a 7-9, you’ll have to settle for something close or it comes with strings attached, your call.","stat":"CHA","page":359,"tier":2},{"name":"Ever Watchful","text":"When you discern realities, ask one additional question, even on a miss.","page":359,"tier":2},{"name":"Forecast","text":"When you make camp, the GM will tell you about one enemy, hazard, or obstacle you are likely to face tomorrow, and you take +1 forward against it.","page":359,"tier":2},{"name":"Evasion","text":"When you defy danger, on a 12+, you transcend the danger. You not only do what you set out to, but the GM will offer you a better outcome, true beauty, or a moment of grace.","page":360,"tier":6},{"name":"Ever Thoughtful","text":"When you discern realities, up to two of your questions can by anything, not limited to the list.","page":360,"tier":6,"requires":["Ever Watchful"]},{"name":"Heist","text":"When you take time to make a plan to steal something, name the thing you want to steal and ask the GM these questions. When acting on the answers you and your allies take +1 forward.\n- What’s its most powerful defence?\n- Who else wants it?\n- Who will come after it?\n- Who will notice it’s missing?","page":360,"tier":6}],"alignments":[{"type":"Chaotic","text":"Pull off a heist that causes an uproar in public society."},{"type":"Evil","text":"Rob someone of their most valuable item."}],"bonds":["__________ earned my respect the hard way.","__________ helped me get where I am today.","__________ is my trusty assistant."],"gear":"You get the clothes necessary to look like a normal person, a bag of thieves’ tools (2 weight), and whatever your other specialties give you.","races":[{"name":"Dwarf","text":"Add these to the list of questions you can ask when you have a bad feeling about this:\n- Is there treasure hidden here?\n- What is the most valuable object here?"},{"name":"Elf","text":"Add these to the list of questions you can ask when you have a bad feeling about this:\n- Is there a secret hiding here?\n- What here is magical or an illusion?"},{"name":"Human","text":"When you recruit from the criminal underworld, take +1."}]},{"name":"Poisoner","archetype":"Rogue","page":362,"blurb":"Poison is a coward’s weapon. A smart coward’s weapon.","compendium":"Once you have created your own unique blend of poison, you may consider the poisoner specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the poisoner specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Poisoner","text":"You’ve mastered the care and use of a poison. Choose a poison from the list below; that poison is no longer dangerous for you to use. You also start with three uses of the poison you choose. Whenever you have time to gather materials and a safe place to brew, you can make three uses of the poison you choose for free. Note that some poisons are applied, meaning you have to carefully apply it to the target or something they eat or drink. Touch poisons just need to touch the target, they can even be used on the blade of a weapon.\n○ Bloodweed (touch): The target deals -1d4 damage ongoing until cured.\n○ Goldenroot (applied): The target treats the next creature they see as a trusted ally, until proved otherwise.\n○ Iocaine Powder (ingested): Causes the target to die.\n○ Oil of Tagit (applied): The target falls into a light sleep.\n○ Serpent’s Tears (touch): Anyone dealing damage to the target rolls twice and takes the better result.","page":362}],"advanced":[{"name":"Brewer","text":"When you have time to gather materials and a safe place to brew, you can create three doses of any one poison you’ve used before.","page":363,"tier":2,"requires":["Poisoner"]},{"name":"Envenom","text":"You can apply even complex poisons with a pinprick. When you apply a poison that’s not dangerous for you to use to your weapon, it’s touch instead of applied.","page":363,"tier":2,"requires":["Poisoner"]},{"name":"Nose for Danger","text":"Using only your sense of smell, you can tell if something has been poisoned and with what, if you know the poison.","page":363,"tier":2},{"name":"Poison Master","text":"After you’ve used a poison once, it is no longer dangerous for you to use.","page":363,"tier":2,"requires":["Poisoner"]},{"name":"The Poisoned Blade","text":"When you attack with a poisoned blade, on a hit, the poison also takes effect, but on a 7-9, your weapon is no longer poisoned. When you coat your blade with poison, choose an applied or touch poison that you possess or either of these two:\n- Paralytic: Choose one of your foe’s limbs, senses, or other physical abilities. They can no longer use it.\n- Toxic: Deal +1d4 damage moments after you strike.","page":363,"tier":2},{"name":"Alchemist","text":"When you have time to gather materials and a safe place to brew, you can create three doses of any poison you’ve used before. Alternately you can describe the effects of a poison you’d like to create. The GM will tell you that you can create it, but with one or more caveats:\n- It will have obvious side effects.\n- It will only work under specific circumstances\n- It will take a while to take effect.\n- The best you can manage is a weaker version.","page":364,"tier":6,"replaces":["Brewer"]},{"name":"Envenomed","text":"Choose one poison: your body is infused with it. Your blood, sweat, and tears, even your spit, are all now poisonous, as if they are this poison. You are unaffected by it.","page":364,"tier":6,"requires":["Envenom"]},{"name":"Poison God","text":"No poison, neither mundane nor magical, can affect you unless you let it.","page":364,"tier":6,"requires":["Poison Master"]}],"alignments":[],"bonds":["__________ helped me develop my poison.","__________ suspects me of a crime I didn’t commit.","I spent time in jail with ___________."],"gear":"You get three uses of your poison and whatever your other specialties give you.","races":[{"name":"Elf","text":"Your race is old and patient. You start with three poisons, instead of only one."},{"name":"Halfling","text":"When you brew your poisons, you can make four uses instead of three."},{"name":"Human","text":"When you’re in a town or city, you can always find the materials you need to brew your poison."}]},{"name":"Pretender","archetype":"Rogue","page":367,"blurb":"Fake it ’till you make it.","compendium":"Once you have successfully impersonated someone famous throughout the land, you may consider the pretender specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Fake","text":"Choose a type of person—perhaps an occupation, rank, or other social role. You have a costume that allows you to disguise yourself as this kind of person—all you need do is don the clothes. Your actions might give you away, but your clothes and mannerisms will not. Each time you level up, choose another type of person that you can disguise yourself as.","page":367}],"advanced":[{"name":"Bamboozle","text":"When you parley with someone, on a hit, you also take +1 forward with them.","page":368,"tier":2},{"name":"Impersonation","text":"When you disguise yourself as a specific person, roll+CHA. On a 10+, only that person’s most intimate associates can tell the difference. On a 7-9, only those who do not know the person are fooled.","stat":"CHA","page":368,"tier":2},{"name":"Silver Tongue","text":"You never have to spend money to carouse, and you roll with CHA instead of coins spent. If there is already a gathering happening, you may carouse without having returned triumphant.","page":368,"tier":2},{"name":"Social Climber","text":"When you set your heart on achieving a certain social position, the GM will sketch out a relationship map or diagram to help you plot your approach. Working together, make note of a number of useful circumstances equal to your level, and take +1 forward when you make use of them. You can only work towards one position at a time.","page":368,"tier":2},{"name":"Con","text":"When you parley with someone, on a hit, you also take +1 forward with them and get to ask their player one question which they must answer truthfully.","page":368,"tier":6,"replaces":["Bamboozle"]},{"name":"Master Impersonator","text":"When you disguise yourself as a specific person, you look just like them. Your actions may give you away, but anyone who does not know the person intimately will be fooled by your appearance. When you meet someone who is intimately associated with the person you are impersonating, roll+CHA. On a 10+, they are fooled, even by strange behaviour, until you give yourself away for certain. On a 7-9, they are already suspicious of you.","stat":"CHA","page":369,"tier":6,"replaces":["Impersonation"]},{"name":"Reputation","text":"When you first meet someone who’s heard tell of you, roll+CHA. On a 10+, tell the GM two things they’ve heard about you. On a 7-9, tell the GM one thing they’ve heard, and the GM tells you one thing.","stat":"CHA","page":369,"tier":6}],"alignments":[{"type":"Evil","text":"Harm someone’s reputation or social standing."}],"bonds":["__________ shared a secret with me.","I grew up with ___________. They know who I really am."],"gear":"You start with the extra costume you get from being fake, and whatever else your other specialties give you.","races":[]},{"name":"Psi-Knife","archetype":"Rogue","page":370,"blurb":"A keen intellect you have, as sharp as a knife. Literally.","compendium":"Once you have worked the anger in your heart like an iron in a forge, dedicating yourself to stifling its expression in any way save through the mental image of a knife, and proved your discipline by remaining calm three times you should have responded, you may consider the psi-knife specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Psychic Blade","text":"When you create a blade out of psychic energy, it counts as a weapon (hand, near, ignores armour), and you can hack and slash with INT instead of STR when you fight with it. If you reduce a foe to zero HP with your psychic blade, instead of dying, they fall unconscious.","page":370}],"advanced":[{"name":"Flying Daggers of the Mind","text":"Your psychic blades gain the near tag. You can volley using INT instead of DEX, but if you choose to expend ammo, take 1d4 damage (ignores armour) instead.","page":371,"tier":2,"requires":["Psychic Blade"]},{"name":"Psychic Fist","text":"Your psychic blade also has the forceful, messy, and reach tags.","page":371,"tier":2,"requires":["Psychic Blade"]},{"name":"Psychic Shield","text":"You can use your psychic blade as a shield instead of a knife. When you do, you get +1 armour, and you cannot use it as a weapon.","page":371,"tier":2,"requires":["Psychic Blade"]},{"name":"Savage Blade","text":"Your psychic blade does an extra +1d4 damage, and also has the close tag.","page":371,"tier":2,"requires":["Psychic Blade"]},{"name":"Twilight Blade","text":"Your psychic blade can cut through solid objects. When you deal damage with your psychic blade to a damaged, defenceless, or surprised enemy, you may also cut through one of their possessions or weapons, or reduce their armour by 1. If you do, deal no damage.","page":371,"tier":2,"requires":["Psychic Blade"]},{"name":"Deadly Blade","text":"Your psychic blade does an extra +1d8 damage, and also has the close and reach tags.","page":372,"tier":6,"replaces":["Savage Blade"]},{"name":"The Lock Undone","text":"You can open locks and interfere with other mechanical devices as if you had lockpicks or other tools, using only your mind.","page":372,"tier":6},{"name":"Shield of Blades","text":"You can use your psychic blade as a shield and a weapon at the same time. When you wield your psychic knife, you get +1 armour.","page":372,"tier":6,"replaces":["Psychic Shield"]},{"name":"Twilight Reckoning","text":"When you deal damage with your psychic blade to a damaged, defenceless, or surprised enemy, you may sever anything from the target—their life, their limb, their title, their relationship with someone, their most prized possession, their thoughts on a topic, anything. If you do, deal no damage.","page":372,"tier":6,"requires":["Twilight Blade"]}],"alignments":[{"type":"Evil","text":"Defeat a foe because they have something you want."},{"type":"Good","text":"Capture and imprison a dangerous villain."},{"type":"Neutral","text":"Get the drop on a foe by appearing harmless."}],"bonds":["__________ keeps cramping my style.","__________ underestimates the trouble that lies before us.","This isn’t the first time __________ and I have been in a mess together."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Antitoxin.\n○ Healing potion.\n○ Leather armour (1 armour, 1 weight).\n○ Shield (+1 armour, 2 weight).","races":[]},{"name":"Puppet Master","archetype":"Rogue","page":374,"blurb":"You have your hands in so many pies, your strings on so many hearts, your fingers stroking so many minds. Who could defy your will?","compendium":"Once you have successfully manipulated someone else into making a series of life-altering decisions, according to your elaborate plan, all without suspecting your influence, you may consider the puppet master specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Puppet Strings","text":"When you have time and physical contact with someone, you can plant commands inside their mind. Voice your commands, no matter how complicated, and roll+INT. On a 10+, hold 3. On a 7-9, hold 1. If they fulfill your commands, you lose all your hold over them. Until then, you can spend a hold at any time to inflict 1d6 damage (ignores armour). You may only retain your hold over one person at a time, though you can abandon your remaining hold if you wish.","stat":"INT","page":374}],"advanced":[{"name":"Command and Conquer","text":"When you order hirelings, add your INT to their loyalty.","page":374,"tier":2},{"name":"Commanding Touch","text":"You may use puppet strings, and maintain hold, on more than one person at a time, if you have time and physical contact with them. You may also use puppet strings with but a touch, skin to skin, but you must abandon your hold on anyone else in order to do so, if you have any.","page":376,"tier":2,"requires":["Puppet Strings"]},{"name":"Iron Will","text":"When you are subject to mind control or magic that influences your feelings, you may choose to take 1d4 damage (ignores armour) and ignore the influence.","page":376,"tier":2},{"name":"Vicious Commands","text":"When you spend a hold, you deal 1d8 damage, not 1d6.","page":376,"tier":2,"requires":["Puppet Strings"]},{"name":"Deadly Commands","text":"When you spend a hold, you deal 1d10 damage, not 1d6.","page":376,"tier":6,"replaces":["Vicious Commands"]},{"name":"Master of Puppets","text":"You can spend all your hold on an NPC to control their physical movements for a few minutes or until they suffer harm.","page":376,"tier":6,"requires":["Puppet Strings"]},{"name":"The Voice","text":"You may use puppet strings on more than one person as long as you touch them, skin to skin. You may also use puppet strings on one person who can hear you speak, but you must abandon your hold on anyone else in order to do so, if you have any.","page":376,"tier":6,"replaces":["Commanding Touch"]}],"alignments":[{"type":"Evil","text":"Deflect blame or consequences from yourself to someone else."},{"type":"Lawful","text":"Use your special powers to enforce or restore the social order."}],"bonds":["__________ is undisciplined, and needs firm guidance.","Chaos follows in __________’s wake. I must be wary.","What an intriguing mind __________ has!"],"gear":"You get 3d6 coins, in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"Increase your maximum HP by 2."},{"name":"Human","text":"When you have a hold over someone, you can spend all your hold and take 1d6 damage (ignores armour) to make them obey your command, whether they want to or not."}]},{"name":"Shadow","archetype":"Rogue","page":379,"blurb":"Like the ghost of something real, like a passing shadow, you’re not really there most of the time. Until you are. But then you’re gone!","compendium":"Once you have followed someone to a place that is impossible to get to, without them noticing, you may consider the shadow specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Stay Out of the Light","text":"When you hide in shadows or darkness, you cannot be detected by any normal means until you reveal yourself.","page":379}],"advanced":[{"name":"Following","text":"When you follow or shadow someone, roll+DEX. On a 10+, you find out exactly what they’re up to without arousing suspicion. On a 7-9, it’s either an impression of their doings or you can reveal yourself to learn more.","stat":"DEX","page":379,"tier":2},{"name":"Iron Will","text":"When you are subject to mind control or magic that influences your feelings, you may choose to take 1d4 damage (ignores armour) and ignore the influence.","page":379,"tier":2},{"name":"Like a Ghost","text":"When you roll for another move that you want to perform in a clandestine manner, you may choose options equal to your DEX or less (but not fewer than none), and then tell the other players:\n- …how you draw attention elsewhere instead of to you.\n- …how you stay out of sight.\n- …that you remain silent.\n- …why you leave no trace behind.\nOn a 10+, all that you say is true. On a 7-9, the GM chooses one of your statements to be false, the others are true. On a miss, no guarantees.","page":380,"tier":2},{"name":"Disguise","text":"When you have time and materials, you can create a disguise that will fool anyone into thinking you’re another creature of about the same size and shape. Your actions can give you away but your appearance won’t.","page":380,"tier":6},{"name":"Escape Route","text":"When you’re in too deep and need a way out, name your escape route and roll+DEX. On a 10+, you’re gone. On a 7-9, you can stay or go, but if you go it costs you: leave something behind or take something with you, the GM will tell you what.","stat":"DEX","page":380,"tier":6},{"name":"Fade Away","text":"While you stay still or act meek and unobtrusive, even in broad daylight, people only notice you if they are looking for you specifically.","page":380,"tier":6,"requires":["Stay Out of the Light"]},{"name":"Unseen Hand","text":"When you leave a room or other location, you can name something small that you saw that no one else was using or studying. You took it.","page":381,"tier":6}],"alignments":[{"type":"Neutral","text":"Learn a secret about someone important."}],"bonds":["__________ once talked me into guiding some halflings on the run through dangerous territory, and never thanked me properly for it.","I am obsessed with __________, but they don’t know. Yet.","I stole something from __________."],"gear":"You get adventuring gear (5 uses, 1 weight), a backpack, and a key, though you don’t know what lock it opens.","races":[{"name":"Elf","text":"You can hide in forests just as well as shadows and darkness."},{"name":"Human","text":"At the end of a session, mark an extra experience if you infiltrated a secure location."}]},{"name":"Siren","archetype":"Rogue","page":382,"blurb":"Everyone needs guidance at some point. Everyone needs a muse. They just hate so much to be commanded. But you can steer anyone in the right direction without commands, can’t you?","compendium":"Once you have convinced someone to worship you as a deity or to trust you more than anyone else in the world, even though they shouldn’t, you may consider the siren specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the siren specialty, reduce your base damage by one die size, but not lower than d4.","mods":{"dmg":-1},"starting":[{"name":"Hypnotic Allure","text":"When you are alone with an NPC and you fix your will upon them, roll+CHA. On a 10+, hold 2 over them. On a 7-9, hold 1. While you have a hold over them, they cannot act against you, except in self-defence. They can spend one of your hold by:\n- Doing something you tell them to do.\n- Fighting to protect you.\n- Giving you something you want.","stat":"CHA","page":382}],"advanced":[{"name":"Dangerous Eyes","text":"You can spend a hold on someone to meet their gaze. They freeze and cannot move until you break off eye contact. You cannot move either.","page":383,"tier":2,"requires":["Hypnotic Allure"]},{"name":"Grand Entrance","text":"When you make a spectacular entrance or perform for an audience, roll+CHA. On a 10+, choose three options from the list below. On a 7-9, choose two. On a miss, choose one, in addition to whatever the GM tells you.\n- Someone desires to meet you later, the GM will tell you who.\n- Someone falls in love with you, the GM will tell you who.\n- Someone must give you a gift, the GM will tell you who.","stat":"CHA","page":383,"tier":2},{"name":"Social Climber","text":"When you set your heart on achieving a certain social position, the GM will sketch out a relationship map or diagram to help you plot your approach. Working together, make note of a number of useful circumstances equal to your level, and take +1 forward when you make use of them. You can only work towards one position at a time.","page":383,"tier":2},{"name":"Animal Magnetism","text":"When you use your hypnotic allure, you get +1 hold, even on a miss.","page":383,"tier":6,"requires":["Hypnotic Allure"]},{"name":"Deadly Eyes","text":"You can spend a hold on someone to meet their gaze. They freeze and cannot move until you break off eye contact. You can move as long as you maintain eye contact.","page":384,"tier":6,"replaces":["Dangerous Eyes"]},{"name":"Popular","text":"You can write an additional two bonds with the other PCs, in addition to those you started with.","page":384,"tier":6},{"name":"Reputation","text":"When you first meet someone who’s heard tell of you, roll+CHA. On a 10+, tell the GM two things they’ve heard about you. On a 7-9, tell the GM one thing they’ve heard, and the GM tells you one thing.","stat":"CHA","page":384,"tier":6},{"name":"A Specific Audience","text":"Instead of choosing one of the options from the list, you may choose a member of the audience. The GM will choose how they react from the list.","page":384,"tier":6,"requires":["Grand Entrance"]}],"alignments":[{"type":"Chaotic","text":"Use your personal influence to sow discord amongst your foes."},{"type":"Evil","text":"Get someone to give you their most valued possessions."},{"type":"Neutral","text":"Increase your social position and personal influence."}],"bonds":["__________ has a thing for me, but I’m not interested. Right now.","I need something from __________, something important."],"gear":"Choose one or two:\n○ Antitoxin.\n○ Bandages (3 uses, slow).\n○ Dagger (hand, 1 weight).\n○ Engagement ring.\n○ Letter of introduction.\n○ Map.\n○ Mask.\n○ Ostentatious clothes.\n○ Personal feast (1 use, 1 weight).\n○ Pet.\n○ Spyglass (1 weight).","races":[{"name":"Elf","text":"When you use your hypnotic allure, on a 12+, hold 3 over them."},{"name":"Human","text":"When you have a hold over someone, you deal +1d4 damage when you harm them."}]},{"name":"Swindler","archetype":"Rogue","page":386,"blurb":"Why work hard for it, when people just give it away?","compendium":"Once you have convinced someone to part with something unique or valuable, that they would charge a high price for, and then swindle them out of the payment you agreed upon, you may consider the swindler specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Con Artist","text":"When you evaluate a potential victim, roll+INT. On a 10+, ask their player three questions from the list below. On a 7-9, ask one:\n- How could I engage you in conversation?\n- How much are you worth?\n- What are your current intentions?\n- What do you value?\nOn a miss, you look suspicious.","stat":"INT","page":386}],"advanced":[{"name":"Bamboozle","text":"When you parley with someone, on a hit, you also take +1 forward with them.","page":387,"tier":2},{"name":"Disarming and Open","text":"When you engage someone in conversation, you can ask their player a question from the list below. They must answer it truthfully, then they may ask you a question from the list. If you lie, you cannot use this move on them ever again. If you tell the truth, you can.\n- What are your present intentions?\n- What do you most desire?\n- What do you not want me to know?\n- What do you want from me?","page":387,"tier":2},{"name":"Heart of Gold","text":"After you evaluate a potential victim and ask your questions, tell the other player something they could do to make you change your mind about taking advantage of them. If they end up doing this, you take +1 forward. If they are a PC, they also mark XP.","page":387,"tier":2,"requires":["Con Artist"]},{"name":"The Upsell","text":"If you repackage or modify goods you own in order to resell them, they are now worth one-and-a-half times as much as before. Note that doing this with money is called “counterfeiting” and is everywhere banned by law.","page":387,"tier":2},{"name":"Con","text":"When you parley with someone, on a hit, you also take +1 forward with them and get to ask their player one question which they must answer truthfully.","page":388,"tier":6,"replaces":["Bamboozle"]},{"name":"Devious","text":"When you use disarming and open, you may also ask this:\n- How are you vulnerable to me?\nYour subject may not ask this question of you.","page":388,"tier":6,"requires":["Disarming and Open"]},{"name":"Snake Oil","text":"When you give someone a thing that you have tampered with, roll+INT. On a hit, you may choose one, but on a 7-9, there are strings attached or complications:\n- The thing comes with some sort of unpleasant side effects (describe them).\n- The thing is ruined as soon as you are gone.\n- The thing returns to you within the week.","stat":"INT","page":388,"tier":6}],"alignments":[{"type":"Evil","text":"Profit from someone else’s misery."},{"type":"Neutral","text":"Get the better of another thief or swindler."}],"bonds":["__________ helped me steal something really valuable from someone who is really dangerous.","__________ knows where I stashed some loot.","I stole something from __________."],"gear":"You get a case full of fraudulent merchandise and various kinds of quackery (3 weight) and 2d6 coins, in addition to whatever your other specialties give you.","races":[{"name":"Elf","text":"When you enter an important location (your call) you can ask the GM for one fact from the history of that location."},{"name":"Human","text":"When you evaluate a potential victim who is also human, ask an extra question, even on a miss."}]},{"name":"Thief","archetype":"Rogue","page":390,"blurb":"It’s not just about stealing things. It’s about stealing things from people who don’t want their things to be stolen, who make sure that you know it. That’s the stuff worth stealing!","compendium":"Once you have successfully robbed the richest person you know, you may consider the thief specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Trap Expert","text":"When you spend a moment to survey a dangerous area, roll+DEX. On a 10+, hold three. On a 7-9, hold one. Spend your hold as you move through the area to ask these questions:\n- Is there a trap here and if so, what activates it?\n- What does the trap do when activated?\n- What else is hidden here?","stat":"DEX","page":390},{"name":"Tricks of the Trade","text":"When you pick locks or pockets or disable traps, roll+DEX. On a 10+, you do it, no problem. On a 7-9, you still do it, but the GM will offer you two options between a cost, danger, and suspicion.","stat":"DEX","page":390}],"advanced":[{"name":"Cautious","text":"When you use trap expert, you always get +1 hold, even on a miss.","page":391,"tier":2},{"name":"Guild Thief","text":"When you contact the guild and ask for assistance, roll+CHA. On a 10+, another thief shows up with what you need for a fair price. On a 7-9, you can still get what you want but there are strings attached or the guild wants a favour in return. On a miss, you have fallen out of good standing with the guild and need to make amends.","stat":"CHA","page":391,"tier":2},{"name":"It Belongs in a Museum","text":"When you are trying to snatch a significant treasure and get away with it, and no more, you have 2 armour.","page":391,"tier":2},{"name":"The Smell of Sorcery","text":"When you discern realities or use trap expert, the GM will also tell you what the closest magical effect or source is, if it’s within sight or scent.","page":391,"tier":2},{"name":"Sneaky Bastard","text":"When you disable a trap, you can reset it after you pass, so it catches the next person. When you pick a lock, you may set it so that it locks behind you again.","page":391,"tier":2,"requires":["Tricks of the Trade"]},{"name":"Heist","text":"When you take time to make a plan to steal something, name the thing you want to steal and ask the GM three questions from the list below. When acting on the answers you and your allies take +1 forward.\n- What’s its most powerful defence?\n- Who else wants it?\n- Who will come after it?\n- Who will notice it’s missing?","page":392,"tier":6},{"name":"Evasion","text":"When you defy danger, on a 12+, you transcend the danger. You not only do what you set out to, but the GM will offer you a better outcome, true beauty, or a moment of grace.","page":392,"tier":6},{"name":"Extremely Cautious","text":"When you use trap expert, you always get +1 hold, even on a miss. On a 12+, you get 3 hold and the next time you come near a trap the GM will immediately tell you what it does, what triggers it, who set it, and how you can use it to your own advantage.","page":392,"tier":6,"replaces":["Cautious"]}],"alignments":[{"type":"Chaotic","text":"Steal something of social or cultural significance."},{"type":"Neutral","text":"Avoid detection or infiltrate a location."}],"bonds":["__________ helped me steal something really valuable from someone who is really dangerous.","__________ knows where I stashed some loot.","__________ saved me from joining the wrong thieves’ guild.","I spent time in jail with ___________.","I stole something from __________."],"gear":"You get thieves’ tools (1 weight) and choose one:\n○ Bag of chalk and sand.\n○ Change of clothes.\n○ Small watchdog.","races":[{"name":"Dwarf","text":"When you use trap expert in a structure made of stone, on a hit, you get +1 hold."},{"name":"Elf","text":"When you discern realities or use trap expert, on a hit, you may also ask this question, in addition to any other results:\n- Is there a secret door here?"},{"name":"Halfling","text":"When you defy danger and use your small size to your advantage, take +1."}]},{"name":"Tomb Robber","archetype":"Rogue","page":395,"blurb":"Looting the tombs of dead wizards isn’t all it’s cracked up to be. You need some powerful magic of your own if you’re going to survive!","compendium":"Once you have looting the treasures of an ancient tomb that was protected by magic, you may consider the tomb robber specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the tomb robber specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Ward of Protection","text":"You have a device that is proof against arcane magic. This could be something you wear, like a bracelet or an amulet, or it could be a procedure of limited duration—a potion you prepare, symbols painted on your skin, etc. When you use the protection of this device to thwart a magical effect (actively or passively), roll+CON. On a 10+, you are unaffected by the magic. On a 7-9, you can either suffer the effect to a lesser degree or exhaust yourself and mark a debility of your choice.","stat":"CON","page":395}],"advanced":[{"name":"Appraisal","text":"When you examine an important item (your call) for the first time, roll+INT. On a 10+, ask three questions from the list below. On a 7-9, ask two. On a miss, ask one question anyway, but you might not like the answer. If you act on the answers while using the item, take +1 forward.\n- Does this have magical properties?\n- How much is this worth and to whom?\n- What has been done to this or with this?\n- What is it for?\n- Who made this and how old is it?","stat":"INT","page":396,"tier":2},{"name":"Life, Death, and Greed","text":"When you have a great and valuable treasure in your possession, you deal +1d6 damage.","page":396,"tier":2},{"name":"Sympathetic Ward","text":"Your ward of protection also guards anyone you touch; they resist any magic you do. On a 7-9, they choose between the lesser effect and a debility for themselves.","page":396,"tier":2,"requires":["Ward of Protection"]},{"name":"Ward Against the Dead","text":"When you use your ward or wards against the undead, select another living target and roll+CON. On a 10+, all undead present pursue the other target instead of you. On a 7-9, only mindless undead pursue the other target. Intelligent undead are too clever, and will do what they want.","stat":"CON","page":396,"tier":2,"requires":["Ward of Protection"]},{"name":"Greed is Good","text":"When you obtain a great and valuable treasure for the first time, gain 1d6 temporary hit points. Damage is applied to these temporary hit points before harming you.","page":397,"tier":6},{"name":"Looting the Wizard’s Tomb","text":"When you use a magical item and force it to obey your will, instead of using its effects as written, roll+INT. On a 10+, you control the degree and extent of its effects. On a 7-9, you direct its effects, but choose one:\n- You break it and its beneficial properties cannot be used again until it is fixed.\n- You lose control, producing additional, unwanted effects.","stat":"INT","page":397,"tier":6,"requires":["Appraisal"]},{"name":"Protection Most Excellent","text":"When your ward protects you, on a 12+, the magic rebounds onto its caster, affecting them instead of anyone else.","page":397,"tier":6,"requires":["Sympathetic Ward"]},{"name":"Ward Against Monsters","text":"When you use your wards against monsters, select another living target and roll+CON. On a 10+, all monsters present pursue the other target instead of you. On a 7-9, only mindless monsters pursue the other target. Intelligent monsters are too clever, and will do what they want.","stat":"CON","page":397,"tier":6,"replaces":["Ward Against the Undead"]}],"alignments":[{"type":"Good","text":"Give your treasure to someone who needs it more than you."},{"type":"Lawful","text":"Return treasure to its rightful owner."},{"type":"Neutral","text":"Avoid detection or infiltrate a location."}],"bonds":["__________ has promised to lead me to an ancient burial site.","I worry about the ability of __________ to survive in the dungeon.","Me and __________ are the only survivors of a dubious adventure."],"gear":"You get your ward of protection, two large sacks, and whatever your other specialties give you.","races":[{"name":"Elf","text":"Only the darkest and most violent of elves would willingly seek their fortunes underground. Choose a weapon. In your hands, weapons of this type have the precise tag."},{"name":"Halfling","text":"You know how to take advantage of your small size underground, where you get +1 armour if you’re at all able to defend yourself."},{"name":"Human","text":"As a child of the greediest of all races, you can treat all treasures that are 2 weight or heavier as if they were 1 weight lighter than they are."}]},{"name":"Armiger","archetype":"Warrior","page":407,"blurb":"You are skilled in the wearing of heavy armour. You make it look easy, walking around with heavy pieces of metal all over you, deflecting blows left and right.","compendium":"Once you have commissioned a suit of armour, and then run a marathon, given a rousing speech, and won a fight while wearing it, you may consider the armiger specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the armiger specialty, you get +2 load.","mods":{"load":2},"starting":[{"name":"Armoured","text":"You ignore the clumsy tag on armour you wear.","page":407}],"advanced":[{"name":"Armour Mastery","text":"When you make your armour take the brunt of damage dealt to you, the damage is negated but you must reduce the armour value of your armour or shield (your choice) by 1 until you spend a few hours repairing it. The value is reduced each time you make this choice. If the reduction leaves the item with 0 armour, it is destroyed.","page":408,"tier":2},{"name":"Bloody Aegis","text":"When you take damage, you can grit your teeth and accept the blow. If you do you take no damage but instead suffer a debility of your choice. If you already have all six debilities you can’t use this move.","page":408,"tier":2},{"name":"Heroic Monster Slayer","text":"When you take the skin of a slain monster, you can fashion it into a clumsy shield worth +1 armour or a clumsy suit worth 1 or more armour, the GM will tell you how much (usually 1 or 2 less than the monster had in life).","page":408,"tier":2},{"name":"Hide Like Iron","text":"Armour that you are wearing has +1 armour and weighs 1 less.","page":408,"tier":2},{"name":"Staunch Defender","text":"When you defend, you always get +1 hold, even on a miss.","page":408,"tier":2},{"name":"Armoured Perfection","text":"When you choose to let your armour take the brunt of damage dealt to you, the damage is negated and you take +1 forward against the attacker, but you must reduce the armour value of your armour or shield (your choice) by 1. The value is reduced each time you make this choice. If the reduction leaves the item with 0 armour, it is destroyed.","page":409,"tier":6,"replaces":["Armour Mastery"]},{"name":"Impervious Defender","text":"When you defend, you always get +1 hold, even on a miss. On a 12+, instead of getting hold the nearest attacking creature is stymied giving you a clear advantage, the GM will describe it.","page":409,"tier":6,"replaces":["Staunch Defender"]},{"name":"Indomitable","text":"When you suffer a debility (even through Bloody Aegis), take +1 forward against whatever caused it.","page":409,"tier":6},{"name":"Maker of Monster Suits","text":"When you take the skin of a slain monster, you can fashion it into a clumsy shield worth +1 armour or a clumsy suit worth 1 or more armour, the GM will tell you how much (usually 1 or 2 less than the monster had in life). This armour also retains one aspect of the slain monster that you choose to imbue it with.","page":409,"tier":6,"replaces":["Heroic Monster Slayer"]},{"name":"Skin of Steel","text":"Armour that you are wearing has +1 armour and weighs 2 less, but not less than zero. Any shield on your arm has +1 armour, too, and counts as 0 weight.","page":409,"tier":6,"replaces":["Hide Like Iron"]}],"alignments":[],"bonds":["__________ has stood by me in battle and can be trusted completely.","__________ was instrumental in helping me get my armour."],"gear":"Choose one:\n○ Plate armour (3 armour, clumsy, 4 weight).\n○ Scale mail (2 armour, clumsy, 3 weight) and shield (+1 armour, 2 weight).","races":[{"name":"Dwarf","text":"When you make camp, you can repair damaged armour for 1 point of armour. If you have access to a forge, you can restore any suit of broken armour to its original condition."},{"name":"Human","text":"When you take damage, take +1 armour forward."}]},{"name":"Arsenal","archetype":"Warrior","page":412,"blurb":"You are a walking arsenal, kitted out with a myriad of murderous implements. Who can stand before your onslaught? For every foe, and every defence, you have the perfect weapon. Until you stand upon a mountain of your discarded blades and handles, surrounded by the conquered, you cannot be stopped.","compendium":"Once you have collected a dozen different types of exotic weapons and have a story to tell about each of them, you may consider the arsenal specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the arsenal specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"Pull Out a Weapon","text":"You have a whole arsenal of weapons at your disposal. It is 4 weight, and starts with stock +2. While you carry it around, you can instantly produce weapons of any type with the hand, close, or reach tags. When you pull out a more specialized weapon, roll+stock. On a 10+, describe it and choose one option from the list below. On a 7-9, you can still choose one option but you can’t choose that option again until you restock your arsenal by buying more weapons.\n- +1 damage.\n- 2 piercing.\n- Forceful and messy.\n- Precise.\n- Ranged weapon (near, far) with 1 ammo.\n- Stun damage.\nWhen you pull out and define a specialized weapon, write it down: once you have four, you cannot pull out another until you restock your arsenal. If you lose or give away a weapon from your arsenal, take -1 stock until you restock. When you restock, your arsenal is restored to stock +2 and you can keep one weapon as a separate item. The rest go back into your arsenal, erase them.","page":414}],"advanced":[{"name":"Pack Rat","text":"You have more than just weapons in your arsenal. When you search it for an item that would fit, roll+WIS. On a 10+, you find just the thing as long as it isn’t magical, unique, or valuable. On a 7-9, you have just the thing and you take -1 stock or you have something close but not exact. Make do. Anything you pull out counts toward your limit of four specialized weapons.","stat":"WIS","page":415,"tier":2,"requires":["Pull Out a Weapon"]},{"name":"Scavenger","text":"When you collect the weapons of your fallen foes (more than one), it counts as restocking your arsenal.","page":415,"tier":2,"requires":["Pull Out a Weapon"]},{"name":"A Shield Made of Weapons","text":"When you defend, you can take -1 stock to get +1 hold.","page":415,"tier":2,"requires":["Pull Out a Weapon"]},{"name":"Suiting Up","text":"You can pull out a weapon with two options if you spend a preparation or take -1 stock instead of rolling.","page":415,"tier":2,"requires":["Pull Out a Weapon"]},{"name":"Swordbreaker","text":"When you allow your weapons to take the brunt of an attack upon you, the damage is negated but a weapon is destroyed. Take -1 stock and you may not pull out any other weapons of that type until you restock your arsenal.","page":415,"tier":2,"requires":["Pull Out a Weapon"]},{"name":"Bag of Holding","text":"You can pull out seven specialized weapons or items before you must restock your arsenal. When you restock, you get stock +3 instead of +2.","page":416,"tier":6,"requires":["Pull Out a Weapon"]},{"name":"Can Opener","text":"Instead of the 2 piercing option, you can produce a weapon that ignores armour. You may not keep this weapon separate when you restock.","page":416,"tier":6,"requires":["Pull Out a Weapon"]},{"name":"Superior Arsenal","text":"When you pull out a weapon, on a 12+, you can choose two options and this weapon doesn’t count toward your limit.","page":416,"tier":6,"requires":["Pull Out a Weapon"]},{"name":"That’s Not a Knife","text":"Instead of the +1 damage option, you can produce a weapon that deals +1d6 damage. You may not keep this weapon separate when you restock.","page":416,"tier":6,"requires":["Pull Out a Weapon"]}],"alignments":[],"bonds":[],"gear":"You get your arsenal (4 weight) in addition to whatever your other specialties give you.","races":[{"name":"Dwarf","text":"You can also pull tools out of your arsenal, in addition to weapons, as long as they are used in forging, smithing, gemcutting, mining, or underground survey work."},{"name":"Elf","text":"You can always pull out a ranged weapon from your arsenal, along with 1 ammo, or a weapon with the hand tag, but pulling out a weapon with the close or reach tags is a specialized weapon. Replace the ranged option with this:\n- Close or reach."},{"name":"Halfling","text":"You always pack a lunch. Instead of pulling out a specialized weapon, you can choose to pull out a tasty ration from your arsenal. If someone eats it, take -1 stock until you restock."},{"name":"Human","text":"When you restock, you also gain 1 Preparation."}]},{"name":"Beastmaster","archetype":"Warrior","page":418,"blurb":"Nature is red of tooth and claw, but it obeys your call.","compendium":"Once you have successfully raised a wild animal from a newborn to an adult, you may consider the beastmaster specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Call of the Wild","text":"When you summon animals to your presence or to the presence of someone else, choose a type of animal and roll+WIS. On a 10+, they congregate at the location you chose. On a 7-9, they congregate but choose one:\n- It takes time for them to gather.\n- You are not precise about the location.\n- You attract other animals in addition to or instead of those you intended.","stat":"WIS","page":418}],"advanced":[{"name":"Eyes of the Tiger","text":"When you mark an animal (with mud, dirt, or blood), you can see through that animal’s eyes as if they were your own, no matter what distance separates you. Only one animal at a time may be marked in this way.","page":420,"tier":2},{"name":"Familiar","text":"When you spout lore about an animal, you can use WIS instead of INT.","page":420,"tier":2},{"name":"Wild Empathy","text":"You can speak with and understand animals. This means you can closely study them and parley with them as if they were people.","page":420,"tier":2},{"name":"Two Minds, One Thought","text":"When you touch and animal and push your thoughts into its mind, roll+WIS. On a hit, you can read the animal’s mind and memories, reliving its past and seeing what it has seen. On a 7-9, though, you have trouble separating these memories from your own, and you exhibit some aspects of the animal’s behaviour for a while after you break the link.","stat":"WIS","page":420,"tier":6},{"name":"Wild Speech","text":"You can speak with and understand any non-magical, non-planar creature. This means you can closely study them and parley with them as if they were people.","page":420,"tier":6,"replaces":["Wild Empathy"]},{"name":"Zoologist","text":"When you spout lore about an animal, you can use WIS instead of INT. On a 12+, in addition to the normal effects, you get to ask the GM any one question about the subject.","page":421,"tier":6,"replaces":["Familiar"]}],"alignments":[{"type":"Chaotic","text":"Eschew a convention of the civilized world."},{"type":"Neutral","text":"Teach someone the ways of your people."}],"bonds":["__________ does not understand life in the wild, so I will teach them.","__________ has tasted my blood and I theirs. We are bound by it.","__________ smells more like prey than a hunter.","__________’s ways are strange and confusing."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight).\n○ Antitoxin and dungeon rations (5 uses, 1 weight).\n○ Healing potion.\n○ Leather armour (1 armour, 1 weight).","races":[{"name":"Dwarf","text":"Choose one type of cave-dwelling or underground animal: these animals will always answer your call if they are near. Choose one type of bird or aerial creature: these animals will never heed your call, but nor will they arrive unbidden."},{"name":"Elf","text":"Animals of the Great Forest respect your power. They will never attack you, even if they are unfriendly."},{"name":"Halfling","text":"Wild Empathy is a starting move for you."},{"name":"Human","text":"You may summon other humans as if they were animals, though you cannot specify what type (language, class, or gender) to call."}]},{"name":"Blade Dancer","archetype":"Warrior","page":424,"blurb":"Battle is an art form and you are its master.","compendium":"Once you have mastered the two dozen blade katas, to the satisfaction of a master blade dancer, and constructed your own set of dancing blades, you may consider the blade dancer specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"","mods":{},"starting":[{"name":"Dance of Blades","text":"When you enter a fight against multiple foes, roll+DEX. On a 10+, hold 3 maneuvers. On a 7-9, hold 2. On a miss, hold 1 anyway, but your enemies already have you, in particular, at a disadvantage. Spend a hold to perform a maneuver that achieves one of the following results:\n- You create an advantage and you or an ally can take +1 forward for exploiting it.\n- You disengage from melee with one foe.\n- You immediately cross the distance between you and one foe it is possible for you to reach.\n- You throw off the effects of being stunned, confused, or enchanted.","stat":"DEX","page":424}],"advanced":[{"name":"On the Move","text":"When you defy a danger caused by movement (maybe falling off a narrow bridge or rushing past an armed guard), take +1.","page":425,"tier":2},{"name":"Viper’s Strike","text":"When you strike an enemy with two weapons at once, add an extra 1d4 damage for your off-hand strike.","page":425,"tier":2},{"name":"Wall of Knives","text":"When you are outnumbered, you get +1 armour as long as you have a weapon in hand.","page":425,"tier":2},{"name":"The Well-Balanced Blade","text":"Any blade in your hands counts as having the precise tag.","page":425,"tier":2},{"name":"Right Where I Want to Be","text":"When you use the dance of blades or symphony of battle moves, add these to your options:\n- You escape the clutches of one foe.\n- You take a position where only one enemy can fight you at a time.","page":425,"tier":6,"requires":["Dance of Blades|Symphony of Battle"]},{"name":"Symphony of Battle","text":"When you enter a fight against multiple foes, roll+DEX. On a 10+, hold 3 maneuvers. On a 7-9, hold 2. On a miss, hold 1 anyway, but your enemies already have you, in particular, at a disadvantage. Spend a hold to perform a maneuver that achieves one of the following effects:\n- You create an advantage and you or an ally can take +1 ongoing while exploiting it.\n- You disengage from melee with all foes.\n- You immediately cross the distance between you and one foe.\n- You throw off the effects of being stunned, confused, or enchanted.","stat":"DEX","page":426,"tier":6,"replaces":["Dance of Blades"]},{"name":"Viper’s Fangs","text":"When you strike an enemy with two weapons at once, add an extra +1d8 damage for your off-hand strike.","page":426,"tier":6,"replaces":["Viper’s Strike"]}],"alignments":[{"type":"Chaotic","text":"Break an unjust law to help someone."},{"type":"Evil","text":"Destroy something beautiful."},{"type":"Lawful","text":"Choose honour over personal gain."}],"bonds":["__________ left me in a pinch when they were supposed to come through for me.","__________ obviously doesn’t trust me, and this needs to change."],"gear":"Choose one blade:\n○ Axe (close, 1 weight).\n○ Greatsword (close, two-handed, +1 damage, 2 weight).\n○ Long sword (close, +1 damage, 2 weight).\n○ Pair of throwing knives (thrown, 2 weight).\n○ Rapier (close, precise, 2 weight).","races":[{"name":"Dwarf","text":"Add these options to the dance of blades/symphony of battle lists:\n- Barge past others to enter melee with a foe.\n- Push someone over.\n- Take a blow meant for someone else."},{"name":"Elf","text":"Add this option to the dance of blades list:\n- Avoid an attack meant for you."},{"name":"Human","text":"When you roll for dance of blades (or symphony of battle), on a 12+, hold 5 maneuvers."}]},{"name":"Bounty Hunter","archetype":"Warrior","page":428,"blurb":"What’s the difference between a kidnapper and a bounty hunter? The one who pays the ransom money! Oh, sorry, I meant reward, of course. I hunt down bad people before they can do bad things and I return them to the rightful authorities. That’s the real difference. Why? You know somebody worth something?","compendium":"Once you have tracked down a criminal, captured them, and delivered them to the authorities, you may consider the bounty hunter specialty an available compendium class. The next time you level up, you may add this specialty to your character instead of choosing a move from your class.","requirements":"","statsText":"If you choose the bounty hunter specialty, you get +1 load.","mods":{"load":1},"starting":[{"name":"The Hunter","text":"Name someone you want to find, either an individual or a gang that sticks together. When you discern realities while looking for them, on a hit, the GM will also tell you if there is any evidence of their passage, and if so what. On a miss, though, something catches up to you instead, the GM will tell you what. You can only be hunting one target at a time, but you can change that target whenever you want.","page":428}],"advanced":[{"name":"The Bigger They Are","text":"When you spout lore about someone you know or you’ve heard of before (your call), on a hit, you can also ask the GM either of these questions and then take +1 forward when acting on the answer.\n- How could they be taken?\n- What are they worth and to whom?","page":429,"tier":2},{"name":"The Harder They Fall","text":"When you successfully attack someone, you can roll a d6. If you roll your foe’s HP or higher, after they take your damage, you knock them out cold or capture them.","page":429,"tier":2},{"name":"Official Position","text":"You work for the law. When you first enter a civilized settlement, someone in authority will take you in as their guest. Take +1 to parley if you can use your authority as leverage.","page":429,"tier":2},{"name":"Professional Gossip","text":"When you ask around at the local watering-hole or other social nexus and make your profession obvious, roll+CHA. On a hit, you’re told about available work. On a 10+, you’re able to suss out the backgrounds of prospective employers. On a 7-9, you only hear about the most promising job currently available. On a miss, you’re shut out or given bad information.","stat":"CHA","page":429,"tier":2},{"name":"Considered It Already","text":"When you spout lore about someone you know or you’ve heard of before (your call), on a hit, you can also ask the GM both of these questions and then take +1 forward when acting on the answers:\n- How could they be taken?\n- What are they worth and to whom?","page":430,"tier":6,"replaces":["The Bigger They Are"]},{"name":"Hellhound on Your Trail","text":"Once you have shed someone’s blood, or they have shed yours, you can track them anywhere. No matter where they go you can always find them.","page":430,"tier":6},{"name":"Wrap It Up","text":"When you successfully attack someone, you can roll a d8. If you roll your foe’s HP or higher, after they take your damage, you knock them out cold or capture them, however you want.","page":430,"tier":6,"replaces":["The Harder They Fall"]}],"alignments":[{"type":"Good","text":"Show mercy to a captive."},{"type":"Lawful","text":"Apprehend a dangerous criminal."},{"type":"Neutral","text":"Gain profit from someone else’s body."}],"bonds":["I have heard of _________’s exploits and am suitably impressed.","Me and __________ were both hired by a boss who turned on us."],"gear":"Choose one:\n○ Adventuring gear (5 uses, 1 weight) and bandages (3 uses, slow).\n○ Duelling rapier (close, precise, 2 weight).\n○ Dungeon rations (5 uses, 1 weight).\n○ Net (reach, stun damage, 2 weight).\n○ Shield (+1 armour, 2 weight).","races":[{"name":"Dwarf","text":"You are blessed with a hardy constitution. While on someone’s trail, you do not need to consume any rations."},{"name":"Elf","text":"When in the wilderness, you may discern realities with INT instead of WIS."},{"name":"Human","text":"When you take damage from or are harmed by someone you are hunting, take +1 forward."}]},{"name":"Captain","archetype":"Warrior","page":432,"blurb":"Heavy is the head t
