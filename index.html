  let cls=c.kind==='cw'?c.cw.archetype:'keep';
  if(c.kind==='custom'){
    const nm=String(c.custom.name||'').trim();const hit=Object.keys(ARCH).find(a=>a.toLowerCase()===nm.toLowerCase());
    if(hit)cls=hit;else{const cnt={};list.forEach(s=>s.homes.forEach(h=>{if(h.type==='spec'&&h.starting)cnt[h.arch]=(cnt[h.arch]||0)+1}));
      const top=Object.entries(cnt).sort((x,y)=>y[1]-x[1])[0];if(top&&top[1]>=2)cls=top[0]}
  }
  const touched={};
  const followArch=()=>list.forEach((s,i)=>{if(touched[i])return;const ai=s.homes.findIndex(h=>h.type==='arch'&&h.arch===cls);if(ai>=0)choice[i]=ai;else if(s.homes[choice[i]]&&s.homes[choice[i]].type==='arch')choice[i]=s.homes.indexOf(s.pick)});
  followArch();
  const specsInPlay=()=>{const o=own();const map={};list.forEach((s,i)=>{const h=choice[i]>=0?s.homes[choice[i]]:null;if(h&&h.type==='spec'&&!o.has(h.spec))(map[h.spec]=map[h.spec]||[]).push({move:s.move,starting:h.starting})});return map};
  const defaultStatus=(sp,ms)=>{
    const hasStart=ms.some(x=>x.starting);
    if(!hasStart)return 'borrowed';
    if(cls!=='keep'&&SPEC_BY[sp].archetype===cls){const startCount=Object.values(status).filter(v=>v==='start').length+(c.cw&&c.cw.specs||[]).filter(s=>s.how==='start').length;if(startCount<3)return 'start'}
    return 'compendium';
  };
  modal(`<h2>Sort out specialties and moves</h2>
    <p class="hint">${afterImport?"Dungeon Paper doesn't track specialties or compendium classes, so these came in as ordinary moves. ":''}These moves match other classes and specialties by name. Tell the app how you got each specialty: the rules differ for a starting specialty, a compendium class, and a move you only borrowed when levelling up. The book's text replaces what's on your sheet; your old text is kept under the move.</p>
    <div id="rclass"></div>
    <div id="rspecs"></div>
    <div class="lbl" style="margin-top:14px">Moves</div>
    <div id="rlist"></div>
    <div id="rstart"></div>
    <div class="row"><button class="btn" id="rkeep" style="margin-right:auto">Keep all as they are</button><button class="btn" data-act="closemodal">Not now</button><button class="btn pri" id="rgo">Save</button></div>`,
  m=>{
    const draw=()=>{
      if(askClass){
        m.querySelector('#rclass').innerHTML=`<div class="lbl" style="margin-top:12px">Class</div>
          <select class="inp" id="rcls" style="margin-top:6px;max-width:420px"><option value="keep" ${cls==='keep'?'selected':''}>${c.kind==='cw'?'Not a Class Warfare build':`Keep the custom class “${esc(c.custom.name||'Imported class')}”`}</option>${ARCH_ORDER.map(a=>`<option value="${a}" ${cls===a?'selected':''}>Class Warfare ${a.toLowerCase()} (${ARCH[a].dmg}, ${ARCH[a].hp}+CON HP, ${ARCH[a].load}+STR load)</option>`).join('')}</select>
          ${c.dpTarget&&cls!=='keep'?'<p class="hint" style="margin:4px 0 0">Your max HP, load and armor from Dungeon Paper are kept either way.</p>':''}`;
        m.querySelector('#rcls').onchange=e=>{cls=e.target.value;followArch();if(cls==='keep')Object.keys(status).forEach(k=>{if(status[k]==='start')status[k]='compendium'});draw()};
      }
      const sp=specsInPlay();
      Object.keys(status).forEach(k=>{if(!sp[k])delete status[k]});
      Object.entries(sp).forEach(([k,ms])=>{if(!(k in status))status[k]=defaultStatus(k,ms)});
      const opts=k=>['start','compendium','borrowed','skip'].filter(o=>o!=='start'||cls!=='keep');
      m.querySelector('#rspecs').innerHTML=Object.keys(sp).length?`<div class="lbl" style="margin-top:14px">Specialties found</div>
        ${Object.entries(sp).map(([k,ms])=>`<div class="rspec"><div><b>${esc(k)}</b> <span class="src">${esc(SPEC_BY[k].archetype)} · CW p.${SPEC_BY[k].page}</span>
            <div class="hint">Your moves from it: ${ms.map(x=>esc(x.move.name)+(x.starting?' (starting)':'')).join(', ')}</div></div>
          <div class="rspecopts">${opts(k).map(o=>`<label class="quest" style="margin:0"><input type="radio" name="rs-${esc(k)}" value="${o}" ${status[k]===o?'checked':''}> ${SPEC_STATUS[o]}</label>`).join('')}
            <span class="hint">${SPEC_STATUS_HINT[status[k]]}</span></div></div>`).join('')}`:'';
      m.querySelectorAll('#rspecs input[type=radio]').forEach(x=>x.onchange=()=>{status[x.name.slice(3)]=x.value;draw()});
      m.querySelector('#rlist').innerHTML=list.map((s,i)=>{const h=choice[i]>=0?s.homes[choice[i]]:null;const st=h&&h.type==='spec'?(own().has(h.spec)?'owned':status[h.spec]):null;
        return `<div class="rrow">
        <div><b>${esc(s.move.name)}</b><div class="hint">Filed as: ${esc(srcLabel(c,s.move))}</div>
          <details><summary class="hint">Compare text</summary><div class="hint" style="margin-top:4px"><b>On your sheet:</b> ${esc((s.move.text||'(no text)').slice(0,300))}</div></details></div>
        <label class="fld"><span class="lbl">Belongs to</span><select class="inp" data-r="${i}">${s.homes.map((h,hi)=>`<option value="${hi}" ${choice[i]===hi?'selected':''}>${esc(h.label)} · ${h.type==='spec'||h.type==='arch'?'CW':'DW'} p.${h.move.page||'?'}</option>`).join('')}<option value="-1" ${choice[i]<0?'selected':''}>Leave it where it is</option></select>
          ${st?`<span class="hint">${st==='owned'?'A specialty you already have':st==='skip'?'Will be left as is':SPEC_STATUS[st]}</span>`:''}</label>
      </div>`}).join('');
      m.querySelectorAll('[data-r]').forEach(x=>x.onchange=()=>{choice[+x.dataset.r]=+x.value;touched[+x.dataset.r]=true;draw()});
      // starting moves you'd be missing for specialties you now hold
      const rows=Object.entries(sp).filter(([k])=>status[k]==='start'||status[k]==='compendium').map(([k,ms])=>{
        const filed=new Set(ms.map(x=>normName(x.move.name)));
        const missing=SPEC_BY[k].starting.filter(x=>!filed.has(normName(x.name))&&!hasMove(c,x.name));
        return missing.length?{sp:k,missing}:null}).filter(Boolean);
      m.querySelector('#rstart').innerHTML=rows.length?`<div class="lbl" style="margin-top:14px">Missing starting moves</div><p class="hint" style="margin:2px 0 6px">You get every starting move of a specialty you hold. These weren't on your character:</p>
        <div class="optlist">${rows.flatMap(r=>r.missing.map(x=>{const k=r.sp+'::'+x.name;if(!(k in addStart))addStart[k]=true;return `<label class="opt"><input type="checkbox" data-as="${esc(k)}" ${addStart[k]?'checked':''}><span><b>${esc(x.name)}</b> <span class="src">${esc(r.sp)} starting move · CW p.${x.page}</span></span></label>`})).join('')}</div>`:'';
      m.querySelectorAll('[data-as]').forEach(x=>x.onchange=()=>{addStart[x.dataset.as]=x.checked});
    };
    draw();
    m.querySelector('#rkeep').onclick=()=>{list.forEach(s=>s.move.reviewed=true);closeModal();touch(c,{full:true});toastInfo("Left as is. You won't be asked about these moves again.")};
    m.querySelector('#rgo').onclick=()=>{
      if(askClass&&cls!=='keep'){
        if(c.kind!=='cw'){c.kind='cw';c.cw={archetype:cls,specs:(c.cw&&c.cw.specs)||[],borrow:{same:0,early:0,late:0},penaltyChoice:'dmg'}}
        else c.cw.archetype=cls;
      }else if(askClass&&cls==='keep'&&c.kind==='cw'){c.kind='custom';c.custom={name:c.custom&&c.custom.name||c.cw.archetype||'Custom class',dmg:base(c).dmg,hp:base(c).hp,load:base(c).load}}
      const before=new Set((c.cw&&c.cw.specs||[]).map(s=>s.name));
      list.forEach((s,i)=>{if(choice[i]<0){s.move.reviewed=true;return}const h=s.homes[choice[i]];
        if(h.type==='spec'){const st=before.has(h.spec)?'owned':status[h.spec];if(st==='skip'){s.move.reviewed=true;return}applyHome(c,s.move,h,st==='owned'?undefined:st)}
        else applyHome(c,s.move,h)});
      Object.entries(addStart).forEach(([k,on])=>{if(!on)return;const [sp,mn]=k.split('::');if(!(status[sp]==='start'||status[sp]==='compendium'))return;const x=SPEC_BY[sp].starting.find(y=>y.name===mn);if(x&&!hasMove(c,mn))addMove(c,{...x,book:'CW',tier:0},'spec:'+sp)});
      relinkReplaces(c);keepDpNumbers(c);
      const added=(c.cw&&c.cw.specs||[]).filter(s=>!before.has(s.name));
      const borrowed=Object.entries(status).filter(([k,v])=>v==='borrowed').map(([k])=>k);
      closeModal();S.filter='all';S.mtab='moves';touch(c,{full:true});
      toastInfo(`Saved.${added.length?' Added '+added.map(s=>s.name+(s.how==='start'?' (starting)':' (compendium)')).join(', ')+'.':''}${borrowed.length?' Borrowed moves from '+borrowed.join(', ')+'.':''}`);
    };
  },{wide:true});
}

/* ---------- change how you have a specialty, after the fact ---------- */
function specStatusModal(c,name){
  const s=SPEC_BY[name];if(!s)return;
  const cur0=(c.cw&&c.cw.specs||[]).find(x=>x.name===name);
  let st=cur0?cur0.how:'borrowed';
  const n=c.moves.filter(m=>m.src==='spec:'+name).length;
  const opts=['start','compendium','borrowed'].filter(o=>o!=='start'||c.kind==='cw');
  modal(`<h2>How do you have ${esc(name)}?</h2><p class="hint">${esc(s.archetype)} specialty · CW p.${s.page}. You have ${n} move${n===1?'':'s'} from it.</p>
    <div class="optlist" style="margin-top:10px">${opts.map(o=>`<label class="opt"><input type="radio" name="ss" value="${o}" ${st===o?'checked':''}><span><b>${SPEC_STATUS[o]}</b><br><span class="src">${SPEC_STATUS_HINT[o]}</span></span></label>`).join('')}
      <label class="opt"><input type="radio" name="ss" value="remove"><span><b>Remove it</b><br><span class="src">Takes ${esc(name)} and its ${n} move${n===1?'':'s'} off your character.</span></span></label></div>
    <div class="row"><button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" id="ssgo">Save</button></div>`,
  m=>{m.querySelectorAll('[name=ss]').forEach(x=>x.onchange=()=>{st=x.value});
    m.querySelector('#ssgo').onclick=()=>{const before=maxHp(c);setSpecStatus(c,name,st);c.hp+=maxHp(c)-before;closeModal();touch(c,{full:true});
      toastInfo(st==='remove'?`Removed ${name}.`:`${name}: ${SPEC_STATUS[st].toLowerCase()}.`)}});
}

/* ---------- move browser (all books) ---------- */
function allBookMoves(){
  const out=[];
  Object.entries(DW_CLASS).forEach(([k,v])=>v.moves.forEach(m=>out.push({...m,from:k,book:'DW'})));
  Object.values(SPEC_BY).forEach(s=>[...s.starting.map(m=>({...m,tier:0})),...s.advanced].forEach(m=>out.push({...m,from:s.name,book:'CW',arch:s.archetype})));
  return out;
}
function browseMoves(c){
  const all=allBookMoves();let q='',src='all',shown=60;
  modal(`<h2>Browse all moves</h2><p class="hint">Every move from Dungeon World and Class Warfare. Adding one here skips the level-up rules, so check with your GM.</p>
    <div class="mtools" style="margin-top:10px"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><input id="bq" type="search" placeholder="Search ${all.length} moves" autofocus></label>
    <select id="bsrc" class="sel"><option value="all">All sources</option><option value="DW">Dungeon World classes</option>${ARCH_ORDER.map(a=>`<option value="${a}">${a} specialties</option>`).join('')}</select></div>
    <div id="blist" class="optlist" style="max-height:60vh;overflow:auto"></div>
    <div class="row"><button class="btn" data-act="closemodal">Close</button></div>`,
  m=>{
    const draw=()=>{const qq=q.toLowerCase();
      const list=all.filter(x=>(src==='all'||(src==='DW'?x.book==='DW':x.arch===src))&&(!qq||x.name.toLowerCase().includes(qq)||x.text.toLowerCase().includes(qq)||x.from.toLowerCase().includes(qq)));
      m.querySelector('#blist').innerHTML=list.slice(0,shown).map((x,i)=>`<div class="lopt"><div class="h"><b>${esc(x.name)}</b><span class="ref">${esc(x.from)} · ${x.tier===0?'starting':x.tier===6?'levels 6–10':'levels 2–5'} · ${x.book} p.${x.page||'?'}</span><span class="spacer"></span><button class="btn sm" data-i="${all.indexOf(x)}" ${hasMove(c,x.name)?'disabled':''}>${hasMove(c,x.name)?'Have it':'Add'}</button></div>${moveText(x)}</div>`).join('')+(list.length>shown?`<button class="btn" id="bmore">Show more (${list.length-shown} left)</button>`:'')+(list.length?'':'<p class="empty">No moves match.</p>');
      m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const x=all[+b.dataset.i];const nm=addMove(c,x,x.book==='CW'?'spec:'+x.from:'multiclass');if(x.book==='CW'&&!(c.cw&&c.cw.specs||[]).some(s=>s.name===x.from))nm.borrowed=true;touch(c,{full:true});b.textContent='Added';b.disabled=true});
      const more=m.querySelector('#bmore');if(more)more.onclick=()=>{shown+=60;draw()};
    };
    m.querySelector('#bq').oninput=e=>{q=e.target.value;shown=60;draw()};
    m.querySelector('#bsrc').onchange=e=>{src=e.target.value;shown=60;draw()};
    draw();
  },{wide:true});
}

    <span class="sm">${esc((s.blurb||'').slice(0,140))}${(s.blurb||'').length>140?'…':''}</span>

/* ---------- level up ---------- */
function openLevelUp(c){
  const need=xpNeed(c);const opts=levelOptions(c);const L=opts.level;
  const st={stat:null,pick:null,mc:null,mode:'move',q:'',ignore:false,comp:null,compOrigin:'',custom:{name:'',text:''}};
  const allOpts=[];opts.groups.forEach(g=>g.items.forEach(it=>{it._g=g.key;it._i=allOpts.length;allOpts.push(it)}));
  modal(`<h2>Level ${c.level} → ${L}</h2>
    <p class="hint">${c.xp>=need?`Spend ${need} XP.`:`You have ${c.xp} of ${need} XP. You can still level up if your GM says so.`} Raise one stat by 1, then choose a new move.</p>
    <div class="lbl" style="margin-top:12px">Raise a stat</div>
    <div class="stats" style="margin:6px 0 14px" id="lstats">${STATS.map(s=>`<button class="ccard" data-s="${s}" ${+c.stats[s]>=18?'disabled style="opacity:.4"':''} aria-pressed="false"><b>${s}</b><span>${c.stats[s]} → ${Math.min(18,+c.stats[s]+1)} (${sgn(scoreMod(c.stats[s]))} → ${sgn(scoreMod(Math.min(18,+c.stats[s]+1)))})</span></button>`).join('')}</div>
    <div class="ctabs" id="lmodes"><button data-m="move" aria-pressed="true">Advanced move</button><button data-m="comp" aria-pressed="false">Compendium class</button><button data-m="custom" aria-pressed="false">Write your own</button></div>
    <div id="lbody"></div>
    <div class="row"><span class="hint" id="lsum" style="margin-right:auto"></span><button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" id="lgo" disabled>Level up</button></div>`,
  m=>{
    const body=m.querySelector('#lbody');
    const ok=()=>{
      const statOk=st.stat||STATS.every(s=>+c.stats[s]>=18);
      let moveOk=false;
      if(st.mode==='move'){const p=allOpts[st.pick];moveOk=!!p&&(!isMulticlassMove(p)||st.mc)}
      if(st.mode==='comp')moveOk=!!st.comp;
      if(st.mode==='custom')moveOk=!!st.custom.name.trim();
      m.querySelector('#lgo').disabled=!(statOk&&moveOk);
      const p=allOpts[st.pick];const sum=m.querySelector('#lsum');
      const need=[!statOk?'pick a stat to raise':'',!moveOk?(st.mode==='comp'?'pick a compendium class':st.mode==='custom'?'name your move':(p&&isMulticlassMove(p)?'pick the other class\'s move':'pick a move')):''].filter(Boolean);
      sum.classList.toggle('need',need.length>0);
      if(need.length){sum.textContent='Still to do: '+need.join(' and ');return}
      sum.textContent=[st.stat?`+1 ${st.stat}`:'',st.mode==='move'&&p?p.name+(st.mc?` (${st.mc.name})`:''):'',st.mode==='comp'&&st.comp?st.comp+' (compendium)':'',st.mode==='custom'&&st.custom.name?st.custom.name:''].filter(Boolean).join(' · ');
    };
    m.querySelectorAll('#lstats [data-s]').forEach(x=>x.onclick=()=>{st.stat=x.dataset.s;m.querySelectorAll('#lstats [data-s]').forEach(y=>y.setAttribute('aria-pressed',y===x));ok()});
    m.querySelectorAll('#lmodes [data-m]').forEach(x=>x.onclick=()=>{st.mode=x.dataset.m;m.querySelectorAll('#lmodes [data-m]').forEach(y=>y.setAttribute('aria-pressed',y===x));draw();ok()});
    const mcPicker=()=>{
      const groups=multiclassOptions(c,L);
      return `<div class="lgroup" style="margin:8px 0 0"><div style="padding:10px 12px"><b>Pick a move from another class</b><p class="hint" style="margin:2px 0 0">Your level counts as ${L-1} for this.</p>
        <select class="sel" id="mccls" style="margin-top:6px"><option value="">Choose a class…</option>${groups.map(g=>`<option ${st.mcCls===g.cls?'selected':''}>${g.cls}</option>`).join('')}</select></div>
        <div class="litems">${(groups.find(g=>g.cls===st.mcCls)?.items||[]).map((x,i)=>`<button class="lopt ${x.met?'':'unmet'}" data-mc="${i}" aria-pressed="${st.mc&&st.mc.name===x.name}"><span class="h"><b>${esc(x.name)}</b><span class="ref">${x.tier?'levels '+(x.tier===6?'6–10':'2–5'):'starting'} · DW p.${x.page||'?'}</span></span>${moveText(x)}</button>`).join('')}</div></div>`;
    };
    const draw=()=>{
      if(st.mode==='custom'){body.innerHTML=`<div class="stack"><label class="fld"><span class="lbl">Move name</span><input class="inp" id="lcn" value="${esc(st.custom.name)}"></label><label class="fld"><span class="lbl">Text</span><textarea class="inp" id="lct">${esc(st.custom.text)}</textarea></label><p class="hint" style="margin:0">For moves your GM invents, or advancement your group agrees on.</p></div>`;
        body.querySelector('#lcn').oninput=e=>{st.custom.name=e.target.value;ok()};body.querySelector('#lct').oninput=e=>{st.custom.text=e.target.value};return}
      if(st.mode==='comp'){
        const qq=(st.cq||'').toLowerCase();const ca=st.ca||'all';
        const list=compendiumOptions(c).filter(s=>(ca==='all'||s.archetype===ca)&&(!qq||(s.name+' '+s.compendium+' '+s.starting.map(x=>x.name).join(' ')).toLowerCase().includes(qq)));
        const s=SPEC_BY[st.comp];
        body.innerHTML=`<p class="hint">Done what a specialty's compendium class asks? Take all of its starting moves now instead of an advanced move. Its advanced moves open up for later levels.</p>

        <label class="quest"><input type="checkbox" id="lign" ${st.ignore?'checked':''}> Show moves I don't meet the requirements for</label></div>
        <p class="hint" style="margin:0 0 8px">Only moves you qualify for are listed. A move that says “Requires” needs that move first (✓ you have it, ✗ you don't). A move that says “Replaces” swaps out the move it names when you take it.</p>
        ${opts.groups.map(g=>{const items=g.items.filter(it=>(st.ignore||it.met)&&(!qq||it.name.toLowerCase().includes(qq)||it.text.toLowerCase().includes(qq)||(it.spec||'').toLowerCase().includes(qq)));
          const openG=['class','same','other'].includes(g.key)&&!qq?(g.key==='class'):true;
          if(!items.length&&qq)return '';
          return `<details class="lgroup ${g.locked?'locked':''}" ${openG||g.key.startsWith('spec:')?'open':''}><summary><b>${esc(g.title)}</b><span class="hint">${esc(g.note)}${g.locked?' · used up':''}</span><span class="spacer"></span><span class="pill">${items.length}</span></summary>
            <div class="litems">${items.slice(0,qq?400:g.key==='same'||g.key==='other'?80:400).map(it=>`<button class="lopt ${it.met?'':'unmet'}" data-o="${it._i}" aria-pressed="${st.pick===it._i}" ${g.locked?'disabled':''}>
              <span class="h"><b>${esc(it.name)}</b><span class="ref">${it.spec&&g.key!=='spec:'+it.spec?esc(it.spec)+' · ':''}${it.tier===6?'levels 6–10':'levels 2–5'} · ${it.book} p.${it.page||'?'}</span></span>
              ${(it.requires||it.replaces)?`<span class="hint" style="font-size:.78rem">${it.requires?`${it.met?'✓':'✗'} Requires ${esc(it.requires.join(', ').replace(/\|/g,' or '))}`:''}${it.requires&&it.replaces?' · ':''}${it.replaces?'Replaces '+esc(it.replaces.join(', '))+(it.replaces.some(r=>hasMove(c,r))?' (you have it; it will be swapped out)':''):''}</span>`:''}

              ${(g.key==='same'||g.key==='other')&&!qq&&items.length>80?`<p class="hint">Showing 80 of ${items.length}. Search to narrow it down.</p>`:''}</div></details>`}).join('')}`;

      body.querySelector('#lign').onchange=e=>{st.ignore=e.target.checked;draw()};
      body.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>{st.pick=+x.dataset.o;st.mc=null;draw();ok()});
      const mcs=body.querySelector('#mccls');if(mcs)mcs.onchange=e=>{st.mcCls=e.target.value;st.mc=null;draw();ok()};
      body.querySelectorAll('[data-mc]').forEach(x=>x.onclick=()=>{const g=multiclassOptions(c,L).find(g=>g.cls===st.mcCls);st.mc=g.items[+x.dataset.mc];draw();ok()});
    };
    m.querySelector('#lgo').onclick=()=>{
      const beforeHp=maxHp(c);
      c.xp=Math.max(0,c.xp-need);c.level=L;
      if(st.stat){c.stats[st.stat]=Math.min(18,+c.stats[st.stat]+1)}
      let added='';
      if(st.mode==='move'){const p=allOpts[st.pick];const nm=addMove(c,p,p.src);if(p.borrow)nm.borrowed=true;added=p.name;
        if(p.borrow&&c.cw){c.cw.borrow=c.cw.borrow||{};c.cw.borrow[p.borrow]=(c.cw.borrow[p.borrow]||0)+1}
        if(st.mc){addMove(c,{...st.mc,book:'DW'},'multiclass');added+=' and '+st.mc.name}}
      let compRes=null;
      if(st.mode==='comp'){compRes=addSpecialty(c,st.comp,'compendium',st.compOrigin);added=st.comp+' (compendium class)'}
      if(st.mode==='custom'){addMove(c,{name:st.custom.name.trim(),text:st.custom.text},'custom');added=st.custom.name}
      c.hp+=maxHp(c)-beforeHp;
      closeModal();touch(c,{full:true});
      if(compRes){revealSpec(c,st.comp,compRes);return}
      const cast=casting(c);
      toastInfo(`Level ${L}! Took ${added}.${cast&&cast.mode!=='commune'?' Add a new spell to your spellbook too.':''}`);
    };
    draw();ok();
  },{wide:true});
}

/* ---------- character builder ---------- */
function arrLabel(n){return n}
function cwGearBlocks(arch,specs){
  const srcs=[{src:arch+' (archetype)',text:CW_ARCH_DATA[arch]?.gear||''},...specs.map(n=>({src:n,text:SPEC_BY[n]?.gear||''}))];
  return srcs.filter(s=>s.text).map(s=>{
    const lines=s.text.split('\n');const intro=[];const opts=[];
    lines.forEach(l=>{if(/^○\s*/.test(l))opts.push(l.replace(/^○\s*/,''));else intro.push(l.replace(/\*\*/g,''))});
    const fixed=intro.join(' ').split(/choose/i)[0];
    return {src:s.src,intro:intro.join(' '),fixed:parseItems(fixed).filter(i=>i.n.length<40),opts};
  });
}
function openBuilder(prefill){

      'Bonds & story':()=>bondsStep()+storyStep(),
      'Name & look':()=>{const k=B.kind==='core'?DW_CLASS[B.cls]:null;
        return `<label class="fld"><span class="lbl">Name</span><input class="inp" id="bname" value="${esc(B.name)}" autofocus></label>
          ${k&&k.names?`<p class="hint">${esc(k.names)}</p>`:''}
          ${k&&k.looks?`<div class="lbl" style="margin-top:12px">Look: choose one from each</div>${k.looks.map((l,i)=>`<select class="inp" data-look="${i}" style="margin-top:6px"><option value="">—</option>${l.split(/,\s*|\s+or\s+/).map(x=>x.replace(/^or\s+/,'').trim()).filter(Boolean).map(x=>`<option ${B.looks[i]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`).join('')}`:''}
          <label class="fld" style="margin-top:12px"><span class="lbl">${k&&k.looks?'Anything else about how you look':'Look'}</span><input class="inp" id="blook" value="${esc(B.look)}" placeholder="Eyes, hair, clothes, body"></label>`}
    };
    const bondsStep=()=>{const bo=bondOpts();const lim=B.kind==='cw'?ARCH[B.arch].bonds:null;const n=Object.values(B.bonds).filter(x=>x&&x.on).length;
      return `<p class="hint">Fill in a companion's name in the blank${lim?`. You can hold up to <b>${lim}</b> bonds (${n} chosen)`:''}. You can change these during play.</p>
        <div class="optlist">${bo.map((b,i)=>{const v=B.bonds[i]||{on:false,t:b.t};return `<label class="opt"><input type="checkbox" data-bd="${i}" ${v.on?'checked':''}><span style="flex:1"><input class="inp" data-bt="${i}" value="${esc(v.t)}" aria-label="Bond text"><span class="src">${esc(b.src)}</span></span></label>`}).join('')}</div>`};
    const storyStep=()=>{
      const disc=B.arch==='Disciple'||B.specs.some(n=>/miracle worker|embodiment/i.test(n));
      const schools=B.specs.some(n=>/prepared caster|vancian caster/i.test(n));
      return `<div class="lbl" style="margin-top:16px">Where your powers came from</div><p class="hint" style="margin:2px 0 6px">For each specialty, tell the others what you did to gain these abilities.</p>
        ${B.specs.map(n=>`<label class="fld" style="margin-top:6px"><span class="lbl">${esc(n)}</span><input class="inp" data-or="${esc(n)}" value="${esc(B.origins[n]||'')}"></label>`).join('')}
        ${disc?`<div class="lbl" style="margin-top:16px">Spheres of influence (Devotion)</div><p class="hint" style="margin:2px 0 6px">Choose 1 to 3. These decide which holy spells you can cast.</p><div class="chips">${DATA.cw.spells.holy.map(g=>`<button class="fchip" data-sph="${esc(g.name)}" aria-pressed="${B.spheres.includes(g.name)}">${esc(g.name)}</button>`).join('')}</div>
          <label class="fld"><span class="lbl">Codes, strictures or tenets you live by</span><input class="inp" id="btenets" value="${esc(B.tenets)}"></label>`:''}
        ${schools?`<div class="lbl" style="margin-top:16px">Schools of magic</div><p class="hint" style="margin:2px 0 6px">Choose 3. You start with their cantrips and three 1st-level spells.</p><div class="chips">${DATA.cw.spells.magic.map(g=>`<button class="fchip" data-sch="${esc(g.name)}" aria-pressed="${B.schools.includes(g.name)}">${esc(g.name)}</button>`).join('')}</div>`:''}`};
    const WIRE={
      'Class':()=>{
        main.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{B.kind=x.dataset.k;B.race=null;B.align=null;B.bonds={};draw()});
        main.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{B.cls=x.dataset.c;B.race=null;B.align=null;B.bonds={};B.gear={};draw()});
        main.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{B.arch=x.dataset.a;B.specArch=null;B.specs=B.specs.filter(n=>SPEC_BY[n].archetype===B.arch);B.race=null;B.align=null;B.bonds={};draw()});
        const f=(id,k,num)=>{const e=main.querySelector(id);if(e)e.oninput=()=>{B.custom[k]=num?+e.value||0:e.value;summary()}};
        f('#bcn','name');f('#bch','hp',1);f('#bcl','load',1);const d=main.querySelector('#bcd');if(d)d.onchange=()=>{B.custom.dmg=d.value;summary()};
      },
      'Specialties':()=>{
        main.querySelectorAll('[data-spec]').forEach(x=>x.onclick=()=>{const n=x.dataset.spec;if(B.specs.includes(n))B.specs=B.specs.filter(y=>y!==n);else B.specs.push(n);B.bonus=null;B.race=null;B.align=null;draw()});
        main.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{B.specs=B.specs.filter(y=>y!==x.dataset.rm);B.bonus=null;draw()});
        main.querySelector('#bsq').oninput=e=>{B.specQ=e.target.value;const pos=e.target.selectionStart;draw();const n=main.querySelector('#bsq');n.focus();n.setSelectionRange(pos,pos)};
        main.querySelector('#bsa').onchange=e=>{B.specArch=e.target.value;draw()};
        const bb=main.querySelector('#bbonus');if(bb)bb.onchange=()=>{B.bonus=bb.value||null;summary()};
        main.querySelectorAll('[name=pc]').forEach(x=>x.onchange=()=>{B.penaltyChoice=x.value;summary()});
      },
      'Stats':()=>{
        main.querySelectorAll('[data-arr]').forEach(x=>x.onchange=()=>{const s=x.dataset.arr;const v=+x.value;const other=STATS.find(t=>t!==s&&+B.arr[t]===v);if(other)B.arr[other]=B.arr[s];B.arr[s]=v;draw()});
        main.querySelectorAll('[data-arrv]').forEach(x=>x.onchange=()=>{B.arr[x.dataset.arrv]=Math.max(1,Math.min(18,+x.value||0));draw()});
      },
      'Race & alignment':()=>{
        main.querySelectorAll('[name=brace]').forEach(x=>x.onchange=()=>{B.race=+x.value});
        main.querySelectorAll('[name=balign]').forEach(x=>x.onchange=()=>{B.align=+x.value});
      },
      'Gear':()=>{
        main.querySelectorAll('[data-g]').forEach(x=>x.onchange=()=>{const g=+x.dataset.g;const max=DW_CLASS[B.cls].gear[g].max||1;
          if(max>1){const set=new Set(B.gear[g]||[]);x.checked?set.add(+x.value):set.delete(+x.value);B.gear[g]=[...set]}else B.gear[g]=[+x.value]});
        main.querySelectorAll('[data-cg]').forEach(x=>x.onchange=()=>{B.cwgear[x.dataset.cg]=x.checked});
      },
      'Bonds':()=>wireBonds(),
      'Bonds & story':()=>{wireBonds();
        main.querySelectorAll('[data-or]').forEach(x=>x.oninput=()=>{B.origins[x.dataset.or]=x.value});
        main.querySelectorAll('[data-sph]').forEach(x=>x.onclick=()=>{const n=x.dataset.sph;if(B.spheres.includes(n))B.spheres=B.spheres.filter(y=>y!==n);else if(B.spheres.length<3)B.spheres.push(n);draw()});
        main.querySelectorAll('[data-sch]').forEach(x=>x.onclick=()=>{const n=x.dataset.sch;if(B.schools.includes(n))B.schools=B.schools.filter(y=>y!==n);else if(B.schools.length<3)B.schools.push(n);draw()});
        const t=main.querySelector('#btenets');if(t)t.oninput=()=>{B.tenets=t.value};
      },
      'Name & look':()=>{
        main.querySelector('#bname').oninput=e=>{B.name=e.target.value;summary()};
        main.querySelector('#blook').oninput=e=>{B.look=e.target.value};
        main.querySelectorAll('[data-look]').forEach(x=>x.onchange=()=>{B.looks[x.dataset.look]=x.value});
      }
    };
    const wireBonds=()=>{const bo=bondOpts();
      main.querySelectorAll('[data-bd]').forEach(x=>x.onchange=()=>{const i=+x.dataset.bd;B.bonds[i]=B.bonds[i]||{t:bo[i].t};B.bonds[i].on=x.checked;
        const lim=B.kind==='cw'?ARCH[B.arch].bonds:null;if(lim&&Object.values(B.bonds).filter(v=>v&&v.on).length>lim){x.checked=false;B.bonds[i].on=false;toastInfo(`${B.arch}s hold up to ${lim} bonds.`)}});
      main.querySelectorAll('[data-bt]').forEach(x=>x.oninput=()=>{const i=+x.dataset.bt;B.bonds[i]=B.bonds[i]||{on:true};B.bonds[i].t=x.value;if(!B.bonds[i].on){B.bonds[i].on=true;main.querySelector(`[data-bd="${i}"]`).checked=true}});
    };
    const create=()=>{
      if(B.kind==='cw'){const iss=specIssues();if(iss.length){B.step=1;draw();toastInfo(iss[0]);return}}
      const c=preview();
      c.name=B.name.trim();
      const ro=raceOpts(),ao=alignOpts();
      if(B.race!=null&&ro[B.race]){const r=ro[B.race];c.race=r.name;c.raceText=r.text;addMove(c,{name:r.name+(B.kind==='cw'?' ('+r.src+')':''),text:r.text,book:B.kind==='core'?'DW':'CW'},'race')}
      if(B.align!=null&&ao[B.align]){c.alignment=ao[B.align].type;c.alignText=ao[B.align].text}
      const lk=Object.values(B.looks).filter(Boolean);c.look=[...lk,B.look].filter(Boolean).join(', ');
      if(B.kind==='core'){
        (FIXED_GEAR[B.cls]||[]).forEach(s=>c.items.push(...parseItems(s)));c.coin=FIXED_COIN[B.cls]||0;
        DW_CLASS[B.cls].gear.forEach((g,gi)=>(B.gear[gi]||[]).forEach(oi=>{const o=g.options[oi];if(!o)return;o.items.forEach(it=>c.items.push(itemFromSrd(it,it.amount)));c.coin+=+o.coins||0;const cm=o.label.match(/^(\d+) coins/i);if(cm&&!o.items.length)c.coin+=+cm[1]}));
      }
      if(B.kind==='cw'){
        cwGearBlocks(B.arch,B.specs).forEach((bl,bi)=>{c.items.push(...bl.fixed);bl.opts.forEach((o,oi)=>{if(!B.cwgear[bi+':'+oi])return;const cm=o.match(/^(\d+) coins/i);if(cm){c.coin+=+cm[1];return}c.items.push(...parseItems(o))})});
        c.spheres=[...B.spheres];c.tenets=B.tenets;
        c.spellSources=[...B.spheres,...B.schools];
      }
      c.items.forEach(i=>{if(equippable(i))i.eq=true});
      // dedupe rations
      const seen={};c.items=c.items.filter(i=>{const k=normName(i.n);if(/ration/.test(k)){if(seen[k])return false;seen[k]=1}return true});
      c.bonds=Object.values(B.bonds).filter(v=>v&&v.on&&v.t).map(v=>({id:uid(),t:v.t,res:false}));
      // spells: free cantrips/rotes
      const cast=casting(c);
      if(cast){
        if(c.kind==='core')c.spellSources=[c.cls];
        const srcs=c.spellSources.length?c.spellSources:spellSourcesDefault(c);
        ALL_SPELLS.filter(s=>srcs.includes(s.list)&&isFree(s)).forEach(s=>c.spells.push({id:uid(),...s,known:true}));
      }
      if(c.kind==='core'&&c.cls==='Ranger')c.extras.push({id:uid(),type:'companion',name:''});
      if(c.kind==='core'&&c.cls==='Druid')c.extras.push({id:uid(),type:'shape',name:'',hold:0});
      if(c.kind==='core'&&c.cls==='Paladin')c.extras.push({id:uid(),type:'quest',name:''});
      c.hp=maxHp(c);
      S.chars=S.chars.filter(x=>!x.example);S.chars.push(c);S.curId=c.id;S.filter='all';S.q='';S.open={};S.mtab='moves';
      remember();Store.write(c);closeModal();renderAll();
      if(cast)toastInfo(cast.mode==='commune'?'Open the Spells tab to choose your granted spells.':'Open the Spells tab to fill your spellbook. Cantrips are already in.');
    };
    draw();
  },{wide:true});
}

/* ---------- equipment catalog ---------- */
function catKind(it){const t=(it.tags||[]).map(x=>String(x.n).toLowerCase());
  if(t.includes('armor'))return 'Armor';
  if(t.some(x=>['hand','close','reach','near','far','thrown'].includes(x))||/arrow|bolt/i.test(it.name))return 'Weapons';
  if(t.includes('dangerous'))return 'Poisons';
  if(t.includes('ration'))return 'Rations';
  return 'Gear';}
function catalogModal(c){
  let q='',kind='all';const items=DATA.dw.items.filter(i=>!/^(token of origin|father|fine lute|memorable pipes|stolen horn|unplayed fiddle|forgotten songbook)/i.test(i.name));
  modal(`<h2>Equipment</h2><p class="hint">From the Dungeon World equipment chapter (DW p.321). Tap to add to your pack.</p>
    <div class="mtools" style="margin-top:10px"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><input id="eq" type="search" placeholder="Search equipment" autofocus></label></div>
    <div class="chips" id="ek">${['all','Weapons','Armor','Gear','Rations','Poisons'].map(k=>`<button class="fchip" data-k="${k}" aria-pressed="${k==='all'}">${k==='all'?'All':k}</button>`).join('')}</div>
    <div class="catalog" id="elist"></div>
    <div class="row"><span class="hint" id="emsg" style="margin-right:auto"></span><button class="btn" data-act="closemodal">Done</button></div>`,
  m=>{
    const draw=()=>{const qq=q.toLowerCase();const list=items.filter(i=>(kind==='all'||catKind(i)===kind)&&(!qq||i.name.toLowerCase().includes(qq)));
      m.querySelector('#elist').innerHTML=list.map(i=>{const x=itemFromSrd(i,1);return `<button class="citem" data-i="${items.indexOf(i)}"><b>${esc(i.name)}</b><span>${esc([...x.tags,x.w+' weight',x.cost!=null?x.cost+' coins':''].filter(Boolean).join(', '))}</span>${i.desc?`<span>${esc(i.desc.slice(0,110))}${i.desc.length>110?'…':''}</span>`:''}</button>`}).join('')||'<p class="empty">Nothing matches.</p>';
      m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=itemFromSrd(items[+b.dataset.i],1);if(equippable(it))it.eq=true;c.items.push(it);touch(c,{full:true});m.querySelector('#emsg').textContent='Added '+it.n+'.'})};
    m.querySelector('#eq').oninput=e=>{q=e.target.value;draw()};
    m.querySelectorAll('#ek [data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;m.querySelectorAll('#ek [data-k]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
    draw();
  },{wide:true});
}
function cwGearModal(c){
  const blocks=cwGearBlocks(c.cw.archetype,c.cw.specs.map(s=>s.name));
  modal(`<h2>Starting gear options</h2><p class="hint">From your archetype and specialties. Tap to add.</p>
    ${blocks.map(bl=>`<div class="lbl" style="margin-top:12px">${esc(bl.src)}</div><p class="hint" style="margin:2px 0 6px">${esc(bl.intro)}</p><div class="optlist">${bl.opts.map(o=>`<button class="opt" data-o="${esc(o)}" style="text-align:left">${esc(o)}</button>`).join('')}</div>`).join('')}
    <div class="row"><span class="hint" id="gmsg" style="margin-right:auto"></span><button class="btn" data-act="closemodal">Done</button></div>`,
  m=>m.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=b.dataset.o;const cm=o.match(/^(\d+) coins/i);if(cm)c.coin=(+c.coin||0)+ +cm[1];else parseItems(o).forEach(i=>{if(equippable(i))i.eq=true;c.items.push(i)});touch(c,{full:true});m.querySelector('#gmsg').textContent='Added.'}),{wide:true});
}
function bondIdeasModal(c){
  let opts=[];
  if(c.kind==='core'&&DW_CLASS[c.cls])opts=DW_CLASS[c.cls].bonds.map(t=>({t,src:c.cls}));

}

/* ---------- spells ---------- */
function spellAddModal(c){
  const cast=casting(c);const srcs=spellSourcesDefault(c);let showAll=false,q='';
  const commune=cast&&cast.mode==='commune';
  modal(`<h2>${commune?'Granted spells':'Add to spellbook'}</h2><p class="hint">${srcs.length?`From ${srcs.map(esc).join(', ')}.`:'Choose your spell sources first.'} ${commune?'Granted spells are marked prepared.':''}</p>
    <div class="mtools" style="margin-top:10px"><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><input id="sq" type="search" placeholder="Search spells" autofocus></label>
    <label class="quest"><input type="checkbox" id="sall"> Every list and level</label></div>
    <div id="slist" class="optlist" style="max-height:60vh;overflow:auto"></div>
    <div class="row"><button class="btn" data-act="spellsrcm">Change sources</button><span class="spacer"></span><button class="btn" data-act="closemodal">Done</button></div>`,
  m=>{
    m.querySelector('[data-act="spellsrcm"]').onclick=()=>spellSourceModal(c);
    const draw=()=>{const qq=q.toLowerCase();const L=+c.level||1;
      const list=ALL_SPELLS.filter(s=>(showAll||(srcs.includes(s.list)&&spellLevel(s)<=L))&&(!qq||(s.name+' '+s.text).toLowerCase().includes(qq)));
      m.querySelector('#slist').innerHTML=list.map((s,i)=>{const have=c.spells.some(x=>normName(x.name)===normName(s.name));return `<div class="lopt"><div class="h"><b>${esc(s.name)}</b><span class="ref">${levelLabel(s.level)}${s.ongoing?' · ongoing':''} · ${esc(s.list)} · ${s.book} p.${s.page||'?'}</span><span class="spacer"></span><button class="btn sm" data-i="${ALL_SPELLS.indexOf(s)}" ${have?'disabled':''}>${have?'Have it':commune?'Grant':'Add'}</button></div><div class="txt">${md(s.text,{q:false})}</div></div>`}).join('')||'<p class="empty">No spells match.</p>';
      m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const s=ALL_SPELLS[+b.dataset.i];c.spells.push({id:uid(),...s,known:true,prepared:commune&&!isFree(s)});touch(c,{full:true});b.textContent='Added';b.disabled=true});
    };
    m.querySelector('#sq').oninput=e=>{q=e.target.value;draw()};
    m.querySelector('#sall').onchange=e=>{showAll=e.target.checked;draw()};
    draw();
  },{wide:true});
}
function spellSourceModal(c){
  const cur0=new Set(spellSourcesDefault(c));
  const row=(n,kind)=>`<button class="fchip" data-src="${esc(n)}" aria-pressed="${cur0.has(n)}">${esc(n)}</button>`;
  modal(`<h2>Spell sources</h2><p class="hint">Which lists your spells come from. Disciples cast from their spheres of influence; magicians from three schools of magic.</p>
    <div class="lbl" style="margin-top:10px">Dungeon World</div><div class="chips">${['Wizard','Cleric'].map(n=>row(n)).join('')}</div>
    <div class="lbl">Holy spheres (CW p.183)</div><div class="chips">${DATA.cw.spells.holy.map(g=>row(g.name)).join('')}</div>
    <div class="lbl">Schools of magic (CW p.297)</div><div class="chips">${DATA.cw.spells.magic.map(g=>row(g.name)).join('')}</div>
    <div class="row"><button class="btn pri" id="ssgo">Save sources</button></div>`,
  m=>{m.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{const n=b.dataset.src;cur0.has(n)?cur0.delete(n):cur0.add(n);b.setAttribute('aria-pressed',cur0.has(n))});
    m.querySelector('#ssgo').onclick=()=>{c.spellSources=[...cur0];
      ALL_SPELLS.filter(s=>cur0.has(s.list)&&isFree(s)&&!c.spells.some(x=>normName(x.name)===normName(s.name))).forEach(s=>c.spells.push({id:uid(),...s,known:true}));
      closeModal();touch(c,{full:true})}});
}

/* ---------- end of session ---------- */
function sessionModal(c){
  const qs=[`I resolved a bond (the other player agrees)`,`I fulfilled my alignment${c.alignText?': '+c.alignText:''}`,'We learned something new and important about the world','We overcame a notable monster or enemy','We looted a memorable treasure'];
  modal(`<h2>End of session</h2><p class="hint">Each check marks 1 XP.</p>
    <div style="margin-top:8px">${qs.map((q,i)=>`<label class="check"><input type="checkbox" id="es${i}"><span>${esc(q)}</span></label>`).join('')}</div>
    ${c.bonds.filter(b=>!b.res).length?`<div class="lbl" style="margin-top:10px">Which bond did you resolve?</div><select class="inp" id="esb"><option value="">None</option>${c.bonds.filter(b=>!b.res).map((b,i)=>`<option value="${b.id}">${c.bondsHidden?'Bond '+(i+1)+' (hidden)':esc(b.t.slice(0,80))}</option>`).join('')}</select>`:''}
    <div class="lbl" style="margin-top:14px">Session recap (saved to your journal as Session ${nextSession(ensureJournal(c))})</div>
    <input class="inp" id="esTitle" placeholder="What was this session about?" style="margin-top:6px">
    <textarea class="inp" id="esBody" placeholder="What happened, who you met, what you found, loose ends…" style="margin-top:6px;min-height:90px"></textarea>
    ${c.journal.some(e=>e.goal&&!e.done)?`<div class="lbl" style="margin-top:12px">Goals you finished</div>${c.journal.filter(e=>e.goal&&!e.done).map(g=>`<label class="check"><input type="checkbox" data-goal="${g.id}"><span>${esc(g.title||'Untitled goal')}</span></label>`).join('')}`:''}
    <div class="row"><button class="btn" data-act="closemodal">Cancel</button><button class="btn pri" id="esGo">Mark XP and save</button></div>`,
  m=>{m.querySelector('#esGo').onclick=()=>{const n=[...m.querySelectorAll('input[id^="es"]:checked')].length;c.xp=(+c.xp||0)+n;
    m.querySelectorAll('[data-goal]:checked').forEach(x=>{const g=c.journal.find(e=>e.id===x.dataset.goal);if(g){g.done=true;g.updated=Date.now()}});

/* ---------- Dungeon Paper import ---------- */
function dpDie(d){const m=String(d||'').match(/d(\d+)/i);return m?'d'+m[1]:''}
function dpStat(dice){for(const d of dice||[]){const m=String(d).toUpperCase().match(/\+\s*(STR|DEX|CON|INT|WIS|CHA|BOND)/);if(m)return m[1]}return ''}
function dpText(o){return [o.description,o.explanation].map(x=>String(x||'').trim()).filter(Boolean).join('\n\n')}
function dpTag(tags,name){const t=(tags||[]).find(t=>String(t.name).toLowerCase()===name);if(!t)return null;const n=parseInt(t.value,10);return isNaN(n)?null:n}
function fromDungeonPaper(ch){
  const cls=ch.class||{};const clsName=String(cls.name||'').trim();
  const core=Object.keys(DW_CLASS).find(k=>k.toLowerCase()===clsName.toLowerCase());
  const c=blankChar();c.name=ch.displayName||'';
  const st=ch.stats||{};
  (ch.abilityScores?.stats||[]).forEach(a=>{const k=String(a.key||'').toUpperCase();if(STATS.includes(k)){c.stats[k]=+a.value||0;if(a.isDebilitated)c.deb[k]=true}});
  c.level=+st.level||1;c.xp=+st.currentXP||0;c.coin=Math.round(+ch.coins||0);
  const known=new Set([...BASIC,...SPECIAL].map(m=>normName(m.name)));known.add('hack and slash');known.add('hack slash');
  const dpMoves=(ch.moves||[]).filter(m=>!((m.category==='basic'||m.category==='special')&&known.has(normName(m.name))));
  if(core){c.kind='core';c.cls=core}
  else{c.kind='custom';c.custom={name:clsName||'Imported class',dmg:dpDie(cls.damageDice)||'d6',hp:+cls.hp||0,load:+cls.load||0}}
  // specialties and compendium classes are sorted out with the player afterwards, not guessed
  c.dpTarget={maxHP:st.maxHP,load:st.load,armor:st.armor};
  dpMoves.forEach(m=>{
    let src='custom',page,book,tier,replaces,requires,text=dpText(m);
    if(c.kind==='core'){const d=DW_CLASS[core].moves.find(x=>normName(x.name)===normName(m.name));if(d){src='class';page=d.page;book='DW';tier=d.tier;replaces=d.replaces}}
    const nm={id:uid(),name:m.name||'Move',stat:dpStat(m.dice),text,src,page,book,tier};if(replaces)nm.replaces=replaces;if(requires)nm.requires=requires;
    c.moves.push(nm);
  });
  // supersede
  c.moves.forEach(m=>(m.replaces||[]).forEach(r=>{const o=c.moves.find(x=>normName(x.name)===normName(r));if(o)o.supersededBy=m.name}));
  (ch.spells||[]).forEach(sp=>{const f=ALL_SPELLS.find(x=>normName(x.name)===normName(sp.name));
    const lv=String(sp.level??'').toLowerCase();
    c.spells.push({id:uid(),name:sp.name||'Spell',level:lv==='0'?'cantrip':lv||(f?f.level:'1'),text:dpText(sp)||(f?f.text:''),ongoing:f?f.ongoing:/ongoing/i.test(JSON.stringify(sp.tags||'')),prepared:!!sp.prepared,known:true,list:f?f.list:'',page:f?f.page:undefined,book:f?f.book:undefined})});
  if(c.spells.length&&c.kind==='core'&&(core==='Wizard'||core==='Cleric'))c.spellSources=[core];
  const race=ch.race;if(race&&race.name){c.race=race.name;c.raceText=dpText(race);if(c.raceText)c.moves.push({id:uid(),src:'race',name:race.name,stat:dpStat(race.dice),text:c.raceText})}
  (ch.items||[]).forEach(it=>{
    const amt=it.amount!=null?+it.amount:1;
    const tags=[];(it.tags||[]).forEach(t=>{const n=String(t.name||'').toLowerCase();const v=t.value;if(['weight','coins','uses'].includes(n))return;
      if(n==='armor')tags.push((/shield/i.test(it.name)?'+':'')+v+' armor');else if(n==='damage')tags.push('+'+v+' damage');else if(n==='piercing')tags.push(v+' piercing');else tags.push(v!=null&&v!==''?n+' '+v:n)});
    const w=(it.settings?.countWeight===false)?0:(dpTag(it.tags,'weight')||0)*Math.max(1,amt);
    const uses=dpTag(it.tags,'uses');
    const i={id:uid(),n:(amt>1?amt+' × ':'')+(it.name||'Item'),w,u:uses,um:uses,tags,desc:it.description||'',eq:!!it.equipped};
    c.items.push(i);
  });
  const marks=ch.sessionMarks||[];
  c.bonds=marks.filter(m=>m.type==='bond').map(m=>({id:uid(),t:m.description||'',res:!!m.completed}));
  const bio=ch.bio||{};c.look=String(bio.looks||'');
  const al=bio.alignment;if(al&&al.type){c.alignment=al.type[0].toUpperCase()+al.type.slice(1);c.alignText=al.description||''}
  ensureJournal(c);
  if(bio.description)c.journal.push(newEntry(c,'note',{cat:'Backstory',title:'Backstory',body:String(bio.description)}));
  marks.filter(m=>m.type==='flag').forEach(m=>c.journal.push(newEntry(c,'goal',{title:m.description||'Goal',done:!!m.completed})));
  (ch.notes||[]).forEach(n=>{let cat=String(n.category||'').trim()||'General';cat=cat.charAt(0).toUpperCase()+cat.slice(1);
    const hit=c.noteCats.find(k=>k.toLowerCase()===cat.toLowerCase());if(hit)cat=hit;else c.noteCats.push(cat);
    c.journal.push(newEntry(c,'note',{cat,title:n.title||'Note',body:n.description||'',pinned:!!n.favorite}))});
  keepDpNumbers(c);
  c.hp=st.currentHP!=null?+st.currentHP:maxHp(c);
  return c;
}
/* keep Dungeon Paper's max HP, load and armor even when the rules would work them out differently */
function keepDpNumbers(c){
  const t=c.dpTarget;if(!t)return;
  if(t.maxHP!=null){c.hpAdj=0;c.hpAdj=(+t.maxHP)-maxHp(c)}
  if(t.load!=null){c.loadAdj=0;c.loadAdj=(+t.load)-loadInfo(c).max}
  if(t.armor!=null){c.armorAdj=0;c.armorAdj=(+t.armor)-armorInfo(c).total}
}
function parseImport(text){
  let d;try{d=JSON.parse(text)}catch(e){return {error:"That file isn't readable JSON. Choose the .json file Dungeon Paper exported, or paste Torchlight data."}}
  if(d&&d.app==='torchlight'&&Array.isArray(d.characters)){const chars=d.characters.filter(x=>x&&x.stats).map(x=>ensureJournal(migrate({...x,example:false})));
    return chars.length?{chars,restore:true}:{error:'That backup has no characters in it.'}}
  if(d&&d.kind&&d.stats)return {chars:[ensureJournal({...migrate(d),id:uid(),example:false})]};
  const list=Array.isArray(d?.characters)?d.characters:(d&&d.abilityScores&&d.class)?[d]:Array.isArray(d)?d.filter(x=>x&&x.abilityScores):null;
  if(!list)return {error:"No characters found in that file. In Dungeon Paper, use Export and include your characters."};
  if(!list.length)return {error:"That Dungeon Paper export has no characters in it. Export again with your characters selected."};
  const chars=[],bad=[];
  list.forEach(ch=>{try{chars.push(fromDungeonPaper(ch))}catch(e){console.error(e);bad.push(ch?.displayName||'a character')}});
  return {chars,error:chars.length?null:"Couldn't read the characters in that file.",skipped:bad};
}
function addImported(chars,{restore=false}={}){
  S.chars=S.chars.filter(x=>!x.example);let replaced=0;
  // a backup that brings its own Sir Sampleton replaces the fresh one this browser started with
  if(restore&&chars.some(c=>c.sample))S.chars.filter(x=>x.sample&&!chars.some(c=>c.id===x.id)).forEach(x=>{Store.remove(x.id);S.chars=S.chars.filter(y=>y!==x)});
  chars.forEach(c=>{
    const same=S.chars.findIndex(x=>x.id===c.id);
    if(restore&&same>=0){S.chars[same]=c;replaced++}
    else{if(S.chars.find(x=>x.name&&x.name===c.name))c.name+=' (imported)';if(same>=0)c.id=uid();S.chars.push(c)}
    Store.write(c);
  });
  if(restore&&typeof bkMark==='function')bkMark(chars.map(c=>c.id));
  S.curId=chars[0].id;S.filter='all';S.q='';S.open={};remember();renderAll();
  if(restore)toastInfo(`Restored ${chars.length} character${chars.length>1?'s':''} from your backup${replaced?` (${replaced} replaced the copy already here)`:''}.`);
}

const DEFAULT_CATS=['General','NPCs','Places','Loot','Rumors','Backstory'];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function fmtDate(s){if(!s)return '';const d=new Date(s+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function ensureJournal(c){
  if(!Array.isArray(c.journal))c.journal=[];
  if(!Array.isArray(c.noteCats)||!c.noteCats.length)c.noteCats=[...DEFAULT_CATS];
  if(c.notes&&String(c.notes).trim()){c.journal.push(newEntry(c,'note',{title:'Earlier notes',body:String(c.notes).trim()}));c.notes=''}

function nextSession(c){return Math.max(0,...c.journal.filter(e=>e.type==='session').map(e=>+e.n||0))+1}
function newEntry(c,type,o={}){
  const e={id:uid(),type,title:'',body:'',cat:type==='session'?'':(o.cat||'General'),pinned:false,goal:type==='goal',done:false,created:Date.now(),updated:Date.now(),...o};
  if(type==='goal'){e.type='note';e.goal=true;if(!o.cat)e.cat='General'}

}
const J={filter:'all',q:'',edit:null,arm:null,catEdit:false};
function entryLabel(e){return e.type==='session'?`Session ${e.n}`:e.cat||'General'}
function journalList(c){

    if(q)return (e.title+' '+e.body+' '+entryLabel(e)).toLowerCase().includes(q);
    if(J.filter==='sessions'&&e.type!=='session')return false;

    if(q&&!(e.title+' '+e.body+' '+entryLabel(e)).toLowerCase().includes(q))return false;
    return true;});
  const key=e=>e.type==='session'?(+e.n||0)*1e13:e.updated||e.created||0;
  list.sort((a,b)=>(b.pinned-a.pinned)||(J.filter==='goals'?(a.done-b.done):0)||(key(b)-key(a)));

function addEntry(c,type,o){ensureJournal(c);const e=newEntry(c,type,o);c.journal.push(e);J.edit=e.id;
  if(type==='session'&&!['all','sessions'].includes(J.filter))J.filter='all';
  if(type==='goal'&&!['all','goals'].includes(J.filter))J.filter='all';
  if(type==='note'&&J.filter.startsWith('cat:'))e.cat=J.filter.slice(4);
  else if(type==='note'&&!['all'].includes(J.filter))J.filter='all';
  touch(c);openJournal(c,e.id,true);return e}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-jact]');if(!b||b.closest('.modal'))return;
  const c=cur();if(!c)return;ensureJournal(c);
  const a=b.dataset.jact,e=c.journal.find(x=>x.id===b.dataset.id);
  if(a!=='del')J.arm=null;
  const rerender=()=>{renderM();renderR();refresh()};
  switch(a){
    case 'open':openJournal(c);break;
    case 'goto':openJournal(c,b.dataset.id);break;
    case 'new-session':addEntry(c,'session');break;
    case 'new-note':addEntry(c,'note');break;
    case 'new-goal':addEntry(c,'goal');break;
    case 'filter':J.filter=b.dataset.f;J.edit=null;rerender();break;
    case 'cats':J.catEdit=!J.catEdit;rerender();break;
    case 'cat-del':{const i=+b.dataset.i;const k=c.noteCats[i];c.journal.forEach(x=>{if(x.cat===k)x.cat='General'});c.noteCats.splice(i,1);if(J.filter==='cat:'+k)J.filter='all';touch(c);rerender();break}
    case 'edit':J.edit=e.id;rerender();document.getElementById('jt-'+e.id)?.focus();break;
    case 'done-edit':J.edit=null;if(e){e.updated=Date.now()}touch(c);rerender();break;
    case 'pin':e.pinned=!e.pinned;touch(c);rerender();break;
    case 'toggle-done':e.done=!e.done;e.updated=Date.now();touch(c);setTimeout(rerender,120);break;
    case 'del':if(J.arm===e.id){c.journal=c.journal.filter(x=>x.id!==e.id);J.arm=null;J.edit=null;touch(c);rerender()}else{J.arm=e.id;b.textContent='Click again to delete'}break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;if(t.closest('.modal'))return;const c=cur();if(!c)return;
  if(t.dataset.jchange){const e=c.journal.find(x=>x.id===t.dataset.id);if(!e)return;
    if(t.dataset.jchange==='cat')e.cat=t.value;
    if(t.dataset.jchange==='goal'){e.goal=t.checked;if(!t.checked)e.done=false}
    e.updated=Date.now();touch(c);return}
  if(t.dataset.jcat!=null){const i=+t.dataset.jcat;const old=c.noteCats[i];const nv=t.value.trim();if(!nv||c.noteCats.includes(nv)){t.value=old;return}
    c.noteCats[i]=nv;c.journal.forEach(x=>{if(x.cat===old)x.cat=nv});if(J.filter==='cat:'+old)J.filter='cat:'+nv;touch(c);renderM();refresh()}
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(t.id==='jq'){J.q=t.value;const pos=t.selectionStart;renderM();refresh();const n=document.getElementById('jq');n.focus();n.setSelectionRange(pos,pos);return}
  if(t.classList.contains('jb')){t.style.height='auto';t.style.height=Math.min(600,t.scrollHeight+4)+'px'}
  const p=t.dataset&&t.dataset.bind;if(p&&p.startsWith('journal.')){const c=cur();const e=c&&c.journal.find(x=>x.id===p.split('.')[1]);if(e)e.updated=Date.now()}
});
document.addEventListener('submit',ev=>{
  const c=cur();if(!c)return;
  if(ev.target.id==='jcatadd'){ev.preventDefault();const v=document.getElementById('jcatnew').value.trim();if(!v||c.noteCats.includes(v))return;c.noteCats.push(v);touch(c);renderM();refresh();document.getElementById('jcatnew')?.focus()}
  if(ev.target.id==='jquick'){ev.preventDefault();const inp=document.getElementById('jquicktext');const v=inp.value.trim();if(!v)return;ensureJournal(c);
    const first=v.split('\n')[0];c.journal.push(newEntry(c,'note',{title:first.length>60?first.slice(0,57)+'…':first,body:first.length>60?v:''}));
    touch(c);renderR();refresh();if(S.mtab==='journal')renderM();toastInfo('Added to your journal under General.')}
});

/* ================= BACKUPS (for when characters live only in this browser) ================= */
const BK_KEY='torchlight.backup';
function bkMap(){try{return JSON.parse(localStorage.getItem(BK_KEY)||'{}')}catch(e){return {}}}
function bkMark(ids){const m=bkMap();const t=Date.now()+5;ids.forEach(id=>m[id]=t);try{localStorage.setItem(BK_KEY,JSON.stringify(m))}catch(e){}updateBackupPill()}
const realChars=()=>S.chars.filter(c=>!c.example);
function isDirty(c){return !c.example&&!c.sample&&(c.updatedAt||0)>(bkMap()[c.id]||0)}
const anyDirty=()=>realChars().some(isDirty);
const inClaude=()=>!!(window.claude&&window.claude.use);
const stamp=()=>new Date().toISOString().slice(0,10);
/* hand the viewer a file: Claude's download prompt inside Claude, a normal download on any other website */
async function saveFile(filename,data){
  if(inClaude()){
    try{const dl=await claude.use('downloads');if(!dl){toastInfo("Saving files isn't available here. Use Manage → Copy instead.");return false}
      await dl.save({filename,data});return true}catch(e){return false}
  }
  try{const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true}
  catch(e){toastInfo("Couldn't save the file. Use Manage → Copy and paste it somewhere safe.");return false}
}
async function backupAll(){
  const chars=realChars();if(!chars.length){toastInfo('Nothing to back up yet. The example character is not saved.');return}
  const data=JSON.stringify({app:'torchlight',version:2,exportedAt:new Date().toISOString(),characters:chars},null,1);
  if(await saveFile(`torchlight-backup-${stamp()}.json`,data)){bkMark(chars.map(c=>c.id));toastInfo(`Backed up ${chars.length} character${chars.length>1?'s':''}. To restore, use Manage → choose this file → Import.`)}
}
async function backupOne(c){
  const data=JSON.stringify(c,null,1);
  if(await saveFile((c.name||'character').replace(/[^\w-]+/g,'_')+'.json',data)){bkMark([c.id]);return true}return false;
}
function updateBackupPill(){
  const p=document.getElementById('backupPill');if(!p)return;
  const show=(Store.mode==='local'||Store.mode==='none')&&anyDirty();
  p.hidden=!show;
}
window.addEventListener('beforeunload',e=>{if((Store.mode==='local'||Store.mode==='none')&&anyDirty()){e.preventDefault();e.returnValue=''}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-bk]');if(!b||b.closest('.modal'))return;
  if(b.dataset.bk==='all')backupAll();
  if(b.dataset.bk==='dismiss'){S.bkDismissed=true;renderBanner()}
});
function backupBanner(){
  if(!(Store.mode==='local'||Store.mode==='none')||S.bkDismissed||!anyDirty())return '';
  const ever=Object.keys(bkMap()).length>0;
  return `<div class="banner bkbanner"><span><b>${Store.mode==='none'?'This page can\'t save in this browser.':ever?'You have changes that aren\'t backed up.':'Your characters are saved only in this browser.'}</b> Clearing browser data, private browsing or switching devices loses them. Save a backup file now and then; you can restore it from Manage on any device.</span><button class="btn pri sm" data-bk="all">Back up all characters</button><button class="btn sm ghost" data-bk="dismiss">Later</button></div>`;
}

}

/* ---------- the guide ---------- */
const GUIDE=[
 {id:'start',title:'Getting started',body:`Torchlight is a character sheet for **Dungeon World**, with the **Class Warfare** supplement built in.
- **New character** walks you through making one: class, stats, race, alignment, gear and bonds.
- Already have a character in **Dungeon Paper**? Use **Import from Dungeon Paper** (in New character, or Manage).
- Switch between characters with the menu at the top left.
- Every rule shows its book page, like **DW p.112** or **CW p.428**, so you can check it.
- Look for the small **?** on each panel to jump straight to its part of this guide.`},
 {id:'top',title:'Top bar',body:`- **Character menu**: switch between your characters.
- **Next roll**: a one-off bonus or penalty for your next roll only, like +1 from help or −1 from a bad spot. It resets after the roll. Use it for your bond number when you **Aid or Interfere**.
- **Manage**: back up, restore or import characters, review where moves come from, or delete a character.
- **Options**: colour scheme and other settings.
- **Status** (top right) shows where your character is saved. See *Saving and backups*.`},
 {id:'identity',title:'Name, class and look',body:`The top-left panel is who your character is.
- Type straight into the name, alignment, race and look boxes; changes save as you go.
- **Alignment goal** is what earns you XP at the end of a session.
- For Class Warfare characters, your **specialties** are listed here, with where your powers came from.
- **How damage, HP and load were worked out** shows the maths for Class Warfare builds, including penalties for mixing archetypes.`},
 {id:'hp',title:'Hit points and armor',body:`- Use the **−5 … +5** buttons when you take damage or heal. **Full** restores you to max.
- **Armor** is worked out from what you're wearing: your best armor, plus a shield, plus any armor from your moves. Use **Other** for anything else, like a spell.
- If you wear **clumsy** armor you take −1 to rolls, unless a move like **Armored** lets you ignore it.
- **Forward** adds to your next roll and then clears itself. **Ongoing** applies to every roll until you change it.`},
 {id:'damage',title:'Damage',body:`- **Roll** rolls your damage die plus every ticked bonus, like **d10+1+1d4**.
- Bonuses come from your equipped weapon (**+1 damage** tags) and moves like **Merciless**.
- **Situational** bonuses (only when outnumbered, only on your next attack…) start unticked. Tick them when they apply.
- Moves that only work **on a quest** have an **On a quest** switch.
- Add your own bonus, like **Backstab +1d6**, with the box at the bottom.`},
 {id:'stats',title:'Stats and rolling',body:`- Tap a big **modifier** (like **+2**) to roll 2d6 plus that stat.
- The small number under it is your **score**; type to change it. The modifier updates by itself.
- Tap the word under each stat (**Weak**, **Shaky**…) to mark a **debility**, which gives −1 to that stat until it's healed.
- Results: **10+** strong hit, **7–9** weak hit, **6−** miss. **12+** is flagged for moves that do something extra on a 12+.
- Move cards also have roll buttons, so you rarely need to remember which stat a move uses.`},
 {id:'xp',title:'Experience and levelling up',body:`- Mark XP with **+** and **−**. By default every **miss** marks 1 XP for you (switch this off in the Roll log or Options).
- **End of session** walks through the end-of-session questions, marks XP, lets you resolve a bond, saves a session recap to your journal, and ticks off goals.
- When you have **level + 7** XP, **Level up** lights up. You raise one stat by 1 and pick a new move.
- The level-up screen only lists moves you qualify for. ✓ and ✗ show whether you have what a move **Requires**. A move that **Replaces** another swaps it out.
- You can also take a **compendium class** or write your own move there.`},
 {id:'log',title:'Roll log',body:`- Every roll you make this session is listed, newest first, with its result.
- **Mark XP automatically on a miss** can be switched off if your group tracks XP differently.
- The log isn't saved; **Clear** empties it.`},
 {id:'moves',title:'Moves',body:`- Moves are grouped by where they come from: your class, specialties, race, borrowed moves, then the basic and special moves everyone has.
- Tap a move to read it. **10+**, **7–9** and **miss** results are coloured to match your roll.
- **Search** (or press **/**) looks through names and rules text. The chips filter by group.
- Moves that give **hold** have a small counter; spend hold with **−**.
- A ⚠ warning means a move needs something you don't have, or is above your level.
- **Write a custom move** for homebrew. **Browse all moves** searches both books.`},
 {id:'cw',title:'Specialties and compendium classes',body:`Class Warfare builds a class from an **archetype** plus **specialties**.
- **Starting specialty**: chosen when you made the character. Its stat changes apply and all its moves are open to you.
- **Compendium class**: a specialty you earned in play by doing what it asks. You get all its starting moves, and its advanced moves open up.
- **Borrowed moves**: a move you took from another specialty when levelling up. Only that move is yours; the rest of that specialty isn't.
- Each specialty's section lists the **advanced moves you can take**. Use **Change** on its heading to switch between starting, compendium and borrowed, or remove it.
- **Add a compendium class** at the bottom of Moves, or through **Level up**.`},
 {id:'spells',title:'Spells',body:`The Spells tab appears for casters.
- **Add to spellbook** (or **Choose granted spells** for clerics and disciples) picks from your spell lists. **Change** sets which lists you use, like the Wizard list or Class Warfare spheres and schools.
- Tick **Prepare** on the spells you want ready. The badge at the top checks you're within your limit for your level.
- **Cast** rolls for you. On a 7–9 you get buttons for the book's choices.
- Ongoing spells you've marked **Active** give −1 to cast other spells.
- **Prepare spells** or **Commune** refreshes forgotten spells.`},
 {id:'extras',title:'Companions and more',body:`Cards for things that need their own stats:
- **Animal companion**: ferocity, cunning, armor, instinct, training and weaknesses.
- **Current shape**: for shapeshifters, with a hold counter.
- **Quest**: your goal, boons and vows.
- **Hireling**: skills, loyalty and cost, with an **Order hireling** roll.
- **Card**: anything else.
Your moves suggest the right cards automatically.`},
 {id:'journal',title:'Journal',body:`- **Sessions** are numbered and dated for you. Write what happened, who you met and loose ends.
- **Notes** go in categories: NPCs, Places, Loot, Rumors and Backstory to start. **Edit categories** adds, renames or removes them.
- **Goals** are things you plan to do. Tick them off when they're done; open ones show in the Journal panel on the right.
- **★** pins an entry to the top. **Search** looks through every entry.
- The **Journal** panel on the right has a quick-note box for jotting something down mid-game.`},
 {id:'pack',title:'Pack and gear',body:`- Type an item with its tags in brackets, like **Spear (reach, thrown, 1 weight)**, and the tags are applied.
- **Browse equipment** adds items from the Dungeon World equipment list.
- The **✓** box marks weapons and armor as equipped. Equipped armor counts toward your armor; equipped weapons add their damage.
- **⋯** opens an item's tags and uses. Items with uses (rations, adventuring gear) have − and + counters.
- **Load** adds up weight; 100 coins weigh 1. Over your load you take −1.`},
 {id:'bonds',title:'Bonds',body:`- Bonds are how your character feels about the others. Fill in a name in each.
- **Resolve** a bond when it's no longer true (with that player's agreement) to mark XP at the end of the session, then write a new one.
- The **eye** button hides your bonds, in case the person next to you is in one.
- **Bond ideas** lists bonds from your class and specialties.`},
 {id:'saving',title:'Saving and backups',body:`The status in the top right tells you where your character is saved.
- **Saved to your account**: on the Claude page, signed in. Your characters follow you to any device, and nobody else can see them.
- **Saved in this browser**: only on this device and browser. Clearing browser data, private browsing or switching devices loses them.
- **Not backed up · Back up** appears when you have changes that only live in this browser. It saves a backup file you can keep anywhere.
- To restore, open **Manage**, choose your backup file, and press **Import**. This works on any device.`},
 {id:'import',title:'Importing from Dungeon Paper',body:`- In Dungeon Paper, use **Export** and include your characters. That makes a .json file.
- In Torchlight, choose **Import from Dungeon Paper** and pick that file. Every character in it comes in.
- Dungeon Paper doesn't track specialties or compendium classes, so Torchlight asks: is each one a starting specialty, a compendium class, or just borrowed moves?
- Your max HP, load and armor from Dungeon Paper are kept.
- You can run the same review later from **Manage → Review where moves come from**.`}
];
function openGuide(id='start'){
  let cur0=GUIDE.find(g=>g.id===id)?id:'start';
  modal(`<div class="guide"><nav class="gnav" aria-label="Guide sections">${GUIDE.map(g=>`<button data-g="${g.id}" aria-current="${g.id===cur0?'true':'false'}">${esc(g.title)}</button>`).join('')}</nav>
    <article class="gbody" id="gbody" tabindex="-1"></article></div>
    <div class="row"><button class="btn" id="gprev">Back</button><button class="btn" id="gnext">Next</button><span class="spacer"></span><button class="btn pri" data-act="closemodal">Close</button></div>`,
  m=>{
    const show=g=>{cur0=g;const it=GUIDE.find(x=>x.id===g);const i=GUIDE.indexOf(it);
      m.querySelector('#gbody').innerHTML=`<h2>${esc(it.title)}</h2>${md(it.body,{q:false})}`;
      m.querySelectorAll('[data-g]').forEach(b=>b.setAttribute('aria-current',b.dataset.g===g?'true':'false'));
      m.querySelector('#gprev').disabled=i===0;m.querySelector('#gnext').disabled=i===GUIDE.length-1;
      m.querySelector('#gnext').textContent=i<GUIDE.length-1?'Next: '+GUIDE[i+1].title:'Next';
      m.querySelector('.gnav [aria-current="true"]')?.scrollIntoView({block:'nearest'});m.querySelector('#gbody').scrollTop=0};
    m.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>show(b.dataset.g));
    m.querySelector('#gprev').onclick=()=>{const i=GUIDE.findIndex(x=>x.id===cur0);if(i>0)show(GUIDE[i-1].id)};
    m.querySelector('#gnext').onclick=()=>{const i=GUIDE.findIndex(x=>x.id===cur0);if(i<GUIDE.length-1)show(GUIDE[i+1].id)};
    show(cur0);
  },{wide:true});
}

    const needs=res.chars.find(x=>reconcileSuggestions(x).length);
    if(needs){S.curId=needs.id;renderAll();reconcileModal(needs,{afterImport:true});return}
    toastInfo('Imported '+res.chars.map(c=>c.name||'a character').join(', ')+'.'+(c.kind==='cw'?` Recognized a Class Warfare ${c.cw.archetype}: ${c.cw.specs.map(s=>s.name).join(', ')}.`:'')+(res.skipped?.length?' Skipped: '+res.skipped.join(', ')+'.':''))};
  r.onerror=()=>toastInfo("Couldn't open that file. Try choosing it again.");
  r.readAsText(f);
});
(function splash(){
  const sp=document.getElementById('splash');if(!sp)return;
  let seen=false;try{seen=sessionStorage.getItem('torchlight.splashed')==='1';sessionStorage.setItem('torchlight.splashed','1')}catch(e){}
  if(seen){sp.remove();return}
  const done=()=>{sp.remove();document.removeEventListener('pointerdown',skip,true);document.removeEventListener('keydown',skip,true)};
  const skip=()=>{sp.classList.add('skip');done()};
  document.addEventListener('pointerdown',skip,true);document.addEventListener('keydown',skip,true);
  setTimeout(done,2000);
})();
(async function boot(){
  const ex=exampleChar();S.chars=[ex];S.curId=ex.id;setTab('sheet');setStatus();renderAll();
  await Store.init();
  try{
    const saved=(await Store.list()).map(migrate).map(ensureJournal);
    const edited=S.chars.filter(c=>!c.example);
    const seeded=Store.getFlag('sampleSeeded');
    if(saved.length){
      S.chars=[...saved.filter(s=>!edited.some(e=>e.id===s.id)),...edited];
      let last=null;try{last=localStorage.getItem('torchlight.cur')}catch(e){}
      if(!S.chars.some(c=>c.id===S.curId))S.curId=(S.chars.find(c=>c.id===last)||S.chars[0]).id;
      if(!seeded)Store.setFlag('sampleSeeded');
      edited.forEach(c=>Store.write(c));
    }else if(!seeded){
      const sam=edited[0]||S.chars[0];sam.example=false;sam.sample=true;S.chars=[sam,...edited.filter(x=>x!==sam)];S.curId=sam.id;
      S.chars.forEach(c=>Store.write(c));Store.setFlag('sampleSeeded');
    }else{
      S.chars=edited;S.curId=edited[0]?edited[0].id:null;edited.forEach(c=>Store.write(c));
    }
  }catch(e){console.error(e);Store.mode='local'}
  if(Store.mode==='local'&&navigator.storage&&navigator.storage.persist){try{navigator.storage.persist()}catch(e){}}
  setStatus();renderAll();
  if(Store.moved)toastInfo(`Moved ${Store.moved} character${Store.moved>1?'s':''} from this browser into your account.`);
})();

</script>
