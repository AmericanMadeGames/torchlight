 party breaks it.","page":200},{"name":"Casting Stones","level":"1","ongoing":true,"text":"As long as you concentrate on judgment, any stone you pick up becomes a powerful weapon (thrown, near, 1 piercing). While this spell is ongoing you take -1 to cast a spell.","page":200},{"name":"Cause Fear","level":"1","ongoing":true,"text":"Choose a target you can see and a nearby object. The target is afraid of the object so long as you maintain the spell. Their reaction is up to them: flee, panic, beg, fight. While this spell is ongoing you take -1 to cast a spell. You cannot target entities with less than animal intelligence (magical constructs, undead, automatons, and the like).","page":200},{"name":"Dispel Magic","level":"3","ongoing":false,"text":"Choose a spell or magic effect in your presence: this spell rips it apart. Lesser spells are ended, powerful magic is just reduced or dampened so long as you are nearby.","page":200},{"name":"Hold Person","level":"3","ongoing":true,"text":"Choose a person you can see. Until you cast a spell or leave their presence they cannot act except to speak. This effect ends immediately if the target takes damage from any source.","page":201},{"name":"Contagion","level":"5","ongoing":true,"text":"Choose a creature you can see. Until you end this spell, the target suffers from a disease of your choice. While this spell is ongoing you take -1 to cast a spell.","page":201},{"name":"Harm","level":"7","ongoing":false,"text":"Touch an enemy and strike them with divine wrath—deal 2d8 damage to them and 1d6 damage to yourself. This damage ignores armour.","page":201},{"name":"False World","level":"9","ongoing":true,"text":"With a touch, you can put someone’s body into an enchanted sleep and their mind into a false world that they believe is real. Until the spell is ended, they continue to live on in a world entirely of your creation, never knowing it is a lie and that their body lies sleeping somewhere else.","page":201},{"name":"Plague","level":"9","ongoing":true,"text":"Name a city, town, encampment, or other place where people live. As long as this spell is active that place is beset by a plague appropriate to your deity’s domains (locusts, death of the first born, etc). While this spell is ongoing you take -1 to cast a spell.","page":201}]},{"name":"Plants","page":202,"intro":"What heavenly power could be more vital to civilization than that behind the world of plants? Without them, mortal life is doomed.","spells":[{"name":"Grass Eater","level":"rote","ongoing":false,"text":"This spell allows you to eat any vegetable matter, even poisonous vegetation, and derive nutrition from it. You may eat as many rations as you like, as long as there are enough plants available.","page":202},{"name":"Entangle","level":"1","ongoing":false,"text":"You cause your target to become entangled in any nearby vegetation, which moves to accomplish this goal. These plants are not strengthened by this spell, and the target can break free as if they had become entangled normally.","page":202},{"name":"Wood Bender","level":"1","ongoing":false,"text":"A piece of wood, either alive or dead, or a structure made of wood, warps at your touch into a new shape of your choosing.","page":202},{"name":"Plant Whispers","level":"3","ongoing":false,"text":"You speak with the spirits of the green world. One living plant you touch will answer three questions you pose, as best it can.","page":202},{"name":"Summon Nature Elemental","level":"5","ongoing":true,"text":"An elemental creature made of plant matter appears and aids you as best it can. Treat the elemental as a character, but with access to only the basic moves. It has a +1 modifier for all stats, 1 HP, and uses your damage die. The elemental also gets your choice of 1d6 of these traits:\n- It does 1d8 damage.\n- It has a functioning mind and can complete complex tasks.\n- It has some useful adaptation.\n- It’s durable. It has +2 HP for each level you have.\n- It’s talented. Give one stat a +2 modifier.\nThe elemental exists on this plane until it is destroyed by taking damage in excess of its HP, or until you end the spell. While this spell is ongoing, you take -1 to cast a spell.","page":203},{"name":"Wall of Thorns","level":"7","ongoing":false,"text":"You call up thorny vines and brambles from the earth. They can loosely cover any location within sight, or form a thick wall in the middle of it. These plants are hard to get rid of, resistant to fire, and their thorns cause deep gashes.","page":203},{"name":"Cornucopia","level":"9","ongoing":false,"text":"With a word, the entire region you are in bursts into harvest. In a matter of moments, plants grow until they are ripe and farms produce their full crop. This spell only affects plants and seeds that are present—it does not cause seeds to be sown.","page":203}]},{"name":"Protection","page":204,"intro":"If the work of the gods is to be done here, on this plane, their servants must survive to do it.","spells":[{"name":"Endure","level":"rote","ongoing":true,"text":"As long as this spell is ongoing, you or an ally you touch can endure extremes of heat or cold that would normally cause harm, like walking across burning sands or swimming through arctic waters.","page":204},{"name":"Sanctuary","level":"1","ongoing":false,"text":"As you cast this spell, you walk the perimeter of an area, consecrating it to your deity. As long as you stay within that area you are alerted whenever someone acts with malice within the sanctuary (including entering with harmful intent). Anyone who receives healing within a sanctuary heals +1d4 HP.","page":204},{"name":"Ward of Protection","level":"1","ongoing":false,"text":"By drawing a simple glyph on one of your possessions, you will always know if and when it is taken from you, and generally where it is located if that should happen. You may only have one Ward active at a time.","page":204},{"name":"Immunity","level":"3","ongoing":true,"text":"Name one specific source of harm, such as burning, cutting, lightning, or poisonous gas, for example. While this spell is ongoing, you are immune to harm from that source, and you take -1 to cast a spell. You may still be subject to secondary effects—fire that does not burn you produces smoke that can still choke you, and drowning is still uncomfortable, to say the least.","page":204},{"name":"Silence","level":"3","ongoing":true,"text":"Name a location you can see. While this spell is ongoing, no sound can be made in that place, and you take -1 to cast a spell (assuming the silence does not prevent spellcasting outright).","page":205},{"name":"Circle of Protection","level":"5","ongoing":true,"text":"Draw a circle upon the ground around you or someone else. Until that person leaves the confines of the circle, no extraplanar entity can cross it or extend their influence beyond it. While this spell is ongoing, take -1 to cast a spell.","page":205},{"name":"Word of Recall","level":"7","ongoing":false,"text":"Choose a word. The first time after casting this spell that you speak the chosen word, you and any allies touching you when you cast the spell are immediately returned to the exact spot where you cast the spell. You can only maintain a single location; casting Word of Recall again before speaking the word replaces the earlier spell.","page":205},{"name":"Divine Presence","level":"9","ongoing":true,"text":"Every creature must ask your leave to enter your presence, and you must give permission aloud for them to enter. Any creature without your leave takes an extra 1d10 damage whenever they take damage in your presence. While this spell is ongoing you take -1 to cast a spell.","page":205}]},{"name":"Revelation","page":206,"intro":"The divine power can push back even the darkest curtains of ignorance, and show the devoted the truth of things.","spells":[{"name":"Light","level":"rote","ongoing":false,"text":"An item you touch glows with divine light, about as bright as a torch. It gives off no heat or sound and requires no fuel but is otherwise like a mundane torch. You have complete control of the colour of the flame. The spell lasts as long as it is in your presence.","page":206},{"name":"Detect Magic","level":"1","ongoing":false,"text":"One of your senses is briefly attuned to magic. The GM will tell you what here is magical.","page":206},{"name":"Faerie Fire","level":"1","ongoing":true,"text":"One target you can see is outlined in pale, glowing light that produces no heat but makes the target highly visible, especially in darkness. While this spell is ongoing, the target also leaves a faint trail of fading light and you take -1 to cast a spell.","page":206},{"name":"Locate Object","level":"3","ongoing":true,"text":"Name a specific object or a type of object. While you concentrate, this spell will indicate which direction it is in, and where it is exactly if it is within a short walking distance. If you name a type of object, the spell points you toward the nearest one. While this spell is ongoing, take -1 to cast a spell.","page":206},{"name":"Divination","level":"5","ongoing":false,"text":"Name a person, place, or thing you want to learn about. Your devotion grants you visions of the target, as clear as if you were there.","page":207},{"name":"Revelation","level":"5","ongoing":false,"text":"Your devotion is answered with a moment of perfect understanding. The GM will shed light on the current situation. When acting on the information, you take +1 forward.","page":207},{"name":"Prophecy","level":"7","ongoing":false,"text":"Name someone who poses a threat to you. The GM will reveal one aspect of a danger they are involved with. It could be a grim portent, the impending doom, someone else connected to that danger, a custom move or some other detail that gives you insight into how to stop it from achieving its goal.","page":207},{"name":"Alert","level":"9","ongoing":false,"text":"Describe an event. The GM will tell you when that event occurs, no matter where you are or how far away the event is. If you choose, you can view the location of the event as though you were there in person. You can only have one Alert active at a time.","page":207}]},{"name":"The Sky","page":208,"intro":"The mightiest of all the gods, the conquerors of heaven, who lay waste to their enemies upon the earth, are the gods of the sky.","spells":[{"name":"Gust of Wind","level":"rote","ongoing":false,"text":"You summon a gust of wind to blow in the direction of your choosing, scattering light objects before it.","page":208},{"name":"Perfume","level":"1","ongoing":false,"text":"Name a location you can see. The aroma of your choice, pleasant or putrid, descends from the air above and saturates the area. This smell can be dispersed as all scents can, once the spell has been cast.","page":208},{"name":"Skysight","level":"1","ongoing":false,"text":"For a moment, you see things from the sky’s perspective, looking down at yourself and your surroundings with the eyes of an eagle.","page":208},{"name":"Sunbeam","level":"1","ongoing":false,"text":"An object you hold glows or projects a warm yellow light that functions as sunlight does—illuminating the darkness, nourishing plants, and burning vampires. While this spell is ongoing, you take -1 to cast a spell.","page":208},{"name":"Lightning","level":"3","ongoing":false,"text":"A bolt of lightning strikes down from the sky, the clouds, or from out of your own body, striking the target and everyone nearby, inflicting 2d6 damage which ignores armour.","page":208},{"name":"Fly","level":"5","ongoing":true,"text":"You take to the air, soaring on a gust of wind or floating on a puffy cloud. While this spell is ongoing, you take -1 to cast a spell.","page":209},{"name":"Starlight","level":"5","ongoing":false,"text":"You commune with the stars above and name a location. Whether you can see them or not, the stars tell you where you are now and which way you need to go to get to the stated location.","page":209},{"name":"Control Weather","level":"7","ongoing":false,"text":"Pray for rain—or sun, wind, or snow. Within a day or so, the sky will answer. The weather will change according to your will and last a handful of days.","page":209},{"name":"Rainbow Bridge","level":"9","ongoing":false,"text":"Name a location, describing it with a number of words up to your level. A bridge made of rainbows bursts forth from the ground in front of you—walking across it leads you and any allies present to the location you described. The bridge may only be used once by each person.","page":209},{"name":"Storm of Vengeance","level":"9","ongoing":false,"text":"The sky brings the unnatural weather of your choice to pass. Rain of blood or acid, clouds of souls, wind that can carry away buildings, or any other weather you can imagine: ask and it shall come.","page":209}]},{"name":"Wisdom","page":210,"intro":"Without the wisdom to know Truth from Folly, one cannot choose the right path over the others.","spells":[{"name":"Guidance","level":"rote","ongoing":false,"text":"The symbol of your deity appears before you and gestures towards the direction or course of action your deity would have you take then disappears. The message is through gesture only; your communication through this spell is severely limited.","page":210},{"name":"Detect Alignment","level":"1","ongoing":false,"text":"When you cast this spell choose an alignment: Good, Evil, Lawful, or Chaotic. One of your senses is briefly able to detect that alignment. The GM will tell you what here is of that alignment.","page":210},{"name":"Mending","level":"1","ongoing":false,"text":"Your devotion allows you to fix some mundane object, without needing tools or expertise.","page":210},{"name":"Planning","level":"1","ongoing":true,"text":"Cast this spell when you devise a plan to better your understanding of the situation. When you carry out that plan, take +1 forward. You can only have a heightened understanding of one plan at a time.","page":210},{"name":"Inquiry","level":"3","ongoing":false,"text":"Cast this spell on a person you can see and ask one question about them from the list below:\n- What does this person intend to do?\n- What does this person need or desire?\n- What is false about this person?\n- Who does this person associate with?\nTake +1 forward when you act on the answer.","page":212},{"name":"Local Customs","level":"3","ongoing":true,"text":"The customs of the people you observe are revealed to you. While this spell is ongoing, you take -1 to cast a spell and you are able to determine and mimic local customs, wherever you are. You can tell if someone’s behaviour is routine or unexpected by observers, and you can predict what kind of behaviour is expected of you, but you do not gain any additional language skills.","page":212},{"name":"True Seeing","level":"5","ongoing":true,"text":"Your vision is opened to the true nature of everything you lay your eyes on. You pierce illusions and see things that have been hidden. The GM will describe the area before you ignoring any illusions and falsehoods, magical or otherwise. While this spell is ongoing you take -1 to cast a spell.","page":212},{"name":"Words of the Unspeaking","level":"5","ongoing":false,"text":"With a touch you speak to the spirits within things. The non-living object you touch answers three questions you pose, as best it can.","page":212},{"name":"True Discernment","level":"7","ongoing":false,"text":"When you cast this spell on the evidence left by some creature or event, or something removed from a faraway location, you may study that creature, event, or location as if you had discerned realities and rolled 10+.","page":213},{"name":"Questing","level":"9","ongoing":false,"text":"Describe an objective, however complicated. The GM will tell you what it would take to accomplish normally. You can choose one of those requirements, and the GM will tell you an easier—and possible—way to achieve it.","page":213}]}],"magic":[{"name":"Alteration","page":298,"intro":"With the power that flows through your mind, forms are not limited to what we can see. One thing can become another in an instant.","spells":[{"name":"Erase","level":"cantrip","ongoing":true,"text":"With a wave of your hand, you erase any text in front of you. You may choose to be selective of which words you erase, and you may erase an entire book you wave your hand over.","page":298},{"name":"Alter Colours","level":"1","ongoing":false,"text":"You change the colour of an object, structure, or person you touch. The change can be permanent or it can last until you dispel it, your choice.","page":298},{"name":"Mending","level":"1","ongoing":false,"text":"You touch a single mundane object and it is miraculously repaired.","page":298},{"name":"Two Face","level":"1","ongoing":true,"text":"Your face changes so you resemble someone else. While this spell is ongoing, you take -1 to cast a spell.","page":298},{"name":"Alter Liquid","level":"3","ongoing":false,"text":"You transmute a body of liquid no larger than yourself into a different kind of liquid. It must be within your reach, but you need not touch it. This transmutation only affects one liquid at a time, and does not affect liquids being used in a biological process (like blood, for example). A corrosive liquid may be used as a weapon.","page":300},{"name":"Alter Thing","level":"3","ongoing":false,"text":"You transform one mundane item in your hands into some other mundane item, whatever you want. The effect is permanent.","page":300},{"name":"Gift of Spells","level":"5","ongoing":false,"text":"You give one of your memorized spells to someone you can see. You forget that spell and they can cast it as if they were you. Until they cast it, you may not memorize it again.","page":300},{"name":"Four Arms","level":"5","ongoing":true,"text":"You grow an extra pair of arm-like limbs. If they are wings, you can fly or glide with them. If they are arms, you gain +1 damage for each extra arm that wields a weapon, or you can use two shields at once, gaining the armour bonus for both. Or you can play a bunch of musical instruments all at once! While this spell is ongoing, you take -1 to cast a spell.","page":300},{"name":"Polymorph","level":"5","ongoing":false,"text":"Your touch reshapes a creature entirely, they stay in the form you craft until you cast a spell. Describe the new shape you craft, including any stat changes, significant adaptations, or major weaknesses. The GM will then tell you one or more of these:\n- The creature’s mind will be altered as well.\n- The form has an unintended benefit or weakness.\n- The form will be unstable and temporary.","page":300},{"name":"Change Self","level":"7","ongoing":true,"text":"You transform your shape into that of an animal, monster, or another person. Hold 3, and the GM will tell you one or more moves associated with your new form. Spend a hold to make that move. Once you’re out of hold, you return to your natural form. At any time, you may spend all your hold to banish the spell and revert to your natural form. While this spell is ongoing, you take -1 to cast a spell.","page":301},{"name":"Change Other","level":"9","ongoing":true,"text":"Someone or something you touch is transformed into another form of your choice. They cannot become smaller than half, or larger than twice, its original size. They have all the innate abilities and weaknesses of the form, except magical powers. While this spell is ongoing, you take -1 to cast a spell.","page":301}]},{"name":"Divination","page":302,"intro":"Open you eyes to the possibilities of magic, see the truth behind the lies.","spells":[{"name":"Identify","level":"cantrip","ongoing":false,"text":"This spell will tell you what an item that you touch is, if you don’t already know. Only mundane details are revealed.","page":302},{"name":"Detect Alignment","level":"1","ongoing":false,"text":"When you cast this spell choose an alignment: Good, Evil, Lawful, or Chaotic. One of your senses is briefly able to detect that alignment. The GM will tell you what here is of that alignment.","page":302},{"name":"Detect Magic","level":"1","ongoing":false,"text":"One of your senses is briefly attuned to magic. The GM will tell you what here is magical.","page":302},{"name":"Telepathy","level":"1","ongoing":true,"text":"You form a telepathic bond with a single person you touch, enabling you to converse with that person through your thoughts. You can only have one telepathic bond at a time.","page":302},{"name":"Locate Object","level":"3","ongoing":true,"text":"Name a specific object or a type of object. While you concentrate, this spell will indicate which direction it is in, and where it is exactly if it is within a short walking distance. If you name a type of object, the spell points you toward the nearest one. While this spell is ongoing, take -1 to cast a spell.","page":302},{"name":"Visions Through Time","level":"3","ongoing":false,"text":"Cast this spell and gaze into a reflective surface to see into the depths of time. The GM will reveal the details of a grim portent to you—a bleak event that will come to pass without your intervention. They’ll tell you something useful about how you can interfere with the grim portent’s dark outcomes. Rare is the portent that claims “You’ll live happily ever after.” Sorry.","page":303},{"name":"Contact Other Plane","level":"5","ongoing":true,"text":"You send a request to another plane. Specify who or what you’d like to contact by location, type of creature, name, or title. You open a two-way communication with that creature. Your communication can be cut off at any time by you or the creature you contacted.","page":303},{"name":"Divination","level":"5","ongoing":false,"text":"Name a person, place, or thing you want to learn about. This spell grants you visions of the target, as clear as if you were there.","page":303},{"name":"True Seeing","level":"7","ongoing":true,"text":"You see all things as they truly are. This effect persists until you tell a lie or dismiss the spell. While this spell is ongoing you take -1 to cast a spell.","page":303},{"name":"Alert","level":"9","ongoing":false,"text":"Describe an event. The GM will tell you when that event occurs, no matter where you are or how far away the event is. If you choose, you can view the location of the event as though you were there in person. You can only have one Alert active at a time.","page":303}]},{"name":"Enchantment","page":305,"intro":"Magic is like a net, a gloss, an infusion of flavour. You are an artist who adds to the world, not a vandal who destroys it.","spells":[{"name":"Emote","level":"cantrip","ongoing":false,"text":"You cause a person you touch to feel one emotion of your choice, very strongly, but only for a moment.","page":305},{"name":"Cause Fear","level":"1","ongoing":true,"text":"Choose a target you can see and a nearby object. The target is afraid of the object so long as you maintain the spell. Their reaction is up to them: flee, panic, beg, fight. While this spell is ongoing you take -1 to cast a spell. You cannot target entities with less than animal intelligence (magical constructs, undead, automatons, and the like).","page":305},{"name":"Charm Person","level":"1","ongoing":true,"text":"The person (not beast or monster) you touch while casting this spell counts you as a friend until they take damage or you prove otherwise.","page":305},{"name":"Dispel Magic","level":"3","ongoing":false,"text":"Choose a spell or magic effect in your presence: this spell rips it apart. Lesser spells are ended, powerful magic is just reduced or dampened so long as you are nearby.","page":306},{"name":"Sleep","level":"3","ongoing":false,"text":"1d4 enemies you can see of the GM’s choice fall asleep. Only creatures capable of sleeping are affected. They awake as normal: loud noises, jolts, pain.","page":306},{"name":"Hold Person","level":"5","ongoing":true,"text":"Choose a person you can see. Until they take damage or leave your presence, they cannot act except to speak. While this spell is ongoing you take -1 to cast a spell.","page":306},{"name":"Polymorph","level":"5","ongoing":false,"text":"Your touch reshapes a creature entirely, they stay in the form you craft until you cast a spell. Describe the new shape you craft, including any stat changes, significant adaptations, or major weaknesses. The GM will then tell you one or more of these:\n- The creature’s mind will be altered as well.\n- The form has an unintended benefit or weakness.\n- The form will be unstable and temporary.","page":306},{"name":"Dominate","level":"7","ongoing":true,"text":"Your touch pushes your mind into someone else’s. You gain 1d4 hold. Spend one hold to make the target take one of these actions:\n- Give you something they hold.\n- Make a concerted attack on a target of your choice.\n- Speak a few words of your choice.\n- Truthfully answer one question.\nIf you run out of hold the spell ends. If the target takes damage you lose 1 hold. While the spell is ongoing you cannot cast a spell.","page":307},{"name":"Hold Monster","level":"7","ongoing":true,"text":"Choose a monster you can see. Until they take damage or leave your presence, they cannot act except to speak. While this spell is ongoing you take -1 to cast a spell.","page":307},{"name":"Antipathy","level":"9","ongoing":true,"text":"Choose a target and describe a type of creature or an alignment. Creatures of the specified type or alignment cannot come within sight of the target. If a creature of the specified type does find itself within sight of the target, it immediately flees. This effect continues until you leave the target’s presence or you dismiss the spell. While the spell is ongoing you take -1 to cast a spell.","page":307}]},{"name":"Evocation","page":308,"intro":"The potential of matter and energy, the creative urge, the desire to come into being—all these are things you understand about creation. And you are the one to bring them forth into existence.","spells":[{"name":"Light","level":"cantrip","ongoing":false,"text":"An item you touch glows with arcane light, about as bright as a torch. It gives off no heat or sound and requires no fuel, but it is otherwise like a mundane torch. You have complete control of the colour of the flame. The spell lasts as long as it is in your presence.","page":308},{"name":"Magic Missile","level":"1","ongoing":false,"text":"Projectiles of pure magic spring from your fingers. Deal 2d4 damage to one target.","page":308},{"name":"The Fog","level":"1","ongoing":true,"text":"Name a location you can see. It is completely blanketed in thick fog that prevents anyone from seeing further than a foot in front of them. While this spell is ongoing, the fog will not dissipate and cannot be blown away by wind, and you take -1 to cast a spell.","page":308},{"name":"Fireball","level":"3","ongoing":false,"text":"You evoke a mighty ball of flame that envelops your target and everyone nearby, inflicting 2d6 damage which ignores armour.","page":308},{"name":"Web","level":"3","ongoing":false,"text":"Up to 1d4 creatures you can see become trapped in a sticky web. Until they are cut free or the webs are burnt away, they are stuck.","page":308},{"name":"Cage","level":"5","ongoing":true,"text":"The target is held in a cage of magical force. Nothing can get in or out of the cage. The cage remains until you cast another spell or dismiss it. While the spell is ongoing, the caged creature can hear your thoughts and you cannot leave sight of the cage.","page":309},{"name":"Contingency","level":"7","ongoing":false,"text":"Choose a spell of 5th level or lower that you know. Describe a trigger condition using a number of words equal to your level. The chosen spell is held until you choose to unleash it or the trigger condition is met, whichever happens first. You don’t have to roll for the held spell, it just takes effect. You may only have a single contingent spell held at a time; if you cast Contingency while you have a held spell, the new held spell replaces the old one.","page":309},{"name":"Shelter","level":"9","ongoing":true,"text":"You create a structure out of pure magical power. It can be as large as a castle or as small as a hut, but is impervious to all non-magical damage. The structure endures until you leave it or you end the spell.","page":309}]},{"name":"Illusions","page":311,"intro":"Who needs real power over the elements, when the appearance of power is just as useful? Who needs power over someone’s mind, when a simple trick will change it just as easily? Who needs money when money is just an illusion anyway? You have it all figured out, illusionist, just don’t get caught.","spells":[{"name":"Prestidigitation","level":"cantrip","ongoing":true,"text":"You perform minor tricks of true magic. If you touch an item as part of the casting you can make cosmetic changes to it: clean it, soil it, cool it, warm it, flavour it, or change its colour. if you cast the spell without touching an item you can instead create minor illusions no bigger than yourself. Prestidigitation illusions are crude and clearly illusions—they won’t fool anyone, but they might entertain them.","page":311},{"name":"Invisibility","level":"1","ongoing":true,"text":"Touch an ally: nobody can see them. They’re invisible! This spell persists until the target attacks or you dismiss the effect. While this spell is ongoing, you can’t cast another spell.","page":311},{"name":"Control Sound","level":"1","ongoing":true,"text":"With this spell, you can create noise, music, or silence in your presence. While you control the sound around you, take -1 to cast a spell.","page":311},{"name":"Mimic","level":"3","ongoing":true,"text":"You take the form of someone you touch while casting this spell. Your physical characteristics match theirs exactly but your behaviour may not. This change persists until you take damage or choose to return to your own form. While this spell is ongoing you lose access to all your wizard moves.","page":312},{"name":"Mirror Image","level":"3","ongoing":false,"text":"You create an illusory image of yourself. When you are attacked, roll a d6. On a 4, 5, or 6 the attack hits the illusion instead, the image then dissipates and the spell ends.","page":312},{"name":"Doppelgänger","level":"5","ongoing":true,"text":"You create an exact duplicate of any creature you have observed yourself. This doppelgänger has all the mundane, physical attributes of the creature it mimics, but none of the same knowledge or special powers. It acts according to your mental command, with no life of its own. While this spell is ongoing, you can’t cast another spell.","page":312},{"name":"Faerie Kingdom","level":"5","ongoing":true,"text":"You create the illusion of a fully-detailed location. The old location is covered up, and anyone entering this place experiences only the new one. This location can cause fright, but not any real harm, nor does any food give sustenance, nor fire give warmth. The illusion is broken if you leave and cease to observe it.","page":312},{"name":"Shadow Walk","level":"7","ongoing":false,"text":"The shadows you target with this spell become a portal for you and your allies. Name a location, describing it with a number of words up to your level. Stepping through the portal deposits you and any allies present when you cast the spell at the location you described. The portal may only be used once by each ally.","page":313},{"name":"City in a Bottle","level":"9","ongoing":true,"text":"Choose a location, up to the size of a city. That location disappears from the view of outsiders, who can no longer find it without your permission. Anyone who leaves a disappeared location also cannot find their way back without your leave.","page":313},{"name":"False World","level":"9","ongoing":true,"text":"With a touch, you can place someone’s body into a deep sleep and their mind into a false world that they believe is real. Until you reverse the spell, they continue to live on in a world entirely of your creation, never knowing it is a lie and that their body lies ageless somewhere else.","page":313}]},{"name":"Mind","page":314,"intro":"What could be more mysterious and unknowable than the mind itself? Truly this is the final frontier, the inside of our very souls.","spells":[{"name":"Identify Person","level":"cantrip","ongoing":false,"text":"This spell tells you the name, cultural background, and occupation of one person you can see, hear, or feel.","page":314},{"name":"Deadened","level":"1","ongoing":true,"text":"You touch someone, and they find their emotions dulled and deadened. They can still choose to act on the remaining ghost of their emotions, but will not be ruled by lust or fear while under the influence of this spell. While this spell is ongoing, you take -1 to cast a spell.","page":314},{"name":"Telepathy","level":"1","ongoing":true,"text":"You form a telepathic bond with a single person you touch, enabling you to converse with that person through your thoughts. You can only have one telepathic bond at a time.","page":314},{"name":"The Urge","level":"1","ongoing":false,"text":"You touch someone and create an urge in them—escape, greed, hunger, sexual desire, or thirst, for example. You choose the urge, but they react of their own free will. The urge fades after a few hours.","page":314},{"name":"Memory Reading","level":"3","ongoing":false,"text":"You touch someone and experience one of their memories, as if it were your own.","page":315},{"name":"Truth Telling","level":"3","ongoing":true,"text":"A creature you touch is prevented from saying anything they know to be a deliberate lie. While this spell is ongoing, take -1 to cast a spell.","page":315},{"name":"Open Mind","level":"5","ongoing":true,"text":"When you touch someone, their thoughts become audible to anyone else nearby, as long as you continue to concentrate. While this spell is ongoing, you take -1 to cast a spell.","page":315},{"name":"Past Thoughts","level":"7","ongoing":false,"text":"You can “hear” the thoughts and emotions that happened in your specific location during one historical event of your choosing. You do not necessarily know who originally possessed these thoughts and emotions, though thoughts can easily give away their origins.","page":315},{"name":"Mind Transfer 9 ( )","level":"9","ongoing":true,"text":"You transfer your mind into the body of another living being you touch. You may choose to exchange bodies, in which case their mind now inhabits your body until the effect is reversed. You retain all your moves and stats except those that require your old body. You may instead choose to possess them, which makes this spell ongoing and gives them a chance to resist. If they cannot, your body remains in a state of sleep and while this spell is ongoing, you take -1 to cast a spell.","page":315}]},{"name":"Movement","page":316,"intro":"Places to go and people to meet-everyone is in a hurry to get somewhere. But you don’t need to worry, do you? You always get where you need to go.","spells":[{"name":"Message","level":"cantrip","ongoing":false,"text":"You send a small item from your hand into the air, to land at the feet of whomever you name when the spell is cast.","page":316},{"name":"The Hand that Calls","level":"1","ongoing":false,"text":"You pull an object you can see into your hand, no matter its distance from you. The object can be no larger than something you would be able to life one-handed.","page":316},{"name":"Vestigia Nulla Retrorsum","level":"1","ongoing":true,"text":"This spell erases your tracks as you walk so that you leave no trace. While this spell is ongoing, you take -1 to cast a spell.","page":316},{"name":"Environmental Protection","level":"3","ongoing":true,"text":"A magic force surrounds and protects you from the environmental hazard of your choice (breathe underwater, resist fire, etc). While this spell is ongoing, take -1 to cast a spell.","page":316},{"name":"Fly","level":"5","ongoing":true,"text":"You take to the air, soaring on a gust of wind or floating on a puffy cloud. While this spell is ongoing, you take -1 to cast a spell.","page":316},{"name":"Star Gate","level":"5","ongoing":true,"text":"You open a gateway to another dimension or plane of existence. You can pass through this gate, either entering this other location or passing through it to get to another place in your present dimension. You can bring a number of others with you equal to your level, if they are willing, or you can send one target of your choice that you touch through, by themselves.","page":317},{"name":"Astral Projection","level":"7","ongoing":true,"text":"You project your mind into the astral plane, in the form of light, where you can meet nearly any kind of divine spirit. You cannot bring mundane objects with you, only magical items. A silver strand connects your astral light to your physical body, which is immobile while your mind roams the stars.","page":317},{"name":"Teleport","level":"9","ongoing":false,"text":"Choose a location, anywhere else you can think of. You disappear, then appear in this new location.","page":317}]},{"name":"Necromancy","page":319,"intro":"What power is greater than Death? Most would argue that there is none, but you know the truth. Magic is more powerful than Death.","spells":[{"name":"Corpse Whispers","level":"cantrip","ongoing":false,"text":"Cast this spell when you touch a corpse. You experience that person’s last moments of life through one of their senses—you see what they saw or hear what they heard, for example.","page":319},{"name":"Find Corpse","level":"1","ongoing":true,"text":"This spell points you in the direction of the nearest dead body, or, if it’s within a short walking distance, reveals exactly where it is. While this spell is ongoing, take -1 to cast a spell.","page":319},{"name":"Speak With Dead","level":"1","ongoing":false,"text":"A corpse converses with you briefly. It will answer any three questions you pose to it to the best of the knowledge it had in life and the knowledge it gained in death.","page":319},{"name":"Animate Dead","level":"3","ongoing":true,"text":"You invoke a hungry spirit to possess a recently-dead body and serve you. This creates a zombie that follows your orders to the best of its limited abilities. Treat the zombie as a character, but with access to only the basic moves. It has a +1 modifier for all stats and 1 HP. The zombie also gets your choice of 1d4 of these traits:\n- It does not appear obviously dead, at least for a day or two.\n- It has a functioning brain and can complete complex tasks.\n- It’s durable. It has +2 HP for each level you have.\n- It’s talented. Give one stat a +2 modifier.\nThe zombie lasts until it is destroyed by taking damage in excess of its HP, or until you end the spell. While this spell is ongoing you take -1 to cast a spell.","page":320},{"name":"Consume Unlife","level":"5","ongoing":false,"text":"The mindless undead creature you touch is destroyed and you steal its death energy to heal yourself or the next ally you touch. The amount of damage healed is equal to the HP that the creature had remaining before you destroyed it.","page":320},{"name":"Mark of Death","level":"7","ongoing":false,"text":"Choose a creature whose true name you know. This spell creates permanent runes on a target surface that will kill that creature, should they read them.","page":320},{"name":"Soul Gem","level":"9","ongoing":false,"text":"You trap the soul of a dying creature within a gem. The trapped creature is aware of its imprisonment but can still be manipulated through spells, parley, and other effects. All moves against the trapped creature are at +1. You can free the soul at any time but it can never be recaptured once freed.","page":321}]},{"name":"Pyromancy","page":322,"intro":"Are you the magician who longs to see? I chant it out, between two worlds, and fire walks with me.","spells":[{"name":"Light","level":"cantrip","ongoing":false,"text":"An item you touch glows with arcane light, about as bright as a torch. It gives off no heat or sound and requires no fuel, but it is otherwise like a mundane torch. You have complete control of the colour of the flame. The spell lasts as long as it is in your presence.","page":322},{"name":"Burning Hands","level":"1","ongoing":true,"text":"Your hands alight with flame, which does not burn until you let it go. When you do, you can use the fire as a weapon to deal your damage, or to light flammable materials ablaze.","page":322},{"name":"Fire Walk For Me","level":"1","ongoing":true,"text":"You command a fire that is contained to one location—such as a campfire or a bonfire—to move to another location of your choice. Although it moves quickly, it may set things on fire as it goes. While this spell is ongoing, you may not cast another.","page":322},{"name":"Extinguish Small Fires","level":"3","ongoing":false,"text":"At your command, any fire the size of a funeral pyre or smaller is extinguished.","page":322},{"name":"Fireball","level":"3","ongoing":false,"text":"You evoke a mighty ball of flame that envelops your target and everyone nearby, inflicting 2d6 damage which ignores armour.","page":322},{"name":"Summon Fire Elemental","level":"5","ongoing":true,"text":"An elemental creature made of fire appears and aids you as best it can. Treat it as your character, but with access to only the basic moves. It has +1 modifier for all stats, 1 HP, and uses your damage dice. The monster also gets your choice of 1d4 of these traits:\n- It can choose what to set on fire and what not to touch.\n- It can fly and hover.\n- It does 1d10 damage.\n- It has +2 instead of +1 to one stat.\n- Its bond to your plane is strong: +2 HP for each level you have.\n- You can touch it safely.\nThe elemental remains on this plane until it dies or you dismiss it. While the spell is ongoing you take -1 to cast a spell.","page":323},{"name":"Extinguish Large Fires","level":"7","ongoing":false,"text":"At your command, a fire of any size is extinguished, or an elemental is banished from this plane of existence.","page":323},{"name":"Form of Fire","level":"9","ongoing":true,"text":"You transform into an elemental made of fire. While in this form, you have all the innate abilities and weaknesses of the form, and your damage die is a d10. Also, hold 3. You may spend a hold to use either of the following moves:\n- Engulf a foe in flames.\n- Fly through the air like a spark.\nOnce you are out of hold, the spell ends. At any time, you may spend all your hold and revert to your natural form.","page":323}]},{"name":"Summoning","page":324,"intro":"You are never alone, unless you want to be.","spells":[{"name":"Unseen Servant","level":"cantrip","ongoing":true,"text":"You conjure a simple invisible construct that can do nothing but carry items. It has Load 3 and carries anything you hand to it. It cannot pick up items on its own and can only carry those you give to it. Items carried by an unseen servant appear to float in the air a few paces behind you. An unseen servant that takes damage or leaves your presence is immediately dispelled, dropping any items it carried. Otherwise the unseen servant serves you until you end the spell.","page":324},{"name":"Contact Spirits","level":"1","ongoing":false,"text":"Name the spirit you wish to contact (or leave it to the GM). You pull that creature through the planes, just close enough to speak to you. It is bound to answer any one question you ask to the best of its ability.","page":324},{"name":"Summon Feast","level":"1","ongoing":false,"text":"From nothing, you are able to summon up to your level in rations worth of delicious food. Somewhere else in the world, all this food goes missing.","page":324},{"name":"Darkness","level":"3","ongoing":true,"text":"Choose an area you can see: it’s filled with supernatural darkness and shadow. While this spell is ongoing you take -1 to cast a spell.","page":324},{"name":"Summon Monster","level":"5","ongoing":true,"text":"A monster appears and aids you as best it can. Treat it as your character, but with access to only the basic moves. It has +1 modifier for all stats, 1 HP, and uses your damage dice. The monster also gets your choice of 1d6 of these traits:\n- It does 1d8 damage.\n- It has +2 instead of +1 to one stat.\n- It has some useful adaptation.\n- It’s not reckless.\n- Its bond to your plane is strong: +2 HP for each level you have.\nThe GM will tell you the type of monster you get based on the traits you select. The creature remains on this plane until it dies or you dismiss it. While the spell is ongoing you take -1 to cast a spell.","page":325},{"name":"Cloudkill","level":"7","ongoing":true,"text":"A cloud of fog drifts into this realm from beyond the Black Gates of Death, filling the immediate area. Whenever a creature in the area takes damage it takes an additional, separate 1d6 damage which ignores armour. This spell persists so long as you can see the affected area, or until you dismiss it.","page":325},{"name":"Perfect Summons","level":"9","ongoing":false,"text":"You teleport a creature to your presence. Name a creature or give a short description of a type of creature. If you named a creature, that creature appears before you. If you described a type of creature, a creature of that type appears before you.","page":325}]},{"name":"Ward-Weaving","page":326,"intro":"The schools of wards and runes involves inscribing magical markings onto the surfaces of solid objects, thus imbuing them with your magic. Symbols have power, after all.","spells":[{"name":"Wizard’s Mark","level":"cantrip","ongoing":false,"text":"You mark a person or object that you touch with your invisible magic. Unless the mark is dispelled, you can always recognize it.","page":326},{"name":"Alarm","level":"1","ongoing":false,"text":"Walk a wide circle as you cast this spell. Until you prepare spells again your magic will alert you if a creature crosses that circle. Even if you are asleep, the spell will shake you from your slumber.","page":326},{"name":"Secret Runes","level":"1","ongoing":false,"text":"You write a message on a surface in magical runes which no one can see—except for the person you name as the spell is cast. They will see these runes as plain as day.","page":326},{"name":"Trap Ward","level":"3","ongoing":false,"text":"By placing this ward on an object, and you deal your damage to the next person who touches this object and isn’t you.","page":326},{"name":"Ward Against Intruders","level":"5","ongoing":false,"text":"When you place this ward on a doorway, window, or other passage, it prevents creatures of a certain type from passing through. Name what kind of creature when you place the ward; they can only pass if they possess magical protection, or the passageway is destroyed.","page":327},{"name":"Location Ward","level":"7","ongoing":false,"text":"When you place this ward anywhere in a specific location, it prevents creatures of a certain type from entering that area. The location must have clearly-defined boundaries, though you can pace out a circle or other space and mark it with chalk, sand, etc. Name what kind of creature is barred from entry when you place the ward.","page":327},{"name":"Mark of Death","level":"7","ongoing":false,"text":"Choose a creature whose true name you know. This spell creates permanent runes on a target surface that will kill that creature, should they read them.","page":327},{"name":"Gateway Runes","level":"9","ongoing":false,"text":"This spell may be used to create two effects. The first effect is to place a gate ward upon a location. The second use of this spell transports yourself and a small handful of other people from one gate ward to another, no matter the distance between. When the spell is cast, you may only do one or the other, not both.","page":327}]}]}},"dw":{"classes":{"Bard":{"dmg":"d6","hp":6,"load":9,"alignments":[{"type":"Good","text":"Perform your art to aid someone else."},{"type":"Neutral","text":"Avoid a conflict or defuse a tense situation."},{"type":"Chaotic","text":"Spur others to significant and unplanned decisive action."}],"bonds":["This is not my first adventure with __________.","I sang stories of __________ long before I ever met them in person.","__________ is often the butt of my jokes.","I am writing a ballad about the adventures of __________.","__________ trusted me with a secret.","__________ does not trust me, and for good reason."],"races":[{"name":"Elf","text":"When you enter an important location (your call) you can ask the GM for one fact from the history of that location."},{"name":"Human","text":"When you first enter a civilized settlement someone who respects the custom of hospitality to minstrels will take you in as their guest."}],"gear":[{"label":"You have dungeon rations (5 uses, 1 weight)","max":1,"options":[{"label":"Dungeon Rations","items":[{"name":"Dungeon Rations","desc":"Not tasty, but not bad either.","tags":[{"n":"Ration","v":null},{"n":"Uses","v":5},{"n":"Coins","v":3},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one instrument, all are 0 weight for you","max":1,"options":[{"label":"Your father's mandolin, repaired","items":[{"name":"Father's Mandolin","desc":"Your father's mandolin, repaired.","tags":[{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"A fine lute, a gift from a noble","items":[{"name":"Fine Lute","desc":"A fine lute, a gift from a noble.","tags":[{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"The pipes with which you courted your first love","items":[{"name":"Memorable Pipes","desc":"The pipes with which you courted your first love","tags":[{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"A stolen horn","items":[{"name":"Stolen Horn","desc":"A stolen horn","tags":[{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"A fiddle, never before played","items":[{"name":"Unplayed Fiddle","desc":"A fiddle, never before played.","tags":[{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"A songbook in a forgotten tongue","items":[{"name":"Forgotten Songbook","desc":"A songbook in a forgotten tongue.","tags":[{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0}]},{"label":"Choose your clothing","max":1,"options":[{"label":"Leather Armor","items":[{"name":"Leather Armor","desc":"","tags":[{"n":"Armor","v":1},{"n":"Worn","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Ostentatious clothes","items":[{"name":"Ostentatious clothes","desc":"Clothes that are vulgar or pretentious, designed to impress attract notice.","tags":[{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0}]},{"label":"Choose your armament","max":1,"options":[{"label":"Dueling Rapier","items":[{"name":"Dueling Rapier","desc":"","tags":[{"n":"Close","v":null},{"n":"Piercing","v":1},{"n":"Precise","v":null},{"n":"Coins","v":50},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0},{"label":"Ragged Bow","items":[{"name":"Ragged Bow","desc":"","tags":[{"n":"Near","v":null},{"n":"Coins","v":15},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one","max":1,"options":[{"label":"Adventuring Gear","items":[{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Bandages","items":[{"name":"Bandages","desc":"When you have a few minutes to bandage someone else's wounds, heal them of 4 damage and expend a use.","tags":[{"n":"Uses","v":3},{"n":"Slow","v":null},{"n":"Coins","v":5},{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"Halfling Pipeleaf","items":[{"name":"Halfling Pipeleaf","desc":"When you share halfling pipeleaf with someone, expend two uses and take +1 forward to Parley with them.","tags":[{"n":"Uses","v":6},{"n":"Coins","v":5},{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"3 coins","items":[],"coins":3.0}]}],"spellcaster":false,"page":81,"names":"Elf: Astrafel, Daelwyn, Feliana, Damarra, Sistranalle, Pendrell, Melliandre, Dagoliir\nHuman: Baldric, Leena, Dunwick, Willem, Edwyn, Florian, Seraphine, Quorra, Charlotte, Lily, Ramonde, Cassandra","looks":["Knowing Eyes, Fiery Eyes, or Joyous Eyes","Fancy Hair, Wild Hair, or Stylish Cap","Finery, Traveling Clothes, or Poor Clothes","Fit Body, Well-fed Body, or Thin Body"],"blurb":"The poems say an adventurer's life is all open roads and the glory of coin and combat. The tales told in every farmhand-filled inn have to have some ring of truth to them, don't they? The songs to inspire peasantry and royals alike-to soothe the savage beast or drive men to a frenzy-have to come from somewhere.\n\nEnter the bard. You, with your smooth tongue and quick wit. You teller-of-tales and singer-of-songs. It takes a mere minstrel to retell a thing but a true bard to live it. Strap on your boots, noble orator. Sharpen that hidden dagger and take up the call. Someone's got to be there, fighting shoulder-to-shoulder with the goons and the thugs and the soon-to-be-heroes. Who better than you to write the tale of your own heroism?\n\nNobody. Get going.","moves":[{"name":"Arcane Art","text":"When you **weave a performance into a basic spell**, choose an ally and an effect:\n\n* Heal 1d8 damage\n* +1d4 forward to damage\n* Their mind is shaken clear of one enchantment\n* The next time someone successfully assists the target with aid, they get +2 instead of +1\n\nThen roll+Cha.\n\n* On a 10+, the ally gets the selected effect.\n* On a 7-9, your spell still works, but you draw unwanted attention or your magic reverberates to other targets affecting them as well, GM's choice","stat":"CHA","page":82,"tier":0},{"name":"Bardic Lore","text":"Choose an area of expertise:\n\n* Spells and Magicks\n* The Dead and Undead\n* Grand Histories of the Known World\n* A Bestiary of Creatures Unusual\n* The Planar Spheres\n* Legends of Heroes Past\n* Gods and Their Servants\n\nWhen you **first encounter an important creature, location, or item (your call) covered by your bardic lore** you can ask the GM any one question about it; the GM will answer truthfully. The GM may then ask you what tale, song, or legend you heard that information in.","page":82,"tier":0},{"name":"Charming and Open","text":"When you **speak frankly with someone**, you can ask their player a question from the list below. They must answer it truthfully, then they may ask you a question from the list (which you must answer truthfully).\n\n* Whom do you serve?\n* What do you wish I would do?\n* How can I get you to __________?\n* What are you really feeling right now?\n* What do you most desire?","page":83,"tier":0},{"name":"A Port in the Storm","text":"When you return to a civilized settlement you've visited before, tell the GM when you were last here. They'll tell you how it's changed since then.","page":83,"tier":0},{"name":"Healing Song","text":"When you heal with Arcane Art you heal +1d8 damage.","page":85,"tier":2},{"name":"Vicious Cacophony","text":"When you **grant bonus damage with Arcane Art**, you grant an extra +1d4 damage.","page":85,"tier":2},{"name":"It Goes To Eleven","text":"When you unleash a crazed performance (a righteous lute solo or mighty brass blast, maybe) choose a target who can hear you and roll+CHA.\n\n * On a 10+ the target attacks their nearest ally in range.\n * On a 7-9 they attack their nearest ally, but you also draw their attention and ire.","stat":"CHA","page":85,"tier":2},{"name":"Metal Hurlant","text":"When you shout with great force or play a shattering note choose a target and roll+CON.\n\n * On a 10+ the target takes 1d10 damage and is deafened for a few minutes.\n * On a 7-9 you still damage your target, but it's out of control: the GM will choose an additional target nearby.","stat":"CON","page":85,"tier":2},{"name":"A Little Help From My Friends","text":"When you successfully aid someone you take +1 forward as well.","page":85,"tier":2},{"name":"Eldritch Tome","text":"Your Arcane Art is strong, allowing you to choose two effects instead of one.","tier":2},{"name":"Duelist's Parry","text":"When you Hack & Slash, you take +1 armor forward.","page":85,"tier":2},{"name":"Bamboozle","text":"When you Parley with someone, on a 7+ you also take +1 forward with them.","page":85,"tier":2},{"name":"Multiclass Dabbler","text":"Get one move from another class. Treat your level as one lower for choosing the move.","page":86,"tier":2},{"name":"Multiclass Initiate","text":"Get one move from another class. Treat your level as one lower for choosing the move.","page":86,"tier":6,"requires":["Multiclass Dabbler"]},{"name":"Healing Chorus","text":"When you heal with Arcane Art, you heal +2d8 damage.","page":86,"tier":6,"replaces":["Healing Song"]},{"name":"Vicious Blast","text":"When you **grant bonus damage with Arcane Art**, you grant an extra +2d4 damage.","page":86,"tier":6,"replaces":["Vicious Cacophony"]},{"name":"Unforgettable Face","text":"When you **meet someone you've met before** (your call) after some time apart you take +1 forward against them.","page":86,"tier":6},{"name":"Reputation","text":"When you **first meet someone who's heard songs about you**, roll+CHA.\n\n * On a 10+, tell the GM two things they've heard about you.\n * On a 7-9, tell the GM one thing they've heard, and the GM tells you one thing.","stat":"CHA","page":86,"tier":6},{"name":"Eldritch Chord","text":"When you use Arcane Art, you choose two effects. You also get to choose one of those effects to double.","page":86,"tier":6,"replaces":["Eldritch Tones"]},{"name":"An Ear For Magic","text":"When you hear an enemy cast a spell the GM will tell you the name of the spell and its effects. Take +1 forward when acting on the answers.","page":87,"tier":6},{"name":"Devious","text":"When you use **Charming and Open** you may also ask \"How are you vulnerable to me?\" Your subject may not ask this question of you.","page":87,"tier":6},{"name":"Duelist's Block","text":"When you **Hack & Slash**, you take +2 armor forward.","page":87,"tier":6,"replaces":["Duelist's Parry"]},{"name":"Multiclass Master","text":"Get a move from another class. Treat your level as one lower for choosing the move.","page":87,"tier":6}],"extra":false},"Cleric":{"dmg":"d6","hp":8,"load":10,"alignments":[{"type":"Good","text":"Endanger yourself to heal another."},{"type":"Evil","text":"Harm another to prove the superiority of your church or god."},{"type":"Lawful","text":"Endanger yourself following the precepts of your church or god."}],"bonds":["__________ has insulted my deity; I do not trust them.","__________ is a good and faithful person; I trust them implicitly.","__________ is in constant danger, I will keep them safe.","I am working on converting __________ to my faith."],"races":[{"name":"Dwarf","text":"You are one with stone. When you Commune you are also granted a special version of Words of the Unspeaking as a rote which only works on stone."},{"name":"Human","text":"Your faith is diverse. Choose one wizard spell. You can cast and be granted that spell as if it was a cleric spell."}],"gear":[{"label":"Choose your defenses","max":1,"options":[{"label":"Chainmail","items":[{"name":"Chainmail","desc":"","tags":[{"n":"Armor","v":1},{"n":"Worn","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Shield","items":[{"name":"Shield","desc":"","tags":[{"n":"Armor","v":1},{"n":"Coins","v":15},{"n":"Weight","v":2}],"amount":1.0}],"coins":0.0}]},{"label":"Choose your armament","max":1,"options":[{"label":"Warhammer","items":[{"name":"Warhammer","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":8},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Mace","items":[{"name":"Mace","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":8},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Staff","items":[{"name":"Staff","desc":"","tags":[{"n":"Close","v":null},{"n":"Two_handed","v":null},{"n":"Coins","v":1},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one","max":1,"options":[{"label":"Adventuring Gear","items":[{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Healing Potion","items":[{"name":"Healing Potion","desc":"When you drink an entire healing potion, heal yourself of 10 damage or remove one debility, your choice.","tags":[{"n":"Coins","v":50},{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0}]}],"spellcaster":true,"page":89,"names":"Dwarf: Durga, Aelfar, Gerda, Rurgosh, Bjorn, Drummond, Helga, Siggrun, Freya\nHuman: Wesley, Brinton, Jon, Sara, Hawthorn, Elise, Clarke, Lenore, Piotr, Dahlia, Carmine","looks":["Kind Eyes, Sharp Eyes, or Sad Eyes","Tonsure, Strange Hair, or Bald","Flowing Robes, Habit, or Common Garb","Thin Body, Knobby Body, or Flabby Body"],"blurb":"The lands of Dungeon World are a gods-forsaken mess. They're lousy with the walking dead, beasts of all sorts, and the vast unnatural spaces between safe and temple-blessed civilizations. It is a godless world out there. That's why it needs you.\n\nBringing the glory of your god to the heathens isn't just in your nature-it's your calling. It falls to you to proselytize with sword and mace and spell. To cleave deep into the witless heart of the wilds and plant the seed of divinity there. Some say that it is best to keep god close to your heart. You know that's rubbish. God lives at the edge of a blade.\n\nShow the world who is lord.","moves":[{"name":"Multiclass Dabbler","text":"Get one move from another class. Treat your level as one lower for choosing the move.","page":95,"tier":2},{"name":"Deity","text":"You serve and worship some deity or power which grants you spells. Give your god a name (maybe Helferth, Sucellus, Zorica or Krugon the Bleak) and choose your deity's domain:\n\n* Healing and Restoration\n* Bloody Conquest\n* Civilization\n* Knowledge and Hidden Things\n* The Downtrodden and Forgotten\n* What Lies Beneath\n\nChoose one precept of your religion:\n\n* Your religion preaches the sanctity of suffering, add Petition: Suffering\n* Your religion is cultish and insular, add Petition: Gaining Secrets\n* Your religion has important sacrificial rites, add Petition: Offering\n* Your religion believes in trial by combat, add Petition: Personal Victory","page":90,"tier":0},{"name":"Divine Guidance","text":"When you petition your deity according to the precept of your religion, you are granted some useful knowledge or boon related to your deity's domain. The GM will tell you what.","page":91,"tier":0},{"name":"Turn Undead","text":"When you hold your holy symbol aloft and call on your deity for protection, roll+Wis.\n* On a 7+, so long as you continue to pray and brandish your holy symbol, no undead may come within reach of you.\n* On a 10+, you also momentarily daze intelligent undead and cause mindless undead to flee. Aggression breaks the effects and they are able to act as normal. Intelligent undead may still find ways to harry you from afar. They're clever like that.","stat":"WIS","page":91,"tier":0},{"name":"Commune","text":"When you spend uninterrupted time (an hour or so) in quiet communion with your deity, you:\n\n* Lose any spells already granted to you.\n* Are granted new spells of your choice whose total levels don't exceed your own level+1, and none of which is a higher level than your own level.\n* Prepare all of your rotes, which never count against your limit.","page":91,"tier":0},{"name":"Cast a Spell","text":"When you unleash a spell granted to you by your deity, roll+Wis.\n* On a 10+, the spell is successfully cast and your deity does not revoke the spell, so you may cast it again.\n* On a 7-9, the spell is cast, but choose one:\n\n* You draw unwelcome attention or put yourself in a spot. The GM will tell you how.\n* Your casting distances you from your deity-take -1 ongoing to cast a spell until the next time you commune.\n* After you cast it, the spell is revoked by your deity. You cannot cast the spell again until you commune and have it granted to you.\nNote that maintaining spells with ongoing effects will sometimes cause a penalty to your roll to cast a spell.","stat":"WIS","page":91,"tier":0},{"name":"Chosen One","text":"Choose one spell. You are granted that spell as if it was one level lower.","page":93,"tier":2},{"name":"Invigorate","text":"When you heal someone they take +2 forward to their damage.","page":93,"tier":2},{"name":"The Scales of Life and Death","text":"When someone takes their last breath in your presence, they take +1 to the roll.","page":93,"tier":2},{"name":"Serenity","text":"When you Cast a Spell you ignore the first -1 penalty from ongoing spells.","page":93,"tier":2},{"name":"First Aid","text":"Cure Light Wounds is a rote for you, and therefore doesn't count against your limit of granted spells.","page":93,"tier":2},{"name":"Divine Intervention","text":"When you Commune you get 1 hold and lose any hold you already had. Spend that hold when you or an ally takes damage to call on your deity, they intervene with an appropriate manifestation (a sudden gust of wind, a lucky slip, a burst of light) and negate the damage.","page":93,"tier":2},{"name":"Penitent","text":"When you take damage and embrace the pain, you may take +1d4 damage (ignoring armor). If you do, take +1 forward to cast a spell.","page":93,"tier":2},{"name":"Empower","text":"When you Cast a Spell, on a 10+ you have the option of choosing from the 7-9 list. If you do, you may choose one of these effects as well:\n\n* The spell's effects are doubled\n* The spell's targets are doubled","page":93,"tier":2},{"name":"Orison for Guidance","text":"When you sacrifice something of value to your deity and pray for guidance, your deity tells you what it would have you do. If you do it, mark experience.","page":94,"tier":2},{"name":"Devoted Healer","text":"When you heal someone else of damage, add your level to the amount of damage healed.","page":94,"tier":2},{"name":"Anointed","text":"Choose one spell in addition to the one you picked for chosen one. You are granted that spell as if it was one level lower.","page":94,"tier":6,"requires":["Chosen One"]},{"name":"Apotheosis","text":"The first time you spend time in prayer as appropriate to your god after taking this move, choose a feature associated with your deity (rending claws, wings of sapphire feathers, an all-seeing third eye, etc.). When you emerge from prayer, you permanently gain that physical feature.","page":94,"tier":6},{"name":"Reaper","text":"When you take time after a conflict to dedicate your victory to your deity and deal with the dead, take +1 forward.","page":94,"tier":6},{"name":"Providence","text":"You ignore the -1 penalty from two spells you maintain.","page":94,"tier":6,"replaces":["Serenity"]},{"name":"Greater First Aid","text":"Cure Moderate Wounds is a rote for you, and therefore doesn't count against your limit of granted spells.","page":95,"tier":6,"requires":["First Aid"]},{"name":"Divine Invincibility","text":"When you Commune you gain 2 hold and lose any hold you already had. Spend that hold when you or an ally takes damage to call on your deity, who intervenes with an appropriate manifestation (a sudden gust of wind, a lucky slip, a burst of light) and negates the damage.","page":95,"tier":6,"replaces":["Divine Intervention"]},{"name":"Martyr","text":"When you take damage and embrace the pain, you may take +1d4 damage (ignoring armor). If you do, take +1 forward to cast a spell and add your level to any damage done or healed by the spell.","page":95,"tier":6,"replaces":["Penitent"]},{"name":"Divine Armor","text":"When you wear no armor or shield you get 3 armor.","page":95,"tier":6,"replaces":["Divine Protection"]},{"name":"Greater Empower","text":"When you cast a spell, on a 10-11 you have the option of choosing from the 7-9 list. If you do, you may choose one of these effects as well.\n* On a 12+ you get to choose one of these effects for free.\n\n* The spell's effects are doubled\n* The spell's targets are doubled","page":95,"tier":6,"replaces":["Empower"]},{"name":"Divine Protection","text":"When you wear no armor or Shield you get 2 armor.","page":94,"tier":6,"replaces":["Holy Protection"]}],"extra":false},"Druid":{"dmg":"d6","hp":6,"load":6,"alignments":[{"type":"Good","text":"Help something or someone grow."},{"type":"Neutral","text":"Eliminate an unnatural menace."},{"type":"Chaotic","text":"Destroy a symbol of civilization."}],"bonds":["__________ smells more like prey than a hunter.","The spirits spoke to me of a great danger that follows __________.","I have showed __________ a secret rite of the Land.","__________ has tasted my blood and I theirs. We are bound by it."],"races":[{"name":"Elf","text":"The sap of the elder trees flows within you. In addition to any other attunements, the Great Forest is always considered your land."},{"name":"Human","text":"As your people learned to bind animals to field and farm, so too are you bound to them. You may always take the shape of any domesticated animal, in addition to your normal options."},{"name":"Halfling","text":"You sing the healing songs of spring and brook. When you Make Camp, you and your allies heal +1d6."}],"gear":[{"label":"Choose your defenses","max":1,"options":[{"label":"Hide Armor","items":[{"name":"Hide Armor","desc":"","tags":[{"n":"Armor","v":1},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Wooden Shield","items":[{"name":"Wooden Shield","desc":"","tags":[{"n":"Armor","v":1},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]},{"label":"Choose your armament","max":1,"options":[{"label":"Shillelagh","items":[{"name":"Shillelagh","desc":"","tags":[{"n":"Close","v":null},{"n":"Coins","v":1},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Staff","items":[{"name":"Staff","desc":"","tags":[{"n":"Close","v":null},{"n":"Two_handed","v":null},{"n":"Coins","v":1},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Spear","items":[{"name":"Spear","desc":"","tags":[{"n":"Reach","v":null},{"n":"Thrown","v":null},{"n":"Near","v":null},{"n":"Coins","v":5},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0}]},{"label":"Choose one","max":1,"options":[{"label":"Adventuring Gear","items":[{"name":"Adventuring Gear","desc":"Adventuring gear is a collection of useful mundane items such as chalk, poles, spikes, ropes, etc. When you rummage through your adventuring gear for some useful mundane item, you find what you need and mark off a use.","tags":[{"n":"Uses","v":5},{"n":"Coins","v":20},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Poultices and Herbs","items":[{"name":"Poultices and Herbs","desc":"When you carefully treat someone's wounds with poultices and herbs, heal them of 7 damage and expend a use.","tags":[{"n":"Uses","v":2},{"n":"Slow","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}],"amount":1.0},{"name":"Poultices and Herbs","desc":"When you carefully treat someone's wounds with poultices and herbs, heal them of 7 damage and expend a use.","tags":[{"n":"Uses","v":2},{"n":"Slow","v":null},{"n":"Coins","v":10},{"n":"Weight","v":1}],"amount":1.0}],"coins":0.0},{"label":"Halfling Pipeleaf","items":[{"name":"Halfling Pipeleaf","desc":"When you share halfling pipeleaf with someone, expend two uses and take +1 forward to Parley with them.","tags":[{"n":"Uses","v":6},{"n":"Coins","v":5},{"n":"Weight","v":0}],"amount":1.0}],"coins":0.0},{"label":"3 Antitoxins","items":[{"name":"Antitoxin","desc":"When you drink antitoxin, you're cured of one poison affecting you.","tags":[{"n":"Coins","v":10},{"n":"Weight","v":0}],"amount":3.0}],"coins":0.0}]}],"spellcaster":false,"page":103,"names":"Elf: Hycorax, Ethanwe, Sinathel, Demanor, Menoliir, Mithralan, Taeros, Aegor\nHalfling: Tanner, Dunstan, Rose, Ivy, Robard, Mab, Thistle, Puck, Anne, Serah\nHuman: Elana, Obelis, Herran, Syla, Andanna, Siobhan, Aziz, Pelin, Sibel, Nils, Wei","looks":["Wise Eyes, Wild Eyes, or Haunting Eyes","Furry Hood, Messy Hair, or Braided Hair","Ceremonial Garb, Practical Leathers, or Weathered Hides"],"blurb":"Cast your eyes around the fire. What has brought you to these people, stinking of the dust and sweat of the city? Perhaps it is a kindness-do you protect them as the mother bear watches over her cubs? Are they your pack, now? Strange brothers and sisters you have. Whatever your inspiration, they would certainly fail without your sharp senses and sharper claws.\n\nYou are of the sacred spaces; you are born of soil and wear the marks of her spirits on your skin. You may have had a life before, maybe you were a city dweller like them, but not now. You've given up that static shape. Listen to your allies pray to their carved stone gods and polish their silver shells. They speak of the glory they'll find back in that festering town you left behind.\n\nTheir gods are children, their steel is false protection. You walk the old ways, you wear the pelts of the earth itself. You'll take your share of the treasure, but will you ever walk as one of them? Only time will tell.","moves":[{"name":"Born of the Soil","text":"You learned your magic in a place whose spirits are strong and ancient and they've marked you as one of their own. No matter where you go, they live within you and allow you to take their shape. Choose one of the following. It is the land to which you are attuned-when shapeshifting you may take the shape of any animal who might live in your Land.\n\n* The Great Forests\n* The Whispering Plains\n* The Vast Desert\n* The Stinking Mire\n* The River Delta\n* The Depths of the Earth\n* The Sapphire Islands\n* The Open Sea\n* The Towering Mountains\n* The Frozen North\n* The Blasted Wasteland\n\nChoose a tell-a physical attribute that marks you as born of the soil-that reflects the spirit of your land. It may be an animal feature like antlers or leopard's spots or something more general: hair like leaves or eyes of glittering crystal. Your tell remains no matter what shape you take.","page":104,"tier":0},{"name":"By Nature Sustained","text":"You don't need to eat or drink. If a move tells you to mark off a ration just ignore it.","page":105,"tier":0},{"name":"Spirit Tongue","text":"The grunts, barks, chirps, and calls of the creatures of the wild are as language to you. You can understand any animal native to your land or akin to one whose essence you have studied.","page":105,"tier":0},{"name":"Shapeshifter","text":"When you call upon the spirits to change your shape, roll+Wis.\n\n* On a 10+ hold 3.\n* On a 7-9 hold 2.\n* On a miss hold 1 in addition to whatever the GM says.\n\nYou may take on the physical form of any species whose essence you have studied or who lives in your land: you and your possessions meld into a perfect copy of the species' form.\n\n* You have any innate abilities and weaknesses of the form: claws, wings, gills, breathing water instead of air.\n* You still use your normal stats but some moves may be harder to trigger-a housecat will find it hard to do battle with an ogre.\n\nThe GM will also tell you one or more moves associated with your new form. Spend 1 hold to make that move. Once you're out of hold, you return to your natural form. At any time, you may spend all your hold and revert to your natural form.","stat":"WIS","page":105,"tier":0},{"name":"Studied Essence","text":"When you spend time in contemplation of an animal spirit, you may add its species to those you can assume using shapeshifting.","page":105,"tier":0},{"name":"Hunter's Brother","text":"Choose one move from the ranger class list.","page":107,"tier":2},{"name":"Red of Tooth and Claw","text":"When you are in an appropriate animal form (something dangerous) increase your damage to d8.","page":107,"tier":2},{"name":"Communion of Whispers","text":"When you spend time in a place, making note of its resident spirits and calling on the spirits of the land, roll+Wis. You will be granted a vision of significance to you, your allies, and the spirits around you.\n* On a 10+ the vision will be clear and helpful to you.\n* On a 7-9 the vision is unclear, its meaning murky. On a miss, the vision is upsetting, frightening, or traumatizing. The GM will describe it. Take -1 forward.","stat":"WIS","page":107,"tier":2},{"name":"Barkskin","text":"So long as your feet touch the ground you have +1 armor.","page":107,"tier":2},{"name":"Eyes of the Tiger","text":"When you mark an animal (with mud, dirt, or blood) you can see through that animal's eyes as if they were your own, no matter what distance separates you. Only one animal at a time may be marked in this way.","page":107,"tier":2},{"name":"Shed","text":"When you take damage while shapeshifted you may choose to revert to your natural form to negate the damage.","page":107,"tier":2},{"name":"Thing-Talker","text":"You see the spirits in the sand, the sea and the stone. You may now apply your spirit tongue, shapeshifting and studied essence to inanimate natural objects (plants and rocks) or creatures made thereof, as well as animals. Thing-talker forms can be exact copies or can be mobile vaguely humanoid-shaped entities.","page":107,"tier":2},{"name":"Formcrafter","text":"When you shapeshift choose a stat: you take +1 ongoing to rolls using that stat while shifted. The GM will choose a stat, too: you take -1 ongoing to rolls using that stat while shifted.","page":108,"tier":2},{"name":"Elemental Mastery","text":"When you call on the primal spirits of fire, water, earth or air to perform a task for you roll+Wis.\n* On a 10+ choose two.\n* On a 7-9 choose one. On a miss, some catastrophe occurs as a result of your calling.\n\n* The effect you desire comes to pass\n* You avoid paying nature's price\n* You retain control","stat":"WIS","page":108,"tier":2},{"name":"Balance","text":"When you deal damage, take 1 balance. When you touch someone and channel the spirits of life you may spend balance. For each balance spent, heal 1d4 HP.","page":108,"tier":2},{"name":"Embracing No Form","text":"When you shapeshift, roll 1d4 and add that total to your hold.","page":108,"tier":6},{"name":"Doppelgänger's Dance","text":"You are able to study the essence of specific individuals to take their exact form, including men, elves, or the like. Suppressing your tell is possible, but if you do, take -1 ongoing until you return to your own form.","page":108,"tier":6},{"name":"Blood and Thunder","text":"When you are in an appropriate animal form (something dangerous) increase your damage to d10.","page":108,"tier":6,"replaces":["Red of Tooth and Claw"]},{"name":"The Druid Sleep","text":"When you take this move, the next opportunity that you have safety and time to spend in an appropriate location, you may attune yourself to a new land. This effect occurs only once and the GM will tell you how long it will take and what cost you must pay. From then on, you are considered to be born of the soil in both lands.","page":109,"tier":6},{"name":"World-Talker","text":"You see the patterns that make up the fabric of the world. You may now apply your spirit tongue, shapeshifter and studied essence moves to pure elements-fire, water, air and earth.","page":109,"tier":6,"requires":["Thing-Talker"]},{"name":"Stalker's Sister","text":"Choose one move from the ranger class list.","page":109,"tier":6},{"name":"Formshaper","text":"You may increase your armor by 1 or deal an additional +1d4 damage while in an animal form. Choose which
